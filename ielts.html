<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE for IELTS WRITING</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap');

:root{
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #131315;
  --ink-soft: #6b7076;
  --ink-faint: #9aa0a6;
  --line: #e9e9ea;
  --red: #c23b3b;
  --red-deep: #9a2c2c;
  --red-wash: #fbe9e9;
  --pattern-pink: #d63384;
  --star: #ffcd3c;
  --hl-mint: #ccffff;
  --subhead: #fc3468;
  --radius: 12px;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --en: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --hand: 'Caveat', cursive;
}

*{ box-sizing:border-box; }
html{
  scroll-behavior:smooth;
  /* dotted texture fills the gutters outside the centered 1040px column.
     Two identical radial-gradient layers, the second shifted by half a
     tile both horizontally and vertically, so each dot sits in the gap
     between the two dots of the row above it (a staggered / brick-offset
     grid, not a plain square grid) -- and because it's a repeating
     gradient rather than a dropped-in raster image, it tiles seamlessly
     with no visible seam. */
  background-color: var(--bg);
  background-image:
    radial-gradient(circle, #d7d7d9 1.3px, transparent 1.6px),
    radial-gradient(circle, #d7d7d9 1.3px, transparent 1.6px);
  background-size: 26px 26px, 26px 26px;
  background-position: 0 0, 13px 13px;
}

body{
  margin: 0 auto;
  max-width: 1040px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--kr);
  font-weight: 300;
  line-height: 1.6;
}

a{ color:inherit; text-decoration:none; }
::selection{ background: var(--red-wash); color: var(--red-deep); }
:focus-visible{ outline: 2px solid var(--red); outline-offset: 3px; }

.wrap{
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ---------- top bar ---------- */
.topbar{
  padding: 26px 0 0;
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
}
.topbar .wrap{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom: 20px;
}
.navbtns{ display:flex; gap:8px; }
.navbtns button{
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.navbtns button:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns a:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns button:disabled{ opacity: 0.35; cursor: default; }
.navbtns button:disabled:hover{ border-color: var(--line); color: var(--ink-soft); }
.navbtns button svg{ width: 15px; height: 15px; }
.starnav{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.starnav-btn{
  border: none;
  background: none;
  cursor: pointer;
  padding: 2px 0;
  display: flex;
  gap: 2px;
  line-height: 0;
}
.starnav-btn svg{ width: 13px; height: 13px; }
.star-fill{ fill: var(--star); stroke: var(--star); }
.star-empty{ fill: none; stroke: var(--ink-faint); stroke-width: 1.5; }
.starnav-btn.active svg .star-empty{ stroke: var(--ink); }

.topbar-brand{
  font-family: var(--en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.01em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease, max-width .3s ease;
}
.topbar-brand span{
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}
.topbar-brand .tb-for{
  font-weight: 300;
  font-size: 11.5px;
  color: var(--ink-faint);
}
.topbar-brand:hover{ opacity: 0.65; }
body:not(.is-home) .topbar-brand{
  opacity: 1;
  max-width: 320px;
  transform: translateY(0);
  pointer-events: auto;
}
body:not(.is-home) .topbar-brand:hover{ opacity: 0.65; }

/* ---------- hero ---------- */
/* Collapses via a CSS-grid row (1fr -> 0fr) rather than max-height: a
   max-height transition animates against an arbitrary cap, not the content's
   real height, so it visually snaps shut early and eases out over empty
   space -- this grid technique animates the actual track size instead, so
   the motion tracks the real content height and reads as smooth, not janky. */
.hero-collapse{
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows .3s ease;
}
body:not(.is-home) .hero-collapse{
  grid-template-rows: 0fr;
  pointer-events: none;
}
.hero-collapse-inner{
  overflow: hidden;
  min-height: 0;
}
.hero{
  padding: 34px 0 30px;
  opacity: 1;
  transition: opacity .18s ease;
}
body:not(.is-home) .hero{
  opacity: 0;
  transition: opacity .12s ease;
}
.hero .eyebrow{
  font-family: var(--en);
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.1em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 16px;
  display:flex; align-items:center; gap:8px;
}
.hero .eyebrow::before{
  content:"";
  width: 20px; height: 2px;
  background: var(--red);
  display:inline-block;
}
.hero h1{
  font-family: var(--en);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
.hero-row{
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.hero-row > div:first-child{ flex: 1 1 auto; min-width: 0; }
.hero-noun-link{
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--en);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  white-space: nowrap;
  padding-bottom: 6px;
  transition: color .15s ease;
}
.hero-noun-link:hover{ color: var(--ink); }
@media (max-width: 600px){
  .hero-row{ justify-content: flex-start; }
  .hero-noun-link{ margin-left: auto; font-size: 12px; padding-bottom: 4px; }
}
.hero h1 a{ display:block; transition: opacity .15s ease; }
.hero h1 a:hover{ opacity: 0.6; }
.hero h1 span{ display:block; }
.hero h1 .l1{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.02; }
.hero h1 .l2{ font-size: clamp(38px, 6.4vw, 62px); font-weight: 300; color: var(--ink); margin: 2px 0; }
.hero h1 .l3{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.05; }

/* ---------- legend row (unused, kept out) ---------- */

/* ---------- section headers ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 44px 0 18px;
}
.section-head h2{
  font-family: var(--kr);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
  margin:0;
}
.section-head .count{
  font-family: var(--en);
  font-size: 12px;
  color: var(--ink-faint);
}

/* ---------- category grid ---------- */
.cat-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 12px;
}
.cat-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 18px 18px 16px;
  cursor:pointer;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  display:flex; flex-direction:column; gap:10px;
  position: relative;
}
.cat-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.cat-card.active{ border-color: var(--ink); }
.cat-card .top-row{ display:flex; align-items:flex-start; justify-content:space-between; }
.cat-card .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}
.pill{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  white-space: nowrap;
}
.cat-card .label{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 16.5px;
  line-height: 1.35;
}
.cat-card .desc{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height:1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cat-card .bottom-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: auto; padding-top: 4px;
}
.cat-card .arrow{
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint);
}
.cat-card .arrow svg{ width: 11px; height: 11px; display:block; }

/* ---------- essay cards ---------- */
.essay-grid{ display:flex; flex-direction:column; gap: 12px; }
.essay-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.essay-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.essay-card .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.essay-card .title{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 8px;
}
.essay-card .tag-row{ display:flex; flex-wrap:wrap; gap: 6px; }
.essay-card .score{
  text-align: right;
}
.essay-card .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
  line-height: 1;
}
.essay-card .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- essay detail header ---------- */
.essay-header{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 26px;
  margin: 8px 0 30px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
}
.essay-header .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.essay-header h3{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 22px;
  margin: 0 0 6px;
}
.essay-header .back{
  display:inline-block;
  margin-top: 10px;
  font-family: var(--en);
  font-weight: 600;
  font-size: 12px;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
}
.essay-header .score{ text-align:right; }
.essay-header .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 34px;
  color: var(--ink);
  line-height: 1;
}
.essay-header .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- question + original (uncorrected) text ---------- */
.essay-original{
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin: -12px 0 30px;
  background: var(--card);
}
.essay-original .block + .block{ margin-top: 22px; }
.essay-original .block-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.essay-original .word-count-note{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 12px;
}
.essay-original .word-count-note.is-ok{ color: var(--ink-soft); }
.essay-original .word-count-note.is-short{ color: var(--red-deep); }
.essay-original .question-text{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14.5px;
  color: var(--ink-soft);
  font-style: italic;
  line-height: 1.6;
}
.essay-original .question-text.placeholder{
  color: var(--ink-faint);
  font-style: normal;
}
.essay-original .original-text p{
  font-family: var(--en);
  font-weight: 400;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.75;
  margin: 0 0 14px;
}
.essay-original .original-text p:last-child{ margin-bottom: 0; }
.essay-original .chart-image{
  max-width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--line);
}
.essay-original .chart-svg-wrap{
  background: #fff;
  padding: 10px;
}
.essay-original .chart-svg-wrap svg{
  width: 100%;
  height: auto;
  display: block;
}

/* ---------- notes card ("알아두기") ---------- */
/* ---------- word/expression doc sidebar + "PDF popup" modal ---------- */
.topbar-right{
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
}
.worddoc-launcher-wrap{ position: relative; display: flex; align-items: center; }
.worddoc-launcher{
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
}
.worddoc-launcher-imgwrap{
  position: relative;
  display: block;
  height: 58px;
}
.worddoc-launcher-imgwrap img{
  height: 58px;
  width: auto;
  display: block;
  transition: opacity .15s ease, transform .15s ease;
}
/* Two pre-rendered layers instead of a CSS filter: wd-outline is a
   precomputed ring that traces only the character's *outer* silhouette
   (any internal gaps -- e.g. between the raised arm and the body -- were
   filled in before the ring was generated, so they're excluded from it).
   It sits behind the character, invisible at rest, and fades in on hover;
   because it has no ring around internal gaps, none appears there. */
.wd-outline{
  position: absolute;
  inset: 0;
  opacity: 0;
  z-index: 0;
}
.wd-char{ position: relative; z-index: 1; }
.worddoc-launcher:hover .wd-outline{ opacity: 1; }
.worddoc-launcher:hover .wd-char{ transform: scale(1.05); }


/* The flyout is split into an invisible "bridge" (this element, flush
   against the launcher with no gap) and a visible inner card offset by
   padding -- not margin. If the visible card started right where the
   hoverable box starts, moving the mouse from the launcher down into the
   list would cross a dead zone with nothing hoverable in it, and :hover
   would drop before the pointer ever reaches the list. Padding keeps the
   whole path continuously "inside" one hoverable element. */
.worddoc-flyout{
  position: absolute;
  right: 0;
  top: 100%;
  padding-top: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
  z-index: 45;
}
.worddoc-launcher-wrap:hover .worddoc-flyout,
.topbar-right.is-open .worddoc-flyout{
  opacity: 1;
  pointer-events: auto;
}
.worddoc-flyout-inner{
  min-width: 230px;
  max-width: 290px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0,0,0,0.14);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.worddoc-flyout-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 6px 10px 4px;
}
.worddoc-flyout-item{
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  border: none;
  background: none;
  font-family: var(--kr);
}
.worddoc-flyout-item:hover{ background: var(--line-soft, #f4f1ec); }
.worddoc-flyout-item .doc-title{ font-weight: 600; font-size: 13.5px; color: var(--ink); }
.worddoc-flyout-item .doc-sub{ font-size: 11px; color: var(--ink-faint); margin-top: 1px; }

/* Word-doc content is shown inline as its own page (see the "#/words" route
   family), not in a modal -- this just gives it slightly roomier padding
   than a standard notes-card. */
.worddoc-card{ padding: 0; margin-bottom: 20px; }
.worddoc-card .notes-content{ gap: 10px; }

/* Refined "reference sheet" look for the word-doc modal specifically.
   Collapsed chips keep the shared pill look used everywhere else on the site
   (same click-to-expand interaction people already know) -- but once
   expanded, the content reads like a clean glossary page rather than a
   stack of gray admin boxes: no box fill, a hairline rule between groups,
   dashed rules between entries, and each entry's own typographic hierarchy
   (bold pattern / italic example / small vocab caption) instead of uniform
   body text. */
/* "Index card" look (option B): each numbered entry is its own flat card --
   cream fill, thin border, one soft shadow for a touch of lift. No stacked
   "peek" card behind it -- just the single front card. Collapsed chips keep
   the shared pill look used everywhere else on the site (same click-to-
   expand interaction people already know). */
.worddoc-card .notes-section{
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
}
.worddoc-card .notes-section.is-collapsed{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 14px;
}
.worddoc-card .notes-section:not(.is-collapsed){
  padding-bottom: 4px;
}
.worddoc-card .notes-section:not(.is-collapsed) + .notes-section{
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}
.worddoc-card .notes-section:not(.is-collapsed) .notes-section-head{ margin-bottom: 14px; }
.worddoc-card .notes-section-title{ font-size: 17px; }

.worddoc-card .notes-content > .notes-section:not(.is-collapsed) .notes-section-body{
  display: flex;
  flex-direction: column;
}
.worddoc-card .notes-block{
  padding: 16px 4px 16px 22px;
  border-bottom: 1px solid var(--line);
}
.worddoc-card .notes-block:last-child{ border-bottom: none; padding-bottom: 4px; }
.worddoc-card .notes-block:first-child{ padding-top: 4px; }

/* Option E: a big fixed-width number column on the left; every other line's
   label reserves the same width (even though it's small text like "EX)" or
   "단어:") so all of a block's text lines start at one shared left edge,
   the way the first line's text starts right after its big number. */
.worddoc-card .notes-line{ align-items: baseline; }
.worddoc-card .notes-line-label{
  flex: 0 0 46px;
  width: 46px;
  overflow: hidden;
  text-align: right;
}
.worddoc-card .notes-line + .notes-line{ margin-top: 6px; }
.worddoc-card .notes-line[data-marker="num"] .notes-line-label{
  font-family: var(--en);
  font-weight: 500;
  font-size: 21px;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="num"] .notes-line-text{
  font-family: var(--en);
  font-weight: 800;
  font-size: 19px;
  color: var(--pattern-pink);
}
.worddoc-card .notes-line[data-marker="meaning"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="meaning"] .notes-line-text{
  font-size: 14.5px;
  color: var(--ink);
}
.worddoc-card .notes-line[data-marker="ex"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="ex"] .notes-line-text{
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
}
.worddoc-card .notes-line[data-marker="vocab"] .notes-line-label,
.worddoc-card .notes-line[data-marker="vocab"] .notes-line-text{
  font-size: 12px;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="desc"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* Topbar gets cramped on phones: three groups (nav arrows, brand, launcher+
   stars) competing for width, plus the brand reserving space even while
   invisible, pushed it past the viewport and forced horizontal scrolling.
   Shrink each control and tighten the gaps so everything fits on one line
   without needing to scroll, and stays vertically centered against each
   other at the smaller size. */
@media (max-width: 600px){
  .wrap{ padding: 0 16px; }
  .topbar .wrap{ gap: 8px; }
  .navbtns{ gap: 6px; }
  .navbtns button{ width: 26px; height: 26px; }

  .topbar-brand{ display: none; }
  .topbar-right{ gap: 6px; }
  .worddoc-launcher-imgwrap,
  .worddoc-launcher-imgwrap img{ height: 40px; }

/* Collapsible guide chips (used inside .guide-card): collapsed by default,
   click the head to expand. Border, radius, and padding stay identical in

      "guide": "━━━ the + 비교급 + of 복수명사 · 동사 일치 ━━━\n\n\"the + 비교급 + of + 복수명사\"는 그 복수명사들 중 비교급에 해당하는 \"것들(the ones)\"을 가리키는 표현이며, 의미상 복수이므로 동사도 단수(is)가 아니라 복수(are)로 받는다.\n\n1) the + 비교급 + of + 복수명사 = 그 대상들 중 더 ~한 것들\n   설명: ones, groups 같은 원래 명사가 생략된 형태이며, 가리키는 대상이 여럿이므로 뒤에 오는 동사도 복수형을 씀.\n   Ex) The more important of these groups are shown in the figure above. (O)\n   Ex) The more important of these groups is shown in the figure above. (X, 의미상 복수인데 단수동사를 씀)\n\n2) 가리키는 대상이 하나로 좁혀지는 경우는 예외\n   설명: 문맥상 \"~중 하나\"를 뜻하는 게 아니라 정말 단일 대상 하나만 가리킬 때는 단수로 받을 수 있음 — 몇 개를 가리키는지 먼저 확인해야 함.\n   Ex) The best of these three plans is the third one. (셋 중 최종적으로 하나만 지목하므로 단수)\n\n━━━ the + 형용사 · 복수 보통명사 역할 ━━━\n\n영어에서 \"the + 형용사\"는 그 자체로 \"~한 사람들(people)\" 또는 \"~한 것들(things)\"이라는 복수 명사 역할을 하며, 위에서 다룬 the + 비교급 구조와 같은 원리다.\n\n1) the + 형용사 = ~한 사람들 / ~한 것들 (복수 취급)\n   설명: 형용사가 그 자체로 명사화되어 특정 집단·부류 전체를 가리킴. 뒤에 오는 be동사·일반동사는 항상 복수형으로 받음.\n   Ex) The rich are not always happy. (부유한 사람들 — 복수)\n   Ex) The unemployed need more support. (실업자들 — 복수)\n\n요약: \"the + 형용사/비교급 (+ of 복수명사)\"는 사람이나 사물의 집합을 가리키는 복수 개념이므로, 겉모습이 단수처럼 보여도 동사는 반드시 복수(are/were)로 일치시켜야 한다.\n\n━━━ and로 연결된 주어의 수 일치 (가산·불가산 무관) ━━━\n\nA and B 형태로 연결된 두 명사가 주어로 쓰이면, 각 명사가 가산인지 불가산인지와 상관없이 원칙적으로 복수 동사를 씀. 핵심은 가산성이 아니라 \"A와 B가 서로 다른 별개의 대상을 가리키는가\"임.\n\n1) 가산+가산, 불가산+불가산, 가산+불가산 혼합 모두 별개의 대상이면 복수 동사\n   Ex) A pen and a pencil are on the desk. (가산+가산, 서로 다른 두 물건)\n   Ex) The entertainment and the emotion gained from social media are also not necessary. (불가산+불가산, 서로 다른 두 개념)\n   Ex) Money and time are both limited resources. (불가산+불가산)\n\n2) 예외 — 두 명사가 사실상 하나의 개념·사물을 가리킬 때는 단수\n   Ex) Bread and butter is my favorite snack. (빵과 버터 = 하나의 간식 개념)\n   Ex) Peace and quiet is all I want. (평화와 고요함 = 하나의 상태로 인식)\n\n3) 예외 — 동격 관계(같은 대상을 가리킴)일 때는 단수\n   Ex) The founder and CEO of the company is here. (한 사람을 두 직함으로 부른 것)\n\n4) 예외 — each/every가 붙으면 and가 있어도 단수\n   Ex) Every boy and girl was given a candy. (each/every는 하나씩을 강조하므로 항상 단수)\n\n요약: and로 연결된 주어의 수 일치는 가산·불가산 구분이 아니라 \"그 두 명사가 의미상 몇 개의 대상을 가리키는가\"로 판단해야 함."

      "guide": "━━━ 가정법 과거(2nd Conditional) — 현재 사실과 반대되는 상상 ━━━\n\n구조: If + 주어 + 동사의 과거형(be동사는 인칭에 상관없이 주로 were) ~, 주어 + would/could/should/might + 동사원형 ~\n\n## 언제 쓰는가\n\n현재 사실과 반대되거나 실현 가능성이 낮은 상상을 말할 때 씀. \"만약 ~라면, ~할 텐데\"라는 뜻이며 실제로는 그렇지 않다는 뉘앙스를 담음.\nEx) If I were rich, I would travel the world. (실제로는 부자가 아님)\nEx) If it were not preserved, there wouldn't be any preciousness of each culture left. (Task 2 · Opinion Essay · 예술가에 대한 정부 지원)\n\n## 흔한 오류 — if절과 주절의 시제 불일치 (반복 오류)\n\nif절은 가정법 과거(과거형)로 시작했는데 주절은 그대로 일반동사·조동사 현재형을 남겨두는 오류.\nEx) 오류: if it isn't preserved (X) → if it were not preserved (O) (Task 2 · Opinion Essay · 예술가에 대한 정부 지원)\nEx) 오류: If our culture remained the same over thousands of years, won't it be too boring? (X) → wouldn't it be too boring? (O) (Task 2 · Agree/Disagree · 고대 문화 교육)\n   설명: 두 사례 모두 if절만 가정법 과거로 쓰고 주절은 현재형 조동사를 그대로 남겨서 생긴 오류임 — if절이 과거형이면 주절도 반드시 would/could/should/might + 동사원형으로 짝을 맞춰야 함\n\n## 다른 가정법과 구분\n\n1) 가정법 현재(1st Conditional) — 실현 가능성이 있는 미래 조건\n   Ex) If it rains tomorrow, I will stay home. (If + 현재형, will + 동사원형)\n2) 가정법 과거(2nd Conditional) — 현재 사실과 반대되거나 실현 가능성이 낮은 상상\n   Ex) If I were you, I would apologize. (If + 과거형 were, would + 동사원형)\n3) 가정법 과거완료(3rd Conditional) — 과거 사실과 반대되는 후회·상상\n   Ex) If I had studied harder, I would have passed the exam. (If + had + p.p., would have + p.p.)\n\n요약: If절의 시제(현재/과거/과거완료)에 따라 실현 가능성이 다르게 표현되며, if절과 주절의 시제는 항상 짝을 맞춰야 함. 지금까지 반복된 오류는 2번(가정법 과거) 유형에서 if절만 과거형으로 바꾸고 주절을 현재형 그대로 남겨두는 패턴이었으니, if절에 과거형이 보이면 주절의 조동사도 과거형(would/could/should/might)인지 항상 확인할 것."

      "guide": "━━━ 자동사의 과거분사 형용사화 ━━━\n\n## 자동사 expire의 특징\n\n자동사는 주어 스스로 동작이나 상태 변화를 일으키는 동사임.\n\n- 수동태 불가: 자동사는 목적어를 가지지 않기 때문에 기본적으로 수동태 형태(be + p.p.)를 만들지 않음.\n- 과거분사의 형용사화: expired는 수동의 의미가 아니라 \"이미 만료된\", \"기간이 경과한\" 상태를 나타내는 완료 의미의 형용사로 쓰임.\n\n## that expired vs that is expired\n\n1) that expired (문장의 실제 구조)\n   설명: 주격 관계대명사 that + 과거시제 동사 expired. \"(현재 회계기간 중에) 이미 만료되어 버린\" 부분을 뜻하며, 동작·상태 변화가 완료되었음을 나타내는 일반적인 과거시제 동사임.\n   Ex) the amount that expired during the period (O)\n\n2) that is expired가 쓰이지 않는 이유\n   설명: is expired로 쓰면 expired를 형용사(만료된 상태)로 보게 되어 문법적으로 완전히 불가능하지는 않지만, 보통 상태를 서술할 때(The contract is expired) 쓰임. 시간의 경과나 사건의 발생을 나타낼 때는 과거시제 동사 expired를 직접 쓰는 것이 훨씬 자연스럽고 정확함.\n   Ex) The contract is expired. (상태 서술, O) / the amount that is expired (사건 서술에는 부자연스러움)\n\n## 비슷한 원리의 다른 예시\n\n자동사의 과거분사가 '완료'의 의미를 지닌 형용사처럼 쓰이거나 과거 동사로 쓰이는 대표적인 예임.\n\n- fallen leaves: 떨어짐을 당한 나뭇잎(수동)이 아니라 이미 떨어진 나뭇잎(완료)\n- the expired portion: 만료되어 버린 부분\n- The time has expired: 시간이 만료되었다\n\n## 다른 자동사 오류와의 연결 — depend\n\n\"Task 1 · Bar Chart · 팀별 점수 비교\"에서 다룬 \"it could be depended on the season\"의 depend도 목적어를 취하지 않는 자동사라 수동태를 만들 수 없다는 점에서 expire와 원리가 같음. 다만 둘의 쓰임에는 차이가 있음.\n\n1) 공통점: 진짜 수동태(be + p.p.)를 만들 수 없음\n   설명: depend와 expire 둘 다 자동사이므로 be동사 뒤에 과거분사를 붙여 '~되다'라는 수동의 의미로 쓸 수 없음.\n   Ex) it could be depended on the season (X) / it could depend on the season (O)\n\n2) 차이점: 과거분사의 형용사화 여부\n   설명: depend는 과거분사가 형용사로 굳어져 쓰이는 경우가 없어 항상 능동형 depend on으로만 씀. 반면 expire처럼 자동사의 과거분사가 '완료된 상태'를 나타내는 형용사로 굳어져 be동사와 함께 쓰이는 경우도 있음. 아래는 같은 원리의 다른 동사들.\n   Ex) depended (형용사로 쓰이지 않음, X) / the expired contract (형용사로 쓰임, O)\n   Ex) wither → The flowers are withered. (시듦을 당한 게 아니라 이미 시들어 버린 상태)\n   Ex) fade → The photo is faded. (빛바래짐을 당한 게 아니라 이미 빛바랜 상태)\n   Ex) rot → The fruit is rotten. (썩힘을 당한 게 아니라 이미 썩어 버린 상태)\n   Ex) rust → The gate is rusted. (녹슬려짐을 당한 게 아니라 이미 녹슨 상태)\n   Ex) retire → My uncle is retired. (은퇴시켜짐을 당한 게 아니라 스스로 은퇴한 상태)"

      "guide": "━━━ 기간·범위를 나타내는 전치사 ━━━\n\n## between vs among\n\n1) between A and B — 두 개의 특정 지점(연도·수치 등) 사이의 범위를 나타낼 때 씀\n   Ex) over 1995 to 2005 (X) → between 1995 and 2005 (O)\n2) among — 셋 이상의 개별 대상들 '사이'를 나타낼 때 쓰며, 기간을 나타내는 표현이 아님\n   Ex) among given period (X) → throughout the given period (O)\n\n## 기간의 폭을 나타내는 over/throughout\n\n1) 특정 기간 전체에 걸쳐 변화가 일어났음을 나타낼 때는 over 또는 throughout을 씀\n   Ex) declining through two terms (X) → declining over the two periods (O)\n   설명: through는 공간·과정을 통과하는 이미지가 강해 기간의 폭을 나타내는 용법으로는 부자연스러움\n\n## since vs from\n\n1) since는 특정 과거 시점부터 현재까지 계속됨을 나타내며 완료시제와 함께 쓰이는 게 자연스러움\n2) from은 일반적인 진술에서 '~부터'라는 시작점만 단순히 나타낼 때 씀\n   Ex) learning practical knowledge since they are young (X) → learning practical knowledge from a young age (O)\n   설명: 특정 과거 시점부터의 지속이 아니라 일반적 사실을 진술하는 문장이므로 since가 아니라 from이 자연스러움\n\n━━━ 전치사의 품사적 성질 ━━━\n\n## 전치사는 명사구만 받음\n\n1) 전치사 뒤에는 명사(구)가 와야 하며, that절을 이어야 할 때는 접속사로 바꿔야 함\n   Ex) Regarding that banning tourism is impossible (X) → Given that banning tourism is impossible (O)\n   설명: Regarding은 명사구만 받는 전치사라 that절을 바로 받을 수 없어, 접속사 역할도 하는 given that으로 교체\n\n## 전치사와 형태가 비슷한 부사·형용사 구분\n\n1) 전치사(near)와 형용사·부사(nearby)는 형태가 비슷해도 뒤에 목적어를 바로 받을 수 있는지가 다름\n   Ex) shop owners nearby trademark in city (X) → shop owners near a landmark in a city (O)\n   설명: nearby는 형용사·부사라 뒤에 목적어(명사)를 바로 취할 수 없어, 목적어를 받으려면 전치사 near가 필요"

      "guide": "━━━ 재귀대명사(itself)의 강조 용법 — 목적어 자리 명사에 따라 자연스러움이 달라짐 ━━━\n\n## 강조 대상은 문장의 핵심 성분(보어·주어)이어야 자연스러움\n\nitself 같은 재귀대명사의 강조 용법은 문장의 핵심 뼈대가 되는 명사(주어나 보어) 바로 뒤에 붙어야 자연스러움. 목적어 자리의 명사에 붙이면 어색해지는 경우가 있음.\n\n1) is a value itself (자연스러움)\n   설명: a value는 문장의 보어(주어를 보충 설명하는 성분)이므로, itself가 이 핵심 성분을 바로 뒤에서 강조해 \"다른 무엇도 아닌 가치 그 자체다\"라는 완결된 의미가 됨.\n   Ex) This tradition is a value itself. (이 전통은 가치 그 자체이다.)\n\n2) has value itself (어색함)\n   설명: 여기서 value는 셀 수 없는 명사로 \"가치가 있다\"는 상태를 나타내기 위해 동사 뒤에 가볍게 붙은 목적어일 뿐이라, itself를 붙이면 \"가치라는 개념의 실체를 손에 쥐고 있다\"처럼 거창하고 부자연스럽게 들림. 진짜 강조하고 싶은 대상은 보통 '가치'가 아니라 '그 대상(주어)'이므로, 주어 뒤에 itself를 붙이는 것이 자연스러움.\n   Ex) has value itself (X) → The book itself has value. (O, 주어 the book을 강조)\n\n## in itself가 붙으면 뜻이 달라짐 — \"본질적으로\"\n\nhas value in itself처럼 전치사 in이 들어가면 itself는 더 이상 목적어를 강조하는 것이 아니라 \"그 자체의 속성으로서, 본질적으로\"라는 관용구가 되어 자연스러워짐.\nEx) The tradition has value in itself. (그 전통은 그 자체로(본질적으로) 가치가 있다.)\n   설명: in itself는 \"다른 것과의 비교나 부가적 이유 없이도 그 자체만으로\"라는 뜻의 고정 표현이라, value라는 추상명사 뒤에 와도 어색하지 않음.\n\n요약: 재귀대명사 itself를 단독으로 명사 강조 용법으로 쓸 때는 그 명사가 문장의 핵심 성분(주어·보어)인지 확인해야 하며, 목적어 자리의 추상명사를 강조하고 싶다면 in itself(본질적으로)라는 관용구로 바꾸는 것이 자연스러움."

      "note": "비교 대상이 불명확하거나 어순이 어색한 경우도 포함.",
      "guide": "━━━ 5형식 정리 ━━━\n\n문장 5형식(주어+동사+목적어+목적격보어) 구문에서, 동사에 따라 목적격보어 앞에 as가 붙는지 여부가 달라짐. 아래 네 가지 경우로 정리함.\n\n## 목적격보어에 as가 붙지 않는 동사\n\n목적어를 '~라고 부르다/여기다/만들다'라는 의미로 취급하는 동사는 목적격 보어(명사·형용사)가 as 없이 바로 옴.\n\n1) 명명·칭호 동사 (이름/칭호를 붙이다)\n   설명: 목적어를 '~라고 부르다/이름 짓다'라는 의미로 쓸 때, 목적격 보어로 명사가 as 없이 바로 옴.\n   Ex) call him John / name the baby Sarah / entitle the book XYZ / label him a traitor / nickname her Sunny\n\n2) 선출·임명 동사 (직책/지위에 앉히다)\n   설명: 목적어를 특정 직책이나 지위(명사)로 만들거나 뽑을 때 쓰는 동사.\n   Ex) appoint him director / elect her president / make him captain / crown him king\n\n3) 사고·인식 동사 (~라고 생각하다/여기다)\n   설명: 목적어의 상태나 정체를 명사·형용사 보어로 판단할 때 쓰는 동사.\n   Ex) consider it an honor / find the movie interesting / think him honest / believe her capable / deem it necessary\n\n4) 상태 변화·유지 동사 (~한 상태로 만들다/유지하다)\n   설명: 목적어의 상태를 나타내는 형용사 보어가 바로 뒤따름.\n   Ex) keep the door open / leave him alone / make me happy / drive him crazy\n\n## 사고·인식 동사 주의사항\n\n1) consider는 반드시 as 없이 씀\n   설명: \"consider him as a genius\"처럼 구어에서는 종종 쓰이지만, 격식체 글(IELTS 등)에서는 오류로 지적되는 대표적인 패턴임.\n   Ex) consider him a genius (O) / consider him as a genius (X, 격식체에서)\n\n2) think, believe + 목적어 + 형용사는 문법은 맞지만 예스러운 문어체 표현\n   설명: Think him honest, Believe her capable처럼 목적어 뒤에 형용사가 바로 오는 구문은 문법적으로는 맞지만 실제 글에서는 잘 안 씀. 아래 표현이 더 자연스러움.\n   Ex) think that he is honest / believe her to be capable / think of him as an honest person\n\n## as 생략·포함 모두 가능한 동사\n\nlabel, appoint, elect, nominate는 as를 붙여도 되고 안 붙여도 되는 동사임. 다만 call, name, make, crown, deem은 as를 붙이면 오히려 틀린 표현이 되므로 이 둘을 구분해서 기억해야 함.\n\n- label him a traitor = label him as a traitor (신문 기사체에서는 오히려 as를 넣는 경우가 더 많음)\n- appoint him director = appoint him as director\n- elect her president = elect her as president (as 없는 쪽이 좀 더 간결한 느낌)\n\n## 반드시 as가 필요한 동사\n\n위 동사들과 한국어 해석이 비슷해 보여도, 아래는 전치사 as가 반드시 필요한 동사(구)임. 에세이에서는 treat, view, see, define처럼 아래쪽 동사가 훨씬 자주 쓰임.\n\n- refer to A as B: A를 B라고 부르다/언급하다\n- regard A as B: A를 B로 여기다\n- describe A as B: A를 B라고 묘사하다\n- treat A as B: A를 B로 취급하다 (treat failure as a learning opportunity — 에세이에서 매우 자주 씀)\n- view A as B / see A as B: A를 B로 보다 (look upon보다 훨씬 흔하게 쓰는 표현)\n- define A as B: A를 B로 정의하다\n- classify A as B: A를 B로 분류하다\n- perceive A as B: A를 B로 인식하다\n- look upon A as B: A를 B로 보다 (다소 예스러운 표현이라 요즘 글에서는 view나 see로 대체하는 경우가 많음)\n\n━━━ 명사 + to부정사 후치수식 · have to와 구분 ━━━\n\nto부정사가 동사 바로 뒤가 아니라 명사 바로 뒤에 붙으면, 앞의 동사를 꾸미는 것이 아니라 그 명사를 수식하는 형용사적 용법으로 쓰인 것이다. have가 '가지다'라는 소유의 의미로 쓰인 문장에서 특히 자주 나타나며, have to(의무)와 혼동하기 쉽다.\n\n## 명사 뒤 to부정사는 그 명사를 수식함\n설명: '동사 + 명사 + to부정사' 구조에서 to부정사는 동사가 아니라 바로 앞의 명사를 꾸며 '~할 (명사)'라는 뜻을 만든다.\nEx) I have work to do. (해야 할 일이 있다 — to do가 work를 수식)\nEx) This city has activities to offer. (제공할 활동들이 있다 — to offer가 activities를 수식)\n\n## 관계대명사절에서는 명사가 앞으로 빠지고 to부정사만 남음\n설명: 위 구조에서 수식받는 명사가 관계대명사(that 등)를 통해 문장 앞으로 이동하면, have/has와 to부정사 사이에 있던 명사가 사라지고 둘만 남아 마치 have to(의무)처럼 보이는 문장이 된다.\nEx) the activities that this city has to offer (이 도시가 제공할 활동들) — has와 to offer 사이에 있던 activities가 관계절의 선행사로 앞에 나가면서 빠짐.\n\n## have to(의무)와 구분하는 법\n설명: have 바로 뒤에 to부정사가 붙어 있으면 '~해야 한다'는 의무의 have to로 보이지만, 원래 그 사이에 목적어 명사가 있었는지를 따져보면 의무가 아니라 '~할 …을 가지고 있다'는 뜻임을 알 수 있다.\n비교) I have to go. (반드시 가야 한다 — 의무, have 뒤에 명사 없이 바로 to) / I have work to do. (해야 할 일이 있다 — have 뒤에 목적어 work가 있고 to do가 그것을 수식)\n\n요약: to부정사가 동사에 바로 붙으면 의무·목적을 나타내는 동사구이지만, 명사 뒤에 붙으면 그 명사를 꾸미는 수식어다. 관계절로 명사가 앞으로 빠지면 동사와 to부정사만 남아 얼핏 have to처럼 보이니, 원래 그 사이에 있던 명사가 무엇인지 확인해야 한다."

      "guide": "━━━ 명사 뒤 수식어와 the의 관계 ━━━\n\n관사(the)는 명사 자체에 붙어 있는 한정 표현에 반응하는 것이지, 문장 앞뒤에 놓인 맥락 정보 전체에 반응하는 게 아님. 문장 앞에 배경 설명이 있어도 그것이 명사 바로 옆에 붙지 않으면 the를 유발하지 않음.\n\n## the가 필요한 경우: 명사 바로 뒤에 붙는 한정 표현\n\n1) 명사 + of구\n   설명: 명사 뒤에 '무엇에 대한 것인지'를 못박는 of구가 바로 붙으면, 그 명사는 더 이상 일반 개념이 아니라 특정 대상이 되므로 the가 필요함.\n   Ex) the growth of UK tourist numbers (O) — growth 뒤에 붙은 of구가 무엇의 성장인지 특정함\n   Ex) the motivation of the students (O)\n\n2) 명사 + 관계절\n   설명: 명사 뒤에 which/that/who로 시작하는 관계절이 붙어 대상을 좁혀주는 경우에도 the가 필요함.\n   Ex) the report that was published last year (O)\n\n3) 명사 + 숫자(동격)\n   설명: year, number처럼 '무엇'을 가리키는 명사 뒤에 구체적인 숫자가 콤마 없이 바로 붙어서 동격으로 그 명사를 특정하는 경우에도 the가 필요함. of구나 관계절만큼 강력한 한정 표현임.\n   Ex) In the year 1995, it is drama that stands out as the most popular genre. (O) — year 뒤에 1995가 동격으로 붙어 몇 년인지 특정함\n   비교) In 1995 (O, year 없이 숫자만 쓰면 애초에 관사 문제가 생기지 않음) / in year 1995 (X, year를 명사로 쓰면서 the를 생략하면 틀림)\n\n## the가 필요 없는 경우: 문장 전체를 꾸미는 부사구\n\n문장 맨 앞이나 뒤에 오는 for/in/among 같은 전치사구는 대개 명사 하나에 붙는 수식어가 아니라, 문장 전체(명제)가 적용되는 범위나 조건을 알려주는 역할만 함. 명사와 문법적으로 연결된 게 아니라 절 전체를 꾸미는 것이므로, 그 명사는 여전히 아무 수식도 받지 않은 일반적 개념으로 남아 무관사로 씀.\n\n1) For UK tourists, growth was slow.\n   설명: \"For UK tourists\"는 growth라는 명사를 꾸미는 게 아니라, \"이 문장이 적용되는 대상은 UK 관광객이다\"라는 조건을 문장 전체에 걸어주는 역할만 함. growth 옆에는 여전히 아무 수식어도 없으므로 무관사.\n   비교) The growth of UK tourist numbers was slow. — growth 바로 뒤에 of구가 붙어야 the가 필요해짐. \"For UK tourists, the growth was slow\"처럼 the를 넣으면 부자연스러움.\n\n2) In 2013, sales increased.\n   설명: \"In 2013\"은 시점을 나타내는 부사구일 뿐, sales에 붙어서 그것을 한정하는 표현이 아님.\n   비교) The sales of laptops increased in 2013. — sales 뒤에 of구가 붙어야 the가 필요함.\n\n3) Among teenagers, obesity is rising.\n   설명: \"Among teenagers\"도 문장 전체가 적용되는 범위를 나타낼 뿐, obesity 옆에 붙어 그것을 한정하는 표현이 아님.\n   비교) The obesity rate among teenagers is rising. — rate라는 명사 옆에 \"among teenagers\"가 직접 붙어 하나의 명사구(the obesity rate among teenagers)를 이루므로 the가 필요함.\n\n요약: the 여부는 '이 문장에 맥락 정보가 있는가'가 아니라 '그 명사 바로 옆에 이 명사를 특정 대상으로 좁혀주는 표현이 문법적으로 직접 붙어 있는가'로 판단해야 함.\n\n━━━ 무관사 · 부정관사 · 정관사 비교 — food 예시로 보기 ━━━\n\nfood처럼 불가산명사로도 쓰이는 단어는 관사에 따라 의미가 완전히 달라짐. 세 가지를 나란히 비교하면 헷갈리지 않음.\n\n1) food (무관사) — 음식이라는 개념 전체를 일반적으로 가리킴\n   설명: 아무 수식어도 없이 '음식'이라는 물질·개념 전체를 말할 때는 관사를 붙이지 않음.\n   Ex) Food is expensive these days. (음식 전반에 대한 일반적 진술)\n\n2) a food (원칙적으로 틀림) — food는 애초에 셀 수 없음\n   설명: food는 불가산명사라 부정관사 a를 붙일 수 없음. 굳이 '한 가지 음식/음식의 한 종류'를 말하고 싶다면 a kind of food, a type of food처럼 풀어써야 함.\n   Ex) a food that you bought (X) → the food that you bought / a type of food (O)\n\n3) the food (특정 지칭) — 이미 특정된 그 음식\n   설명: 관계절(that you bought)이나 of구처럼 명사에 직접 붙는 한정 표현이 있어서 '그 음식'으로 특정될 때는 the를 씀.\n   Ex) the food that you bought from a grocery store (O)\n\n요약: 일반적 개념 전체 = 무관사, 셀 수 없는 명사에 '한 개'라는 의미의 a = 원칙적으로 불가, 특정 대상으로 좁혀졌다면 the.\n\n━━━ few/a few, little/a little — 있음 vs 거의 없음 ━━━\n\n똑같이 '조금'이라는 뜻처럼 보여도, 부정관사 a가 있고 없고에 따라 뉘앙스가 정반대가 됨.\n\n1) a few / a little — 부정관사 a가 있으면 긍정적 뉘앙스 ('그래도 좀 있다')\n   설명: 가산명사에는 a few, 불가산명사에는 a little을 씀. 양은 적지만 '있다'는 쪽에 초점이 있음.\n   Ex) I have a few friends. (친구가 몇 명 있음 — 긍정적)\n   Ex) There is a little water left. (물이 조금 남아있음 — 긍정적)\n\n2) few / little — a 없이 쓰면 부정적 뉘앙스 ('거의 없다')\n   설명: 똑같이 가산명사엔 few, 불가산명사엔 little을 쓰지만, 관사 a가 빠지면 '부족하다'는 부정적 의미로 바뀜.\n   Ex) I have few friends. (친구가 거의 없음 — 외로움 뉘앙스)\n   Ex) There is little water left. (물이 거의 없음 — 부족함 뉘앙스)\n\n   비교) a few friends (친구가 몇 명 있음, O) / few friends (친구가 거의 없음, 의미가 정반대) — 관사 a 하나로 뉘앙스가 뒤집히므로 반드시 의도한 의미에 맞게 골라야 함.\n\n요약: 가산명사엔 few 계열, 불가산명사엔 little 계열을 쓰되, a가 있으면 '있다'(긍정), a가 없으면 '거의 없다'(부정)는 뜻이 됨.\n\n━━━ 가산·불가산명사 × a/the/무관사 조합표 ━━━\n\n관사 선택은 명사가 가산(셀 수 있음)인지 불가산(셀 수 없음)인지, 그리고 그 명사가 특정 대상으로 좁혀졌는지(한정) 아니면 일반적 개념·전체를 가리키는지에 따라 결정됨. 아래는 명사 종류(행) × 관사(열) 아홉 칸을 모두 짚어본 것.\n\n## 가산명사 단수 (a car / the car / car)\n\n1) a/an — O, 기본형\n   설명: 처음 언급하거나, 여러 개 중 어느 것이어도 상관없는 하나를 가리킬 때 씀. 가산명사 단수의 default 관사임.\n   Ex) I bought a car last year.\n2) the — O, 특정 지칭\n   설명: 이미 언급됐거나, of구·관계절 등으로 어느 것인지 특정될 때 씀.\n   Ex) The car I bought last year broke down.\n3) 무관사 — X, 원칙적으로 불가\n   설명: 가산명사 단수는 원칙적으로 관사 없이 못 씀. school, bed, prison처럼 본래 기능을 나타내는 관용구(go to school, in bed)나 by car 같은 교통·통신수단 표현은 예외임.\n   Ex) I bought car. (X) → I bought a car. (O)\n   비교) go to school (O, 예외 관용구) / go to a school (O, 특정 건물을 말할 때는 다시 관사 필요)\n\n## 가산명사 복수 (cars / the cars / 무관사 cars)\n\n1) a/an — X, 애초에 결합 불가\n   설명: a/an은 '하나'를 뜻하므로 복수형과는 함께 쓰이지 않음. 개수를 말하고 싶으면 some, many, two 같은 수량 표현을 씀.\n   Ex) a cars (X) → some cars / two cars (O)\n2) the — O, 특정 지칭\n   설명: 특정된 복수 대상을 가리킬 때 씀.\n   Ex) The cars in the parking lot are all electric.\n3) 무관사 — O, 일반적 진술\n   설명: 특정되지 않은 복수 대상을 종류 전체로 일반화해서 말할 때 가장 흔히 씀.\n   Ex) Cars are becoming more expensive.\n\n## 불가산명사 (water / the water / 무관사 water)\n\n1) a/an — X, 원칙적으로 불가\n   설명: 셀 수 없으므로 a를 붙일 수 없음. '한 잔/한 종류'처럼 단위를 말하고 싶으면 a glass of, a kind of, a piece of처럼 단위 명사를 앞세워야 함.\n   Ex) a water (X) → a glass of water (O) / a type of research (O)\n2) the — O, 특정 지칭\n   설명: 관계절·of구 등으로 특정된 그 물질·개념을 가리킬 때 씀.\n   Ex) The water in this bottle tastes strange.\n3) 무관사 — O, 일반적 진술\n   설명: 물질·개념 전체를 일반적으로 가리킬 때 가장 흔히 씀. IELTS 에세이에서 가장 많이 쓰는 형태임.\n   Ex) Water is essential for life.\n\n요약: the는 가산·불가산 여부와 상관없이 '그 명사가 특정 대상으로 좁혀졌는가'에만 반응함. a/an은 가산명사 단수에만 붙고, 무관사는 가산명사 복수와 불가산명사가 '일반적 개념 전체'를 가리킬 때 씀. 표로 보면: (가산단수, 가산복수, 불가산) × (a/an, the, 무관사) 아홉 칸 중 a/an이 자연스러운 칸은 가산단수 하나뿐이고, the는 세 칸 모두 가능하며, 무관사는 가산복수·불가산 두 칸에서 자연스러움.\n\n━━━ a variety of · 수량사로 쓰이는 명사의 관사 ━━━\n\nvariety처럼 '여러 개'라는 뜻을 담은 명사가 a lot of, a number of처럼 수량사 역할을 할 때는, 뒤에 of구가 오더라도 일반적인 the 규칙을 따르지 않고 항상 부정관사 a로 시작한다.\n\n## a variety of = 수량사 관용구\n설명: variety가 여기서는 '무엇에 대한 것'이라는 일반 명사가 아니라, a lot of·a number of·a range of와 같은 부류의 수량 표현으로 굳어져 쓰임. 뒤에 of + 복수명사가 오지만 항상 a로 시작하고 the를 쓰지 않는다.\nEx) a variety of reasons (O) — 여러 가지 이유들\nEx) the variety of reasons (X, 수량사로 쓸 때는 the를 붙이지 않음)\n\n## the variety of = '다양성'이라는 개념 명사\n설명: variety를 수량사가 아니라 '다양함이라는 성질·정도' 자체를 가리키는 일반 명사로 쓸 때는, article 카테고리의 다른 규칙과 마찬가지로 of구·관계절 등으로 특정되면 the가 붙는다.\nEx) The variety of dishes at the restaurant was impressive. (그 식당이 지닌 다양성 자체를 주어로 서술)\n\n비교) a variety of reasons (여러 이유들 — 수량사, a) / the variety of the menu (그 메뉴의 다양성 — 개념 명사, the)\n\n요약: of 뒤에 온다고 무조건 the가 붙는 게 아니라, 그 명사가 '여러 개의 ~들'을 뜻하는 수량사로 쓰였는지, '다양함'이라는 개념 명사로 쓰였는지에 따라 관사가 달라진다.\n\n━━━ 단수 가산명사는 반드시 한정사가 필요함 ━━━\n\n단수 가산명사(countable noun 단수형)는 절대 관사·한정사 없이 혼자 쓰일 수 없음. car, book, idea처럼 셀 수 있는 단수명사 앞에는 반드시 a/an, the, 지시사(this/that), 소유격(my/your), 수사(one, another) 등 무언가가 붙어야 함.\n\n## 단수 가산명사 앞에 올 수 있는 것들\n\n1) a/an — 처음 언급되거나 특정하지 않은 하나\n   Ex) I bought a car last year.\n2) the — 이미 언급됐거나 특정된 대상\n   Ex) I bought the car you recommended.\n3) 지시사·소유격·수사 (this/that/my/your/one 등)\n   Ex) I bought that car. / I bought my car.\n\n## 이 규칙에서 예외인 경우\n\n1) 복수 가산명사 — 관사 없이도 가능\n   Ex) I bought cars. (O)\n2) 불가산명사 — 관사 없이도 가능\n   Ex) I bought water. (O)\n3) 고유명사 — 관사 없이도 가능\n   Ex) I met John. (O)\n\n요약: 단수·가산명사(car 등)는 앞에 관사류가 반드시 있어야 하며(bought car는 오류), 복수형·불가산명사·고유명사는 이 규칙의 예외로 무관사로 써도 됨.\n\n━━━ 관습적으로 the가 붙는 '제도·공공개념' 명사군 ━━━\n\ngovernment, media, environment, police, news, streets, weather, internet, economy처럼 세상에 여러 개 존재하는 대상이라도, 영어에서 하나의 영역·기관·개념으로 취급하는 명사들은 문맥에서 특정 대상을 안 정해줘도 관습적으로 the를 붙인다. of구·관계절 등 문법적 한정 표현이 있어야 the가 붙는 일반 명사(article 규칙의 기본 원리)와는 별개의, 어휘 단위로 암기해야 하는 예외 그룹이다.\n\n## 이 그룹의 특징 — 특정화 근거 없이도 the\n\n1) the government / the media / the police\n   설명: 어느 나라 정부인지, 어느 언론사인지 밝히지 않아도 일반적 진술에서 관습적으로 the를 붙임.\n   Ex) The government should regulate this industry more strictly. (특정 국가를 지목하지 않아도 the government)\n\n2) the environment (생태적 의미) / the streets / the weather\n   설명: 지구 환경, 거리, 날씨처럼 공동체가 공유하는 하나의 영역으로 인식되는 개념도 이 그룹에 속함. 단, environment가 '분위기·상황'을 뜻하는 다른 의미로 쓰이면(a work environment 등) 이 규칙이 적용되지 않고 평범한 가산명사로 돌아감.\n   Ex) more trash on the streets in tourist areas (거리라는 공공장소 개념)\n   Ex) The environment is deteriorating due to pollution. (생태적 의미 — the 고정)\n   비교) the environment(생태계, 관습적 the) / a supportive environment(분위기·상황, 평범한 가산명사라 a/the 다 가능)\n\n요약: 이 명사군은 '문맥상 특정됐는가'로 판단하는 게 아니라 단어 자체가 관습적으로 the를 요구하는지부터 확인해야 하며, city·landmark처럼 평범한 가산명사에 잘못 적용해 the를 붙이지 않도록 주의해야 한다.\n\n━━━ a vs 무관사 — 개별 사례냐, 기능적 의미냐 ━━━\n\n똑같이 \"특정 안 됨(non-specific)\"처럼 보여도, a를 쓰는 경우와 무관사가 되는 경우는 관사가 빠지는 이유 자체가 다르다. 이 둘을 하나의 기준으로 뭉뚱그리면 헷갈린다.\n\n## a — 그래도 개별 사례(instance)로 취급될 때\n설명: 부류 안에서 정확히 어느 것인지 못 박지는 않아도, \"그중 하나\"라는 개별적인 이미지가 있으면 셀 수 있는 하나로 취급해 a를 씀. age가 대표적 — 인생의 여러 시점들 중 \"젊은 한 시점\"을 가리키는 것이므로 개별 사례로 인식됨.\nEx) from a young age (O) — 나이 스펙트럼 위의 한 지점을 가리킴\n\n## 무관사 — 사물성이 아니라 기능·역할 자체로 쓰일 때\n설명: school, bed, church, prison, hospital(영국식), work, court 등은 원래 가산명사지만, 그 시설이 존재하는 본래 목적(기능)으로 쓰일 때는 건물·개체 하나가 아니라 \"그 활동·역할 자체\"를 가리키므로 예외적으로 관사를 뺌.\nEx) enter school (O) — \"학교 다니는 것\"(학업)이라는 기능을 가리킴, 건물 하나를 가리키는 게 아님\n비교) enter a school / enter the school — 특정 건물을 가리키는 뜻으로 바뀌면 관사가 다시 필요함\n\n## 판별법\n설명: 그 명사를 \"~하는 것/활동\"으로 바꿔도 뜻이 그대로면 무관사 후보이고, 바꿔도 여전히 \"하나의 개체·사례\"로 남으면 a를 씀.\nEx) at a young age → \"젊은 시절에\"로 바꿔도 여전히 나이 스펙트럼 위의 한 시점(개체) → a\nEx) go to school → \"공부하러 가다\"로 바꿔도 뜻이 그대로(기능) → 무관사\n\n요약: \"특정 안 됨\"이라는 인상은 같아도, a는 그 대상을 여전히 하나의 사례로 셀 수 있게 취급하는 것이고, school류의 무관사는 사물성을 벗어나 기능·역할 그 자체를 가리키는 완전히 다른 예외 규칙이다. 헷갈리면 \"이 단어가 지금 개체를 가리키는가, 활동/역할을 가리키는가\"부터 물어볼 것.\n\n━━━ language의 관사 — 개념 vs 특정 언어 ━━━\n\nlanguage는 문맥에 따라 불가산명사로도, 가산명사로도 쓰일 수 있어서 관사 선택이 달라짐. 핵심은 '언어라는 것 자체/언어를 배우는 행위'를 말하는지, '영어·프랑스어처럼 구체적인 개별 언어 하나(또는 여러 개)'를 말하는지 구분하는 것임.\n\n## 무관사 language — 언어라는 개념·과목·능력 전체\n\nmath, music, science처럼 과목이나 능력을 통째로 가리킬 때와 같은 방식으로, '언어'라는 개념 전체(언어 학습이라는 활동, 언어라는 인간의 능력)를 말할 때는 무관사로 씀.\nEx) Language should be taught in small classes. (언어 교육이라는 주제 전반)\nEx) Learning language takes time. (특정 언어가 아니라 언어 학습이라는 행위 자체)\nEx) a language class (여기서 language는 명사 class를 꾸미는 수식어로 쓰였으므로 관사 문제 자체가 발생하지 않음 — math class, art class와 같은 구조)\n\n## a language — 구체적인 언어 하나\n\n영어, 프랑스어처럼 세상에 여러 개 존재하는 언어들 중 하나를 가리킬 때는 가산명사로 취급해 a language를 씀.\nEx) She is learning a language for the first time. (구체적으로 어떤 하나의 언어를 배우고 있음)\nEx) English is a language spoken by many countries.\n\n## languages — 구체적인 언어 여러 개\n\n특정 언어를 복수로 가리킬 때는 languages.\nEx) She speaks three languages.\n\n## 판단 기준\n\n'언어 학습/언어 교육'이라는 주제·행위 자체를 말하는가(무관사) 아니면 '그 여러 언어들 중 하나 혹은 몇 개'를 말하는가(a language / languages)로 구분하면 됨.\n\n## 명사 + to부정사는 해당하지 않음 (주의)\n\n명사 뒤에 to부정사가 붙어도 of구·관계절·동격 숫자와 달리 그 명사를 특정 대상으로 좁혀주지 않음. to부정사는 대개 '목적'이나 '가능한 쓰임새'를 나타낼 뿐, 실제로 존재하는 특정 대상을 가리키는 게 아니기 때문임. 그래서 명사+to부정사 구조는 원칙적으로 무관사/부정관사를 그대로 유지함.\nEx) I need a chance to speak. (O, 막연한 '어떤 기회') / I need the chance to speak. (X, 특정 기회가 아니라면 부자연스러움)\nEx) Students want opportunities to interact. (O, 막연한 기회들)\n비교) the right to vote, the ability to speak처럼 일부 명사(right, ability, opportunity 등)는 관용적으로 the와 자주 결합하지만, 이는 to부정사가 특정성을 부여해서가 아니라 그 명사 자체가 유일한 개념(투표권 자체 등)으로 굳어져 쓰이는 관용 표현임."

      "guide": "━━━ 동사와 전치사의 결합 ━━━\n\n전치사를 붙일지 말지는 사실 '이 동사가 목적어를 직접 가질 수 있는가(타동사인가, 자동사인가)'로 결정된다. 전치사 오류의 절반은 뜻이 아니라 이 구분을 놓쳐서 생긴다.\n\n## 타동사 — 목적어를 바로 받음, 전치사 불필요\n\n1) discuss, mention, resemble, marry, enter, approach, attend, obey, answer, call(A를 B라고 부르다) 등은 모두 타동사라 목적어 앞에 전치사가 오면 오류가 됨\n   설명: 한국어로 '~에 대해 토론하다', '~와 결혼하다', '~에 들어가다', '~라고 부르다'처럼 전치사가 들어가는 뜻이라도, 이 동사들은 이미 그 의미를 동사 자체에 담고 있어서 목적어가 바로 옴\n   Ex) discuss the problem (O) / discuss about the problem (X)\n   Ex) marry him (O) / marry with him (X)\n   Ex) enter the room (O) / enter into the room (X)\n   Ex) something that could be called a trend (O) / called as a trend (X)\n   비교) follow (자동사로 착각하기 쉬운 타동사) — follow by/after 모두 불필요, follow 하나로 끝남\n   Ex) some pros and cons follow (O) / some pros and cons follow by (X)\n\n## 자동사 — 목적어를 못 받음, 명사를 연결하려면 전치사 필수\n\n1) arrive, listen, wait, look, apply, belong, consist, depend, complain, graduate, object, react, insist 등은 자동사라 뒤에 명사가 오려면 전치사가 반드시 있어야 함\n   설명: 동사만으로 문장이 끝날 수 있고(I arrived.), 특정 대상을 언급하려면 전치사가 다리 역할을 해줘야 함\n   Ex) arrive at the station (O) / arrive the station (X)\n   Ex) listen to the radio (O) / listen the radio (X)\n   Ex) wait for the bus (O) / wait the bus (X)\n   Ex) depend on the weather (O) / depend the weather (X)\n   Ex) as you can see from team B's scores (O) / as you can see by team B's scores (X)\n2) 짝을 이루는 전치사가 동사마다 고정돼 있어서 뜻으로 유추하지 말고 통째로 외워야 함\n   Ex) agree with a person / agree to a plan (같은 agree인데 목적어 종류에 따라 전치사가 갈림)\n   Ex) apologize for a mistake / complain about a problem / insist on a rule\n\n## 오류가 나오는 두 방향\n\n1) 타동사에 불필요한 전치사를 붙이는 오류\n   예시 오류: discuss about it → discuss it, follow by → follow, marry with her → marry her\n2) 자동사인데 전치사 없이 목적어를 바로 붙이는 오류\n   예시 오류: arrive the airport → arrive at the airport, listen music → listen to music\n\n요약: 전치사를 쓸지 말지 뜻으로 헷갈리면 그 동사가 타동사인지 자동사인지부터 확인해야 하며, 자동사라면 어떤 전치사가 관용적으로 붙는지 동사별로 암기해야 한다.\n\n━━━ 자동사+전치사가 구동사(전치사 동사)로 넘어가는 경계 ━━━\n\n자동사 뒤에 전치사가 붙는다고 다 같은 게 아니다. 그 결합이 만들어내는 뜻이 원래 동사 뜻 그대로 예측 가능한지, 아니면 전혀 다른 새 의미가 생기는지에 따라 문법적 성질 자체가 달라진다.\n\n## 뜻이 그대로 예측되면 — 그냥 자동사+전치사 결합\n\n1) arrive at, look at, listen to, wait for처럼 전치사가 원래 뜻(도착하다, 보다, 듣다, 기다리다)에 방향·대상만 더해주는 경우\n   설명: 전치사를 다른 것으로 바꾸면 의미가 바뀌긴 해도(look at vs look for), 동사 자체의 뜻은 유지됨\n   Ex) look at the picture (그림을 보다) / look for the key (열쇠를 찾다) — look의 '보다'라는 core 의미가 유지되며 전치사만 역할을 더함\n\n## 뜻이 새로 생기면 — 구동사(전치사 동사)로 취급\n\n1) look after(돌보다), come across(우연히 마주치다), look into(조사하다)처럼 동사+전치사가 원래 각 단어 뜻으로는 유추 안 되는 새 의미를 만드는 경우\n   설명: 이때는 동사+전치사 전체를 하나의 새로운 타동사처럼 취급해야 함 — 그래서 수동태로 바꿀 수 있게 됨(원래 자동사는 수동태 불가능한 것과 대조적)\n   Ex) She looked after the children. → The children were looked after (by her). (O, 구동사 전체가 타동사처럼 수동태 가능)\n   비교) He arrived at the station. → The station was arrived at. (X, 이건 그냥 자동사+전치사라 수동태 불가 — 뜻이 새로 생긴 게 아니기 때문)\n\n요약: 동사+전치사 결합의 뜻이 원래 단어 뜻의 합으로 설명되면 그냥 문법적 결합이고, 전혀 다른 새 의미가 생기면 구동사(전치사 동사)로 취급해 수동태 등 타동사 문법이 적용된다는 점까지 함께 기억해야 한다.\n\n━━━ 명사·형용사와 전치사의 고정 결합 ━━━\n\n## 명사 뒤에 관용적으로 붙는 전치사·부정사\n\n1) 명사 뒤에 목적을 나타내는 to부정사가 관용적으로 붙는 경우\n   Ex) opportunity to explore the world (O) / opportunity of exploring the world (X)\n\n## 형용사 뒤에 붙는 전치사가 정해져 있는 경우\n\n1) 형용사마다 짝을 이루는 전치사가 고정돼 있어 다른 전치사를 쓰면 어색해짐\n   Ex) opposite to the ones just mentioned (O) / opposite from the ones just mentioned (X)\n   Ex) interested in a subject (O) / interested at a subject (X)\n\n## 동사·명사구를 통째로 이루는 관용 표현\n\n1) 개별 단어 뜻을 조합해서는 안 나오는, 통째로 외워야 하는 관용구\n   Ex) take advantage of their young age (O) / getting the advantage of young age (X)\n   Ex) cause confusion for children (O) / give children confusion (X)\n   Ex) from my perspective (O) / in my perspective (X)\n   Ex) move out of the tourist area (O) / move outside the tourist area (X)\n\n━━━ 시간을 가리키는 the/that 표현 정리 ━━━\n\n명사 앞의 the가 '앞서 언급한 것을 다시 가리키는' 정상적인 역할을 하는지, 아니면 뜻이 통째로 고정된 관용구의 일부일 뿐인지 구분해야 함. 똑같이 the가 붙어도 작동 방식이 다름.\n\n## the가 진짜로 앞 내용을 가리키는 경우 — at the time\n\n앞에서 특정 시기(연도, 사건 등)가 언급된 뒤에 쓰면, the time은 그 시기를 정상적으로 되짚어 가리킴. the의 일반적인 용법 그대로 작동함.\nEx) In 2015, I moved to Seoul. At the time, I couldn't speak Korean at all. (O — the time = 2015)\n주의) 앞에 특정 시기가 먼저 언급되지 않은 채 at the time만 쓰면, 무엇을 가리키는지 불분명해서 부자연스러움.\n\n## the가 뜻을 고정해버린 관용구 — at the moment\n\nat the moment는 앞뒤 맥락과 무관하게 통째로 '지금, 현재'라는 뜻으로 굳어진 표현. the가 뭔가를 가리켜서가 아니라 관용구 자체의 일부이므로, 과거시제 문장에 쓰면 시점이 충돌함.\nEx) I am busy at the moment. (O, 현재시제와 자연스럽게 결합)\nEx) I faced a limit at the moment. (X, 과거 문장인데 '지금'이라는 뜻과 충돌)\n\n## 앞서 언급한 특정 시점을 가리키고 싶을 때 — that 계열\n\n앞선 문맥의 특정 시점을 명확히 되짚고 싶다면, the보다 지시대명사 that을 쓴 표현이 더 안전함. that이 '바로 그것'이라는 지시 기능을 직접 수행하기 때문.\nEx) at that moment / at that point / at that time / back then\n비교) I faced a limit at that point. (O) — the moment 자리에 that point를 쓰면 관용구 문제 없이 원하는 뜻이 정확히 전달됨\n\n## 같은 계열의 다른 고정 관용구 (참고로 함께 정리)\n\n1) 현재를 뜻하는 관용구 — the가 있거나 아예 무관사인 경우 모두 존재하므로 개별 암기 필요\n   Ex) at present (무관사, 현재) / for the time being (임시로, 지금 당장은) / currently, nowadays, these days (부사, 무관사)\n2) 시간과 무관하게 the가 고정된 다른 관용구\n   Ex) in the meantime (그 사이에) / on the whole (전반적으로) / in the long run (장기적으로) / at the end of the day (결국)\n   설명: 이런 표현들도 the가 특정 명사를 가리켜서가 아니라 전치사구 전체가 하나의 뜻으로 통째로 굳어진 것이므로, 다른 관사로 바꾸면 틀림\n\n요약: the가 붙었다고 다 앞 문맥을 가리키는 게 아님. at the time처럼 정상적으로 앞 내용을 가리키는 경우와, at the moment처럼 뜻이 이미 고정된 관용구인 경우를 구분해서, 후자는 규칙이 아니라 통째로 외워야 함."

      "originalText": "Scores could be considered as which are determined by eacg team's ability, but the bar chart above show that it could be depended on the season. Of course, as you can see by team B's scores during 2002~2005, there could be a team whose scores are always way above than others. However, Team B's score was 82pt in 2002 but it had became lower until 2004, but it has successfully made their socre better in 2005.\n\nTeam A and Team C's scores are definitely lower than Team A's for the entire given period. Their scores are relatively similar compared to the scores of Team B's, even though the gap changes by the year. Furthermore, until 2003, Team C's performance was better than Team A's. By the way, as the gap had shrinked and Team A had performed better in 2004 with the score of 35. In 2005, TeamA's score has got lower a lot, but they were still above Team C.\n\nThis chart shows two ponits. First one is that the teams' score is not always high or low, and it costantly changes as the season goes. Second, there's something that could be called as a trend in theses scores.",
      "notes": "━━━ 과거 · 과거완료 · 현재완료 구분 ━━━\n\n- 과거(단순과거): 이미 종료된 특정 시점의 사건을 나타냄. 연도가 명시되는 경우 대부분 이에 해당함.\n- 과거완료(had + p.p.): 특정 과거 시점보다 앞서 발생한 사건을 나타냄. 문장 내에 기준이 되는 시점이 먼저 제시되어야 함.\n- 현재완료(has/have + p.p.): 과거부터 현재까지 이어지는 상황, 또는 현재 시점을 기준으로 한 서술에 사용함. 이미 종료된 연도(예: 2005년)를 서술할 때는 사용할 수 없음.\n\n예시 오류: \"it has successfully made their score better in 2005\"\n→ 2005년은 이미 종료된 특정 연도이므로 현재완료(has made)가 아닌 단순과거(made)로 표기해야 함.\n\n━━━ 과거완료 사용 조건 ━━━\n\n과거완료는 문장 내에 '기준이 되는 더 나중 시점'이 존재할 때만 사용 가능함. 그 기준 시점보다 앞선 사건에 한해 had + p.p.를 사용하며, 기준 시점이 없는 경우 단순과거를 사용함.\n\n1) By the time + 과거, 주어 + had + p.p.\n   Ex) By the time the season ended, Team B had already lost its lead.\n   설명: 시즌이 끝난 시점이 기준. 그 이전에 이미 선두를 잃었음을 나타냄.\n\n2) Before + 과거, 주어 + had + p.p.\n   Ex) Before 2004, Team A had never scored above 20 points.\n   설명: 2004년이 기준 시점이며, 그 이전 상황을 서술함.\n\n3) By + 연도, 주어 + had + p.p.\n   Ex) By 2004, the gap between Team A and Team C had narrowed significantly.\n   설명: 'by 2004'가 기준 시점 역할을 하므로 had narrowed 사용이 적절함.\n\n   비교 예시:\n   \"Team A had performed better in 2004\" (오류)\n   → 2004년 자체를 서술하는 문장으로, 기준이 될 더 나중 시점이 없음. 따라서 had performed가 아닌 performed(단순과거)가 적절함.\n   \"By 2005, Team A had performed better than in the previous year.\" (올바름)\n   → 'by 2005'라는 기준 시점이 존재하므로 had performed 사용 가능.\n\n4) After + 주어 + had + p.p., 주어 + 과거\n   Ex) After the score had dropped for two years, it rose again in 2005.\n   설명: 점수가 하락한 사건이 그 이후 상승한 사건보다 먼저 발생했음을 명확히 하기 위해 앞선 사건에 had를 사용함.\n\n요약: 한 문장에 두 개의 과거 사건이 있고, 그중 하나가 다른 하나보다 명백히 먼저 발생했음을 강조할 때만 과거완료를 사용함.",

      "notes": "━━━ 현재완료 · 단순과거 구분 ━━━\n\n- 단순과거: 이미 종료된 특정 기간이나 시점의 사건을 나타냄. 종료 연도가 명시되는 경우 대부분 이에 해당함.\n- 현재완료(has/have + p.p.): 과거부터 현재까지 이어지는 상황, 또는 현재 시점을 기준으로 한 서술에 사용함. 종료 연도가 명시된 기간(예: 1970~2010년)을 서술할 때는 사용할 수 없음.\n\n예시 오류: \"It has never been above 20 percent.\"\n→ 1970년부터 2010년까지는 이미 종료된 기간이므로 현재완료(has been)가 아닌 단순과거(was)로 표기해야 함.\n\n예시 오류: \"it has fluctuated a lot\"\n→ 같은 이유로 단순과거(fluctuated)가 적절함.\n\n━━━ 관사 사용 규칙 ━━━\n\n관사는 명사가 특정 대상을 가리키는지, 일반적 개념을 가리키는지에 따라 붙이거나 생략함.\n\n1) 관용 표현에는 관사를 넣지 않음\n   Ex) ranked in second place (O) / ranked in a second place (X)\n   설명: in first/second/third place와 같은 순위 표현은 관사 없이 씀.\n\n2) 일반적 의미로 쓰인 불가산명사 앞에는 the를 넣지 않음\n   Ex) as time passed (O) / as the time passed (X)\n   설명: 특정 시점을 가리키는 것이 아니라 '시간이 흐르면서'라는 일반적 의미이므로 the를 붙이지 않음.\n\n3) 반대로, 특정한 기간·대상을 가리킬 때는 the가 필요함\n   Ex) throughout the given period (O) / among given period (X)\n   설명: 그래프에 제시된 특정 기간(1970~2010년)을 가리키므로 the가 필요하며, among은 하나의 기간과는 어울리지 않는 전치사이므로 throughout으로 바꿔야 함.\n\n4) 종류·범주 전체를 가리키는 가산명사는 관사 없이 씀\n   Ex) Trucks were the most common type of vehicle. (O)\n   비교) The truck in the picture was red. (특정한 트럭 한 대를 가리킴 → the 필요)\n   설명: Truck, Taxi, Bus처럼 도표 범례의 항목명을 그대로 문장의 주어로 써서 그 종류 전체의 통계를 서술할 때는 특정 대상 하나를 가리키는 것이 아니므로 관사가 필요 없음. 이때는 원칙적으로 단수(Truck)보다 복수형(Trucks)을 주어로 쓰는 것이 더 표준적인 표현임.\n\n5) 가산명사·불가산명사 구분 기준\n   설명: 명사를 셀 수 있는지 없는지는 '누가 세더라도 기준이 같은지'로 판단함. 하나의 단위가 명확하고 고정되어 있으면 가산명사, 하나의 단위를 사람마다 다르게 나눌 수 있으면 불가산명사임.\n   Ex) a chair, an idea, a day → 단위가 명확함 (가산명사)\n   Ex) bread, water, furniture → 물질이나 집합 전체를 가리켜 고정된 단위가 없음 (불가산명사)\n\n   불가산명사는 그 자체로는 개수를 셀 수 없으므로, 단위를 나타내는 명사(a piece of, a loaf of, a glass of 등)를 앞에 붙여야 개수를 표현할 수 있음.\n   Ex) a loaf of bread(빵 한 덩어리) / a slice of bread(빵 한 조각) — 같은 bread라도 어디까지를 '하나'로 볼지는 사람마다 다르므로, 그 기준을 단위명사로 정해줘야 함.\n   Ex) a piece of furniture(가구 한 점), a piece of information(정보 하나), a glass of water(물 한 잔)\n\n   같은 단어도 의미에 따라 가산·불가산이 달라지기도 함.\n   Ex) hair(불가산, 머리카락 전체) / a hair(가산, 머리카락 한 올)\n   Ex) paper(불가산, 종이라는       "question": "Around the world, many people buy ready-to-eat food rather than cooking for themselves. Do the advantages of this situation outweigh the disadvantages?",
      "originalText": "The advantages of buying ready-to-eat food don't outweigh the disadvantages of it. There are definite cons of buying ready-to-eat food rather than cooking for myself. It is really costly if you buy the food in restaurants, compared to the case of buying supplies for our meal from grocery stores. These days I pack a lunch box to my work becuase I need to save money, and I can tell it really worked. The cost of buying ready-to-eat food is at least 1.5 times expensive, from my experience, even if a food that you bought from a grocery store is ready-to-cook food.\n\nBut, of course there are some downsides of making my own food. It is not delicious as the food made by chef, or at leat somebody who is proficient at cooking. Also, the menu of my meals feel like they are repeated a lot because I need to use all the ingredients I bought until a week pasts by.\n\nThese are the advantages and disadvantages that I could think of about buying ready-to-eat food. But I value the advantages of making my own meals. I can make food, not only affordable but also in healthy way. I know every single thing that is put inside my food, unlike when I buy food which is already made with unknown ingredients. Also, the process of making food makes me feel like I'm in control of something, which allows me to ahcieve the goal I set up. Moreover, I get so much joy when I make food for others, so it is good for me to practice my cooking skills in my daily life.\n\nTherefore, I would like to make my own food, unless it's time for me to enjoy the mood of the restaurant or sophisticated food.",
      "notes": "━━━ 배수·비교 구문 정확히 쓰기 ━━━\n\n1) N times + 비교급 (또는 as...as)\n   설명: '몇 배 더 ~하다'라는 배수 비교는 times 뒤에 원급 형용사만 두면 안 되고, 반드시 비교급(more + 형용사)이나 as...as 구문과 함께 써야 함.\n   Ex) is at least 1.5 times more expensive (O) / is at least 1.5 times expensive (X)\n\n2) not as + 형용사 + as — 첫 as를 빠뜨리지 않기\n   설명: '~만큼 …하지 않다'라는 부정 비교는 not 다음에 as가 먼저 나오고, 형용사 뒤에 as가 한 번 더 와야 함. 첫 as를 생략하면 비교 구문 자체가 성립하지 않음.\n   Ex) It is not as delicious as food made by a chef. (O) / It is not delicious as the food made by chef. (X)\n\n━━━ 관사 사용 — 이 글에서 반복된 패턴 ━━━\n\nessay-2에서 정리한 규칙(불가산명사·일반 지칭 등)과 이어지는 내용으로, 이번 글에서는 다음 두 경우가 추가로 확인됨.\n\n1) 불가산명사로 쓰인 food에는 a를 붙이지 않음\n   설명: food가 특정한 음식 하나가 아니라 '음식'이라는 물질을 가리킬 때는 불가산명사라 a를 붙일 수 없음. 이미 언급된 특정 음식을 가리킬 때는 the를 씀.\n   Ex) the food that you bought from a grocery store (O) / a food that you bought from a grocery store (X)\n\n2) 특정되지 않은 직업·장소를 일반적으로 가리킬 때는 a\n   설명: '어떤 요리사든', '어떤 식당이든'처럼 특정 대상이 아니라 그 종류 하나를 일반적으로 가리킬 때는 정관사 the가 아니라 부정관사 a를 씀.\n   Ex) food made by a chef (O) / food made by chef (X, 관사 아예 없음)\n   Ex) enjoy the mood of a restaurant (O) / enjoy the mood of the restaurant (X, 특정 식당처럼 읽힘)\n\n━━━ 수 일치 · 인칭 일관성 ━━━\n\n1) 단수 주어 뒤에는 단수 동사·단수 대명사\n   설명: the menu는 단수 명사이므로 동사도 feels로, 뒤에서 받는 대명사도 it으로 일치시켜야 함. 복수 동사(feel)나 복수 대명사(they)를 쓰면 안 됨.\n   Ex) the menu of my meals feels like it is repeated a lot (O)\n   Ex) the menu of my meals feel like they are repeated a lot (X)\n\n2) 글 전체의 인칭 일관성 유지\n   설명: 앞에서 cooking for myself처럼 1인칭으로 서술을 시작했다면, 뒤에서 갑자기 our처럼 다른 인칭으로 바꾸면 안 됨.\n   Ex) supplies for my meal from grocery stores (O) / supplies for our meal from grocery stores (X)",

      "notes": "━━━ 상태동사의 진행형 오용 ━━━\n\n## have + 상태 vs 동작\nhave가 소유·특성을 나타낼 땐 상태동사라서 진행형(-ing)을 원칙적으로 쓰지 않음.\n\nEx) are having trends (✗) → have trends / show a trend (○)\n비교) percentages are having trends → percentages have noticeable trends\n비교) genres are also having trends → genres also show a trend\n설명: 이 글에서 같은 오류가 두 번 반복됨. have가 '가지고 있다'는 지속 상태를 뜻할 때는 have/has로만 쓰고, 마시다·먹다처럼 동작을 뜻할 때만(have lunch 등) 진행형이 가능함.\n\n━━━ 전치사 및 시제 일관성 ━━━\n\n## opposite + 전치사\nopposite는 to와 결합함.\n\nEx) opposite from (✗) → opposite to (○)\n\n## 기간을 나타내는 전치사\n어떤 상태가 지속되는 기간에는 over/during, 시작점과 끝점을 잇는 'A부터 B까지'에는 between A and B(또는 from A to B)를 씀.\n\nEx) declining through two terms (✗) → declining over the two periods (○)\nEx) fluctuated over 1995 to 2005 (✗) → fluctuated between 1995 and 2005 (○)\n\n## 시제 일관성\n차트 묘사 글 전체가 현재시제(shows, are, seem)로 통일되어 있으므로 특정 데이터 값을 언급하는 경우가 아니라면 과거시제를 섞어 쓰지 않음.\n\nEx) fluctuated (✗) → fluctuate (○)",

      "score": "6.5",
      "question": "International tourism has brought enormous benefits to many places. At the same time, there is concern about its impact on local inhabitants and the environment. What are the advantages and disadvantages of this trend?",
      "originalText": "International tourism has grown significantly over recent decades. The success of transportation and technology allowed us to travel abroad easily, and some pros and cons follow by.\nFirst of all, there are a lot of advantages of international tourism. People are able to experience broader world, and I think it would make people tend to understand each other. Being in the environment of others makes understanding each culture and context possible. In addition, these experiences are not limited to the riches these days. Of course there would be the difference of experiences when it comes to quality, but still, the range of people who can travel abroad has become bigger.\nWe should also talk about the tour market. There are lots of people who benefit from tourism, like shop owners nearby trademark in city or CEOs who own tour related business. They earn extra money because of tourists, compared to the case of only locals being consumers.\nHowever, this tour market also brings downsides, in both economic and environmental ways. Locals often suffer from noise caused by tourists, and the environment of tourist areas has more trash on streets than non-tourist ones. Even the government put an effort on these problems, it is hard to make them better because there’s always way too many tourists who don’t really care about local inhabitants and the environment.\nWhat makes it worse is that the local inhabitants are actually being pushed to move outside the tourist area. The increasing house price caused by tourism makes this happen, even though it is not really intended.\nOverall, advantages and disadvantages of international tourism both exist. Regarding that banning tourism is impossible, we need to find out the solution to minimize disanvantages.",

      "question": "More and more people use social media every day. Do the advantages of this trend outweigh the disadvantages?",
      "originalText": "It is apparent that there are some pros and cons of using social media everday. However, I believe that the advantages of this trend don't outweigh the disadvantages.\nFirst, the best part of social media for me is the aspect of entertainment. We can have the moment of joy, just scrolling reels sitting on the chair in a room. It becomes easy to get a glimpse of the world and feel various emotions thanks to people who share their personal experiences on social media, even though it is not the experience made by face-to-face interaction. In addition, we can still feel connected to friends and family by using social media when we don't really have time to spend with them.\nHowever, the downsides of social media deny every advantage I mentioned. It is questionable if the entertainment or the connection from social media can be considered genuine. There's a word 'brain rot' and it expresses the feeling that we have when using social media without thinking independently. Notably, the entertainment and the emotion gained from social media is also not necessary. People have lived without it for thousands of years, and there was no problem. It is not impossible for us to read a book, take a walk, and have a real conversation instead.\nThe amount of disadvantges we can get by using social media is so outweighing its advantages that controlling social media is crucial skill that should not be underestimated these days.",
      "notes": "━━━ 주어-동사 수 일치 (and로 연결된 주어) ━━━\n\nand로 연결된 두 개의 명사는 원칙적으로 복수 주어로 취급하므로 동사도 복수형을 써야 함. 가산·불가산 여부와 무관하게 적용됨.\nEx) \"the entertainment and the emotion ... is not necessary\" (오류) → \"... are not necessary\" — entertainment와 emotion 둘 다 불가산명사이지만 서로 다른 두 개념이므로 복수로 취급함.\n\n━━━ 관사 필요 여부 판단 ━━━\n\n명사가 가산 단수로 쓰였는지부터 확인하고, 그렇다면 a/an을 반드시 붙여야 함.\nEx) \"controlling social media is crucial skill\" (오류) → \"is a crucial skill\" — skill은 가산명사이므로 단수형 앞에 관사가 필요함.\n\n━━━ 문장 구조 다양성 (단문·등위접속 위주에서 벗어나기) ━━━\n\n1) 관계절로 정보를 압축하기\n   Ex) 오류: There's a word 'brain rot' and it expresses the feeling that we have...\n   Ex) 개선: There's a term that describes the feeling of using social media without thinking independently.\n   설명: and로 문장을 나열하는 대신 관계절(that describes...)로 압축하면 더 복잡한 구조를 정확하게 구사했음을 보여줄 수 있음.\n\n2) 양보·조건 부사절을 문두에 배치해 문장 시작 다양화\n   설명: 지금 글은 대부분 주어(We/It/People)로 문장이 시작됨. Although/While/Even if 등을 문두에 배치하면 리듬과 구조가 다양해짐.\n   Ex) Although social media offers entertainment and a sense of connection, these benefits are not as genuine as they appear.\n\n3) 분사구문 활용\n   Ex) 오류: We can have the moment of joy, just scrolling reels sitting on the chair in a room.\n   Ex) 개선: Scrolling through reels alone can bring a moment of joy.\n   설명: 분사(-ing)가 두 개 나란히 붙으면 어색해짐 — 분사구문은 한 문장에 하나의 명확한 역할로 정리하는 게 자연스러움.\n\n4) 가정법 문장 추가\n   Ex) Even if social media disappeared tomorrow, people would still find ways to feel entertained and connected.\n   설명: 가정법 구문을 하나 넣으면 문법적 구조의 다양성(range)을 보여줄 수 있음.\n\n━━━ 논지 전개 · 근거 보강 ━━━\n\n1) 검증 불가능한 역사적 일반화 피하기\n   Ex) 오류: People have lived without it for thousands of years, and there was no problem.\n   Ex) 개선: Studies have linked heavy social media use to shorter attention spans and higher anxiety among teenagers, suggesting that the entertainment it offers comes at a real cost.\n   설명: 막연한 역사적 진술보다 구체적인 인과관계·근거를 드는 것이 설득력 있음.\n\n2) 이중부정으로 논지를 약화시키지 않기\n   Ex) 오류: It is not impossible for us to read a book, take a walk, and have a real conversation instead.\n   Ex) 개선: Reading a book, taking a walk, or having a real conversation can just as easily fill that need.\n   설명: \"불가능하지 않다\"는 매우 약한 주장이라, 반박 논리를 펼치는 자리에서는 단정적 표현이 더 힘 있음.\n\n3) 찬성 근거에 구체적 사례 추가\n   설명: 첫 문단(엔터테인먼트·연결)이 개인적 느낌 위주로 서술되어 구체적 사례가 없음. 가족과 떨어져 사는 사람이 영상통화로 매일 연락하는 경우처럼 구체적 상황을 하나 넣으면 이후 반박 문단과의 대조가 더 선명해짐.\n\n4) 결론에서 본론 근거를 짧게 되짚어준 뒤 마무리하기\n   설명: 마지막 문장이 본론 반박 내용을 요약하지 않고 새로운 주장(통제 기술의 중요성)으로 바로 넘어가 다소 뭉툭하게 느껴짐. 결론에서는 앞선 근거를 한 문장으로 되짚은 뒤 이 주장으로 이어가면 흐름이 자연스러워짐.",

      "question": "Some people think that the government should provide assistance to all kinds of artists, including painters, musicians, and poets, while other people think that this is a waste of money. To what extent do you agree or disagree with this statement?",
      "originalText": "It is common belief that the aid towards artists is waste of money. However, I believe that the government should provide assitance to them, because their presence keep cultural diversity and increase public interest.\nTo begin with, we need to help artists to maintain their job to make them produce cultural results. Considering the high cost of learning and putting effort into the process needed to create something, the help from the government sounds more necessary. If the answer to ‘Why does cultural diversity matter’ is needed, there’s the theory insisting that the main point of culture is about diversity, and there wouldn't be any preciousness of each culture left if it isn't preserved.\nOn top of that, assisting various artists is benefitial for our mental health too. Every people want to pursue art by their personal preference, so the aids from the gevernment is actually helping everyone, and eventually it is good for the public interest. In addition, one survey shows that a large amount of people control their stress by cultural experience.\nTo sum up, I strongly agree with the government helping all kinds of artists because  we could gain cultural diversity and the public interest from it. Even though, there still needs to be the method to make sure they are real artists, not fake ones just seeking for financial help.",

rtists, and they keep culture alive. (등위접속, 단순 나열)\nEx) The government should help artists, who keep culture alive. (관계절, 압축된 구조)\n비교) 이 글은 짧은 문장을 and로 잇는 구조가 많아, 관계절·분사구문·조건절 등으로 정보를 압축하는 연습이 필요함\n\n━━━ 근거 제시 표현 — research/survey vs 구체적 인과관계 ━━━\n\nresearch has shown that / studies suggest that / a survey shows that는 실제 논문이나 통계를 인용하는 것이 아니라, IELTS 에세이에서 예시를 도입할 때 쓰이는 관용적 연결 표현임. 이 표현 자체는 출처 검증 대상이 아니므로 자유롭게 쓸 수 있음.\n\n근거의 설득력은 표현이 아니라 그 뒤에 오는 내용으로 결정됨 — 누가·무엇을 해서·어떤 결과가 났는지 구체적 인과관계를 담은 사례인지, 아니면 주제 문장을 숫자나 출처만 붙여 반복한 재진술인지로 판단함.\nEx) 구체적 인과관계: research has shown that children whose parents help them solve math problems get better grades than those who do their work on their own (누가 - 무엇을 해서 - 어떤 결과)\nEx) 막연한 재진술: one survey shows that a large number of people control their stress by cultural experience (인과관계 없이 주제 문장에 숫자만 붙임)\n\n같은 기준이 theory류 표현에도 적용됨.\nEx) 막연한 재진술: there's the theory insisting that the main point of culture is about diversity (뒤에 구체적 전개 없이 주제를 반복)\nEx) 구체적 전개: one could argue that the main point of culture lies in its diversity, since losing any single culture narrows the range of perspectives available to everyone (근거를 한 단계 더 전개함)\n\n요약: research has shown that / a survey shows that 같은 도입 표현은 자유롭게 쓰되, 그 뒤에는 반드시 누가·무엇을·어떤 결과라는 구체적 인과관계를 붙여야 하며, 막연한 재진술에 숫자나 출처만 얹는 것은 피해야 함.",

      "question": "The study of ancient culture is not a relevant subject in modern education. To what extent do you agree or disagree?",
      "originalText": "It is common belief that the study of ancient culture is not appropriate for modern education. However, I firmly believe that we need to learn about ancient culture because of the importance of history and its cultural value.\nTo start with, getting education of history is essential, which is acknowledged by centuries. Humanity has learned about history of ancestors not to make same mistakes with them. I guess it is human’s instinct to have a desire to be a better person and progress, and history acts like one of the useful guides that help us ahcheive it. From my experience, I tend to reflect on me a lot when I write a diary, making myself a better person than yesterday. History being a diary of humanity, we can have a process of improvement..\nOn top of that, ancient culture has its own value due to its cultural features. If our culture remained the same over thousands of years, won’t it be too boring? As much as we have diversity of culture, we are able to explore various worlds of art, architecture, design, etc. Let’s say the only art style remaining is modern art. It would be hard for us to find our own tastes, which would lead us to less enjoyable lives. It’s not fair for people who like art style commonly used back then. There’s even a possibility of modern art not being the one we know these days because the art style results in the long process of development started from ancient culture.\nTo sum up, I disagree with them arguing the study of ancient culture is not a relevant subject in modern education. We should learn about ancient culture to get lessons and to admire various cultures.",

      "originalText": "It is a common belief that whether language is taught in small classes or not doesn't matter. However, I firmly believe that it does matter.\nOn the other hand, relying on the fact that language is also a sort of information, some people would argue that learning language depends on the individuals' level of understanding, not on the number of students in a class. With vocabulary and grammer being the most fundamental part of learning language, this point of view makes sense. Students can learn language even if they don't have any chance to speak in the language they are learning. They still can have a certain amount of input, which is necessary and will help them actually speak with others oneday.\nNevertheless, even though I admit the importance of inputs needed in the early stages of learning language, I can't neglect that real interactions happened in classes need to be prioritized. From my experience, when learning English by myself, I faced a limit at the moment. No matter how much I listened to English videos, and how long I sat down trying to memorize words and rules of grammer, I couldn't sound natural when I finally got a chance to speak with native Englsih speakers. I've always regretted not deciding to join a club for practicing English earlier, where my English improved significantly in a fast pace, due to interactions among real people. In addition to this advantage of small classes that students can have opportunities to speak, tutors also can help each student for decent time, which is not true when it comes to classes with many students.\nTo sum up, I'd say learning language in small classes helps us learn fast and efficiently because of the interactions that can possibly only happen in small classes. I recommend attending in a small class to those wanting to learn new languages.",

      "id": "task1-trend-expressions",
