      "text": "━━━ 전치사 감각 잡기: at · of · by · to · over · between · among ━━━\n\n이 표현집에 반복해서 나오는 전치사 at, of, by, to는 뜻으로 외우기보다 아래 감각으로 이해하면 훨씬 헷갈리지 않음.\n\n## at — 동사 뒤에서 '그 지점에 멈춰있다/도달했다'\n\n동사(peak, remain, stand, stop 등) 바로 뒤에서 '특정 지점에'라는 의미로 씀. 움직이던 것이 정확히 그 지점에서 멈추는 이미지.\n\n1) peak at ~\n   설명: peak가 동사로 쓰여 '그 지점에서 정점을 찍었다'는 뜻. 그래프가 올라가다가 정확히 그 수치 지점에서 멈추는 이미지라 at이 자연스러움.\n   Ex) The number of students from China peaked at 320,000 in 2015.\n\n2) remain at ~\n   설명: remain은 '머무르다'라는 뜻의 동사이므로, '어떤 지점에 머물러 있다'는 의미와 자연스럽게 어울림.\n   Ex) The number of US residents traveling to the UK remained at around 2.8 million.\n\n## of — 명사 뒤에서 '그 명사가 구체적으로 무엇인지 풀어줌'\n\npoint, level, low, high처럼 '어떤 지점'을 가리키는 명사 바로 뒤에서, 그 지점이 정확히 어떤 수치인지 동격처럼 풀어줌. '그 지점 = 얼마'라는 관계.\n\n1) reach the highest point of ~\n   설명: point 자체는 '지점'이라는 추상적인 명사라, 그것이 구체적으로 어떤 수치인지는 of로 이어줘야 함. the point of 3.2 million은 '3.2 million이라는 그 지점'으로 읽힘.\n   Ex) The number of US tourists traveling to the UK reached the highest point of 3.2 million in 2015.\n\n2) hit a low of ~\n   설명: a low도 '최저점'이라는 명사이므로 같은 원리로 of가 붙음.\n   Ex) The number of UK travelers hit a low of three million in 2012.\n\n   비교) peak at 320,000 / reach the highest point of 320,000\n   설명: 똑같이 '정점을 찍다'는 뜻이라도, peak처럼 동사로 쓰면 at, point처럼 명사로 쓰면 of가 붙음. 동사 뒤에는 at, 명사 뒤에는 of로 기억하면 헷갈리지 않음.\n\n## by — '변화의 폭' (그만큼의 차이)\n\n무엇이 얼마나 변했는지, 그 변화의 크기(margin)를 나타냄. 도착한 값이 아니라 '이동한 거리'를 말하는 감각.\n\n1) fall/drop/increase by + 수치\n   설명: by 뒤에 오는 숫자는 '변화의 양'이지 '결과값'이 아님. 27퍼센트만큼 떨어졌다는 뜻이지 27퍼센트가 됐다는 뜻이 아님.\n   Ex) Truck numbers dipped notably, falling by almost 27 percent in the second year.\n\n## to — '변화 후 도착한 최종 값'\n\n변화가 끝나고 도달한 결과값(도착지)을 나타냄. by와 정반대로, '얼마나'가 아니라 '어디까지'를 말하는 감각.\n\n1) fall/rise/halve to + 수치\n   설명: to 뒤에 오는 숫자는 변화가 끝난 뒤의 최종 수치임.\n   Ex) Sweden's proportion had roughly halved to 35 percent.\n\n   비교) fell by 5 percent / fell to 5 percent\n   설명: 원래 수치가 30퍼센트였다면, fell by 5 percent는 25퍼센트가 된 것이고 fell to 5 percent는 5퍼센트가 된 것이라 결과가 완전히 다름. 헷갈리면 문장의 의미 자체가 바뀌므로 반드시 구분해야 함.\n\n## over — '기간에 걸쳐'와 '~보다 많이', 두 가지 감각\n\n1) over + 기간 — 그 기간 전체에 걸쳐 (변화의 흐름을 강조)\n   설명: 어떤 값이 특정 기간 동안 점진적으로 변해왔다는 흐름을 강조할 때 씀. 그 기간 전체를 하나의 화살표처럼 관통하는 이미지.\n   Ex) increased gradually over the 20-year period (O)\n   Ex) almost doubling over the three-year period (O)\n\n2) over + 수치 — '~가 넘는'이라는 뜻의 수식어\n   설명: 이때 over는 기간이 아니라 뒤에 오는 수치를 꾸며서 '그 수치보다 많이'라는 뜻이 됨. more than과 같은 역할.\n   Ex) Traffic soared sharply by over 150 million in the last five years. (여기서 over는 150 million을 수식함, 기간이 아님)\n   Ex) growing by over two-thirds between the two years (여기서도 over는 two-thirds를 수식함)\n\n## over vs during vs between — 기간을 나타낼 때의 미묘한 차이\n\n1) over — 손가락으로 그래프 선을 처음부터 끝까지 쭉 훑는 이미지\n   설명: 그 기간의 시작점부터 끝점까지, 수치가 오르내려온 궤적 전체를 그림. '기간 내내 일어난 변화'를 하나로 묶어서 말할 때 씀.\n   Ex) increased gradually over the 20-year period (20년 전체를 훑으며 그린 증가 궤적)\n\n2) during — 그 기간 어딘가의 한 장면에 스포트라이트를 비추는 이미지\n   설명: 기간 전체의 흐름이 아니라, 그 구간 '안의 어느 지점'에 스포트라이트를 비춰서 무대를 깔아주는 느낌. that period 자체가 사건의 주인공이 아니라 배경이 됨.\n   Ex) Motorcycle registrations varied consistently during the whole period, with peaks in 1995 and 1997. (그 기간이라는 무대 위에서 벌어진 변동)\n\n3) between — 두 지점에 깃발 두 개만 꽂아두는 이미지\n   설명: 시작 깃발과 끝 깃발만 꽂아 '이 사이'라는 틀을 정해줄 뿐, over처럼 그 안에서 어떻게 변해왔는지 궤적을 그리지는 않음. 보통 between A and B 형태로 두 끝점을 명시함.\n   Ex) There were significant changes in the volume of migration between 1990 and 2010. (1990년과 2010년에 깃발을 꽂아 그 사이 구간만 지정)\n\n   비교) over the 20-year period (그 20년의 궤적을 쭉 훑음) / during the period (그 기간이라는 무대 위 한 장면) / between 1990 and 2010 (두 지점에 깃발만 꽂아 구간을 지정 — 궤적도 무대도 아님)\n\n## by의 또 다른 뜻 — '변화의 폭' vs '마감 시점'\n\n설명: 앞서 다룬 by(변화의 폭)와 달리, by 뒤에 연도가 오면 '그 시점까지는'이라는 마감 기한의 의미로 씀. 두 뜻이 헷갈리기 쉬우므로 반드시 구분해야 함.\n   Ex) Projections show that 25 percent of the population will fall into this category by 2050. (마감 시점 — '2050년까지는')\n   Ex) The total of master's degree students, representing approximately nine percent in 1980, nearly quadrupled by 2000. (마감 시점)\n   비교) falling by almost 27 percent (변화의 폭 — '27퍼센트만큼')\n\n## from ~ to ~ / between ~ and ~ — 범위의 시작과 끝\n\n설명: 둘 다 수치나 연도의 '범위'를 나타내지만 느낌이 다름. from ~ to ~는 변화의 시작값에서 끝값까지 이동한 궤적을 그리고, between ~ and ~는 두 시점 사이의 구간 자체를 가리킴.\n   Ex) The number of Internet users in Denmark approximately doubled from 22,000 to 45,000. (시작값 → 끝값)\n   Ex) The proportion of workers hired in the agriculture sector decreased substantially from 33 percent in 1981 to 6 percent in 2011. (시작값 → 끝값)\n   Ex) There were significant changes in the volume of migration between 1990 and 2010. (두 시점 사이의 구간)\n\n## between vs among — 대상이 두 개인지 셋 이상인지\n\n설명: between은 정확히 두 지점이나 두 대상 사이를 가리키고, among은 셋 이상의 대상 사이의 관계·비교를 나타냄. from ~ to ~와 between ~ and ~는 둘 다 '두 개'를 전제로 하는 표현이라, 대상이 셋 이상이면 among으로 바꿔야 함.\n   Ex) growing by over two-thirds between the two years (대상 2개 — between)\n   Ex) The gap in population among the three countries had widened by the end of the period. (대상 3개 — among)\n\n요약: 동사 뒤에서 특정 지점을 가리킬 땐 at, 지점을 뜻하는 명사를 구체적 수치로 풀 땐 of, 변화의 폭(얼마나)은 by, 변화의 도착값(어디까지)은 to, 기간에 걸친 흐름은 over, 마감 시점은 by(연도)로, 대상이 둘이면 between, 셋 이상이면 among으로 표현함.\n\n━━━ 증가를 나타낼 때 쓰는 표현 ━━━\n\n1) 점차/빠르게 증가하다 — 주어 increase gradually/quickly\n   Ex) The number of public transit passengers increased gradually over the 20-year period.\n   단어: 대중교통 public transit / 탑승객 passenger\n\n2) 대략/거의 두 배가 되다 — 주어 approximately/almost double\n   Ex) The number of Internet users in Denmark approximately doubled from 22,000 to 45,000.\n\n3) 증가가 더디다/빠르다 — Growth is slow/fast\n   Ex) For UK tourists, growth was slow until 2013, when it started to increase dramatically.\n   단어: 여행객 tourist / 극적으로 dramatically\n\n4) 빠르게/심하게 증가하다 — 주어 rise rapidly/heavily\n   Ex) The amount of beef Brazil exported rose rapidly from 125,465 to 137,650 tons over the ten-year period.\n   단어: 수출하다 export\n\n5) ~으로 정점에 도달하다 — 주어 peak at ~\n   Ex) The number of students from China peaked at 320,000 in 2015, before falling considerably in the next year.\n   단어: 상당히 considerably\n\n6) -에 ~으로 최고점에 도달하다 — 주어 reach the highest point of ~ in -\n   Ex) The number of US tourists traveling to the UK reached the highest point of 3.2 million in 2015.\n\n7) 일시적으로/계속해서 오르다 — 주어 ascend temporarily/continually\n   Ex) In 2000, comedy ascended temporarily to the top spot, before falling in the following year.\n   단어: 1위, 최고의 자리 top spot / 그다음 해에 in the following year\n\n8) 빠르게/극적으로 급증하다 — 주어 surge quickly/dramatically\n   Ex) Tram usage surged quickly from 2003 to 2005, almost doubling over the three-year period.\n   단어: 전차 tram / 두 배가 되다 double\n\n9) 상당히/꾸준히 증가하다 — 주어 grow significantly/steadily\n   Ex) The economic contribution of students from overseas in the US grew significantly.\n   단어: 경제상의, 경제의 economic / 기여 contribution\n\n10) 기하급수적으로/꽤 증가하다 — 주어 go up exponentially/moderately\n   Ex) Bus passenger numbers went up exponentially over the eight years from 2000, eventually reaching five times what they were at the start of the period.\n   단어: 결국 eventually\n\n11) 급격히/눈에 띄게 치솟다 — 주어 soar sharply/remarkably\n   Ex) Traffic soared sharply by over 150 million in the last five years.\n   단어: 교통량 traffic\n\n12) 상승 추세가 보여지다 — An upward/increasing trend is seen\n   Ex) An upward trend was seen in Mexico over the 40-year period, rapidly increasing in pace towards the end.\n   단어: 일정한 속도로 in pace\n\n13) 상당히/갑자기 급증하다 — 주어 shoot up considerably/suddenly\n   Ex) The share of graduates in Portugal shot up considerably from its lowest point of 54 percent in 2005 to a peak of 95 percent in 2009.\n   단어: 졸업생 graduate\n\n━━━ 하락을 나타낼 때 쓰는 표현 ━━━\n\n14) 눈에 띄게/극히 작게 떨어지다 — 주어 dip notably/minimally\n   Ex) Truck numbers dipped notably, falling by almost 27 percent in the second year and continued to drop in subsequent years.\n\n15) 조금/꾸준히 하락하다 — 주어 fall slightly/steadily\n   Ex) The number of US residents traveling to the UK remained at around 2.8 million in 2011 and 2012, but fell slightly in 2013.\n\n16) 서서히/꽤 크게 감소하다 — 주어 decline slowly/sizably\n   Ex) Luxembourg's rate declined slowly from 24% to 13%, which was the largest decrease of all the countries in question.\n\n17) 급속히/근소하게 하락하다 — 주어 drop rapidly/insignificantly\n   Ex) This figure dropped rapidly to 25 percent by 2011, a decrease of almost 50 percent compared to the original amount.\n\n18) 대략/거의 반으로 줄다 — 주어 roughly/nearly halve\n   Ex) Sweden's proportion had roughly halved to 35 percent, which was almost equal to Norway.\n   단어: 비율 proportion / ~과 같은 수준인 equal to\n\n19) 급격히/조금 떨어지다 — 주어 go down sharply/slightly\n   Ex) Iceland's percentage went down sharply to just under 20 percent.\n\n20) 크게/빠르게 폭락하다 — 주어 plummet remarkably/quickly\n   Ex) The proportion of people under the age of 15 plummeted remarkably during the second half of the period.\n   단어: 하반기 second half\n\n21) ~로 최저점에 도달하다 — 주어 hit a low of ~\n   Ex) The number of UK travelers hit a low of three million in 2012 before increasing substantially over the next few years.\n   단어: 상당히 substantially\n\n22) 끊임없이/갑자기 줄어들다 — 주어 shrink consistently/abruptly\n   Ex) The youngest age group was the only one to shrink consistently.\n   단어: 연령대 집단 age group\n\n23) 상당히/빠르게/점차 감소하다 — 주어 decrease substantially/quickly/gradually\n   Ex) The proportion of workers hired in the agriculture sector decreased substantially from 33 percent in 1981 to 6 percent in 2011.\n   단어: 농업 agriculture / 분야 sector\n\n━━━ 변동을 나타낼 때 쓰는 표현 ━━━\n\n24) -년의 기간 동안 변동을 거듭하다 — 주어 fluctuate over the #-year period\n   Ex) The percentage of industrial workers fluctuated over the 20-year period.\n\n25) ~에 큰 변화가 있다 — There are significant changes in ~\n   Ex) There were significant changes in the volume of migration between 1990 and 2010.\n   단어: 양, 용량 volume / 인구 이동 migration\n\n26) 조금씩의 변화가 있다 — There are some slight shifts\n   Ex) Sales figures were more or less stable in the three years, though there were some slight shifts.\n   단어: 거의 more or less\n\n27) 지속적으로/계속해서 변하다 — 주어 vary consistently/continuously\n   Ex) Motorcycle registrations varied consistently during the whole period, with peaks in 1995 and 1997, and a low in 2000.\n   단어: 오토바이 motorcycle / 등록 건수 registration\n\n28) 여러 차례 오르내리다 — 주어 go up and down several times\n   Ex) The percentages for resources and equipment went up and down several times.\n   단어: 재료, 자원 resource"

      "title": "Task 1 · 비교·비율·안정 표현",

      "text": "━━━ 비교를 나타낼 때 쓰는 표현 ━━━\n\n1) 주어 is nearly/roughly equal to ~\n   뜻: ~와 거의/대략 같다\n   Ex) Adventure represented close to 15 percent, which was nearly equal to the profit rates of the three least popular genres combined.\n   단어: 나타내다, 대표하다 represent / 이익률 profit rate / 합치다 combine\n\n2) 주어 is relatively evenly distributed\n   뜻: 상대적으로 균등하게 분포되어 있다\n   Ex) The proportions for both sexes in Norway and Finland were relatively evenly distributed.\n\n3) A is 비교급(higher/lower/more ~) than B\n   뜻: A가 B보다 ~하다\n   Ex) Advertising costs for televisions were higher than those for any other category.\n   단어: 광고비 advertising cost / 범주 category\n\n4) A is 최상급(the most common/the most popular/the highest)\n   뜻: A가 가장 ~하다\n   Ex) Although the amount of bachelor's degree students decreased, it was still the most common degree at the end of the period.\n   단어: 학사 학위 bachelor's degree\n\n5) 주어 followed by ~\n   뜻: ~가 뒤를 이었다\n   Ex) The UK spent the most on health, at roughly 8 percent, followed by education at 6.4 percent.\n   단어: 지출하다 spend / 건강 health\n\n6) 주어+동사 close behind\n   뜻: 바로 뒤를 따르다\n   Ex) Chilean and Finnish men were close behind at roughly 60 percent, whilst South Africa was the lowest.\n   단어: ~하는 반면에 whilst\n\n7) The gap widens/narrows\n   뜻: 격차가 넓어지다/좁혀지다\n   Ex) The gap in population among the three countries had widened by the end of the period.\n   단어: 격차, 갭 gap\n\n8) Compared to ~\n   뜻: ~와 비교해서\n   Ex) Compared to the 2010 figure, the 2015 value was around 2.5 times higher.\n   단어: 수치 figure\n\n9) In/By contrast,\n   뜻: 그에 반해,\n   Ex) In contrast, the proportion of people visiting on tour was cut by more than half from 27 percent to 12 percent.\n   단어: 여행 중에 on tour / ~만큼 줄다 cut by\n\n━━━ 비율을 나타낼 때 쓰는 표현 ━━━\n\n10) A similar pattern/trend was seen\n   뜻: 비슷한 경향이 보였다\n   Ex) A similar pattern was seen on the lower end with refrigerators and washing machines, capturing just 6.78 percent and 6.04 percent of the total.\n   단어: 냉장고 refrigerator / 차지하다, 잡다 capture\n\n11) Whereas 주어 + 동사\n   뜻: 반면\n   Ex) Whereas there were only slight shifts in most categories, to visit on tour shrank considerably between the years.\n   단어: 조금, 약간의 slight shift\n\n12) 주어 + 동사 + more than ~ combined\n   뜻: ~를 합한 것보다 더 ~하다\n   Ex) Brazil exported more beef than Japan, Switzerland, Norway, and Uruguay combined.\n   단어: 수출하다 export\n\n13) 주어 stand out\n   뜻: 두드러지다\n   Ex) In the year 1995, it is drama that stands out as the most popular genre.\n\n14) 주어 account for almost/roughly ~\n   뜻: ~을 차지하다\n   Ex) The proportion of undergraduate students accounted for almost three-quarters of all students.\n   단어: 학부생 undergraduate student / 4분의 3 three-quarters\n\n15) 주어 represent approximately/nearly ~\n   뜻: 대략/거의 ~에 해당하다\n   Ex) The total of master's degree students, representing approximately nine percent in 1980, nearly quadrupled by 2000.\n   단어: 석사 학위생 master's degree student / 네 배가 되다 quadruple\n\n16) 주어 fall into ~\n   뜻: ~에 속하다\n   Ex) Projections show that 25 percent of the population will fall into this category by 2050.\n   단어: 추정치, 예상 projection\n\n17) The majority of ~\n   뜻: 다수의 ~\n   Ex) The overwhelming majority of visitors went to art museums to learn and gain knowledge.\n   단어: 압도적인 overwhelming\n\n18) 주어 consist of ~\n   뜻: ~으로 이루어져 있다\n   Ex) The biggest differences in residences consist of a reduction in residences and an increase in green spaces.\n   단어: 감소 reduction / 녹지 공간 green space\n\n━━━ 안정을 나타낼 때 쓰는 표현 ━━━\n\n19) 주어 is/are composed of ~\n   뜻: ~으로 구성되어 있다\n   Ex) The diagram is composed of a voltage measuring device, an engine, and a battery, all of which are connected by a series of electrical cables.\n   단어: 전기선 electrical cable / 일련의 a series of / 전압측정기 voltage measuring device\n\n20) 주어 make up approximately/almost\n   뜻: 대략/가까이 ~을 차지하다\n   Ex) Those who went for other purposes made up approximately three to four percent, whilst those who went to shop accounted for just one percent.\n\n21) The portion of ~\n   뜻: ~의 부분\n   Ex) The portion of students seeking a master's degree markedly increased, growing by over two-thirds between the two years.\n   단어: 얻고자 하다, 구하다 seek / 두드러지게 markedly / 3분의 2 two-thirds\n\n22) 주어 is the dominant ~\n   뜻: 우위를 차지하는 ~이다\n   Ex) Rock was the dominant genre, accounting for approximately 40 percent of all sales in each period.\n   단어: 차지하다 account for / 판매량 sale\n\n23) 주어 is/are nearly/relatively flat\n   뜻: 가/이 거의 균일하다\n   Ex) Italy's numbers were nearly flat from 1996 to 2006, but were constantly high.\n   단어: 지속적으로 constantly\n\n24) 주어 remain relatively/almost constant\n   뜻: 비교적/거의 안정적인 상태를 유지하다\n   Ex) The profitability of romantic comedy remained relatively stable, with slight increases in the first two years.\n   단어: 수익성 profitability\n\n25) 주어 remain almost/relatively constant\n   뜻: 대략/거의 계속 변함이 없다\n   Ex) Oil usage in Italy remained almost constant, but the figures for Sweden and Iceland plunged.\n   단어: 사용량 usage\n\n26) There was nearly/relatively no change\n   뜻: 가/비교적 변화가 없다\n   Ex) There was nearly no change in the proportion of postgraduates in Luxembourg, although the number of graduates gradually rose.\n   단어: 대학원생 postgraduate\n\n27) 주어 stay at ~\n   뜻: ~에 머무르다\n   Ex) Portugal consistently stayed at around 70 percent over the span of 40 years.\n   단어: ~에 걸쳐 over the span of"

      "text": "━━━ 과정을 나타낼 때 쓰는 표현 ━━━\n\n1) There are + 숫자 + distinct stages\n   뜻: ~단계가 있다\n   Ex) There are six distinct stages in plastic bottle production, each of which uses different equipment to create the final product.\n   단어: 뚜렷한 distinct / 최종 제품 final product\n\n2) The process/life cycle begins when ~\n   뜻: 과정/사이클이 ~하면 시작되다\n   Ex) The process begins when a blend consisting of 20 percent soft woods, 40 percent water, and 40 percent chemicals is placed in a pulp digester machine.\n   단어: 혼합물 blend / 펄프 증해기 pulp digester machine\n\n3) Subsequently, 주어 + 동사\n   뜻: 그 뒤에, ~\n   Ex) Subsequently, it goes through a machine that removes fine dust particles.\n   단어: ~을 통과하다 go through / 미세 먼지 입자 fine dust particles\n\n4) The first step is ~\n   뜻: 첫 번째 단계는 ~이다\n   Ex) The first step is to spread the mixture across a fine screen, which eliminates lumps.\n   단어: 고운(촘촘한) 체 fine screen / 제거하다 eliminate / 덩어리 lump\n\n5) After this + 명사, 주어 + 동사\n   뜻: ~한 후,\n   Ex) After this phase is completed, cultures are added to this blend to begin the fermentation process.\n   단어: 단계 phase / 발효 fermentation\n\n6) Then, 주어 + 동사\n   뜻: 그다음에,\n   Ex) Then, it moves along between stacked rollers to squeeze the water out of the pulp.\n   단어: 쌓인 stacked / 짜내다 squeeze\n\n7) In the final step/In the last stage of this process,\n   뜻: 이 과정의 마지막 단계에서,\n   Ex) In the final step of this process, the sheet of paper is rolled up in a large reel.\n   단어: 둥글게 감다 roll up / 실패 reel\n\n8) One of the biggest changes to ~ is -\n   뜻: ~의 가장 큰 변화 중 하나는 -이다\n   Ex) One of the biggest changes to the town was the rerouting of the main road.\n   단어: 경로를 바꾸다 reroute\n\n9) The main change for ~ involves -\n   뜻: ~의 주요 변화는 -를 포함하다\n   Ex) The main change for the gallery involves the construction of a courtyard.\n   단어: 안뜰 courtyard\n\n━━━ 전환을 나타낼 때 쓰는 표현 ━━━\n\n## 추가·철거\n\n10) the removal of ~\n   뜻: ~의 철거\n   Ex) The most noticeable alteration is the removal of the park, which has been replaced by a massive stadium.\n   단어: 변화 alteration / 거대한 massive / 경기장 stadium\n\n11) the addition of ~\n   뜻: ~의 추가\n   Ex) A projected change for 2020 is the addition of a new hospital.\n   단어: 계획된 projected\n\n## 변화\n\n12) A is transformed into B\n   뜻: A가 B로 변모되다\n   Ex) This area is transformed into a lively hub, with the new commercial establishments.\n   단어: 활발한 lively / 중심지 hub / 상업 시설 commercial establishment\n\n13) A is constructed near B\n   뜻: A가 B 근처에 건설되다\n   Ex) A large golf course was constructed near the parking lot, which took up all of the land previously used for farming.\n   단어: 골프장 golf course / (공간을) 차지하다 take up / 농사 짓다 farming\n\n14) A is moved to B\n   뜻: A가 B로 옮겨지다\n   Ex) The special exhibition room was moved to the second floor, which was expanded with the addition of two new rooms.\n   단어: 전시실 exhibition room\n\n15) A is extended to B\n   뜻: A가 B까지 연장되다\n   Ex) The lift was extended to the third floor, where a terrace space with a bar had been added.\n   단어: 엘리베이터 lift\n\n16) A is replaced with B\n   뜻: A가 B로 대체되다\n   Ex) The various small shops from the 1980s were replaced with a large shopping center.\n\n17) A is displaced by B\n   뜻: A가 B에 의해 대체되다\n   Ex) The bank was displaced by a large restaurant and a supermarket was built on the opposite side of the road.\n   단어: 반대편 opposite side\n\n## 변동 없음·기타\n\n18) No changes were made to ~\n   뜻: ~에 변동 사항이 없다\n   Ex) No changes were made to the layout of the town over the course of the last ten years.\n   단어: 배치 layout\n\n19) 주어 + line ~ along -\n   뜻: -가 ~을 따라 늘어서 있다\n   Ex) Other hotels lined the river along the new footpath and a dock was added near to the largest hotel.\n   단어: 산책로 footpath / 접근로 dock\n\n━━━ 위치를 나타낼 때 쓰는 표현 ━━━\n\n20) A is parallel to B\n   뜻: A는 B와 평행하다\n   Ex) The road used to be parallel to the river, but now turns east towards the neighboring village.\n   단어: 이웃의 neighboring / 동네 village\n\n21) A is next to B\n   뜻: A는 B 옆에 있다\n   Ex) The entrance is next to the refrigerator in Room B.\n\n22) A is across from B\n   뜻: A는 B의 맞은편에 있다\n   Ex) The printer is across from the entrance on the left side of the room by the bookshelves.\n\n23) in the middle/center of -\n   뜻: -의 중간(중앙)에\n   Ex) The table and coffee machine are in the middle of the room.\n\n24) A is located/positioned/situated near -\n   뜻: -근처에 위치해 있다\n   Ex) The housing units are located near the park, which also includes a swimming complex and fitness center.\n   단어: 주거 단지 housing unit / 피트니스 센터 fitness center\n\n25) A is split into B\n   뜻: A가 B로 나누어지다\n   Ex) The cloakroom and front desk were split into individual rooms.\n   단어: 휴대품 보관소 cloakroom\n\n26) A is separated by B\n   뜻: A가 B로 분리되다\n   Ex) The two school buildings were separated by a path, which extended to the train station.\n\n27) A is connected to B\n   뜻: A가 B와 연결되다\n   Ex) The entranceway is connected to the stairs on the first floor.\n   단어: 입구 entranceway"

      "text": "━━━ 찬반을 나타낼 때 쓰는 표현 ━━━\n\n1) It is true that 주어 + 동사\n   뜻: …은 사실이다\n   Ex) It is true that progress is often harmful, especially to people who are unable to benefit from it.\n\n2) It is a common belief that 주어 + 동사\n   뜻: …은 일반적인 생각이다\n   Ex) It is a common belief that protecting the environment is more important than funding the arts.\n\n3) There is a more persuasive argument that 주어 + 동사\n   뜻: …라는 더 설득력 있는 주장이 있다\n   Ex) There is a more persuasive argument that the quality of education would improve if professors received higher pay.\n\n4) It is evident that 주어 + 동사\n   뜻: …은 명백하다\n   Ex) It is evident that the introduction of the Internet ushered humanity into a new age of technology.\n   단어: 인도하다, 안내하다 usher / 인류 humanity\n\n5) I firmly believe that 주어 + 동사\n   뜻: 나는 …라고 굳게 믿는다\n   Ex) I firmly believe that a strong sense of determination is a key factor to a successful life.\n   단어: 굳은 결의 determination\n\n6) I support the idea that 주어 + 동사\n   뜻: 나는 …라는 생각을 지지한다\n   Ex) I support the idea that government should invest in public transportation systems.\n\n7) I am of the opinion that 주어 + 동사\n   뜻: 나는 …라고 생각한다\n   Ex) I am of the opinion that the issue can be resolved by utilizing alternative energy sources.\n   단어: 대체 에너지 자원 alternative energy resource\n\n8) Some people think that 주어 + 동사\n   뜻: 일부 사람들은 …라고 생각한다\n   Ex) Some people think that children should learn a foreign language as soon as possible.\n\n9) I agree that 주어 + 동사 / I agree with ~\n   뜻: 나는 …에 동의한다\n   Ex) I agree that children are better off growing up in the city because everything they need is relatively close by.\n   단어: 가까이 있다 close by\n\n━━━ 장단점을 나타낼 때 쓰는 표현 ━━━\n\n10) My view on this issue is that 주어 + 동사\n   뜻: 이 문제에 대한 나의 견해는 …이다\n   Ex) My view on this issue is that people pay too much attention to the lives of celebrities.\n   단어: 관심을 쏟다 pay attention / 유명인 celebrity\n\n11) I object to ~ / I object that 주어 + 동사\n   뜻: 나는 …에 반대한다\n   Ex) I object to paying a large sum rable for young people to choose a different type of job than their parents have.\n\n23) It is more imperative than ever before\n   뜻: …이 그 어느 때보다 더 긴요하다\n   Ex) Taking time for family is more imperative than ever before.\n\n━━━ 대조를 나타낼 때 쓰는 표현 ━━━\n\n24) On the one hand, 주어 + 동사\n   뜻: 한편으로는, …이다\n   Ex) On the one hand, homeschooling a child can be very productive because the child receives the full attention of the parent.\n   단어: 생산적인 productive\n\n25) While it is undeniable that 주어 + 동사, 주어 + 동사\n   뜻: ~을 부인할 수 없지만, …이다\n   Ex) While it is undeniable that consumers want to enjoy items from abroad, it is clear that buying domestic farm products should be our top priority.\n   단어: 최우선 순위 top priority\n\n26) In contrast, 주어 + 동사\n   뜻: 그에 반해, …이다\n   Ex) In contrast, children of parents who forbid them to eat fast food end up trying it but not eating it on a regular basis.\n   단어: 금지하다 forbid / 결국 ~이 되다 end up\n\n27) On the contrary, 주어 + 동사\n   뜻: 반면에, …이다\n   Ex) On the contrary, studying at the library is motivating and free from distractions.\n   단어: ~이 없는 free from / 집중을 방해하는 것 distractions\n\n28) However, unlike ~, 주어 + 동사\n   뜻: 하지만, ~과는 다르게, …이다\n   Ex) However, unlike lecture-style classes, discussion groups give students a chance to share their opinions.\n   단어: 강의식 수업 lecture-style class"

      "text": "━━━ 인과를 나타낼 때 쓰는 표현 ━━━\n\n1) For these reasons, 주어 + 동사\n   뜻: 이러한 이유 때문에, …이다\n   Ex) For these reasons, I am against excessive advertising in schools.\n   단어: 지나친 excessive\n\n2) The main cause/issue of ~ is that 주어 + 동사\n   뜻: ~의 주된 원인은 …이다\n   Ex) The main cause of damage to famous locations is that people tend to get overly excited when traveling, so they are likely to forget the historical significance of these places.\n   단어: 중요성 significance\n\n3) The issue can be resolved by/with ~\n   뜻: ~함으로써 문제가 해결될 수 있다\n   Ex) The issue can be resolved by teaching students the correct way to utilize the Internet.\n   단어: 사용하다 utilize\n\n4) As a result, 주어 + 동사\n   뜻: 그 결과, …되다\n   Ex) As a result, some pets are considered as important as family members.\n   단어: 외모 appearance\n\n5) Consequently/As a consequence, 주어 + 동사\n   뜻: 결과적으로, …이다\n   Ex) Consequently, watching TV with their children can be a bonding experience.\n   단어: 유대감 bonding\n\n6) Due to ~, 주어 + 동사\n   뜻: ~ 때문에, …이다\n   Ex) Due to his constantly ringing cell phone, it is difficult for him to have peaceful weekends.\n   단어: 끊임없이 constantly / 휴대폰 cell phone\n\n━━━ 예시를 나타낼 때 쓰는 표현 ━━━\n\n7) For instance, 주어 + 동사\n   뜻: 예를 들어, …이다\n   Ex) For instance, I had a friend in high school who always finished her homework before watching TV.\n\n8) Take the example of ~\n   뜻: ~의 예를 보자\n   Ex) Take the example of a CEO, who chose a career in business like his mother.\n\n9) In another case, 주어 + 동사\n   뜻: 또 다른 예로, …이다\n   Ex) In another case, I asked a friend for advice and she told me the same thing that my mother did.\n\n10) 주어 + 동사, as can be seen in ~\n   뜻: ~에서 볼 수 있듯이, …이다\n   Ex) People are overly concerned about appearance, as can be seen in the increased amount of money they spend on their image.\n   단어: 외모 appearance\n\n━━━ 인용을 나타낼 때 쓰는 표현 ━━━\n\n11) According to ~, 주어 + 동사\n   뜻: ~에 따르면, …이다\n   Ex) According to research by the Center for Disease Control, policies and initiatives are needed to encourage physical activity to combat obesity.\n   단어: 질병통제예방센터 Center for Disease Control / 비만 obesity\n\n12) Studies have shown that 주어 + 동사\n   뜻: 연구 결과는 …을 보여주었다\n   Ex) Studies have shown that even subtle changes in advertising can induce customers to buy a certain product.\n   단어: 유도하다 induce\n\n13) It has been proven that 주어 + 동사\n   뜻: …이 입증되었다\n   Ex) It has been proven that students tend to remember more if they go over their notes later.\n   단어: 미묘한 subtle\n\n14) Statistics have shown that 주어 + 동사\n   뜻: 통계는 …을 보여주었다\n   Ex) Statistics have shown that owning a pet can reduce stress and increase happiness.\n\n━━━ 부연을 나타낼 때 쓰는 표현 ━━━\n\n15) To begin with, 주어 + 동사\n   뜻: 우선, …이다\n   Ex) To begin with, face-to-face communication allows people to convey information through body language.\n   단어: 전달하다 convey\n\n16) On top of that, 주어 + 동사\n   뜻: 게다가, …이다\n   Ex) On top of that, some people get stressed out easily and need time to relax.\n\n17) First of all, 주어 + 동사\n   뜻: 가장 먼저, …이다\n   Ex) First of all, spending time outdoors has been shown to improve both physical and mental health.\n   단어: 신체적인 physical / 정신적인 mental\n\n18) Secondly, 주어 + 동사\n   뜻: 두 번째로, …이다\n   Ex) Secondly, working in a team teaches employees how to communicate more effectively with others.\n   단어: 효과적으로 effectively\n\n19) Another reason is that 주어 + 동사\n   뜻: 또 다른 이유는 …이다\n   Ex) Another reason is that students who receive immediate feedback tend to make faster progress.\n   단어: 즉각적인 immediate / 진전 progress\n\n20) We can see that 주어 + 동사\n   뜻: …을 알 수 있다\n   Ex) We can see that women are not given as many chances to make it to the top of their fields.\n   단어: 유아원 daycare facility\n\n21) One of the ways to ~ is -\n   뜻: ~하는 방법 중 하나는 -이다\n   Ex) One of the ways to keep children with working parents happy and safe is to expand daycare facilities.\n   단어: 맞벌이 부모 working parents\n\n22) This gives rise to 주어 + 동사\n   뜻: 이것은 …을 불러일으키다\n   Ex) This gives rise to concerns about overused resources and excessive pollution.\n   단어: 지나친, 남용된 excessive\n\n23) That is why 주어 + 동사\n   뜻: 그것이 …하는 이유이다\n   Ex) That is why I feel that foreign students should not get preferential treatment compared to other students.\n   단어: 우선적 처치 preferential treatment\n\n24) As this case reveals, 주어 + 동사\n   뜻: 이 사건이 보여주듯, …이다\n   Ex) As this case reveals, the news media often magnifies stories.\n   단어: 과장하다 magnify\n\n25) This demonstrates that 주어 + 동사\n   뜻: 이것은 ~을 보여준다\n   Ex) This demonstrates that there are good alternatives to libraries when people want to obtain some reading materials.\n   단어: 대안 alternative / 얻다 obtain\n\n26) To be specific, 주어 + 동사\n   뜻: 구체적으로, …이다\n   Ex) To be specific, corner rooms are the best because they usually have more than one window.\n\n27) Not only that, but 주어 + 동사\n   뜻: 그뿐 아니라, …이다\n   Ex) Not only that, but a child's ability to learn languages also starts to diminish around that time.\n   단어: 능력 ability / 줄어들다, 훼손하다 diminish\n\n28) In other words, 주어 + 동사\n   뜻: 다시 말해서, …이다\n   Ex) In other words, traveling alone can be a lesson in how to overcome hardship.\n   단어: 고난 hardship\n\n29) Moreover/In addition, 주어 + 동사\n   뜻: 게다가, …하다\n   Ex) Moreover, families tend to be more spread out because the car has made long-distance travel easier.\n   단어: 흩어지다, 퍼지다 spread out\n\n30) In this way, 주어 + 동사\n   뜻: 이런 식으로, …하다\n   Ex) In this way, teachers have greater motivation to help their students learn more effectively.\n   단어: 동기 motivation\n\n31) As we have seen, 주어 + 동사\n   뜻: 이상과 같이, …이다\n   Ex) As we have seen, society has benefited greatly from certain significant inventions.\n   단어: 득을 보다 benefit\n\n32) To some extent, 주어 + 동사\n   뜻: 어느 정도까지는, …이다\n   Ex) To some extent, all colleges try to ensure that students receive proper attention from the teaching staff.\n   단어: 보장하다 ensure\n\n33) On the whole, 주어 + 동사\n   뜻: 대체로, …이다\n   Ex) On the whole, TV, video games, and the Internet have had a negative effect on society."

      "text": "━━━ 조건을 나타낼 때 쓰는 표현 ━━━\n\n1) Regardless of ~, 주어 + 동사\n   뜻: ~과 무관하게, …이다\n   Ex) Regardless of the amount of natural talent one has, if one does not work hard, one will never find success.\n   단어: 천부적 재능 natural talent\n\n2) Without ~, 주어 + will + 동사\n   뜻: ~이 없다면, …할 것이다\n   Ex) Without grades, students would not be able to determine how well they are doing in their subjects.\n   단어: 결정하다 determine\n\n3) Once 주어 + 동사, 주어 + 동사\n   뜻: 일단 ~하면, …이다\n   Ex) Once a machine is purchased and installed, it can be operated with only minimal maintenance costs.\n   단어: 설치하다 install / 운영하다 operate / 유지비 maintenance cost\n\n4) Given ~, 주어 + 동사\n   뜻: ~을 고려하면, …이다\n   Ex) Given the extremely high rate of unemployment, something must be done to create more jobs.\n   단어: 실업 unemployment\n\n5) When it comes to ~, 주어 + 동사\n   뜻: ~에 관해서라면, …이다\n   Ex) When it comes to learning a musical instrument, the earlier a child starts, the better.\n   단어: 악기 musical instrument\n\n6) It is doubtful whether 주어 + 동사\n   뜻: …인지 의문이다\n   Ex) It is doubtful whether lie detector tests are a reliable way to determine if a person is telling the truth or not.\n   단어: 거짓말 탐지기 lie detector / 신뢰할 만한 reliable\n\n7) It seems as if 주어 + 동사\n   뜻: 마치 ~처럼 보인다\n   Ex) It seems as if students are more enthusiastic at the beginning of the term.\n   단어: 열정적인 enthusiastic / 학기 term\n\n8) 주어 + would + 동사 + provided that 주어 + 동사\n   뜻: 만일 ~라면, …할 것이다\n   Ex) I would consider taking a job with less pay provided that it is in a field that I am passionate about.\n   단어: 분야 field\n\n9) 주어 is likely to ~ unless 주어 + 동사\n   뜻: 만일 ~하지 않으면 ~할 것 같지 않다\n   Ex) Many students are not likely to be inspired to learn unless they are graded on their performance.\n   단어: 성적을 매기다 grade / 영감을 주다 inspire\n\n10) I would ~ on the condition that 주어 + 동사\n   뜻: 나는 …한다는 조건이라면 ~할 것이다\n   Ex) I would work for a large company on the condition that I would still have a chance to express myself once in a while.\n   단어: 대규모의 large / 한번쯤 once in a while\n\n11) If I were asked to ~, I would -\n   뜻: 만일 나에게 ~을 하라고 한다면, 나는 -할 것이다\n   Ex) If I were asked to change careers, I would become a sports coach.\n\n12) If it were up to me, I would ~\n   뜻: 만일 그것이 나에게 달려 있다면, 나는 ~할 것이다\n   Ex) If it were up to me, I would require all first-year students to attend all their classes or risk failing marks.\n   단어: 신입생 first-year student\n\n━━━ 가정을 나타낼 때 쓰는 표현 ━━━\n\n13) Suppose 주어 + 동사\n   뜻: …라고 가정해보자\n   Ex) Suppose the printing press was never invented. What would have happened in Europe?\n   단어: 인쇄기 printing press\n\n14) Presumably, 주어 + 동사\n   뜻: 아마도, …일 것이다\n   Ex) Presumably, children benefit from taking mandatory physical education classes in elementary school.\n   단어: 의무적인 mandatory / 체육 physical education\n\n15) Let's assume that 주어 + 동사\n   뜻: …라고 가정해보자\n   Ex) Let's assume that not all students with part-time jobs work more than 20 hours a week.\n\n16) In all likelihood, 주어 + will + 동사\n   뜻: 십중팔구, …일 것이다\n   Ex) In all likelihood, cities would improve by increased spending on public transportation.\n\n17) I wish 주어 + 과거동사\n   뜻: 나는 …라면 좋겠다\n   Ex) I wish I could go back to my childhood because that was the last time I was free of responsibility.\n   단어: 책임 responsibility\n\n━━━ 양보를 나타낼 때 쓰는 표현 ━━━\n\n18) Nevertheless/Even so, 주어 + 동사\n   뜻: 그럼에도 불구하고, …이다\n   Ex) Nevertheless, school uniforms provide students with fond memories of school long after they have graduated.\n\n19) In spite of ~, 주어 + 동사\n   뜻: ~에도 불구하고, …이다\n   Ex) In spite of the pollution that is emitted by cars, I still believe they are one of the greatest inventions of the century.\n   단어: 배출하다 emit\n\n━━━ 요약을 나타낼 때 쓰는 표현 ━━━\n\n20) To sum up, 주어 + 동사\n   뜻: 요약하자면, …이다\n   Ex) To sum up, knowing how to use a computer is essential for education and employment.\n   단어: 필수적인 essential\n\n21) Overall, 주어 + 동사\n   뜻: 전반적으로, …이다\n   Ex) Overall, good neighbors are trustworthy, friendly, and caring.\n   단어: 신뢰할 수 있는 trustworthy / 배려하는 caring\n\n22) In this regard, 주어 + 동사\n   뜻: 이러한 점에서, …이다\n   Ex) In this regard, I think that you should never judge others based on their physical appearance.\n   단어: 판단하다 judge / 신체적 외모 physical appearance\n\n23) All things considered, 주어 + 동사\n   뜻: 모든 것을 고려해 보면, …이다\n   Ex) All things considered, students need to prove why they deserve to attend a university.\n   단어: ~할 자격이 있다 deserve\n\n24) Last but not least, 주어 + 동사\n   뜻: 마지막으로 중요한 것은, …이다\n   Ex) Last but not least, war never decides who is right, but rather who is left.\n\n25) As such, 주어 + 동사\n   뜻: 이와 같이, …이다\n   Ex) As such, he has the authority to make major decisions for the company.\n   단어: 권한 authority\n\n26) That is, 주어 + 동사\n   뜻: 즉, …이다\n   Ex) That is, major corporations own media companies and are interested in portraying reality in a way that is favorable to their own interests.\n   단어: 묘사하다 portray / 유리한 favorable\n\n27) In short, 주어 + 동사\n   뜻: 간단히 말해서, …이다\n   Ex) In short, I believe that parents should be selective in how much time their children can spend watching TV.\n\n28) In conclusion, 주어 + 동사\n   뜻: 결론적으로, …이다\n   Ex) In conclusion, the best coworkers are the ones who are honest, loyal, and cooperative.\n   단어: 협조적인 cooperative\n\n29) What it comes down to is that 주어 + 동사\n   뜻: 결국 요점은, …이다\n   Ex) What it comes down to is that unless tuition is raised, student services will be cut back.\n   단어: 등록금 tuition / 삭감하다 cut back\n\n30) There is no doubt that 주어 + 동사\n   뜻: …라는 것은 의심의 여지가 없다\n   Ex) There is no doubt that early exposure to reading builds a lifelong love of books.\n   단어: 노출 exposure / 평생의 lifelong\n\n31) It goes without saying that 주어 + 동사\n   뜻: …은 말할 필요도 없다\n   Ex) It goes without saying that a healthy diet plays a crucial role in a child's development.\n   단어: 필수적인 crucial"

      "text": "━━━ 교육에 관한 표현 ━━━\n\n1) well-rounded education\n   뜻: 다면적인, 잘 짜여진 교육\n   Ex) Some people think that high schools should offer their students a well-rounded education.\n\n2) learn valuable skills\n   뜻: 유용한 기술을 배우다\n   Ex) In addition to normal lessons, students learn valuable skills from interacting with their peers.\n   단어: 상호작용하다 interact\n\n3) extracurricular activities\n   뜻: 학과 외 활동\n   Ex) Participating in extracurricular activities is a good way to widen their social network.\n   단어: 참여하다 participate in\n\n4) hands-on activity\n   뜻: 체험 활동\n   Ex) Teachers sometimes plan hands-on activities to get students more involved.\n   단어: 포함하다 involve\n\n5) group assignment\n   뜻: 조별 과제\n   Ex) Group assignments are an easy way to build trust between students.\n   단어: 신뢰를 쌓다 build trust\n\n6) build a strong character\n   뜻: 훌륭한 인격을 기르다\n   Ex) Building a strong character is more important than any academic or financial success.\n\n7) personality development\n   뜻: 인격 발달\n   Ex) Personality development in kindergarten is geared towards teaching children how to interact as part of a group.\n   단어: 유치원 kindergarten / ~을 향하다, 목표로 하다 geared towards\n\n8) peer pressure\n   뜻: 또래 압박\n   Ex) Positive peer pressure can be applied in study groups to help students motivate each other.\n   단어: 적용하다 apply / 자극하다 motivate\n\n━━━ 가정에 관한 표현 ━━━\n\n9) extended family\n   뜻: 대가족\n   Ex) Extended family remains as valuable as in the past.\n   단어: 남다 remain\n\n10) working parents\n   뜻: 맞벌이 부모\n   Ex) One of the ways to keep children with working parents happy and safe is to expand daycare facilities.\n   단어: 유아 시설 daycare facility\n\n11) birth rate\n   뜻: 출생율\n   Ex) Societies with a lower birth rate can offer a better livelihood to the children.\n   단어: 생계 livelihood\n\n12) single-parent family\n   뜻: 한부모 가정\n   Ex) Today, single-parent families are becoming more and more common.\n\n13) family gathering\n   뜻: 가족 모임\n   Ex) A family gathering can be a great opportunity to reconnect with distant relatives.\n   단어: 다시 이어지다, 재회하다 reconnect with / 먼 distant\n\n14) push one's children\n   뜻: 아이를 다그치다\n   Ex) It is sometimes important to push your children, but not to become overbearing.\n   단어: 지나친, 과도한 overbearing\n\n15) emotional attachment\n   뜻: 정서적인 애착\n   Ex) Children often develop an emotional attachment to blankets and teddy bears.\n\n━━━ 건강에 관한 표현 ━━━\n\n16) life expectancy\n   뜻: 평균 수명\n   Ex) Life expectancy is influenced by a number of factors, such as family history and personal lifestyle.\n   단어: 가족력 family history\n\n17) health care/medical care\n   뜻: 의료 서비스, 치료\n   Ex) Improvements in health care are directly related to advancements in medical science.\n   단어: 발전 advancement\n\n18) deadly disease\n   뜻: 치명적인 질병\n   Ex) Vaccinating children against deadly diseases has lowered mortality rates in advanced countries.\n   단어: 사망률 mortality rate\n\n19) stay in shape\n   뜻: 건강을 유지하다\n   Ex) It is difficult to stay in shape when sitting at a desk all day and then sitting on a couch all night.\n\n20) break a bad habit\n   뜻: 나쁜 습관을 고치다\n   Ex) An effective way to break a bad habit such as smoking is to substitute it with a new behavior, such as chewing nicotine gum.\n   단어: 대체하다 substitute\n\n━━━ 사회에 관한 표현 ━━━\n\n21) stressed out\n   뜻: 스트레스를 많이 받다\n   Ex) There is no point in getting stressed out about things you cannot change.\n\n22) drug addiction\n   뜻: 약물 중독\n   Ex) Drug addiction is one of the most dangerous health issues facing society today.\n   단어: 직면하다 face\n\n23) ever-changing world\n   뜻: 늘 변화하는 세상\n   Ex) It is difficult to make predictions in an ever-changing world.\n   단어: 예측하다 make predictions\n\n24) rural area\n   뜻: 시골 지역\n   Ex) Growing up in a rural area allows for a close connection with nature which is impossible in a crowded urban area.\n   단어: 혼잡한 crowded\n\n25) provoke controversy\n   뜻: 논란을 불러일으키다\n   Ex) Some companies use advertisements that provoke controversy in order to generate publicity.\n   단어: 홍 tendance — 뜻: 의무 출석\n   Ex) Compulsory attendance policies ensure that students do not fall behind in their studies.\n\n40) a college degree — 뜻: 대학 학위\n   Ex) Many employers still consider a college degree to be a basic requirement for entry-level jobs.\n\n41) excel in many areas — 뜻: 많은 분야에서 뛰어나다\n   Ex) A well-rounded curriculum allows students to excel in many areas, not just academics.\n\n42) fall behind — 뜻: 뒤처지다\n   Ex) Students who miss too many classes are likely to fall behind their peers.\n\n43) set a good example — 뜻: 좋은 모범이 되다\n   Ex) Teachers who set a good example inspire their students to work harder.\n\n━━━ 가정 관련 추가 표현 ━━━\n\n44) reach one's teens/enter one's teens — 뜻: 십대가 되다\n   Ex) Many children become more independent as soon as they reach their teens.\n\n45) develop a positive self-image — 뜻: 긍정적인 자아상을 개발하다\n   Ex) Supportive parents help their children develop a positive self-image from a young age.\n\n46) a lifelong friend — 뜻: 일생의 친구\n   Ex) Some people meet a lifelong friend during their childhood years.\n\n47) senior citizens — 뜻: 노인들\n   Ex) Senior citizens often rely on their families for both financial and emotional support.\n\n48) hand down — 뜻: 물려주다\n   Ex) Many families hand down traditions from one generation to the next.\n\n49) household chores — 뜻: 집안일\n   Ex) Assigning household chores to children teaches them responsibility at an early age.\n\n50) the generation gap — 뜻: 세대 차이\n   Ex) The generation gap between parents and children often leads to misunderstandings.\n\n51) go through a hard time — 뜻: 힘든 시기를 겪다\n   Ex) Families who go through a hard time together often develop stronger bonds.\n\n━━━ 건강 관련 추가 표현 ━━━\n\n52) life span — 뜻: 수명\n   Ex) Advances in medicine have significantly increased the average human life span.\n\n53) secondhand smoke — 뜻: 간접흡연\n   Ex) Exposure to secondhand smoke can cause serious health problems in children.\n\n54) annual check-up — 뜻: 연간 정기 건강 검진\n   Ex) An annual check-up allows doctors to detect 하다 rely upon / 은퇴하다 retire\n\n13) developing country — 뜻: 개발도상국\n   Ex) In a developing country, the gap between the rich and the poor is often quite large.\n   단어: 격차, 틈 gap\n\n14) work force — 뜻: 노동 인구, 노동력\n   Ex) A diverse work force helps a company stay ahead of its competitors.\n   단어: ~보다 앞서다 stay ahead of / 경쟁사 competitor\n\n15) unemployment rate — 뜻: 실업률\n   Ex) The unemployment rate in the country has been high for the last three decades.\n   단어: 10년간 decade\n\n━━━ 직업에 관한 표현 ━━━\n\n16) entry-level position — 뜻: 신입직, 견습생 지위\n   Ex) Most people who start at entry-level positions rise to important positions.\n\n17) temporary worker — 뜻: 임시 직원\n   Ex) Many companies hire temporary workers during a holiday season.\n   단어: 휴가철 holiday season\n\n18) managerial position — 뜻: 관리직\n   Ex) Most people do not have the skills and leadership abilities necessary for managerial positions.\n   단어: 지도력 leadership ability\n\n19) build a career — 뜻: 경력을 쌓다\n   Ex) Having a deep interest in a specific field is key to building a career successfully.\n   단어: 필수적인 key\n\n20) career fulfillment — 뜻: 직업적 성취, 만족\n   Ex) What constitutes career fulfillment differs from worker to worker.\n   단어: ~을 구성하다 constitute\n\n21) high-paying job/well-paying job — 뜻: 고소득 직업\n   Ex) Most high-paying jobs require a degree of higher education.\n   단어: 학위 degree\n\n22) work out of one's home — 뜻: 재택근무를 하다\n   Ex) The number of professionals who work out of their homes has increased greatly.\n   단어: 전문직 professional\n\n23) work two jobs — 뜻: 두 가지 직업을 병행하다\n   Ex) Some people have to work two jobs to earn enough money to make ends meet.\n   단어: 돈을 벌다 earn money / 수입과 지출을 맞추다 make ends meet\n\n24) create a business — 뜻: 창업하다\n   Ex) Some colleges encourage their students to create businesses while in school.\n\n25) find employment — 뜻: 직업을 구하다\n   Ex) If a person wishes to find employment for extra pocket money, a good place to look is in restaurants.\n   단어: 용돈 pocket money\n\n26) reap the benefits — (function () {

  // a single fixed document that only this site's own code reads/writes.
  // Every device that opens the page subscribes to that document, so a

  var SYNC_DOC = db ? db.collection('sync').doc('grammar-archive') : null;

  function makeStore(storageKey) {
    var cache = null;
    function load() {
      if (cache) return cache;
      try { cache = JSON.parse(localStorage.getItem(storageKey) || '{}'); }
      catch (e) { cache = {}; }
      return cache;
    }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(cache)); } catch (e) { /* storage unavailable */ }
    }
    function replaceAll(data) {
      cache = data || {};
      save();
    }

  var SStore = makeStore('grammar-archive-stars-v1');

  var pushTimer = null;

    if (!SYNC_DOC) return; // no cloud connection -- local-only mode, already saved above
    clearTimeout(pushTimer);

      SYNC_DOC.set({
        highlights: HStore.load(),
        stars: SStore.load(),
        notes: NStore.load(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()

      return (essayId in d) ? d[essayId] : (fallback || '');

    hasOverride: function (essayId) { return essayId in NStore.load(); },
    set: function (essayId, text) {

    add: function (entryId, field, start, end) {

    removeAt: function (entryId, field, start, end) {

    var sorted = ranges.slice().sort(function (a, b) { return a.start - b.start; });

  // with enough saturation/lightness contrast to stay distinguishable at a glance.
  var PALETTE = [
    { bg: 'hsl(352, 68%, 93%)', fg: 'hsl(352, 58%, 42%)' }, // red
    { bg: 'hsl(26, 75%, 90%)',  fg: 'hsl(26, 65%, 38%)'  }, // orange
    { bg: 'hsl(44, 72%, 87%)',  fg: 'hsl(44, 62%, 32%)'  }, // gold
    { bg: 'hsl(152, 48%, 90%)', fg: 'hsl(152, 45%, 30%)' }, // green
    { bg: 'hsl(180, 45%, 88%)', fg: 'hsl(180, 50%, 28%)' }, // teal
    { bg: 'hsl(210, 62%, 92%)', fg: 'hsl(210, 58%, 40%)' }, // blue
    { bg: 'hsl(238, 58%, 93%)', fg: 'hsl(238, 52%, 46%)' }, // indigo
    { bg: 'hsl(272, 52%, 93%)', fg: 'hsl(272, 46%, 46%)' }, // violet
    { bg: 'hsl(322, 58%, 93%)', fg: 'hsl(322, 52%, 42%)' }  // magenta

  var ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M8 16L16 8M10 8H16V14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';

  function diffWords(wrong, correct) {
    var a = wrong.split(/\s+/);
    var b = correct.split(/\s+/);
    var i = 0;
    while (i < a.length && i < b.length && a[i].toLowerCase() === b[i].toLowerCase()) i++;
    var j = 0;
    while (
      j < a.length - i && j < b.length - i &&
      a[a.length - 1 - j].toLowerCase() === b[b.length - 1 - j].toLowerCase()
    ) j++;
    var prefix = a.slice(0, i);
    var middleWrong = a.slice(i, a.length - j);
    var suffix = a.slice(a.length - j);
    var middleCorrect = b.slice(i, b.length - j);
    if (!middleWrong.length) { middleWrong = a.slice(i); suffix = []; middleCorrect = b.slice(i); }
    return { prefix: prefix, middleWrong: middleWrong, suffix: suffix, middleCorrect: middleCorrect };

  // then wraps each segment with whichever of <mark class="hl"> / <span class="struck">
  // actually apply to it. Handles arbitrary overlap between a user's highlight drag
  // and the auto-computed struck range.
  function renderAnnotatedText(text, highlightRanges, struckRange, fixText, baseOffset) {
    baseOffset = baseOffset || 0;
    var points = {};
    points[0] = true; points[text.length] = true;
    (highlightRanges || []).forEach(function (r) { points[r.start] = true; points[r.end] = true; });
    if (struckRange) { points[struckRange.start] = true; points[struckRange.end] = true; }
    var sorted = Object.keys(points).map(Number).sort(function (a, b) { return a - b; });

    var html = '';
    for (var k = 0; k < sorted.length - 1; k++) {
      var s = sorted[k], e = sorted[k + 1];
      if (s >= e) continue;
      var seg = text.slice(s, e);
      var hiRange = (highlightRanges || []).filter(function (r) { return s >= r.start && e <= r.end; })[0];
      var isHi = !!hiRange;
      var isStruck = struckRange && s >= struckRange.start && e <= struckRange.end;
      var open = '', close = '';

      // stores ranges in (the whole hl-zone's text, per getTextOffsetInZone) --
      // callers that render a smaller fragment of a zone (e.g. one line of a
      // notes box) pass baseOffset so the click-to-cancel lookup still matches.
      if (isHi) {
        var noteAttr = hiRange.note ? ' data-note="' + escapeHtml(hiRange.note) + '"' : '';
        var noteClass = hiRange.note ? ' has-note' : '';
        open += '<mark class="hl' + noteClass + '" data-start="' + (s + baseOffset) + '" data-end="' + (e + baseOffset) + '"' + noteAttr + '>';
        var dotHtml = hiRange.note ? '<button type="button" class="hl-note-dot" data-note="' + escapeHtml(hiRange.note) + '" aria-label="메모 보기"></button>' : '';
        close = dotHtml + '</mark>' + close;
      }
      if (isStruck) {
        open += (fixText != null) ? '<span class="struck" data-fix="' + escapeHtml(fixText) + '">' : '<span class="struck">';

  // - "full": the whole sentence changed -> no shared anchor point exists, so the
  //   correction is shown as a normal in-flow line below (nothing overlaps, ever).
  function buildWrongBlock(entryId, wrong, correct) {
    var d = diffWords(wrong, correct);
    var isFullRewrite = d.prefix.length === 0 && d.suffix.length === 0;
    var hlRanges = Highlights.get(entryId, 'wrong');
    var zoneAttrs = ' class="wrong hl-zone" data-entry-id="' + escapeHtml(entryId) + '" data-field="wrong"';

    if (isFullRewrite) {
      var struckRange = { start: 0, end: wrong.length };
      return (
        '<div' + zoneAttrs + '>' + renderAnnotatedText(wrong, hlRanges, struckRange, null) + '</div>' +
        '<div class="full-correction">' + escapeHtml(correct) + '</div>'
      );
    }

    var prefixStr = d.prefix.join(' ');
    var middleStr = d.middleWrong.join(' ');
    var suffixStr = d.suffix.join(' ');

  // Measures each struck word's actual on-screen position and places its
  // correction note flush left under it, then reserves exactly enough space
  // below so the note never overlaps the explanation text that follows.
  var NOTE_GAP = 4; // fixed, consistent gap between the strikethrough and the correction note

  function positionCorrectionNotes(root) {
    // idempotent: safe to call again (e.g. after web fonts finish loading, or on resize)
    root.querySelectorAll('.correction-note').forEach(function (n) { n.remove(); });

    var wrongs = root.querySelectorAll('.wrong');
    wrongs.forEach(function (wrongEl) {
      wrongEl.style.paddingBottom = '';
      var struck = wrongEl.querySelector('.struck[data-fix]');
      if (!struck) return;
      var wrongRect = wrongEl.getBoundingClientRect();
      var rects = struck.getClientRects();
      // anchor to the LAST visual line of the struck text, not the first --
      // on a single line these are the same rect (so desktop is unaffected),
      // but if the struck phrase wraps onto 2+ lines (narrow / mobile widths),
      // anchoring to the first line would place the note on top of the
      // text's own remaining wrapped lines.
      var anchorRect = rects[rects.length - 1];
      if (!anchorRect) return;

      var center = anchorRect.left + anchorRect.width / 2 - wrongRect.left;
      var top = anchorRect.bottom - wrongRect.top + NOTE_GAP;

      var note = document.createElement('div');
      note.className = 'correction-note';
      note.textContent = struck.getAttribute('data-fix');

      note.style.left = center + 'px'; // temporary, refined below once width is known

      // around the struck word's center, shift it left/right just enough to
      // stay inside the card instead of letting it clip or wrap.
      var noteW = note.getBoundingClientRect().width;

      var clampedCenter = (half * 2 > wrongRect.width)
        ? wrongRect.width / 2
        : Math.min(Math.max(center, half), wrongRect.width - half);
      note.style.left = clampedCenter + 'px';

      var noteRect = note.getBoundingClientRect();
      var neededHeight = (noteRect.bottom - wrongRect.top) - wrongEl.offsetHeight;

  }

  function colorFor(id) {
    var idx = state.categories.findIndex(function (c) { return c.id === id; });
    if (idx < 0) idx = 0;

    for (var i = 0; i < state.categories.length; i++) {

  function essayIndexOf(essayId) {

    var out = [];

          essayId: essay.id,
          essayTitle: essay.title,

  // just by calling allEntries().
  function allNoteSections() {
    var out = [];
    state.essays.forEach(function (essay) {
      var baseId = essay.id + '-notes';
      var text = Notes.get(essay.id, essay.notes);
      if (!text) return;

  // not the order they happen to appear in the data array. Falls back to

  // original (e.g. a typo was normalized when the excerpt was written).
  function essayOrderIndex(essay, entry) {
    if (!essay || !essay.originalText) return Infinity;
    var original = essay.originalText.replace(/\s+/g, ' ').toLowerCase();
    var wrong = entry.wrong.replace(/\s+/g, ' ').toLowerCase();
    for (var len = wrong.length; len >= 10; len -= 5) {

      if (pos !== -1) return pos;

    return Infinity;

      var noteStarlist = allNoteSections().filter(function (s) { return Stars.get(s.id) === route.n; });
      noteStarlist.sort(function (x, y) { return y.date.localeCompare(x.date) || essayIndexOf(y.essayId) - essayIndexOf(x.essayId); });

            essayHeaderWrap.innerHTML =
              '<div class="essay-header">' +
                '<div>' +

                '<div class="top-row" style="justify-content:flex-end">' +

          } else {
            // Level 3: the actual expression cards for one group
            var wsec = wdSections[route.sectionIdx];
            essayHeaderWrap.innerHTML =
              '<div class="essay-header">' +
                '<div>' +
                  '<div class="meta-line">' + escapeHtml(wdoc.title) + '</div>' +

            if (wsec) {

              var wCard = document.createElement('div');
              wCard.className = 'worddoc-card';
              wCard.innerHTML =
                '<div class="notes-content"><div class="notes-section"><div class="notes-section-body hl-zone" data-entry-id="' +
                  escapeHtml(wBaseId) + '" data-field="' + wField + '">' +
                  renderNotesBody(wsec.body, wHl) +
                '</div></div></div>';
              listArea.appendChild(wCard);
            }
          }
        }
      }
    } else if (route.type === 'nouns') {
      catSection.style.display = 'none';
      essayHeaderWrap.innerHTML =
        '<div class="essay-header">' +
          '<div>' +
            '<div class="meta-line">참고 자료</div>' +

    var dates = allEntries().map(function (e) { return e.date; }).sort();

    // Deferred to the next frame so the browser can paint the route-change

  // Internal-only back/forward: a stack of hashes visited inside this site.
  // Deliberately NOT window.history.back()/forward() -- that could walk past
  // the very first visit and leave the site entirely (e.g. back to whatever
  // page linked here). On first load, both buttons start disabled.
  var navStack = [window.location.hash || '#/'];
  var navIndex = 0;
  var isProgrammaticNav = false;

  function navBack() {
    if (navIndex <= 0) return;
    navIndex--;
    isProgrammaticNav = true;
    window.location.hash = navStack[navIndex];
  }
  function navForward() {
    if (navIndex >= navStack.length - 1) return;
    navIndex++;
    isProgrammaticNav = true;
    window.location.hash = navStack[navIndex];
  }
  function onHashChangeForNav() {
    var hash = window.location.hash || '#/';
    if (isProgrammaticNav) {
      isProgrammaticNav = false; // this change came from navBack/navForward -- stack already points at it
    } else {
      // a real navigation (clicking a link inside the site) -- drop any
      // "forward" entries and record this as a new step
      navStack = navStack.slice(0, navIndex + 1);
      if (navStack[navStack.length - 1] !== hash) {
        navStack.push(hash);
        navIndex = navStack.length - 1;
      }
    }
    updateNavButtons();
  }

  document.getElementById('navBack').addEventListener('click', navBack);
  document.getElementById('navForward').addEventListener('click', navForward);
  function updateNavButtons() {
    document.getElementById('navBack').disabled = navIndex <= 0;
    document.getElementById('navForward').disabled = navIndex >= navStack.length - 1;
  }

  // Counts words in the essay's original text (whitespace-delimited tokens)
  // and, when the essay's title tells us which IELTS task it is ("Task 1"
  // / "Task 2"), compares that count against the official minimum (150 /
  // 250 words) -- reporting how far over or under the essay falls using a
  // nominal-ending ("~함/~임/~됨") status phrase, per project convention.
  var TASK_MIN_WORDS = { 1: 150, 2: 250 };
  function countWords(text) {
    var trimmed = (text || '').trim();
    if (!trimmed) return 0;
    return trimmed.split(/\s+/).length;
  }
  function buildWordCountNote(essay) {
    var count = countWords(essay.originalText);
    var taskMatch = (essay.title || '').match(/Task\s*(\d+)/i);
    var taskNum = taskMatch ? parseInt(taskMatch[1], 10) : null;
    var minWords = taskNum ? TASK_MIN_WORDS[taskNum] : null;

    if (!minWords) {
      return '<div class="word-count-note">총 ' + count + '단어</div>';
    }

    var diff = count - minWords;
    var statusClass = diff < 0 ? 'is-short' : 'is-ok';
    var statusText = diff < 0
      ? (Math.abs(diff) + '단어 부족함')
      : (diff === 0 ? '기준 단어 수 정확히 충족함' : (diff + '단어 초과 충족함'));

    return '<div class="word-count-note ' + statusClass + '">' +
      '총 ' + count + '단어 · Task ' + taskNum + ' 최소 기준 ' + minWords + '단어 — ' + statusText +
    '</div>';
  }

  function buildEssayGridEl(essays, activeTag) {
    var grid = document.createElement('div');
    grid.className = 'essay-grid';
    if (!essays.length) {
      grid.innerHTML = '<div class="empty">아직 기록된 글이 없음.</div>';
      return grid;
    }
    essays
      .map(function (essay, idx) { return { essay: essay, idx: idx }; })
      .sort(function (a, b) {
        var byDate = b.essay.date.localeCompare(a.essay.date);
        if (byDate !== 0) return byDate;
        return b.idx - a.idx; // same date: more recently added (later in the array) comes first
      })
      .map(function (x) { return x.essay; })
      .forEach(function (essay) {
      var cats = {};
      essay.entries.forEach(function (e) { cats[e.category] = (cats[e.category] || 0) + 1; });
      var tagRow = Object.keys(cats).map(function (catId) {
        var c = catById(catId);
        var color = colorFor(catId);
        var count = activeTag && catId === activeTag ? cats[catId] : null;
        return '<span class="pill" style="background:' + color.bg + ';color:' + color.fg + '">' +
          (c ? c.label : catId) + (count ? ' · ' + count + '건' : '') + '</span>';
      }).join('');

      var card = document.createElement('a');
      card.className = 'essay-card';
      card.href = '#/essay/' + encodeURIComponent(essay.id);
      card.innerHTML =
        '<div>' +
          '<div class="meta-line">' + essay.date + ' · ' + essay.entries.length + '건 교정</div>' +
          '<div class="title">' + escapeHtml(essay.title) + '</div>' +
          '<div class="tag-row">' + tagRow + '</div>' +
        '</div>' +
        '<div class="score">' +
          '<div class="num">' + escapeHtml(String(essay.score)) + '</div>' +
          '<div class="lbl">EST. BAND</div>' +
        '</div>';
      grid.appendChild(card);
    });
    return grid;
  }
