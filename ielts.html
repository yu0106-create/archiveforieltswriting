  "wordDocs": [
    {
      "id": "task1-trend-expressions",
      "title": "Task 1 \u00b7 \uc99d\uac10\u00b7\ubcc0\ub3d9 \ud45c\ud604",
      "subtitle": "28\uac1c \ud45c\ud604",
      "text": "\u2501\u2501\u2501 \uc804\uce58\uc0ac \uac10\uac01 \uc7a1\uae30: at \u00b7 of \u00b7 by \u00b7 to \u00b7 over \u00b7 between \u00b7 among \u2501\u2501\u2501\n\n\uc774 \ud45c\ud604\uc9d1\uc5d0 \ubc18\ubcf5\ud574\uc11c \ub098\uc624\ub294 \uc804\uce58\uc0ac at, of, by, to\ub294 \ub73b\uc73c\ub85c \uc678\uc6b0\uae30\ubcf4\ub2e4 \uc544\ub798 \uac10\uac01\uc73c\ub85c \uc774\ud574\ud558\uba74 \ud6e8\uc52c \ud5f7\uac08\ub9ac\uc9c0 \uc54a\uc74c.\n\n## at \u2014 \ub3d9\uc0ac \ub4a4\uc5d0\uc11c '\uadf8 \uc9c0\uc810\uc5d0 \uba48\ucdb0\uc788\ub2e4/\ub3c4\ub2ec\ud588\ub2e4'\n\n\ub3d9\uc0ac(peak, remain, stand, stop \ub4f1) \ubc14\ub85c \ub4a4\uc5d0\uc11c '\ud2b9\uc815 \uc9c0\uc810\uc5d0'\ub77c\ub294 \uc758\ubbf8\ub85c \uc500. \uc6c0\uc9c1\uc774\ub358 \uac83\uc774 \uc815\ud655\ud788 \uadf8 \uc9c0\uc810\uc5d0\uc11c \uba48\ucd94\ub294 \uc774\ubbf8\uc9c0.\n\n1) peak at ~\n   \uc124\uba85: peak\uac00 \ub3d9\uc0ac\ub85c \uc4f0\uc5ec '\uadf8 \uc9c0\uc810\uc5d0\uc11c \uc815\uc810\uc744 \ucc0d\uc5c8\ub2e4'\ub294 \ub73b. \uadf8\ub798\ud504\uac00 \uc62c\ub77c\uac00\ub2e4\uac00 \uc815\ud655\ud788 \uadf8 \uc218\uce58 \uc9c0\uc810\uc5d0\uc11c \uba48\ucd94\ub294 \uc774\ubbf8\uc9c0\ub77c at\uc774 \uc790\uc5f0\uc2a4\ub7ec\uc6c0.\n   Ex) The number of students from China peaked at 320,000 in 2015.\n\n2) remain at ~\n   \uc124\uba85: remain\uc740 '\uba38\ubb34\ub974\ub2e4'\ub77c\ub294 \ub73b\uc758 \ub3d9\uc0ac\uc774\ubbc0\ub85c, '\uc5b4\ub5a4 \uc9c0\uc810\uc5d0 \uba38\ubb3c\ub7ec \uc788\ub2e4'\ub294 \uc758\ubbf8\uc640 \uc790\uc5f0\uc2a4\ub7fd\uac8c \uc5b4\uc6b8\ub9bc.\n   Ex) The number of US residents traveling to the UK remained at around 2.8 million.\n\n## of \u2014 \uba85\uc0ac \ub4a4\uc5d0\uc11c '\uadf8 \uba85\uc0ac\uac00 \uad6c\uccb4\uc801\uc73c\ub85c \ubb34\uc5c7\uc778\uc9c0 \ud480\uc5b4\uc90c'\n\npoint, level, low, high\ucc98\ub7fc '\uc5b4\ub5a4 \uc9c0\uc810'\uc744 \uac00\ub9ac\ud0a4\ub294 \uba85\uc0ac \ubc14\ub85c \ub4a4\uc5d0\uc11c, \uadf8 \uc9c0\uc810\uc774 \uc815\ud655\ud788 \uc5b4\ub5a4 \uc218\uce58\uc778\uc9c0 \ub3d9\uaca9\ucc98\ub7fc \ud480\uc5b4\uc90c. '\uadf8 \uc9c0\uc810 = \uc5bc\ub9c8'\ub77c\ub294 \uad00\uacc4.\n\n1) reach the highest point of ~\n   \uc124\uba85: point \uc790\uccb4\ub294 '\uc9c0\uc810'\uc774\ub77c\ub294 \ucd94\uc0c1\uc801\uc778 \uba85\uc0ac\ub77c, \uadf8\uac83\uc774 \uad6c\uccb4\uc801\uc73c\ub85c \uc5b4\ub5a4 \uc218\uce58\uc778\uc9c0\ub294 of\ub85c \uc774\uc5b4\uc918\uc57c \ud568. the point of 3.2 million\uc740 '3.2 million\uc774\ub77c\ub294 \uadf8 \uc9c0\uc810'\uc73c\ub85c \uc77d\ud798.\n   Ex) The number of US tourists traveling to the UK reached the highest point of 3.2 million in 2015.\n\n2) hit a low of ~\n   \uc124\uba85: a low\ub3c4 '\ucd5c\uc800\uc810'\uc774\ub77c\ub294 \uba85\uc0ac\uc774\ubbc0\ub85c \uac19\uc740 \uc6d0\ub9ac\ub85c of\uac00 \ubd99\uc74c.\n   Ex) The number of UK travelers hit a low of three million in 2012.\n\n   \ube44\uad50) peak at 320,000 / reach the highest point of 320,000\n   \uc124\uba85: \ub611\uac19\uc774 '\uc815\uc810\uc744 \ucc0d\ub2e4'\ub294 \ub73b\uc774\ub77c\ub3c4, peak\ucc98\ub7fc \ub3d9\uc0ac\ub85c \uc4f0\uba74 at, point\ucc98\ub7fc \uba85\uc0ac\ub85c \uc4f0\uba74 of\uac00 \ubd99\uc74c. \ub3d9\uc0ac \ub4a4\uc5d0\ub294 at, \uba85\uc0ac \ub4a4\uc5d0\ub294 of\ub85c \uae30\uc5b5\ud558\uba74 \ud5f7\uac08\ub9ac\uc9c0 \uc54a\uc74c.\n\n## by \u2014 '\ubcc0\ud654\uc758 \ud3ed' (\uadf8\ub9cc\ud07c\uc758 \ucc28\uc774)\n\n\ubb34\uc5c7\uc774 \uc5bc\ub9c8\ub098 \ubcc0\ud588\ub294\uc9c0, \uadf8 \ubcc0\ud654\uc758 \ud06c\uae30(margin)\ub97c \ub098\ud0c0\ub0c4. \ub3c4\ucc29\ud55c \uac12\uc774 \uc544\ub2c8\ub77c '\uc774\ub3d9\ud55c \uac70\ub9ac'\ub97c \ub9d0\ud558\ub294 \uac10\uac01.\n\n1) fall/drop/increase by + \uc218\uce58\n   \uc124\uba85: by \ub4a4\uc5d0 \uc624\ub294 \uc22b\uc790\ub294 '\ubcc0\ud654\uc758 \uc591'\uc774\uc9c0 '\uacb0\uacfc\uac12'\uc774 \uc544\ub2d8. 27\ud37c\uc13c\ud2b8\ub9cc\ud07c \ub5a8\uc5b4\uc84c\ub2e4\ub294 \ub73b\uc774\uc9c0 27\ud37c\uc13c\ud2b8\uac00 \ub410\ub2e4\ub294 \ub73b\uc774 \uc544\ub2d8.\n   Ex) Truck numbers dipped notably, falling by almost 27 percent in the second year.\n\n## to \u2014 '\ubcc0\ud654 \ud6c4 \ub3c4\ucc29\ud55c \ucd5c\uc885 \uac12'\n\n\ubcc0\ud654\uac00 \ub05d\ub098\uace0 \ub3c4\ub2ec\ud55c \uacb0\uacfc\uac12(\ub3c4\ucc29\uc9c0)\uc744 \ub098\ud0c0\ub0c4. by\uc640 \uc815\ubc18\ub300\ub85c, '\uc5bc\ub9c8\ub098'\uac00 \uc544\ub2c8\ub77c '\uc5b4\ub514\uae4c\uc9c0'\ub97c \ub9d0\ud558\ub294 \uac10\uac01.\n\n1) fall/rise/halve to + \uc218\uce58\n   \uc124\uba85: to \ub4a4\uc5d0 \uc624\ub294 \uc22b\uc790\ub294 \ubcc0\ud654\uac00 \ub05d\ub09c \ub4a4\uc758 \ucd5c\uc885 \uc218\uce58\uc784.\n   Ex) Sweden's proportion had roughly halved to 35 percent.\n\n   \ube44\uad50) fell by 5 percent / fell to 5 percent\n   \uc124\uba85: \uc6d0\ub798 \uc218\uce58\uac00 30\ud37c\uc13c\ud2b8\uc600\ub2e4\uba74, fell by 5 percent\ub294 25\ud37c\uc13c\ud2b8\uac00 \ub41c \uac83\uc774\uace0 fell to 5 percent\ub294 5\ud37c\uc13c\ud2b8\uac00 \ub41c \uac83\uc774\ub77c \uacb0\uacfc\uac00 \uc644\uc804\ud788 \ub2e4\ub984. \ud5f7\uac08\ub9ac\uba74 \ubb38\uc7a5\uc758 \uc758\ubbf8 \uc790\uccb4\uac00 \ubc14\ub00c\ubbc0\ub85c \ubc18\ub4dc\uc2dc \uad6c\ubd84\ud574\uc57c \ud568.\n\n## over \u2014 '\uae30\uac04\uc5d0 \uac78\uccd0'\uc640 '~\ubcf4\ub2e4 \ub9ce\uc774', \ub450 \uac00\uc9c0 \uac10\uac01\n\n1) over + \uae30\uac04 \u2014 \uadf8 \uae30\uac04 \uc804\uccb4\uc5d0 \uac78\uccd0 (\ubcc0\ud654\uc758 \ud750\ub984\uc744 \uac15\uc870)\n   \uc124\uba85: \uc5b4\ub5a4 \uac12\uc774 \ud2b9\uc815 \uae30\uac04 \ub3d9\uc548 \uc810\uc9c4\uc801\uc73c\ub85c \ubcc0\ud574\uc654\ub2e4\ub294 \ud750\ub984\uc744 \uac15\uc870\ud560 \ub54c \uc500. \uadf8 \uae30\uac04 \uc804\uccb4\ub97c \ud558\ub098\uc758 \ud654\uc0b4\ud45c\ucc98\ub7fc \uad00\ud1b5\ud558\ub294 \uc774\ubbf8\uc9c0.\n   Ex) increased gradually over the 20-year period (O)\n   Ex) almost doubling over the three-year period (O)\n\n2) over + \uc218\uce58 \u2014 '~\uac00 \ub118\ub294'\uc774\ub77c\ub294 \ub73b\uc758 \uc218\uc2dd\uc5b4\n   \uc124\uba85: \uc774\ub54c over\ub294 \uae30\uac04\uc774 \uc544\ub2c8\ub77c \ub4a4\uc5d0 \uc624\ub294 \uc218\uce58\ub97c \uafb8\uba70\uc11c '\uadf8 \uc218\uce58\ubcf4\ub2e4 \ub9ce\uc774'\ub77c\ub294 \ub73b\uc774 \ub428. more than\uacfc \uac19\uc740 \uc5ed\ud560.\n   Ex) Traffic soared sharply by over 150 million in the last five years. (\uc5ec\uae30\uc11c over\ub294 150 million\uc744 \uc218\uc2dd\ud568, \uae30\uac04\uc774 \uc544\ub2d8)\n   Ex) growing by over two-thirds between the two years (\uc5ec\uae30\uc11c\ub3c4 over\ub294 two-thirds\ub97c \uc218\uc2dd\ud568)\n\n## over vs during vs between \u2014 \uae30\uac04\uc744 \ub098\ud0c0\ub0bc \ub54c\uc758 \ubbf8\ubb18\ud55c \ucc28\uc774\n\n1) over \u2014 \uc190\uac00\ub77d\uc73c\ub85c \uadf8\ub798\ud504 \uc120\uc744 \ucc98\uc74c\ubd80\ud130 \ub05d\uae4c\uc9c0 \ucb49 \ud6d1\ub294 \uc774\ubbf8\uc9c0\n   \uc124\uba85: \uadf8 \uae30\uac04\uc758 \uc2dc\uc791\uc810\ubd80\ud130 \ub05d\uc810\uae4c\uc9c0, \uc218\uce58\uac00 \uc624\ub974\ub0b4\ub824\uc628 \uada4\uc801 \uc804\uccb4\ub97c \uadf8\ub9bc. '\uae30\uac04 \ub0b4\ub0b4 \uc77c\uc5b4\ub09c \ubcc0\ud654'\ub97c \ud558\ub098\ub85c \ubb36\uc5b4\uc11c \ub9d0\ud560 \ub54c \uc500.\n   Ex) increased gradually over the 20-year period (20\ub144 \uc804\uccb4\ub97c \ud6d1\uc73c\uba70 \uadf8\ub9b0 \uc99d\uac00 \uada4\uc801)\n\n2) during \u2014 \uadf8 \uae30\uac04 \uc5b4\ub518\uac00\uc758 \ud55c \uc7a5\uba74\uc5d0 \uc2a4\ud3ec\ud2b8\ub77c\uc774\ud2b8\ub97c \ube44\ucd94\ub294 \uc774\ubbf8\uc9c0\n   \uc124\uba85: \uae30\uac04 \uc804\uccb4\uc758 \ud750\ub984\uc774 \uc544\ub2c8\ub77c, \uadf8 \uad6c\uac04 '\uc548\uc758 \uc5b4\ub290 \uc9c0\uc810'\uc5d0 \uc2a4\ud3ec\ud2b8\ub77c\uc774\ud2b8\ub97c \ube44\ucdb0\uc11c \ubb34\ub300\ub97c \uae54\uc544\uc8fc\ub294 \ub290\ub08c. that period \uc790\uccb4\uac00 \uc0ac\uac74\uc758 \uc8fc\uc778\uacf5\uc774 \uc544\ub2c8\ub77c \ubc30\uacbd\uc774 \ub428.\n   Ex) Motorcycle registrations varied consistently during the whole period, with peaks in 1995 and 1997. (\uadf8 \uae30\uac04\uc774\ub77c\ub294 \ubb34\ub300 \uc704\uc5d0\uc11c \ubc8c\uc5b4\uc9c4 \ubcc0\ub3d9)\n\n3) between \u2014 \ub450 \uc9c0\uc810\uc5d0 \uae43\ubc1c \ub450 \uac1c\ub9cc \uaf42\uc544\ub450\ub294 \uc774\ubbf8\uc9c0\n   \uc124\uba85: \uc2dc\uc791 \uae43\ubc1c\uacfc \ub05d \uae43\ubc1c\ub9cc \uaf42\uc544 '\uc774 \uc0ac\uc774'\ub77c\ub294 \ud2c0\uc744 \uc815\ud574\uc904 \ubfd0, over\ucc98\ub7fc \uadf8 \uc548\uc5d0\uc11c \uc5b4\ub5bb\uac8c \ubcc0\ud574\uc654\ub294\uc9c0 \uada4\uc801\uc744 \uadf8\ub9ac\uc9c0\ub294 \uc54a\uc74c. \ubcf4\ud1b5 between A and B \ud615\ud0dc\ub85c \ub450 \ub05d\uc810\uc744 \uba85\uc2dc\ud568.\n   Ex) There were significant changes in the volume of migration between 1990 and 2010. (1990\ub144\uacfc 2010\ub144\uc5d0 \uae43\ubc1c\uc744 \uaf42\uc544 \uadf8 \uc0ac\uc774 \uad6c\uac04\ub9cc \uc9c0\uc815)\n\n   \ube44\uad50) over the 20-year period (\uadf8 20\ub144\uc758 \uada4\uc801\uc744 \ucb49 \ud6d1\uc74c) / during the period (\uadf8 \uae30\uac04\uc774\ub77c\ub294 \ubb34\ub300 \uc704 \ud55c \uc7a5\uba74) / between 1990 and 2010 (\ub450 \uc9c0\uc810\uc5d0 \uae43\ubc1c\ub9cc \uaf42\uc544 \uad6c\uac04\uc744 \uc9c0\uc815 \u2014 \uada4\uc801\ub3c4 \ubb34\ub300\ub3c4 \uc544\ub2d8)\n\n## by\uc758 \ub610 \ub2e4\ub978 \ub73b \u2014 '\ubcc0\ud654\uc758 \ud3ed' vs '\ub9c8\uac10 \uc2dc\uc810'\n\n\uc124\uba85: \uc55e\uc11c \ub2e4\ub8ec by(\ubcc0\ud654\uc758 \ud3ed)\uc640 \ub2ec\ub9ac, by \ub4a4\uc5d0 \uc5f0\ub3c4\uac00 \uc624\uba74 '\uadf8 \uc2dc\uc810\uae4c\uc9c0\ub294'\uc774\ub77c\ub294 \ub9c8\uac10 \uae30\ud55c\uc758 \uc758\ubbf8\ub85c \uc500. \ub450 \ub73b\uc774 \ud5f7\uac08\ub9ac\uae30 \uc26c\uc6b0\ubbc0\ub85c \ubc18\ub4dc\uc2dc \uad6c\ubd84\ud574\uc57c \ud568.\n   Ex) Projections show that 25 percent of the population will fall into this category by 2050. (\ub9c8\uac10 \uc2dc\uc810 \u2014 '2050\ub144\uae4c\uc9c0\ub294')\n   Ex) The total of master's degree students, representing approximately nine percent in 1980, nearly quadrupled by 2000. (\ub9c8\uac10 \uc2dc\uc810)\n   \ube44\uad50) falling by almost 27 percent (\ubcc0\ud654\uc758 \ud3ed \u2014 '27\ud37c\uc13c\ud2b8\ub9cc\ud07c')\n\n## from ~ to ~ / between ~ and ~ \u2014 \ubc94\uc704\uc758 \uc2dc\uc791\uacfc \ub05d\n\n\uc124\uba85: \ub458 \ub2e4 \uc218\uce58\ub098 \uc5f0\ub3c4\uc758 '\ubc94\uc704'\ub97c \ub098\ud0c0\ub0b4\uc9c0\ub9cc \ub290\ub08c\uc774 \ub2e4\ub984. from ~ to ~\ub294 \ubcc0\ud654\uc758 \uc2dc\uc791\uac12\uc5d0\uc11c \ub05d\uac12\uae4c\uc9c0 \uc774\ub3d9\ud55c \uada4\uc801\uc744 \uadf8\ub9ac\uace0, between ~ and ~\ub294 \ub450 \uc2dc\uc810 \uc0ac\uc774\uc758 \uad6c\uac04 \uc790\uccb4\ub97c \uac00\ub9ac\ud0b4.\n   Ex) The number of Internet users in Denmark approximately doubled from 22,000 to 45,000. (\uc2dc\uc791\uac12 \u2192 \ub05d\uac12)\n   Ex) The proportion of workers hired in the agriculture sector decreased substantially from 33 percent in 1981 to 6 percent in 2011. (\uc2dc\uc791\uac12 \u2192 \ub05d\uac12)\n   Ex) There were significant changes in the volume of migration between 1990 and 2010. (\ub450 \uc2dc\uc810 \uc0ac\uc774\uc758 \uad6c\uac04)\n\n## between vs among \u2014 \ub300\uc0c1\uc774 \ub450 \uac1c\uc778\uc9c0 \uc14b \uc774\uc0c1\uc778\uc9c0\n\n\uc124\uba85: between\uc740 \uc815\ud655\ud788 \ub450 \uc9c0\uc810\uc774\ub098 \ub450 \ub300\uc0c1 \uc0ac\uc774\ub97c \uac00\ub9ac\ud0a4\uace0, among\uc740 \uc14b \uc774\uc0c1\uc758 \ub300\uc0c1 \uc0ac\uc774\uc758 \uad00\uacc4\u00b7\ube44\uad50\ub97c \ub098\ud0c0\ub0c4. from ~ to ~\uc640 between ~ and ~\ub294 \ub458 \ub2e4 '\ub450 \uac1c'\ub97c \uc804\uc81c\ub85c \ud558\ub294 \ud45c\ud604\uc774\ub77c, \ub300\uc0c1\uc774 \uc14b \uc774\uc0c1\uc774\uba74 among\uc73c\ub85c \ubc14\uafd4\uc57c \ud568.\n   Ex) growing by over two-thirds between the two years (\ub300\uc0c1 2\uac1c \u2014 between)\n   Ex) The gap in population among the three countries had widened by the end of the period. (\ub300\uc0c1 3\uac1c \u2014 among)\n\n\uc694\uc57d: \ub3d9\uc0ac \ub4a4\uc5d0\uc11c \ud2b9\uc815 \uc9c0\uc810\uc744 \uac00\ub9ac\ud0ac \ub550 at, \uc9c0\uc810\uc744 \ub73b\ud558\ub294 \uba85\uc0ac\ub97c \uad6c\uccb4\uc801 \uc218\uce58\ub85c \ud480 \ub550 of, \ubcc0\ud654\uc758 \ud3ed(\uc5bc\ub9c8\ub098)\uc740 by, \ubcc0\ud654\uc758 \ub3c4\ucc29\uac12(\uc5b4\ub514\uae4c\uc9c0)\uc740 to, \uae30\uac04\uc5d0 \uac78\uce5c \ud750\ub984\uc740 over, \ub9c8\uac10 \uc2dc\uc810\uc740 by(\uc5f0\ub3c4)\ub85c, \ub300\uc0c1\uc774 \ub458\uc774\uba74 between, \uc14b \uc774\uc0c1\uc774\uba74 among\uc73c\ub85c \ud45c\ud604\ud568.\n\n\u2501\u2501\u2501 \uc99d\uac00\ub97c \ub098\ud0c0\ub0bc \ub54c \uc4f0\ub294 \ud45c\ud604 \u2501\u2501\u2501\n\n1) \uc810\ucc28/\ube60\ub974\uac8c \uc99d\uac00\ud558\ub2e4 \u2014 \uc8fc\uc5b4 increase gradually/quickly\n   Ex) The number of public transit passengers increased gradually over the 20-year period.\n   \ub2e8\uc5b4: \ub300\uc911\uad50\ud1b5 public transit / \ud0d1\uc2b9\uac1d passenger\n\n2) \ub300\ub7b5/\uac70\uc758 \ub450 \ubc30\uac00 \ub418\ub2e4 \u2014 \uc8fc\uc5b4 approximately/almost double\n   Ex) The number of Internet users in Denmark approximately doubled from 22,000 to 45,000.\n\n3) \uc99d\uac00\uac00 \ub354\ub514\ub2e4/\ube60\ub974\ub2e4 \u2014 Growth is slow/fast\n   Ex) For UK tourists, growth was slow until 2013, when it started to increase dramatically.\n   \ub2e8\uc5b4: \uc5ec\ud589\uac1d tourist / \uadf9\uc801\uc73c\ub85c dramatically\n\n4) \ube60\ub974\uac8c/\uc2ec\ud558\uac8c \uc99d\uac00\ud558\ub2e4 \u2014 \uc8fc\uc5b4 rise rapidly/heavily\n   Ex) The amount of beef Brazil exported rose rapidly from 125,465 to 137,650 tons over the ten-year period.\n   \ub2e8\uc5b4: \uc218\ucd9c\ud558\ub2e4 export\n\n5) ~\uc73c\ub85c \uc815\uc810\uc5d0 \ub3c4\ub2ec\ud558\ub2e4 \u2014 \uc8fc\uc5b4 peak at ~\n   Ex) The number of students from China peaked at 320,000 in 2015, before falling considerably in the next year.\n   \ub2e8\uc5b4: \uc0c1\ub2f9\ud788 considerably\n\n6) -\uc5d0 ~\uc73c\ub85c \ucd5c\uace0\uc810\uc5d0 \ub3c4\ub2ec\ud558\ub2e4 \u2014 \uc8fc\uc5b4 reach the highest point of ~ in -\n   Ex) The number of US tourists traveling to the UK reached the highest point of 3.2 million in 2015.\n\n7) \uc77c\uc2dc\uc801\uc73c\ub85c/\uacc4\uc18d\ud574\uc11c \uc624\ub974\ub2e4 \u2014 \uc8fc\uc5b4 ascend temporarily/continually\n   Ex) In 2000, comedy ascended temporarily to the top spot, before falling in the following year.\n   \ub2e8\uc5b4: 1\uc704, \ucd5c\uace0\uc758 \uc790\ub9ac top spot / \uadf8\ub2e4\uc74c \ud574\uc5d0 in the following year\n\n8) \ube60\ub974\uac8c/\uadf9\uc801\uc73c\ub85c \uae09\uc99d\ud558\ub2e4 \u2014 \uc8fc\uc5b4 surge quickly/dramatically\n   Ex) Tram usage surged quickly from 2003 to 2005, almost doubling over the three-year period.\n   \ub2e8\uc5b4: \uc804\ucc28 tram / \ub450 \ubc30\uac00 \ub418\ub2e4 double\n\n9) \uc0c1\ub2f9\ud788/\uafb8\uc900\ud788 \uc99d\uac00\ud558\ub2e4 \u2014 \uc8fc\uc5b4 grow significantly/steadily\n   Ex) The economic contribution of students from overseas in the US grew significantly.\n   \ub2e8\uc5b4: \uacbd\uc81c\uc0c1\uc758, \uacbd\uc81c\uc758 economic / \uae30\uc5ec contribution\n\n10) \uae30\ud558\uae09\uc218\uc801\uc73c\ub85c/\uaf64 \uc99d\uac00\ud558\ub2e4 \u2014 \uc8fc\uc5b4 go up exponentially/moderately\n   Ex) Bus passenger numbers went up exponentially over the eight years from 2000, eventually reaching five times what they were at the start of the period.\n   \ub2e8\uc5b4: \uacb0\uad6d eventually\n\n11) \uae09\uaca9\ud788/\ub208\uc5d0 \ub744\uac8c \uce58\uc19f\ub2e4 \u2014 \uc8fc\uc5b4 soar sharply/remarkably\n   Ex) Traffic soared sharply by over 150 million in the last five years.\n   \ub2e8\uc5b4: \uad50\ud1b5\ub7c9 traffic\n\n12) \uc0c1\uc2b9 \ucd94\uc138\uac00 \ubcf4\uc5ec\uc9c0\ub2e4 \u2014 An upward/increasing trend is seen\n   Ex) An upward trend was seen in Mexico over the 40-year period, rapidly increasing in pace towards the end.\n   \ub2e8\uc5b4: \uc77c\uc815\ud55c \uc18d\ub3c4\ub85c in pace\n\n13) \uc0c1\ub2f9\ud788/\uac11\uc790\uae30 \uae09\uc99d\ud558\ub2e4 \u2014 \uc8fc\uc5b4 shoot up considerably/suddenly\n   Ex) The share of graduates in Portugal shot up considerably from its lowest point of 54 percent in 2005 to a peak of 95 percent in 2009.\n   \ub2e8\uc5b4: \uc878\uc5c5\uc0dd graduate\n\n\u2501\u2501\u2501 \ud558\ub77d\uc744 \ub098\ud0c0\ub0bc \ub54c \uc4f0\ub294 \ud45c\ud604 \u2501\u2501\u2501\n\n14) \ub208\uc5d0 \ub744\uac8c/\uadf9\ud788 \uc791\uac8c \ub5a8\uc5b4\uc9c0\ub2e4 \u2014 \uc8fc\uc5b4 dip notably/minimally\n   Ex) Truck numbers dipped notably, falling by almost 27 percent in the second year and continued to drop in subsequent years.\n\n15) \uc870\uae08/\uafb8\uc900\ud788 \ud558\ub77d\ud558\ub2e4 \u2014 \uc8fc\uc5b4 fall slightly/steadily\n   Ex) The number of US residents traveling to the UK remained at around 2.8 million in 2011 and 2012, but fell slightly in 2013.\n\n16) \uc11c\uc11c\ud788/\uaf64 \ud06c\uac8c \uac10\uc18c\ud558\ub2e4 \u2014 \uc8fc\uc5b4 decline slowly/sizably\n   Ex) Luxembourg's rate declined slowly from 24% to 13%, which was the largest decrease of all the countries in question.\n\n17) \uae09\uc18d\ud788/\uadfc\uc18c\ud558\uac8c \ud558\ub77d\ud558\ub2e4 \u2014 \uc8fc\uc5b4 drop rapidly/insignificantly\n   Ex) This figure dropped rapidly to 25 percent by 2011, a decrease of almost 50 percent compared to the original amount.\n\n18) \ub300\ub7b5/\uac70\uc758 \ubc18\uc73c\ub85c \uc904\ub2e4 \u2014 \uc8fc\uc5b4 roughly/nearly halve\n   Ex) Sweden's proportion had roughly halved to 35 percent, which was almost equal to Norway.\n   \ub2e8\uc5b4: \ube44\uc728 proportion / ~\uacfc \uac19\uc740 \uc218\uc900\uc778 equal to\n\n19) \uae09\uaca9\ud788/\uc870\uae08 \ub5a8\uc5b4\uc9c0\ub2e4 \u2014 \uc8fc\uc5b4 go down sharply/slightly\n   Ex) Iceland's percentage went down sharply to just under 20 percent.\n\n20) \ud06c\uac8c/\ube60\ub974\uac8c \ud3ed\ub77d\ud558\ub2e4 \u2014 \uc8fc\uc5b4 plummet remarkably/quickly\n   Ex) The proportion of people under the age of 15 plummeted remarkably during the second half of the period.\n   \ub2e8\uc5b4: \ud558\ubc18\uae30 second half\n\n21) ~\ub85c \ucd5c\uc800\uc810\uc5d0 \ub3c4\ub2ec\ud558\ub2e4 \u2014 \uc8fc\uc5b4 hit a low of ~\n   Ex) The number of UK travelers hit a low of three million in 2012 before increasing substantially over the next few years.\n   \ub2e8\uc5b4: \uc0c1\ub2f9\ud788 substantially\n\n22) \ub04a\uc784\uc5c6\uc774/\uac11\uc790\uae30 \uc904\uc5b4\ub4e4\ub2e4 \u2014 \uc8fc\uc5b4 shrink consistently/abruptly\n   Ex) The youngest age group was the only one to shrink consistently.\n   \ub2e8\uc5b4: \uc5f0\ub839\ub300 \uc9d1\ub2e8 age group\n\n23) \uc0c1\ub2f9\ud788/\ube60\ub974\uac8c/\uc810\ucc28 \uac10\uc18c\ud558\ub2e4 \u2014 \uc8fc\uc5b4 decrease substantially/quickly/gradually\n   Ex) The proportion of workers hired in the agriculture sector decreased substantially from 33 percent in 1981 to 6 percent in 2011.\n   \ub2e8\uc5b4: \ub18d\uc5c5 agriculture / \ubd84\uc57c sector\n\n\u2501\u2501\u2501 \ubcc0\ub3d9\uc744 \ub098\ud0c0\ub0bc \ub54c \uc4f0\ub294 \ud45c\ud604 \u2501\u2501\u2501\n\n24) -\ub144\uc758 \uae30\uac04 \ub3d9\uc548 \ubcc0\ub3d9\uc744 \uac70\ub4ed\ud558\ub2e4 \u2014 \uc8fc\uc5b4 fluctuate over the #-year period\n   Ex) The percentage of industrial workers fluctuated over the 20-year period.\n\n25) ~\uc5d0 \ud070 \ubcc0\ud654\uac00 \uc788\ub2e4 \u2014 There are significant changes in ~\n   Ex) There were significant changes in the volume of migration between 1990 and 2010.\n   \ub2e8\uc5b4: \uc591, \uc6a9\ub7c9 volume / \uc778\uad6c \uc774\ub3d9 migration\n\n26) \uc870\uae08\uc529\uc758 \ubcc0\ud654\uac00 \uc788\ub2e4 \u2014 There are some slight shifts\n   Ex) Sales figures were more or less stable in the three years, though there were some slight shifts.\n   \ub2e8\uc5b4: \uac70\uc758 more or less\n\n27) \uc9c0\uc18d\uc801\uc73c\ub85c/\uacc4\uc18d\ud574\uc11c \ubcc0\ud558\ub2e4 \u2014 \uc8fc\uc5b4 vary consistently/continuously\n   Ex) Motorcycle registrations varied consistently during the whole period, with peaks in 1995 and 1997, and a low in 2000.\n   \ub2e8\uc5b4: \uc624\ud1a0\ubc14\uc774 motorcycle / \ub4f1\ub85d \uac74\uc218 registration\n\n28) \uc5ec\ub7ec \ucc28\ub840 \uc624\ub974\ub0b4\ub9ac\ub2e4 \u2014 \uc8fc\uc5b4 go up and down several times\n   Ex) The percentages for resources and equipment went up and down several times.\n   \ub2e8\uc5b4: \uc7ac\ub8cc, \uc790\uc6d0 resource"

      "id": "task1-comparison-proportion-stability",
      "title": "Task 1 \u00b7 \ube44\uad50\u00b7\ube44\uc728\u00b7\uc548\uc815 \ud45c\ud604",
      "subtitle": "27\uac1c \ud45c\ud604",
      "text": "\u2501\u2501\u2501 \ube44\uad50\ub97c \ub098\ud0c0\ub0bc \ub54c \uc4f0\ub294 \ud45c\ud604 \u2501\u2501\u2501\n\n1) ~\uc640 \uac70\uc758/\ub300\ub7b5 \uac19\ub2e4 \u2014 \uc8fc\uc5b4 is nearly/roughly equal to ~\n   Ex) Adventure represented close to 15 percent, which was nearly equal to the profit rates of the three least popular genres combined.\n   \ub2e8\uc5b4: \ub098\ud0c0\ub0b4\ub2e4, \ub300\ud45c\ud558\ub2e4 represent / \uc774\uc775\ub960 profit rate / \ud569\uce58\ub2e4 combine\n\n2) \uc0c1\ub300\uc801\uc73c\ub85c \uade0\ub4f1\ud558\uac8c \ubd84\ud3ec\ub418\uc5b4 \uc788\ub2e4 \u2014 \uc8fc\uc5b4 is relatively evenly distributed\n   Ex) The proportions for both sexes in Norway and Finland were relatively evenly distributed.\n\n3) A\uac00 B\ubcf4\ub2e4 ~\ud558\ub2e4 \u2014 A is \ube44\uad50\uae09(higher/lower/more ~) than B\n   Ex) Advertising costs for televisions were higher than those for any other category.\n   \ub2e8\uc5b4: \uad11\uace0\ube44 advertising cost / \ubc94\uc8fc category\n\n4) A\uac00 \uac00\uc7a5 ~\ud558\ub2e4 \u2014 A is \ucd5c\uc0c1\uae09(the most common/the most popular/the highest)\n   Ex) Although the amount of bachelor's degree students decreased, it was still the most common degree at the end of the period.\n   \ub2e8\uc5b4: \ud559\uc0ac \ud559\uc704 bachelor's degree\n\n5) ~\uac00 \ub4a4\ub97c \uc774\uc5c8\ub2e4 \u2014 \uc8fc\uc5b4 followed by ~\n   Ex) The UK spent the most on health, at roughly 8 percent, followed by education at 6.4 percent.\n   \ub2e8\uc5b4: \uc9c0\ucd9c\ud558\ub2e4 spend / \uac74\uac15 health\n\n6) \ubc14\ub85c \ub4a4\ub97c \ub530\ub974\ub2e4 \u2014 \uc8fc\uc5b4+\ub3d9\uc0ac close behind\n   Ex) Chilean and Finnish men were close behind at roughly 60 percent, whilst South Africa was the lowest.\n   \ub2e8\uc5b4: ~\ud558\ub294 \ubc18\uba74\uc5d0 whilst\n\n7) \uaca9\ucc28\uac00 \ub113\uc5b4\uc9c0\ub2e4/\uc881\ud600\uc9c0\ub2e4 \u2014 The gap widens/narrows\n   Ex) The gap in population among the three countries had widened by the end of the period.\n   \ub2e8\uc5b4: \uaca9\ucc28, \uac2d gap\n\n8) ~\uc640 \ube44\uad50\ud574\uc11c \u2014 Compared to ~\n   Ex) Compared to the 2010 figure, the 2015 value was around 2.5 times higher.\n   \ub2e8\uc5b4: \uc218\uce58 figure\n\n9) \uadf8\uc5d0 \ubc18\ud574, \u2014 In/By contrast,\n   Ex) In contrast, the proportion of people visiting on tour was cut by more than half from 27 percent to 12 percent.\n   \ub2e8\uc5b4: \uc5ec\ud589 \uc911\uc5d0 on tour / ~\ub9cc\ud07c \uc904\ub2e4 cut by\n\n\u2501\u2501\u2501 \ube44\uc728\uc744 \ub098\ud0c0\ub0bc \ub54c \uc4f0\ub294 \ud45c\ud604 \u2501\u2501\u2501\n\n10) \ube44\uc2b7\ud55c \uacbd\ud5a5\uc774 \ubcf4\uc600\ub2e4 \u2014 A similar pattern/trend was seen\n   Ex) A similar pattern was seen on the lower end with refrigerators and washing machines, capturing just 6.78 percent and 6.04 percent of the total.\n   \ub2e8\uc5b4: \ub0c9\uc7a5\uace0 refrigerator / \ucc28\uc9c0\ud558\ub2e4, \uc7a1\ub2e4 capture\n\n11) \ubc18\uba74 \u2014 Whereas \uc8fc\uc5b4 + \ub3d9\uc0ac\n   Ex) Whereas there were only slight shifts in most categories, to visit on tour shrank considerably between the years.\n   \ub2e8\uc5b4: \uc870\uae08, \uc57d\uac04\uc758 slight shift\n\n12) ~\ub97c \ud569\ud55c \uac83\ubcf4\ub2e4 \ub354 ~\ud558\ub2e4 \u2014 \uc8fc\uc5b4 + \ub3d9\uc0ac + more than ~ combined\n   Ex) Brazil exported more beef than Japan, Switzerland, Norway, and Uruguay combined.\n   \ub2e8\uc5b4: \uc218\ucd9c\ud558\ub2e4 export\n\n13) \ub450\ub4dc\ub7ec\uc9c0\ub2e4 \u2014 \uc8fc\uc5b4 stand out\n   Ex) In the year 1995, it is drama that stands out as the most popular genre.\n\n14) ~\uc744 \ucc28\uc9c0\ud558\ub2e4 \u2014 \uc8fc\uc5b4 account for almost/roughly ~\n   Ex) The proportion of undergraduate students accounted for almost three-quarters of all students.\n   \ub2e8\uc5b4: \ud559\ubd80\uc0dd undergraduate student / 4\ubd84\uc758 3 three-quarters\n\n15) \ub300\ub7b5/\uac70\uc758 ~\uc5d0 \ud574\ub2f   // "id" is essayId + array-index -- stable regardless of how a view later sorts
  // the list for display, so highlights/stars always point at the right sentence.
  function essayIndexOf(essayId) {
    for (var i = 0; i < state.essays.length; i++) {
      if (state.essays[i].id === essayId) return i;
    }
    return -1;
  }

  function allEntries() {
    var out = [];
    state.essays.forEach(function (essay) {
      essay.entries.forEach(function (e, idx) {
        out.push(Object.assign({}, e, {
          id: essay.id + '-' + idx,
          essayId: essay.id,
          essayTitle: essay.title,
          date: essay.date
        }));
      });
    });
    return out;
  }

  // Finds where an entry's "wrong" excerpt sits inside the essay's original text,
  // so entries can be shown in the order the person actually wrote them —
  // not the order they happen to appear in the data array. Falls back to
  // progressively shorter prefixes in case the excerpt diverges from the raw
  // original (e.g. a typo was normalized when the excerpt was written).
  function essayOrderIndex(essay, entry) {
    if (!essay || !essay.originalText) return Infinity;
    var original = essay.originalText.replace(/\s+/g, ' ').toLowerCase();
    var wrong = entry.wrong.replace(/\s+/g, ' ').toLowerCase();
    for (var len = wrong.length; len >= 10; len -= 5) {
      var pos = original.indexOf(wrong.slice(0, len));
      if (pos !== -1) return pos;
    }
    return Infinity;
  }

  function countFor(catId) {
    return allEntries().filter(function (e) { return e.category === catId; }).length;
  }

  function parseRoute() {
    var h = window.location.hash;
    var mEssay = h.match(/^#\/essay\/(.+)$/);
    if (mEssay) return { type: 'essay', essayId: decodeURIComponent(mEssay[1]) };
    var mTag = h.match(/^#\/tag\/(.+)$/);
    if (mTag) return { type: 'tag', tag: decodeURIComponent(mTag[1]) };
    var mStars = h.match(/^#\/stars\/(\d)$/);
    if (mStars) return { type: 'stars', n: parseInt(mStars[1], 10) };
    var mWordsSection = h.match(/^#\/words\/([^/]+)\/(\d+)$/);
    if (mWordsSection) return { type: 'words', docId: decodeURIComponent(mWordsSection[1]), sectionIdx: parseInt(mWordsSection[2], 10) };
    var mWordsDoc = h.match(/^#\/words\/([^/]+)$/);
    if (mWordsDoc) return { type: 'words', docId: decodeURIComponent(mWordsDoc[1]) };
    var mWords = h.match(/^#\/words$/);
    if (mWords) return { type: 'words' };
    return { type: 'home' };
  }

  function render() {
    var route = parseRoute();
    document.body.classList.toggle('is-home', route.type === 'home');

    var catSection = document.getElementById('catSection');
    var essayHeaderWrap = document.getElementById('essayHeaderWrap');
    var guideArea = document.getElementById('guideArea');
    var listArea = document.getElementById('listArea');
    var entryTitle = document.getElementById('entryTitle');
    var entryCount = document.getElementById('entryCount');
    guideArea.innerHTML = '';

    if (route.type === 'essay') {
      catSection.style.display = 'none';
      renderEssayHeader(route.essayId);
      var essay = essayById(route.essayId);
      var list = essay ? essay.entries.map(function (e, idx) {
        return Object.assign({}, e, { id: essay.id + '-' + idx, essayId: essay.id, date: essay.date });
      }) : [];
      // reading order: as the sentences actually appear in what was written
      list.sort(function (x, y) { return essayOrderIndex(essay, x) - essayOrderIndex(essay, y); });
      entryTitle.textContent = essay ? essay.title + ' · 문장별 교정' : '문장별 교정';
      entryCount.textContent = list.length + '건';
      if (essay) guideArea.appendChild(buildNotesCard(essay));
      listArea.innerHTML = '';
      listArea.appendChild(buildEntriesEl(list));
    } else if (route.type === 'tag') {
      // focused page: category grid stays hidden, only the matching sentences show
      catSection.style.display = 'none';
      var cat = catById(route.tag);
      essayHeaderWrap.innerHTML = buildTagHeaderHtml(cat, route.tag);
      var taglist = allEntries().filter(function (e) { return e.category === route.tag; });
      // most recent first (same-date ties broken by essay recency, then position within the essay)
      taglist.sort(function (x, y) { return y.date.localeCompare(x.date) || essayIndexOf(y.essayId) - essayIndexOf(x.essayId); });
      entryTitle.textContent = (cat ? cat.label : route.tag) + ' 실수 목록';
      entryCount.textContent = taglist.length + '건';
      if (cat && Notes.get('cat-guide-' + cat.id, cat.guide)) {
        guideArea.appendChild(buildCategoryGuideCard(cat));
      }
      listArea.innerHTML = '';
      listArea.appendChild(buildEntriesEl(taglist, true));
    } else if (route.type === 'stars') {
      catSection.style.display = 'none';
      essayHeaderWrap.innerHTML = buildStarsHeaderHtml(route.n);
      var starlist = allEntries().filter(function (e) { return Stars.get(e.id) === route.n; });
      starlist.sort(function (x, y) { return y.date.localeCompare(x.date) || essayIndexOf(y.essayId) - essayIndexOf(x.essayId); });
      entryTitle.textContent = '별 ' + route.n + '개 표시한 문장';
      entryCount.textContent = starlist.length + '건';
      listArea.innerHTML = '';
      listArea.appendChild(buildEntriesEl(starlist, true));
    } else if (route.type === 'words') {
      catSection.style.display = 'none';
      listArea.innerHTML = '';
      if (route.docId == null) {
        // Level 1: grid of saved word/expression docs -- the "second home screen"
        essayHeaderWrap.innerHTML =
          '<div class="essay-header">' +
            '<div>' +
              '<div class="meta-line">표현집</div>' +
              '<h3>저장한 표현집</h3>' +
              '<a href="#/" class="back">← 홈으로</a>' +
            '</div>' +
          '</div>';
        entryTitle.textContent = '표현집 목록';
        entryCount.textContent = (state.wordDocs || []).length + '개';
        var wdGrid = document.createElement('div');
        wdGrid.className = 'cat-grid';
        wdGrid.innerHTML = (state.wordDocs || []).map(function (doc) {
          var docSections = splitNotesSections(Notes.get('worddoc-' + doc.id, doc.text));
          return '<a class="cat-card" href="#/words/' + encodeURIComponent(doc.id) + '">' +
            '<div class="top-row">' +
              '<div class="eyebrow">WORD DOC</div>' +
              '<span class="pill" style="background:#f4f4f5;color:#6b7076">' + docSections.length + '개 그룹</span>' +
            '</div>' +
            '<div class="label">' + escapeHtml(doc.title) + '</div>' +
            '<div class="desc">' + escapeHtml(doc.subtitle || '') + '</div>' +
            '<div class="bottom-row">' +
              '<span class="pill" style="background:#f4f4f5;color:#6b7076">표현집</span>' +
              '<span class="arrow">' + ARROW_SVG + '</span>' +
            '</div>' +
          '</a>';
        }).join('');
        listArea.appendChild(wdGrid);
      } else {
        var wdoc = findWordDoc(route.docId);
        if (!wdoc) {
          essayHeaderWrap.innerHTML = '<div class="empty">표현집을 찾을 수 없음.</div>';
        } else {
          var wdText = Notes.get('worddoc-' + wdoc.id, wdoc.text);
          var wdSections = splitNotesSections(wdText);
          if (route.sectionIdx == null) {
            // Level 2: grid of this doc's groups (증가/하락/변동/전치사 등)
            essayHeaderWrap.innerHTML =
              '<div class="essay-header">' +
                '<div>' +
                  '<div class="meta-line">' + escapeHtml(wdoc.subtitle || '표현집') + '</div>' +
                  '<h3>' + escapeHtml(wdoc.title) + '</h3>' +
                  '<a href="#/words" class="back">← 표현집 목록으로</a>' +
                '</div>' +
              '</div>';
            entryTitle.textContent = wdoc.title + ' · 그룹 목록';
            entryCount.textContent = wdSections.length + '개 그룹';
            var secGrid = document.createElement('div');
            secGrid.className = 'cat-grid';
            secGrid.innerHTML = wdSections.map(function (sec, idx) {
              var itemCount = (sec.body.match(/^\d+\)\s+/gm) || []).length;
              return '<a class="cat-card" href="#/words/' + encodeURIComponent(wdoc.id) + '/' + idx + '">' +
                '<div class="top-row" style="justify-content:flex-end">' +
                  '<span class="pill" style="background:#f4f4f5;color:#6b7076">' + itemCount + '개</span>' +
                '</div>' +
                '<div class="label">' + escapeHtml(sec.title || '(제목 없음)') + '</div>' +
                '<div class="bottom-row">' +

                '</div>' +
              '</a>';
            }).join('');
            listArea.appendChild(secGrid);
          } else {
            // Level 3: the actual expression cards for one group
            var wsec = wdSections[route.sectionIdx];
            essayHeaderWrap.innerHTML =
              '<div class="essay-header">' +
                '<div>' +
                  '<div class="meta-line">' + escapeHtml(wdoc.title) + '</div>' +
                  '<h3>' + escapeHtml(wsec ? wsec.title : '') + '</h3>' +
                  '<a href="#/words/' + encodeURIComponent(wdoc.id) + '" class="back">← ' + escapeHtml(wdoc.title) + '로</a>' +
                '</div>' +
              '</div>';
            var wItemCount = wsec ? (wsec.body.match(/^\d+\)\s+/gm) || []).length : 0;
            entryTitle.textContent = wsec ? wsec.title + ' · 표현 목록' : '';
            entryCount.textContent = wItemCount + '개';
            if (wsec) {
              var wBaseId = 'worddoc-' + wdoc.id + '-notes';
              var wField = 'notes-' + route.sectionIdx;
              var wHl = Highlights.get(wBaseId, wField);
              var wCard = document.createElement('div');
              wCard.className = 'worddoc-card';
              wCard.innerHTML =
                '<div class="notes-content"><div class="notes-section"><div class="notes-section-body hl-zone" data-entry-id="' +
                  escapeHtml(wBaseId) + '" data-field="' + wField + '">' +
                  renderNotesBody(wsec.body, wHl) +
                '</div></div></div>';
              listArea.appendChild(wCard);
            }
          }
        }
      }
    } else {
      catSection.style.display = '';
      essayHeaderWrap.innerHTML = '';
      renderCategoryGrid(null);

      entryTitle.textContent = '기록한 글';
      entryCount.textContent = state.essays.length + '개';
      listArea.innerHTML = '';
      listArea.appendChild(buildEssayGridEl(state.essays, null));
    }

    var dates = allEntries().map(function (e) { return e.date; }).sort();
    document.getElementById('lastUpdated').textContent = dates.length ? ('last entry · ' + dates[dates.length - 1]) : '';
    // Deferred to the next frame so the browser can paint the route-change
    // (and the hero collapse/expand transition) before doing this layout-
    // reading work -- otherwise the getBoundingClientRect calls inside run
    // synchronously in the same tick as the DOM rebuild and visibly stall
    // the first frame of the transition.
    requestAnimationFrame(function () {
      positionCorrectionNotes(guideArea);
      positionCorrectionNotes(listArea);
    });
    updateNavButtons();
    document.querySelectorAll('.starnav-btn').forEach(function (btn) {
      var n = parseInt(btn.getAttribute('data-n'), 10);
      btn.classList.toggle('active', route.type === 'stars' && route.n === n);
    });
  }

  function buildTagHeaderHtml(cat, tagId) {
    return (
      '<div class="essay-header">' +
        '<div>' +
          '<div class="meta-line">' + (cat ? cat.eyebrow : '') + '</div>' +
          '<h3>' + escapeHtml(cat ? cat.label : tagId) + '</h3>' +
          '<a href="#/" class="back">← 전체 글 목록으로</a>' +
        '</div>' +
      '</div>'
    );
  }

  function buildStarsHeaderHtml(n) {
    var stars = '';
    for (var i = 0; i < 3; i++) stars += starIconSvg(i < n);
    return (
      '<div class="essay-header">' +
        '<div>' +
          '<h3 style="display:flex;gap:4px;align-items:center">' +
            '<span style="display:flex;gap:3px">' + stars.replace(/<svg/g, '<svg style="width:20px;height:20px"') + '</span>' +
          '</h3>' +
          '<a href="#/" class="back">← 전체 글 목록으로</a>' +
        '</div>' +
      '</div>'
    );
  }

  // Internal-only back/forward: a stack of hashes visited inside this site.
  // Deliberately NOT window.history.back()/forward() -- that could walk past
  // the very first visit and leave the site entirely (e.g. back to whatever
  // page linked here). On first load, both buttons start disabled.
  var navStack = [window.location.hash || '#/'];
  var navIndex = 0;
  var isProgrammaticNav = false;

  function navBack() {
    if (navIndex <= 0) return;
    navIndex--;
    isProgrammaticNav = true;
    window.location.hash = navStack[navIndex];
  }
  function navForward() {
    if (navIndex >= navStack.length - 1) return;
    navIndex++;
    isProgrammaticNav = true;
    window.location.hash = navStack[navIndex];
  }
  function onHashChangeForNav() {
    var hash = window.location.hash || '#/';
    if (isProgrammaticNav) {
      isProgrammaticNav = false; // this change came from navBack/navForward -- stack already points at it
    } else {
      // a real navigation (clicking a link inside the site) -- drop any
      // "forward" entries and record this as a new step
      navStack = navStack.slice(0, navIndex + 1);
      if (navStack[navStack.length - 1] !== hash) {
        navStack.push(hash);
        navIndex = navStack.length - 1;
      }
    }
    updateNavButtons();
  }

  document.getElementById('navBack').addEventListener('click', navBack);
  document.getElementById('navForward').addEventListener('click', navForward);
  function updateNavButtons() {
    document.getElementById('navBack').disabled = navIndex <= 0;
    document.getElementById('navForward').disabled = navIndex >= navStack.length - 1;
  }

  function renderCategoryGrid(activeTag) {
    var grid = document.getElementById('catGrid');
    document.getElementById('catCount').textContent = state.categories.length + '개';
    grid.innerHTML = state.categories.map(function (c) {
      var active = c.id === activeTag ? ' active' : '';
      var color = colorFor(c.id);
      var n = countFor(c.id);
      return (
        '<a class="cat-card' + active + '" href="#/tag/' + encodeURIComponent(c.id) + '">' +
          '<div class="top-row">' +
            '<div class="eyebrow">' + c.eyebrow + '</div>' +
            '<span class="pill" style="background:' + color.bg + ';color:' + color.fg + '">' + n + '건</span>' +
          '</div>' +
          '<div class="label">' + c.label + '</div>' +
          '<div class="desc">' + c.description + '</div>' +
          '<div class="bottom-row">' +
            '<span class="pill" style="background:#f4f4f5;color:#6b7076">최근 ' + (lastDateFor(c.id) || '—') + '</span>' +
            '<span class="arrow">' + ARROW_SVG + '</span>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  }

  function lastDateFor(id) {
    var dates = allEntries().filter(function (e) { return e.category === id; }).map(function (e) { return e.date; }).sort();
    if (!dates.length) return null;
    return dates[dates.length - 1].slice(5).replace('-', '.');
  }

  function renderEssayHeader(essayId) {
    var essay = essayById(essayId);
    var wrap = document.getElementById('essayHeaderWrap');
    if (!essay) { wrap.innerHTML = '<div class="empty">글을 찾을 수 없음.</div>'; return; }

      .map(function (p) { return '<p>' + escapeHtml(p.trim()) + '</p>'; })

    var imageBlock = essay.image
      ? '<div class="block">' +

          questionHtml +

        imageBlock +

  function buildEssayGridEl(essays, activeTag) {
    var grid = document.createElement('div');
    grid.className = 'essay-grid';
    if (!essays.length) {
      grid.innerHTML = '<div class="empty">아직 기록된 글이 없음.</div>';
      return grid;
    }
    essays
      .map(function (essay, idx) { return { essay: essay, idx: idx }; })
      .sort(function (a, b) {
        var byDate = b.essay.date.localeCompare(a.essay.date);
        if (byDate !== 0) return byDate;
        return b.idx - a.idx; // same date: more recently added (later in the array) comes first
      })
      .map(function (x) { return x.essay; })
      .forEach(function (essay) {
      var cats = {};
      essay.entries.forEach(function (e) { cats[e.category] = (cats[e.category] || 0) + 1; });
      var tagRow = Object.keys(cats).map(function (catId) {
        var c = catById(catId);
        var color = colorFor(catId);
        var count = activeTag && catId === activeTag ? cats[catId] : null;
        return '<span class="pill" style="background:' + color.bg + ';color:' + color.fg + '">' +
          (c ? c.label : catId) + (count ? ' · ' + count + '건' : '') + '</span>';
      }).join('');

      var card = document.createElement('a');
      card.className = 'essay-card';
      card.href = '#/essay/' + encodeURIComponent(essay.id);
      card.innerHTML =
        '<div>' +
          '<div class="meta-line">' + essay.date + ' · ' + essay.entries.length + '건 교정</div>' +
          '<div class="title">' + escapeHtml(essay.title) + '</div>' +
          '<div class="tag-row">' + tagRow + '</div>' +
        '</div>' +
        '<div class="score">' +
          '<div class="num">' + escapeHtml(String(essay.score)) + '</div>' +
          '<div class="lbl">EST. BAND</div>' +
        '</div>';
      grid.appendChild(card);
    });
    return grid;
  }

  function buildEntriesEl(list, showEssayLink) {
    var wrap = document.createElement('div');

    if (!list.length) {

      var c = catById(e.category);
      var color = colorFor(e.category);

        ? '<a class="meta-essaylink" href="#/essay/' + encodeURIComponent(e.essayId) + '">' + escapeHtml(e.essayTitle || '') + '</a>'
        : '';

        [1, 2, 3].map(function (n) {
          return '<button type="button" data-star-entry="' + escapeHtml(entryId) + '" data-star-n="' + n + '" aria-label="별 ' + n + '개">' + starIconSvg(n <= rating) + '</button>';
        }).join('') +

      return (
        '<div class="entry" data-entry-id="' + escapeHtml(entryId) + '">' +

              '<a class="tag" href="#/tag/' + encodeURIComponent(e.category) + '" style="background:' + color.bg + ';color:' + color.fg + '">' + (c ? c.label : e.category) + '</a>' +
              starsHtml +
            '</div>' +
            essayLink +
          '</div>' +
          '<div class="body">' +
            buildWrongBlock(entryId, e.wrong, e.correct) +
            '<div class="explanation hl-zone" data-entry-id="' + escapeHtml(entryId) + '" data-field="explanation">' +
              renderAnnotatedText(e.explanation, explHl, null, null) +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    return wrap;

  // Splits a notes string into titled sections using "━━━ 제목 ━━━" divider
  // lines (already used as the authoring convention in the notes text).
  // Any text before the first divider becomes an untitled leading section.
  function splitNotesSections(text) {
    var titleRe = /^━+\s*(.+?)\s*━+\s*$/;
    var lines = text.split('\n');
    var sections = [];
    var current = null;
    lines.forEach(function (line) {
      var m = line.match(titleRe);
      if (m) {
        current = { title: m[1], bodyLines: [] };
        sections.push(current);
      } else {
        if (!current) { current = { title: '', bodyLines: [] }; sections.push(current); }
        current.bodyLines.push(line);
      }
    });
    return sections.map(function (s) {
      return { title: s.title, body: s.bodyLines.join('\n').replace(/^\n+|\n+$/g, '') };
    }).filter(function (s) { return s.title || s.body; });
  }

  // Renders a section's body with a hanging indent: each raw line's own
  // leading whitespace + list marker ("- ", "1) ", "Ex) ", "설명:", "요약:",
  // "→ " ...) becomes a fixed-width label, and the rest of the line wraps
  // underneath itself (not back to the far left) when it's too long to fit.
  // Blank lines in the source just become gaps between "blocks" of lines.
  // A line starting with "## " is a sub-heading *within* the same box (unlike
  // "━━━ 제목 ━━━", which starts a whole new box) -- useful for grouping
  // several related rule-sets under one umbrella box.
  var NOTES_MARKER_RE = /^(-\s+|\d+\)\s+|Ex\)\s+|비교\s?예시:\s*|비교\)\s+|예시\s?오류:\s*|요약:\s*|설명:\s*|단어:\s*|→\s*)/;
  var NOTES_SUBHEAD_RE = /^##\s*(.+)$/;

  // Classifies a matched marker so callers (mainly the word-doc modal's CSS)
  // can style e.g. an "Ex)" example line differently from a "단어:" vocab
  // line, without the renderer itself knowing anything about that styling.
  function markerType(marker) {
    if (!marker) return 'plain';
    if (/^-\s*/.test(marker)) return 'dash';
    if (/^\d+\)/.test(marker)) return 'num';
    if (/^Ex\)/.test(marker)) return 'ex';
    if (/^단어:/.test(marker)) return 'vocab';
    if (/^설명:/.test(marker)) return 'desc';
    if (/^요약:/.test(marker)) return 'summary';
    if (/^비교/.test(marker)) return 'compare';
    if (/^예시\s?오류:/.test(marker)) return 'wrongex';
    if (/^→/.test(marker)) return 'arrow';
    return 'plain';
  }

  function renderNotesBody(bodyText, hlRanges) {
    hlRanges = hlRanges || [];
    var rawLines = bodyText.split('\n');

    // A "## 제목" line is always a sub-heading, regardless of whether the
    // source text happens to have blank lines around it -- author formatting
    // is inconsistent (a "## " line sometimes butts right up against a list
    // item with no blank line between), so detection is per-line, not
    // dependent on the line being isolated in its own blank-line-separated
    // block. Needed up front because a sub-heading's *visible* text (its
    // title, "## " stripped) is shorter than its raw text, and every offset
    // after it must account for that difference or highlights on later
    // lines land in the wrong spot.
    var isSubheadLine = {};
    rawLines.forEach(function (line, i) {
      if (NOTES_SUBHEAD_RE.test(line)) isSubheadLine[i] = true;
    });

    var lineInfos = [];
    var offset = 0;
    rawLines.forEach(function (line, i) {
      var visibleText = isSubheadLine[i] ? line.match(NOTES_SUBHEAD_RE)[1] : line;
      var start = offset;
      var end = start + visibleText.length;
      lineInfos.push({ text: line, visibleText: visibleText, start: start, end: end });
      offset = end; // no text node represents the '\n' itself in the rendered DOM
    });

    // Grouped by blank lines as usual, but a "## " sub-heading line always
    // breaks out into its own isolated block first (even mid-block, with no
    // blank line on either side) so the sub-heading styling below always
    // applies to it.
    var lineBlocks = [];
    var current = [];
    lineInfos.forEach(function (li, i) {
      if (li.text === '') {
        if (current.length) { lineBlocks.push(current); current = []; }
        return;
      }
      if (isSubheadLine[i]) {
        if (current.length) { lineBlocks.push(current); current = []; }
        lineBlocks.push([li]);
        return;
      }
      current.push(li);
    });
    if (current.length) lineBlocks.push(current);

    return lineBlocks.map(function (block) {
      // A block that's just a single "## 제목" line renders as a sub-heading,
      // not as a hanging-indent line.
      if (block.length === 1) {
        var soleMatch = block[0].text.match(NOTES_SUBHEAD_RE);
        if (soleMatch) {
          var li0 = block[0];
          var headHl = hlRanges
            .filter(function (r) { return r.start < li0.end && r.end > li0.start; })
            .map(function (r) { return { start: Math.max(r.start, li0.start) - li0.start, end: Math.min(r.end, li0.end) - li0.start, note: r.note }; });
          return '<div class="notes-subhead">' + renderAnnotatedText(soleMatch[1], headHl, null, null, li0.start) + '</div>';
        }
      }
      var linesHtml = block.map(function (li) {
        var wsMatch = li.text.match(/^\s*/);
        var leadingWs = wsMatch[0];
        var afterWs = li.text.slice(leadingWs.length);
        var markerMatch = afterWs.match(NOTES_MARKER_RE);
        var marker = markerMatch ? markerMatch[0] : '';
        var labelText = leadingWs + marker;
        var contentText = afterWs.slice(marker.length);

        var lineHl = hlRanges
          .filter(function (r) { return r.start < li.end && r.end > li.start; })
          .map(function (r) { return { start: Math.max(r.start, li.start) - li.start, end: Math.min(r.end, li.end) - li.start, note: r.note }; });
        var labelHl = lineHl
          .filter(function (r) { return r.start < labelText.length; })
          .map(function (r) { return { start: r.start, end: Math.min(r.end, labelText.length), note: r.note }; });
        var contentHl = lineHl
          .filter(function (r) { return r.end > labelText.length; })
          .map(function (r) { return { start: Math.max(r.start, labelText.length) - labelText.length, end: r.end - labelText.length, note: r.note }; });

        var labelSpan = labelText
          ? '<span class="notes-line-label">' + renderAnnotatedText(labelText, labelHl, null, null, li.start) + '</span>'
          : '';
        var textSpan = '<span class="notes-line-text">' + renderAnnotatedText(contentText, contentHl, null, null, li.start + labelText.length) + '</span>';

        return '<div class="notes-line" data-marker="' + markerType(marker) + '">' + labelSpan + textSpan + '</div>';
      }).join('');
      return '<div class="notes-block">' + linesHtml + '</div>';
    }).join('');
  }

  // "알아두기" -- a free-form note attached to the whole essay (not one sentence),
  // shown at the bottom of the essay page. Each "━━━ 제목 ━━━" block renders as
  // its own bordered box with a unified title style; highlighting AND star
  // rating both work per box (their own entry id / field, independent of
  // the other boxes in the same card).
  function buildNotesCard(essay) {
    var baseId = essay.id + '-notes';
    var text = Notes.get(essay.id, essay.notes);
    var card = document.createElement('div');
    card.className = 'notes-card';
    card.setAttribute('data-essay-id', essay.id);

    var bodyHtml;
    if (!text) {
      bodyHtml = '<div class="notes-content"><span class="notes-placeholder">아직 작성한 메모가 없음 — 편집 아이콘을 눌러 추가할 수 있음.</span></div>';
    } else {
      var sections = splitNotesSections(text);
      bodyHtml = '<div class="notes-content">' +
        sections.map(function (sec, idx) {
          var field = 'notes-' + idx;
          var hl = Highlights.get(baseId, field);
          var sectionEntryId = baseId + '-' + idx;
          var rating = Stars.get(sectionEntryId);
          var starsHtml = '<div class="stars">' +
            [1, 2, 3].map(function (n) {
              return '<button type="button" data-star-entry="' + escapeHtml(sectionEntryId) + '" data-star-n="' + n + '" aria-label="별 ' + n + '개">' + starIconSvg(n <= rating) + '</button>';
            }).join('') +
            '</div>';
          var titleHtml = sec.title ? '<div class="notes-section-title">' + escapeHtml(sec.title) + '</div>' : '<div class="notes-section-title notes-section-title-empty"></div>';
          return '<div class="notes-section">' +
            '<div class="notes-section-head">' +
              titleHtml +
              starsHtml +
            '</div>' +
            '<div class="notes-section-body hl-zone" data-entry-id="' + escapeHtml(baseId) + '" data-field="' + field + '">' +
              renderNotesBody(sec.body, hl) +
            '</div>' +
          '</div>';
        }).join('') +
        '</div>';
    }

    card.innerHTML =
      '<div class="notes-head">' +
        '<div class="eyebrow">알아두기</div>' +
        '<div class="notes-head-right">' +
          '<button type="button" class="notes-edit-btn" aria-label="편집">' +
            '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15v5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      bodyHtml;
    return card;
  }

  // "문법 가이드" -- an optional reference block attached to a whole category
  // (not one essay), shown above the sentence list on a category page.
  // Each "━━━ 제목 ━━━" box (e.g. "5형식 정리") renders collapsed as a small
  // clickable chip by default -- click it to expand and read the content.
  // This keeps the category page short even as more guides (형식 정리 등) pile
  // up over time. Reuses the same hanging-indent line rendering as
  // buildNotesCard, and the same edit/save wiring (its id is namespaced with
  // "cat-guide-" so it doesn't collide with any essay id). No star rating --
  // Which guide/doc chips are expanded, keyed by "<baseId>::<sectionIdx>".
  // Purely in-memory UI state (not persisted to storage) -- but it must
  // survive a render() call, since render() runs after every highlight/star
  // change and otherwise every chip would snap back to collapsed the moment
  // the person tried to highlight something inside an expanded one.
  var guideSectionExpanded = {};

  // Shared by category "문법 가이드" cards and the word-doc modal: renders a
  // "━━━ 제목 ━━━"-delimited text as a stack of collapsible chip boxes (click
  // the title row to expand/collapse). Returns the inner HTML for a
  // ".notes-content" wrapper's children (the caller supplies the wrapper).
  function buildCollapsibleSectionsHtml(baseId, text) {
    if (!text) {
      return '<span class="notes-placeholder">아직 작성한 내용이 없음 — 편집 아이콘을 눌러 추가할 수 있음.</span>';
    }
    var sections = splitNotesSections(text);
    return sections.map(function (sec, idx) {
      var field = 'notes-' + idx;
      var hl = Highlights.get(baseId, field);
      var titleHtml = sec.title ? '<div class="notes-section-title">' + escapeHtml(sec.title) + '</div>' : '<div class="notes-section-title notes-section-title-empty"></div>';
      var chevron = '<svg class="notes-section-chevron" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      var expanded = !!guideSectionExpanded[baseId + '::' + idx];
      return '<div class="notes-section collapsible' + (expanded ? '' : ' is-collapsed') + '" data-guide-idx="' + idx + '">' +
        '<div class="notes-section-head">' + titleHtml + chevron + '</div>' +
        '<div class="notes-section-body hl-zone" data-entry-id="' + escapeHtml(baseId) + '" data-field="' + field + '">' +
          renderNotesBody(sec.body, hl) +
        '</div>' +
      '</div>';
    }).join('');
  }

  function buildCategoryGuideCard(cat) {
    var guideId = 'cat-guide-' + cat.id;
    var baseId = guideId + '-notes';
    var text = Notes.get(guideId, cat.guide);
    var card = document.createElement('div');
    card.className = 'notes-card guide-card';
    card.setAttribute('data-essay-id', guideId);
    card.innerHTML =
      '<div class="notes-head">' +
        '<div class="eyebrow">문법 가이드</div>' +
        '<div class="notes-head-right">' +
          '<button type="button" class="notes-edit-btn" aria-label="편집">' +
            '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15v5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="notes-content">' + buildCollapsibleSectionsHtml(baseId, text) + '</div>';
    return card;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ---------------------------------------------------------------
  // Highlight interaction: drag-select text inside a .hl-zone -> a small
  // "하이라이트" button appears -> click it to mark that range hot pink.
  // Click an existing mark -> "메모"/"삭제" buttons appear; "메모" opens the
  // small floating textarea below (memoPanel) to attach a note to that
  // specific highlight (shown afterwards as a tooltip + a small dot marker).
  // ---------------------------------------------------------------
  var popupEl = null;
  function ensurePopup() {
    if (!popupEl) {
      popupEl = document.createElement('div');
      popupEl.className = 'hl-popup';
      popupEl.style.display = 'none';
      document.body.appendChild(popupEl);
    }
    return popupEl;
  }

  var memoPanelEl = null;
  var memoState = null; // { entryId, field, start, end }
  function ensureMemoPanel() {
    if (!memoPanelEl) {
      memoPanelEl = document.createElement('div');
      memoPanelEl.className = 'hl-memo-panel';
      memoPanelEl.hidden = true;
      memoPanelEl.innerHTML =
        '<textarea class="hl-memo-textarea" placeholder="메모를 남겨보세요"></textarea>' +
        '<div class="hl-memo-actions">' +
          '<button type="button" class="hl-memo-cancel">취소</button>' +
          '<button type="button" class="hl-memo-save">저장</button>' +
        '</div>';
      document.body.appendChild(memoPanelEl);
      memoPanelEl.querySelector('.hl-memo-cancel').addEventListener('click', function (ev) {
        ev.stopPropagation();
        closeMemoPanel();
      });
      memoPanelEl.querySelector('.hl-memo-save').addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!memoState) return;
        var text = memoPanelEl.querySelector('.hl-memo-textarea').value.trim();
        Highlights.setNote(memoState.entryId, memoState.field, memoState.start, memoState.end, text);
        closeMemoPanel();
        render();
      });
    }
    return memoPanelEl;
  }
  function openMemoPanel(rect, entryId, field, start, end, currentNote) {
    var panel = ensureMemoPanel();
    memoState = { entryId: entryId, field: field, start: start, end: end };
    panel.querySelector('.hl-memo-textarea').value = currentNote || '';
    panel.hidden = false;
    // Positioned in document coordinates (rect + scroll offset) rather than
    // viewport coordinates, so the panel scrolls together with the highlight
    // it's attached to instead of staying pinned to the same spot on screen.
    var top = rect.bottom + 10 + window.scrollY;
    var left = Math.min(Math.max(rect.left, 8), window.innerWidth - 268) + window.scrollX;
    panel.style.top = top + 'px';
    panel.style.left = left + 'px';
    panel.querySelector('.hl-memo-textarea').focus();
  }
  function closeMemoPanel() {
    memoState = null;
    if (memoPanelEl) memoPanelEl.hidden = true;
  }

  var memoViewEl = null;
  // The dot <button> the currently-open memo view is anchored to (null when
  // closed). Kept around so positionMemoView() can re-measure the dot's live
  // position on resize instead of relying on a rect captured once at open time.
  var memoViewAnchorEl = null;
  function ensureMemoView() {
    if (!memoViewEl) {
      memoViewEl = document.createElement('div');
      memoViewEl.className = 'hl-memo-view';
      memoViewEl.hidden = true;
      document.body.appendChild(memoViewEl);
    }
    return memoViewEl;
  }
  // Anchor point is the dot's own top-right corner: the memo rectangle's
  // bottom-left corner sits there (with a small gap so it doesn't cover the
  // dot). Re-run on resize (see the window resize listener below) so the
  // panel tracks the dot's live on-screen position instead of staying at
  // whatever document coordinates were computed when it was first opened --
  // that mismatch is what made it look "stuck" oddly after a window resize.
  function positionMemoView() {
    if (!memoViewEl || memoViewEl.hidden || !memoViewAnchorEl) return;
    var rect = memoViewAnchorEl.getBoundingClientRect();
    var top = rect.top + window.scrollY - memoViewEl.offsetHeight - 8;
    var left = Math.min(rect.right, window.innerWidth - 500 - 12) + window.scrollX;
    memoViewEl.style.top = top + 'px';
    memoViewEl.style.left = left + 'px';
  }
  // Read-only callout shown when the small red dot on a highlight is
  // clicked. Its "수정" button hands off to the same openMemoPanel() editor
  // used from the highlight's own click menu, so there's one edit flow.
  function openMemoView(anchorEl, noteText, onEdit) {
    var panel = ensureMemoView();
    panel.innerHTML =
      '<div class="hl-memo-view-head">' +
        '<button type="button" class="hl-memo-view-edit" aria-label="수정">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15v5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>' +
        '</button>' +
        '<button type="button" class="hl-memo-view-close" aria-label="닫기">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="hl-memo-view-text"></div>';
    panel.querySelector('.hl-memo-view-text').textContent = noteText;
    // Reveal (off-position) first so offsetHeight reflects real rendered
    // height -- needed because positionMemoView() needs the panel's own
    // height up front to sit its bottom edge flush above the dot.
    panel.style.bottom = 'auto';
    panel.hidden = false;
    memoViewAnchorEl = anchorEl;
    // Positioned in document coordinates (rect + scroll offset) so the panel
    // scrolls together with the dot instead of staying pinned to the same
    // spot on screen while scrolling.
    positionMemoView();
    panel.querySelector('.hl-memo-view-edit').onclick = function (ev) {
      ev.stopPropagation();
      closeMemoView();
      onEdit();
    };
    panel.querySelector('.hl-memo-view-close').onclick = function (ev) {
      ev.stopPropagation();
      closeMemoView();
    };
  }
  function closeMemoView() {
    if (memoViewEl) memoViewEl.hidden = true;
    memoViewAnchorEl = null;
  }
  function showPopup(rect, actions) {
    var p = ensurePopup();
    p.innerHTML = actions.map(function (a, i) {
      return '<button type="button" class="hl-popup-btn" data-idx="' + i + '">' + escapeHtml(a.label) + '</button>';
    }).join('<span class="hl-popup-sep"></span>');
    p.style.display = 'flex';
    // Document coordinates (rect + scroll offset) so the popup scrolls
    // together with the selection/highlight it's anchored to.
    p.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
    p.style.top = (rect.top - 10 + window.scrollY) + 'px';
    Array.prototype.forEach.call(p.querySelectorAll('.hl-popup-btn'), function (btn, i) {
      btn.onclick = function (ev) { ev.stopPropagation(); actions[i].onClick(); };
    });
  }
  function hidePopup() {
    if (popupEl) popupEl.style.display = 'none';
  }

  function getTextOffsetInZone(zone, node, nodeOffset) {
    var walker = document.createTreeWalker(zone, NodeFilter.SHOW_TEXT, null);
    var offset = 0, n;
    while ((n = walker.nextNode())) {
      if (n === node) return offset + nodeOffset;
      offset += n.textContent.length;
    }
    return offset;
  }

  function handleSelectionEnd(ev) {
    if (!ev.target || !ev.target.closest) return;
    if (ev.target.closest('.hl-popup')) return;
    if (ev.target.closest('mark.hl')) return; // that's handled by the click-to-remove path instead
    setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hidePopup(); return; }
      var range = sel.getRangeAt(0);
      var startEl = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
      var endEl = range.endContainer.nodeType === 3 ? range.endContainer.parentElement : range.endContainer;
      var startZone = startEl.closest('.hl-zone');
      var endZone = endEl.closest('.hl-zone');
      if (!startZone || startZone !== endZone) { hidePopup(); return; }

      var start = getTextOffsetInZone(startZone, range.startContainer, range.startOffset);
      var end = getTextOffsetInZone(startZone, range.endContainer, range.endOffset);
      if (start === end) { hidePopup(); return; }
      var lo = Math.min(start, end), hi = Math.max(start, end);
      var rect = range.getBoundingClientRect();
      var entryId = startZone.getAttribute('data-entry-id');
      var field = startZone.getAttribute('data-field');

      showPopup(rect, [{ label: '하이라이트', onClick: function () {
        Highlights.add(entryId, field, lo, hi);
        sel.removeAllRanges();
        hidePopup();
        render();
      } }]);
    }, 10);
  }
  document.addEventListener('mouseup', handleSelectionEnd);
  document.addEventListener('touchend', handleSelectionEnd);
  document.addEventListener('mousedown', function (ev) {
    if (!ev.target || !ev.target.closest) return;
    if (!ev.target.closest('.hl-popup') && !ev.target.closest('mark.hl')) hidePopup();
    if (!ev.target.closest('.hl-memo-panel') && !ev.target.closest('mark.hl')) closeMemoPanel();
    if (!ev.target.closest('.hl-memo-view') && !ev.target.closest('mark.hl')) closeMemoView();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { hidePopup(); closeMemoPanel(); closeMemoView(); }
  });

  // clicks inside the results list: star buttons + highlight marks (event
  // delegation on the container, since its contents are fully rebuilt on every render)
  document.body.addEventListener('click', function (ev) {
    var starBtn = ev.target.closest('[data-star-entry]');
    if (starBtn) {
      var id = starBtn.getAttribute('data-star-entry');
      var n = parseInt(starBtn.getAttribute('data-star-n'), 10);
      // clicking the star that's already the current rating clears it back to 0 --
      // otherwise there'd be no way to un-star something once set.
      Stars.set(id, Stars.get(id) === n ? 0 : n);
      render();
      return;
    }
    var noteDot = ev.target.closest('.hl-note-dot');
    if (noteDot) {
      closeMemoPanel();
      var dotMarkEl = noteDot.closest('mark.hl');
      var dotZoneEl = dotMarkEl.closest('.hl-zone');
      var dotNote = noteDot.getAttribute('data-note') || '';
      openMemoView(noteDot, dotNote, function () {
        openMemoPanel(
          dotMarkEl.getBoundingClientRect(),
          dotZoneEl.getAttribute('data-entry-id'),
          dotZoneEl.getAttribute('data-field'),
          parseInt(dotMarkEl.getAttribute('data-start'), 10),
          parseInt(dotMarkEl.getAttribute('data-end'), 10),
          dotNote
        );
      });
      return;
    }
    var markEl = ev.target.closest('mark.hl');
    if (markEl) {
      closeMemoPanel();
      closeMemoView();
      var zoneEl = markEl.closest('.hl-zone');
      var start = parseInt(markEl.getAttribute('data-start'), 10);
      var end = parseInt(markEl.getAttribute('data-end'), 10);
      var entryId = zoneEl.getAttribute('data-entry-id');
      var field = zoneEl.getAttribute('data-field');
      var existingNote = markEl.getAttribute('data-note') || '';
      var rect = markEl.getBoundingClientRect();
      showPopup(rect, [
        { label: existingNote ? '메모 수정' : '메모 추가', onClick: function () {
            hidePopup();
            openMemoPanel(rect, entryId, field, start, end, existingNote);
          } },
        { label: '삭제', onClick: function () {
            Highlights.removeAt(entryId, field, start, end);
            hidePopup();
            render();
          } }
      ]);
      return;
    }

    var toggleHead = ev.target.closest('.notes-section.collapsible > .notes-section-head');
    if (toggleHead) {
      var toggledSection = toggleHead.closest('.notes-section');
      var toggledCard = toggledSection.closest('.notes-card');
      var toggledGuideId = toggledCard.getAttribute('data-essay-id') + '-notes';
      var toggledIdx = toggledSection.getAttribute('data-guide-idx');
      var toggledKey = toggledGuideId + '::' + toggledIdx;
      guideSectionExpanded[toggledKey] = !guideSectionExpanded[toggledKey];
      toggledSection.classList.toggle('is-collapsed');
      return;
    }

    var editBtn = ev.target.closest('.notes-edit-btn');
    if (editBtn) {
      var card = editBtn.closest('.notes-card');
      enterNotesEditMode(card);
      return;
    }
    var cancelBtn = ev.target.closest('.notes-cancel');
    if (cancelBtn) {
      render();
      return;
    }
    var saveBtn = ev.target.closest('.notes-save');
    if (saveBtn) {
      var editCard = saveBtn.closest('.notes-card');
      var essayId = editCard.getAttribute('data-essay-id');
      var textarea = editCard.querySelector('.notes-editarea');
      Notes.set(essayId, textarea.value);
      render();
      return;
    }

    var flyoutItem = ev.target.closest('.worddoc-flyout-item');
    if (flyoutItem) {
      document.getElementById('wordDocSidebar').classList.remove('is-open');
      window.location.hash = '#/words/' + encodeURIComponent(flyoutItem.getAttribute('data-doc-id'));
      return;
    }

    var launcherBtn = ev.target.closest('#wordDocLauncher');
    if (launcherBtn) {
      window.location.hash = '#/words';
      return;
    }

    // click anywhere outside the sidebar closes the tap-opened flyout
    // (hover-opened flyouts on desktop don't need this -- CSS :hover handles them)
    if (!ev.target.closest('#wordDocSidebar')) {
      document.getElementById('wordDocSidebar').classList.remove('is-open');
    }
  });

  // ---------------------------------------------------------------
  // Word/expression docs -- the top floating launcher + flyout list, next
  // to the star-tier filters. Hovering (or tapping, on touch) the character
  // reveals a flyout shortcut list built from DATA.wordDocs; picking one, or
  // clicking the character itself, navigates to the "#/words" route family
  // (a second-home-style page of square cards) rather than opening a modal.
  // ---------------------------------------------------------------
  function findWordDoc(id) {
    var docs = state.wordDocs || [];
    for (var i = 0; i < docs.length; i++) {
      if (docs[i].id === id) return docs[i];
    }
    return null;
  }

  function buildWordDocSidebar() {
    var nav = document.getElementById('wordDocSidebar');
    var flyout = document.getElementById('wordDocFlyout');
    var docs = state.wordDocs || [];
    if (!docs.length) { nav.style.display = 'none'; return; }
    flyout.innerHTML = '<div class="worddoc-flyout-inner">' +
      '<div class="worddoc-flyout-label">저장한 표현집</div>' +
      docs.map(function (doc) {
        return '<button type="button" class="worddoc-flyout-item" data-doc-id="' + escapeHtml(doc.id) + '">' +
          '<span class="doc-title">' + escapeHtml(doc.title) + '</span>' +
          (doc.subtitle ? '<span class="doc-sub">' + escapeHtml(doc.subtitle) + '</span>' : '') +
        '</button>';
      }).join('') +
    '</div>';
  }

  buildWordDocSidebar();

  // The fallback/default text for a notes-card: an essay's "notes" field,
  // or -- for a category guide card, whose id is namespaced "cat-guide-<id>" --
  // that category's "guide" field.
  function defaultNotesText(id) {
    if (id.indexOf('cat-guide-') === 0) {
      var cat = catById(id.slice('cat-guide-'.length));
      return cat ? (cat.guide || '') : '';
    }
    if (id.indexOf('worddoc-') === 0) {
      var doc = findWordDoc(id.slice('worddoc-'.length));
      return doc ? (doc.text || '') : '';
    }
    var essay = essayById(id);
    return essay ? (essay.notes || '') : '';
  }

  function enterNotesEditMode(card) {
    var essayId = card.getAttribute('data-essay-id');
    var current = Notes.get(essayId, defaultNotesText(essayId));
    var contentEl = card.querySelector('.notes-content');
    contentEl.outerHTML =
      '<textarea class="notes-editarea">' + escapeHtml(current) + '</textarea>' +
      '<div class="notes-edit-actions">' +
        '<button type="button" class="notes-cancel">취소</button>' +
        '<button type="button" class="notes-save">저장</button>' +
      '</div>';
    var ta = card.querySelector('.notes-editarea');
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  // top-left star-tier filter buttons (3 / 2 / 1 stars, right-aligned in the topbar)
  document.querySelectorAll('.starnav-btn').forEach(function (btn) {
    var n = parseInt(btn.getAttribute('data-n'), 10);
    var html = '';
    for (var i = 0; i < 3; i++) html += starIconSvg(i >= 3 - n);
    btn.innerHTML = html;
    btn.addEventListener('click', function () { window.location.hash = '#/stars/' + n; });
  });

  render();
  window.addEventListener('hashchange', onHashChangeForNav);
  window.addEventListener('hashchange', render);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { positionCorrectionNotes(document.getElementById('listArea')); });
  }
  window.addEventListener('resize', function () {
    positionCorrectionNotes(document.getElementById('listArea'));
    positionMemoView();
  });

  // Live sync: whenever the shared cloud document changes -- including from
  // a *different* device -- pull it in and re-render. hasPendingWrites=true
  // means this snapshot is our own optimistic local echo (we already have
  // this data), so we skip re-rendering for that one specifically.
  if (SYNC_DOC) {
    SYNC_DOC.onSnapshot(function (doc) {
      if (doc.metadata.hasPendingWrites) return;
      if (!doc.exists) return;
      var data = doc.data() || {};
      HStore.replaceAll(data.highlights || {});
      SStore.replaceAll(data.stars || {});
      NStore.replaceAll(data.notes || {});
      render();
    }, function (err) {
      console.error('Sync read failed (staying local-only):', err);
    });
  }
})();
</script>
</body>
</html>
