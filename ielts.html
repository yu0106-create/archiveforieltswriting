<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE for IELTS WRITING</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap');

:root{
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #131315;
  --ink-soft: #6b7076;
  --ink-faint: #9aa0a6;
  --line: #e9e9ea;
  --red: #c23b3b;
  --red-deep: #9a2c2c;
  --red-wash: #fbe9e9;
  --star: #ffcd3c;
  --hl-mint: #ccffff;
  --subhead: #fc3468;
  --radius: 12px;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --en: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --hand: 'Caveat', cursive;
}

*{ box-sizing:border-box; }
html{
  scroll-behavior:smooth;
  /* dotted texture fills the gutters outside the centered 1040px column.
     Two identical radial-gradient layers, the second shifted by half a
     tile both horizontally and vertically, so each dot sits in the gap
     between the two dots of the row above it (a staggered / brick-offset
     grid, not a plain square grid) -- and because it's a repeating
     gradient rather than a dropped-in raster image, it tiles seamlessly
     with no visible seam. */
  background-color: var(--bg);
  background-image:
    radial-gradient(circle, #d7d7d9 1.3px, transparent 1.6px),
    radial-gradient(circle, #d7d7d9 1.3px, transparent 1.6px);
  background-size: 26px 26px, 26px 26px;
  background-position: 0 0, 13px 13px;
}

body{
  margin: 0 auto;
  max-width: 1040px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--kr);
  font-weight: 300;
  line-height: 1.6;
}

a{ color:inherit; text-decoration:none; }
::selection{ background: var(--red-wash); color: var(--red-deep); }
:focus-visible{ outline: 2px solid var(--red); outline-offset: 3px; }

.wrap{
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ---------- top bar ---------- */
.topbar{
  padding: 26px 0 0;
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
}
.topbar .wrap{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom: 20px;
}
.navbtns{ display:flex; gap:8px; }
.navbtns button{
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.navbtns button:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns a:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns button:disabled{ opacity: 0.35; cursor: default; }
.navbtns button:disabled:hover{ border-color: var(--line); color: var(--ink-soft); }
.navbtns button svg{ width: 15px; height: 15px; }
.starnav{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.starnav-btn{
  border: none;
  background: none;
  cursor: pointer;
  padding: 2px 0;
  display: flex;
  gap: 2px;
  line-height: 0;
}
.starnav-btn svg{ width: 13px; height: 13px; }
.star-fill{ fill: var(--star); stroke: var(--star); }
.star-empty{ fill: none; stroke: var(--ink-faint); stroke-width: 1.5; }
.starnav-btn.active svg .star-empty{ stroke: var(--ink); }

.topbar-brand{
  font-family: var(--en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.01em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease, max-width .3s ease;
}
.topbar-brand span{
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}
.topbar-brand .tb-for{
  font-weight: 300;
  font-size: 11.5px;
  color: var(--ink-faint);
}
.topbar-brand:hover{ opacity: 0.65; }
body:not(.is-home) .topbar-brand{
  opacity: 1;
  max-width: 320px;
  transform: translateY(0);
  pointer-events: auto;
}
body:not(.is-home) .topbar-brand:hover{ opacity: 0.65; }

/* ---------- hero ---------- */
/* Collapses via a CSS-grid row (1fr -> 0fr) rather than max-height: a
   max-height transition animates against an arbitrary cap, not the content's
   real height, so it visually snaps shut early and eases out over empty
   space -- this grid technique animates the actual track size instead, so
   the motion tracks the real content height and reads as smooth, not janky. */
.hero-collapse{
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows .3s ease;
}
body:not(.is-home) .hero-collapse{
  grid-template-rows: 0fr;
  pointer-events: none;
}
.hero-collapse-inner{
  overflow: hidden;
  min-height: 0;
}
.hero{
  padding: 34px 0 30px;
  opacity: 1;
  transition: opacity .18s ease;
}
body:not(.is-home) .hero{
  opacity: 0;
  transition: opacity .12s ease;
}
.hero .eyebrow{
  font-family: var(--en);
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.1em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 16px;
  display:flex; align-items:center; gap:8px;
}
.hero .eyebrow::before{
  content:"";
  width: 20px; height: 2px;
  background: var(--red);
  display:inline-block;
}
.hero h1{
  font-family: var(--en);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
.hero h1 a{ display:block; transition: opacity .15s ease; }
.hero h1 a:hover{ opacity: 0.6; }
.hero h1 span{ display:block; }
.hero h1 .l1{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.02; }
.hero h1 .l2{ font-size: clamp(38px, 6.4vw, 62px); font-weight: 300; color: var(--ink); margin: 2px 0; }
.hero h1 .l3{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.05; }

/* ---------- legend row (unused, kept out) ---------- */

/* ---------- section headers ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 44px 0 18px;
}
.section-head h2{
  font-family: var(--kr);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
  margin:0;
}
.section-head .count{
  font-family: var(--en);
  font-size: 12px;
  color: var(--ink-faint);
}

/* ---------- category grid ---------- */
.cat-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 12px;
}
.cat-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 18px 18px 16px;
  cursor:pointer;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  display:flex; flex-direction:column; gap:10px;
  position: relative;
}
.cat-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.cat-card.active{ border-color: var(--ink); }
.cat-card .top-row{ display:flex; align-items:flex-start; justify-content:space-between; }
.cat-card .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}
.pill{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  white-space: nowrap;
}
.cat-card .label{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 16.5px;
  line-height: 1.35;
}
.cat-card .desc{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height:1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cat-card .bottom-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: auto; padding-top: 4px;
}
.cat-card .arrow{
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint);
}
.cat-card .arrow svg{ width: 11px; height: 11px; display:block; }

/* ---------- essay cards ---------- */
.essay-grid{ display:flex; flex-direction:column; gap: 12px; }
.essay-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.essay-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.essay-card .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.essay-card .title{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 8px;
}
.essay-card .tag-row{ display:flex; flex-wrap:wrap; gap: 6px; }
.essay-card .score{
  text-align: right;
}
.essay-card .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
  line-height: 1;
}
.essay-card .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- essay detail header ---------- */
.essay-header{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 26px;
  margin: 8px 0 30px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
}
.essay-header .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.essay-header h3{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 22px;
  margin: 0 0 6px;
}
.essay-header .back{
  display:inline-block;
  margin-top: 10px;
  font-family: var(--en);
  font-weight: 600;
  font-size: 12px;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
}
.essay-header .score{ text-align:right; }
.essay-header .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 34px;
  color: var(--ink);
  line-height: 1;
}
.essay-header .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- question + original (uncorrected) text ---------- */
.essay-original{
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin: -12px 0 30px;
  background: var(--card);
}
.essay-original .block + .block{ margin-top: 22px; }
.essay-original .block-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.essay-original .question-text{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14.5px;
  color: var(--ink-soft);
  font-style: italic;
  line-height: 1.6;
}
.essay-original .question-text.placeholder{
  color: var(--ink-faint);
  font-style: normal;
}
.essay-original .original-text p{
  font-family: var(--en);
  font-weight: 400;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.75;
  margin: 0 0 14px;
}
.essay-original .original-text p:last-child{ margin-bottom: 0; }
.essay-original .chart-image{
  max-width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--line);
}

/* ---------- notes card ("알아두기") ---------- */
/* ---------- word/expression doc sidebar + "PDF popup" modal ---------- */
.topbar-right{
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
}
.worddoc-launcher-wrap{ position: relative; display: flex; align-items: center; }
.worddoc-launcher{
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
}
.worddoc-launcher-imgwrap{
  position: relative;
  display: block;
  height: 58px;
}
.worddoc-launcher-imgwrap img{
  height: 58px;
  width: auto;
  display: block;
  transition: opacity .15s ease, transform .15s ease;
}
/* Two pre-rendered layers instead of a CSS filter: wd-outline is a
   precomputed ring that traces only the character's *outer* silhouette
   (any internal gaps -- e.g. between the raised arm and the body -- were
   filled in before the ring was generated, so they're excluded from it).
   It sits behind the character, invisible at rest, and fades in on hover;
   because it has no ring around internal gaps, none appears there. */
.wd-outline{
  position: absolute;
  inset: 0;
  opacity: 0;
  z-index: 0;
}
.wd-char{ position: relative; z-index: 1; }
.worddoc-launcher:hover .wd-outline{ opacity: 1; }
.worddoc-launcher:hover .wd-char{ transform: scale(1.05); }


/* The flyout is split into an invisible "bridge" (this element, flush
   against the launcher with no gap) and a visible inner card offset by
   padding -- not margin. If the visible card started right where the
   hoverable box starts, moving the mouse from the launcher down into the
   list would cross a dead zone with nothing hoverable in it, and :hover
   would drop before the pointer ever reaches the list. Padding keeps the
   whole path continuously "inside" one hoverable element. */
.worddoc-flyout{
  position: absolute;
  right: 0;
  top: 100%;
  padding-top: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
  z-index: 45;
}
.worddoc-launcher-wrap:hover .worddoc-flyout,
.topbar-right.is-open .worddoc-flyout{
  opacity: 1;
  pointer-events: auto;
}
.worddoc-flyout-inner{
  min-width: 230px;
  max-width: 290px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0,0,0,0.14);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.worddoc-flyout-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 6px 10px 4px;
}
.worddoc-flyout-item{
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  border: none;
  background: none;
  font-family: var(--kr);
}
.worddoc-flyout-item:hover{ background: var(--line-soft, #f4f1ec); }
.worddoc-flyout-item .doc-title{ font-weight: 600; font-size: 13.5px; color: var(--ink); }
.worddoc-flyout-item .doc-sub{ font-size: 11px; color: var(--ink-faint); margin-top: 1px; }

/* Word-doc content is shown inline as its own page (see the "#/words" route
   family), not in a modal -- this just gives it slightly roomier padding
   than a standard notes-card. */
.worddoc-card{ padding: 0; margin-bottom: 20px; }
.worddoc-card .notes-content{ gap: 10px; }

/* Refined "reference sheet" look for the word-doc modal specifically.
   Collapsed chips keep the shared pill look used everywhere else on the site
   (same click-to-expand interaction people already know) -- but once
   expanded, the content reads like a clean glossary page rather than a
   stack of gray admin boxes: no box fill, a hairline rule between groups,
   dashed rules between entries, and each entry's own typographic hierarchy
   (bold pattern / italic example / small vocab caption) instead of uniform
   body text. */
/* "Index card" look (option B): each numbered entry is its own flat card --
   cream fill, thin border, one soft shadow for a touch of lift. No stacked
   "peek" card behind it -- just the single front card. Collapsed chips keep
   the shared pill look used everywhere else on the site (same click-to-
   expand interaction people already know). */
.worddoc-card .notes-section{
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
}
.worddoc-card .notes-section.is-collapsed{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 14px;
}
.worddoc-card .notes-section:not(.is-collapsed){
  padding-bottom: 4px;
}
.worddoc-card .notes-section:not(.is-collapsed) + .notes-section{
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}
.worddoc-card .notes-section:not(.is-collapsed) .notes-section-head{ margin-bottom: 14px; }
.worddoc-card .notes-section-title{ font-size: 17px; }

.worddoc-card .notes-content > .notes-section:not(.is-collapsed) .notes-section-body{
  display: flex;
  flex-direction: column;
}
.worddoc-card .notes-block{
  padding: 16px 4px 16px 22px;
  border-bottom: 1px solid var(--line);
}
.worddoc-card .notes-block:last-child{ border-bottom: none; padding-bottom: 4px; }
.worddoc-card .notes-block:first-child{ padding-top: 4px; }

/* Option E: a big fixed-width number column on the left; every other line's
   label reserves the same width (even though it's small text like "EX)" or
   "단어:") so all of a block's text lines start at one shared left edge,
   the way the first line's text starts right after its big number. */
.worddoc-card .notes-line{ align-items: baseline; }
.worddoc-card .notes-line-label{
  flex: 0 0 46px;
  width: 46px;
  overflow: hidden;
  text-align: right;
}
.worddoc-card .notes-line + .notes-line{ margin-top: 6px; }
.worddoc-card .notes-line[data-marker="num"] .notes-line-label{
  font-family: var(--en);
  font-weight: 500;
  font-size: 21px;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="num"] .notes-line-text{
  font-weight: 700;
  font-size: 15.5px;
  color: var(--ink);
}
.worddoc-card .notes-line[data-marker="ex"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="ex"] .notes-line-text{
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
}
.worddoc-card .notes-line[data-marker="vocab"] .notes-line-label,
.worddoc-card .notes-line[data-marker="vocab"] .notes-line-text{
  font-size: 12px;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="desc"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="desc"] .notes-line-text{ color: var(--ink-soft); }

@media (max-width: 480px){
  .worddoc-flyout{ max-width: calc(100vw - 40px); }
}

/* Topbar gets cramped on phones: three groups (nav arrows, brand, launcher+
   stars) competing for width, plus the brand reserving space even while
   invisible, pushed it past the viewport and forced horizontal scrolling.
   Shrink each control and tighten the gaps so everything fits on one line
   without needing to scroll, and stays vertically centered against each
   other at the smaller size. */
@media (max-width: 600px){
  .wrap{ padding: 0 16px; }
  .topbar .wrap{ gap: 8px; }
  .navbtns{ gap: 6px; }
  .navbtns button{ width: 26px; height: 26px; }
  .navbtns button svg{ width: 13px; height: 13px; }
  .topbar-brand{ display: none; }
  .topbar-right{ gap: 6px; }
  .worddoc-launcher-imgwrap,
  .worddoc-launcher-imgwrap img{ height: 40px; }
  .starnav{ gap: 3px; }
  .starnav-btn svg{ width: 11px; height: 11px; }
}

.notes-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin-bottom: 30px;
}
.guide-card{
  border-left-color: var(--red-deep);
}
.notes-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.notes-head .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.notes-head-right{ display:flex; align-items:center; gap:14px; }
.notes-edit-btn{
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.notes-edit-btn:hover{ border-color: var(--ink); color: var(--ink); }
.notes-edit-btn svg{ width: 13px; height: 13px; }
.notes-content{
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.notes-content > .notes-placeholder{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
}
.notes-section{
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  background: #fbfbfb;
}
.notes-section-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  line-height: 1;
}
.notes-section-title{
  font-family: var(--en);
  font-weight: 700;
  font-size: 17px;
  line-height: 1;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--subhead);
  display: flex;
  align-items: center;
  gap: 8px;
}
.notes-section-title-empty::before{ background: var(--ink-faint); }
.notes-section-title::before{
  content: "";
  width: 14px; height: 2px;
  background: var(--subhead);
  display: inline-block;
  flex: none;
}
.notes-section-head .stars{ flex: none; }

/* Collapsible guide chips (used inside .guide-card): collapsed by default,
   click the head to expand. Border, radius, and padding stay identical in
   both states -- and the header keeps the same margin-bottom -- so the box's
   top-left corner and the title's position never shift; only the box's
   width (auto vs full) and whether the body is visible change. */
.notes-section.collapsible > .notes-section-head{ cursor: pointer; }
.notes-section-chevron{
  width: 14px; height: 14px;
  color: var(--ink-faint);
  flex: none;
  display: block;
  transition: transform .15s ease;
}
.notes-section.collapsible.is-collapsed{
  align-self: flex-start;
  width: max-content;
  max-width: 100%;
}
.notes-section.collapsible.is-collapsed > .notes-section-head{
  margin-bottom: 0;
}
.notes-section.collapsible:not(.is-collapsed){
  align-self: stretch;
}
.notes-section.collapsible.is-collapsed .notes-section-body{ display: none; }
.notes-section.collapsible.is-collapsed .notes-section-chevron{ transform: rotate(90deg); }
.notes-section.collapsible:not(.is-collapsed) .notes-section-chevron{ transform: rotate(-90deg); }

.notes-section-body{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 15.5px;
  line-height: 1.85;
  color: var(--ink);
}
.notes-block{ margin-bottom: 14px; }
.notes-block:last-child{ margin-bottom: 0; }
.notes-subhead{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 16px;
  color: var(--subhead);
  background: #fdeff3;
  padding: 9px 12px;
  border-radius: 6px;
  /* margin (not just the box's own padding) on both sides, so the gap
     above and below collapses symmetrically with neighboring .notes-block
     margins instead of the box only "absorbing" spacing on one side. */
  margin: 14px 0;
}
.notes-subhead:first-child{ margin-top: 0; }
.notes-subhead:last-child{ margin-bottom: 0; }
.notes-line{
  display: flex;
  align-items: flex-start;
}
.notes-line-label{
  white-space: pre;
  flex: none;
}
.notes-line-text{
  flex: 1 1 auto;
  min-width: 0;
}
.notes-placeholder{ color: var(--ink-faint); font-style: italic; }
.notes-editarea{
  width: 100%;
  min-height: 220px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px;
  resize: vertical;
  background: #fffef8;
}
.notes-editarea:focus{ outline: 2px solid var(--red); outline-offset: 1px; }
.notes-edit-actions{
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}
.notes-edit-actions button{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  padding: 7px 16px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
}
.notes-edit-actions .notes-save{
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.notes-edit-actions button:hover{ opacity: 0.85; }

/* ---------- entries (sentence-level corrections) ---------- */
.entries{ display:flex; flex-direction:column; }
.entry{
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  display:grid;
  grid-template-columns: 140px 1fr;
  gap: 18px;
}
.entry .meta{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  padding-top: 3px;
}
.entry .meta .meta-row{ display: block; }
.entry .meta .meta-date{ display: block; }
.entry .meta .meta-essaylink{
  display: block;
  margin-top: 4px;
  color: var(--ink-faint);
  text-decoration: underline;
}
.entry .meta .tag{
  display:inline-block;
  margin-top: 8px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  cursor: pointer;
}
.stars{
  display: flex;
  gap: 3px;
}
.stars button{
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  line-height: 0;
}
.stars svg{ width: 15px; height: 15px; }
.stars button:hover svg .star-empty{ stroke: var(--ink-soft); }
.entry .meta .stars{ margin-top: 10px; }

mark.hl{
  background: var(--hl-mint);
  color: #073130;
  border-radius: 2px;
  padding: 0 1px;
  cursor: pointer;
  position: relative;
}
.hl-note-dot{
  display: inline-block;
  width: 5px; height: 5px;
  margin: -3px 0 0 1px;
  border-radius: 50%;
  background: var(--red-deep);
  border: none;
  padding: 0;
  vertical-align: top;
  cursor: pointer;
}
.hl-note-dot:hover{ transform: scale(1.4); }

/* Read-only memo callout (opened by clicking the dot) -- styled like the
   site's own cards (cream surface, hairline border, soft shadow) rather than
   the dark quick-action .hl-popup bubble, since this is content to read,
   not a transient action. */
.hl-memo-view{
  position: absolute;
  z-index: 200;
  width: 500px;
  max-width: calc(100vw - 24px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  padding: 12px 14px;
}
.hl-memo-view-head{
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.hl-memo-view-text{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--ink);
  white-space: pre-wrap;
}
.hl-memo-view-edit,
.hl-memo-view-close{
  width: 22px; height: 22px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.hl-memo-view-edit svg,
.hl-memo-view-close svg{ width: 11px; height: 11px; }
.hl-memo-view-edit:hover{ border-color: var(--red-deep); color: var(--red-deep); }
.hl-memo-view-close:hover{ border-color: var(--ink); color: var(--ink); }
.hl-popup{
  position: absolute;
  z-index: 200;
  background: var(--ink);
  color: #fff;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  padding: 4px;
  border-radius: 6px;
  white-space: nowrap;
  transform: translate(-50%, -100%);
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  display: flex;
  align-items: center;
  gap: 2px;
}
.hl-popup::after{
  content: "";
  position: absolute;
  left: 50%; top: 100%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--ink);
}
.hl-popup-btn{
  border: none;
  background: none;
  color: #fff;
  font-family: inherit;
  font-size: inherit;
  font-weight: 300;
  cursor: pointer;
  padding: 5px 9px;
  border-radius: 4px;
}
.hl-popup-btn:hover{ background: rgba(255,255,255,0.15); }
.hl-popup-sep{ width: 1px; height: 14px; background: rgba(255,255,255,0.25); flex: none; }

.hl-memo-panel{
  position: absolute;
  z-index: 200;
  width: 240px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.16);
  padding: 8px;
}
.hl-memo-textarea{
  width: 100%;
  min-height: 70px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  color: var(--ink);
  box-sizing: border-box;
}
.hl-memo-actions{
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 6px;
}
.hl-memo-actions button{
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
}
.hl-memo-actions button:hover{ border-color: var(--ink); color: var(--ink); }
.hl-memo-actions .hl-memo-save{ background: var(--ink); color: #fff; border-color: var(--ink); }
.hl-memo-actions .hl-memo-save:hover{ opacity: 0.85; }
.hl-zone{ cursor: text; }

.entry .body .wrong{
  position: relative;
  font-family: var(--en);
  font-weight: 400;
  font-size: 15.5px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 4px;
}
.entry .body .wrong .struck{
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--ink-faint);
}
.correction-note{
  position: absolute;
  transform: translateX(-50%);
  font-family: var(--hand);
  font-size: 17px;
  line-height: 1.15;
  color: var(--red-deep);
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
}
.full-correction{
  font-family: var(--hand);
  font-size: 19px;
  line-height: 1.3;
  color: var(--red-deep);
  margin: 2px 0 14px;
}
.entry .body .explanation{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.6;
}

.empty{
  padding: 40px 0;
  color: var(--ink-faint);
  font-size: 14px;
  font-family: var(--kr);
}

footer{
  margin-top: 60px;
  padding: 26px 0 50px;
  border-top: 1px solid var(--line);
  font-family: var(--en);
  font-size: 11.5px;
  color: var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}

@media (max-width: 760px){
  .cat-grid{ grid-template-columns: repeat(2, 1fr); }
  .entry{ grid-template-columns: 1fr; gap: 6px; }
  .entry .meta{ padding-top:0; }
  .entry .meta .meta-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .entry .meta .meta-date{ white-space:nowrap; }
  .entry .meta .tag{ margin-top:0; }
  .entry .meta .stars{ margin-top:0; }
  .hero{ padding: 24px 0 22px; }
  .essay-card{ grid-template-columns: 1fr; }
  .essay-card .score{ text-align:left; }
  .essay-header{ grid-template-columns: 1fr; }
  .essay-header .score{ text-align:left; }
}
@media (max-width: 480px){
  .cat-grid{ grid-template-columns: 1fr; }
}
</style>

      "guide": "\u2501\u2501\u2501 5\ud615\uc2dd \uc815\ub9ac \u2501\u2501\u2501\n\n\ubb38\uc7a5 5\ud615\uc2dd(\uc8fc\uc5b4+\ub3d9\uc0ac+\ubaa9\uc801\uc5b4+\ubaa9\uc801\uaca9\ubcf4\uc5b4) \uad6c\ubb38\uc5d0\uc11c, \ub3d9\uc0ac\uc5d0 \ub530\ub77c \ubaa9\uc801\uaca9\ubcf4\uc5b4 \uc55e\uc5d0 as\uac00 \ubd99\ub294\uc9c0 \uc5ec\ubd80\uac00 \ub2ec\ub77c\uc9d0. \uc544\ub798 \ub124 \uac00\uc9c0 \uacbd\uc6b0\ub85c \uc815\ub9ac\ud568.\n\n## \ubaa9\uc801\uaca9\ubcf4\uc5b4\uc5d0 as\uac00 \ubd99\uc9c0 \uc54a\ub294 \ub3d9\uc0ac\n\n\ubaa9\uc801\uc5b4\ub97c '~\ub77c\uace0 \ubd80\ub974\ub2e4/\uc5ec\uae30\ub2e4/\ub9cc\ub4e4\ub2e4'\ub77c\ub294 \uc758\ubbf8\ub85c \ucde8\uae09\ud558\ub294 \ub3d9\uc0ac\ub294 \ubaa9\uc801\uaca9 \ubcf4\uc5b4(\uba85\uc0ac\u00b7\ud615\uc6a9\uc0ac)\uac00 as \uc5c6\uc774 \ubc14\ub85c \uc634.\n\n1) \uba85\uba85\u00b7\uce6d\ud638 \ub3d9\uc0ac (\uc774\ub984/\uce6d\ud638\ub97c \ubd99\uc774\ub2e4)\n   \uc124\uba85: \ubaa9\uc801\uc5b4\ub97c '~\ub77c\uace0 \ubd80\ub974\ub2e4/\uc774\ub984 \uc9d3\ub2e4'\ub77c\ub294 \uc758\ubbf8\ub85c \uc4f8 \ub54c, \ubaa9\uc801\uaca9 \ubcf4\uc5b4\ub85c \uba85\uc0ac\uac00 as \uc5c6\uc774 \ubc14\ub85c \uc634.\n   Ex) call him John / name the baby Sarah / entitle the book XYZ / label him a traitor / nickname her Sunny\n\n2) \uc120\ucd9c\u00b7\uc784\uba85 \ub3d9\uc0ac (\uc9c1\ucc45/\uc9c0\uc704\uc5d0 \uc549\ud788\ub2e4)\n   \uc124\uba85: \ubaa9\uc801\uc5b4\ub97c \ud2b9\uc815 \uc9c1\ucc45\uc774\ub098 \uc9c0\uc704(\uba85\uc0ac)\ub85c \ub9cc\ub4e4\uac70\ub098 \ubf51\uc744 \ub54c \uc4f0\ub294 \ub3d9\uc0ac.\n   Ex) appoint him director / elect her president / make him captain / crown him king\n\n3) \uc0ac\uace0\u00b7\uc778\uc2dd \ub3d9\uc0ac (~\ub77c\uace0 \uc0dd\uac01\ud558\ub2e4/\uc5ec\uae30\ub2e4)\n   \uc124\uba85: \ubaa9\uc801\uc5b4\uc758 \uc0c1\ud0dc\ub098 \uc815\uccb4\ub97c \uba85\uc0ac\u00b7\ud615\uc6a9\uc0ac \ubcf4\uc5b4\ub85c \ud310\ub2e8\ud560 \ub54c \uc4f0\ub294 \ub3d9\uc0ac.\n   Ex) consider it an honor / find the movie interesting / think him honest / believe her capable / deem it necessary\n\n4) \uc0c1\ud0dc \ubcc0\ud654\u00b7\uc720\uc9c0 \ub3d9\uc0ac (~\ud55c \uc0c1\ud0dc\ub85c \ub9cc\ub4e4\ub2e4/\uc720\uc9c0\ud558\ub2e4)\n   \uc124\uba85: \ubaa9\uc801\uc5b4\uc758 \uc0c1\ud0dc\ub97c \ub098\ud0c0\ub0b4\ub294 \ud615\uc6a9\uc0ac \ubcf4\uc5b4\uac00 \ubc14\ub85c \ub4a4\ub530\ub984.\n   Ex) keep the door open / leave him alone / make me happy / drive him crazy\n\n## \uc0ac\uace0\u00b7\uc778\uc2dd \ub3d9\uc0ac \uc8fc\uc758\uc0ac\ud56d\n\n1) consider\ub294 \ubc18\ub4dc\uc2dc as \uc5c6\uc774 \uc500\n   \uc124\uba85: \"consider him as a genius\"\ucc98\ub7fc \uad6c\uc5b4\uc5d0\uc11c\ub294 \uc885\uc885 \uc4f0\uc774\uc9c0\ub9cc, \uaca9\uc2dd\uccb4 \uae00(IELTS \ub4f1)\uc5d0\uc11c\ub294 \uc624\ub958\ub85c \uc9c0\uc801\ub418\ub294 \ub300\ud45c\uc801\uc778 \ud328\ud134\uc784.\n   Ex) consider him a genius (O) / consider him as a genius (X, \uaca9\uc2dd\uccb4\uc5d0\uc11c)\n\n2) think, believe + \ubaa9\uc801\uc5b4 + \ud615\uc6a9\uc0ac\ub294 \ubb38\ubc95\uc740 \ub9de\uc9c0\ub9cc \uc608\uc2a4\ub7ec\uc6b4 \ubb38\uc5b4\uccb4 \ud45c\ud604\n   \uc124\uba85: Think him honest, Believe her capable\ucc98\ub7fc \ubaa9\uc801\uc5b4 \ub4a4\uc5d0 \ud615\uc6a9\uc0ac\uac00 \ubc14\ub85c \uc624\ub294 \uad6c\ubb38\uc740 \ubb38\ubc95\uc801\uc73c\ub85c\ub294 \ub9de\uc9c0\ub9cc \uc2e4\uc81c \uae00\uc5d0\uc11c\ub294 \uc798 \uc548 \uc500. \uc544\ub798 \ud45c\ud604\uc774 \ub354 \uc790\uc5f0\uc2a4\ub7ec\uc6c0.\n   Ex) think that he is honest / believe her to be capable / think of him as an honest person\n\n## as \uc0dd\ub7b5\u00b7\ud3ec\ud568 \ubaa8\ub450 \uac00\ub2a5\ud55c \ub3d9\uc0ac\n\nlabel, appoint, elect, nominate\ub294 as\ub97c \ubd99\uc5ec\ub3c4 \ub418\uace0 \uc548 \ubd99\uc5ec\ub3c4 \ub418\ub294 \ub3d9\uc0ac\uc784. \ub2e4\ub9cc call, name, make, crown, deem\uc740 as\ub97c \ubd99\uc774\uba74 \uc624\ud788\ub824 \ud2c0\ub9b0 \ud45c\ud604\uc774 \ub418\ubbc0\ub85c \uc774 \ub458\uc744 \uad6c\ubd84\ud574\uc11c \uae30\uc5b5\ud574\uc57c \ud568.\n\n- label him a traitor = label him as a traitor (\uc2e0\ubb38 \uae30\uc0ac\uccb4\uc5d0\uc11c\ub294 \uc624\ud788\ub824 as\ub97c \ub123\ub294 \uacbd\uc6b0\uac00 \ub354 \ub9ce\uc74c)\n- appoint him director = appoint him as director\n- elect her president = elect her as president (as \uc5c6\ub294 \ucabd\uc774 \uc880 \ub354 \uac04\uacb0\ud55c \ub290\ub08c)\n\n## \ubc18\ub4dc\uc2dc as\uac00 \ud544\uc694\ud55c \ub3d9\uc0ac\n\n\uc704 \ub3d9\uc0ac\ub4e4\uacfc \ud55c\uad6d\uc5b4 \ud574\uc11d\uc774 \ube44\uc2b7\ud574 \ubcf4\uc5ec\ub3c4, \uc544\ub798\ub294 \uc804\uce58\uc0ac as\uac00 \ubc18\ub4dc\uc2dc \ud544\uc694\ud55c \ub3d9\uc0ac(\uad6c)\uc784. \uc5d0\uc138\uc774\uc5d0\uc11c\ub294 treat, view, see, define\ucc98\ub7fc \uc544\ub798\ucabd \ub3d9\uc0ac\uac00 \ud6e8\uc52c \uc790\uc8fc \uc4f0\uc784.\n\n- refer to A as B: A\ub97c B\ub77c\uace0 \ubd80\ub974\ub2e4/\uc5b8\uae09\ud558\ub2e4\n- regard A as B: A\ub97c B\ub85c \uc5ec\uae30\ub2e4\n- describe A as B: A\ub97c B\ub77c\uace0 \ubb18\uc0ac\ud558\ub2e4\n- treat A as B: A\ub97c B\ub85c \ucde8\uae09\ud558\ub2e4 (treat failure as a learning opportunity \u2014 \uc5d0\uc138\uc774\uc5d0\uc11c \ub9e4\uc6b0 \uc790\uc8fc \uc500)\n- view A as B / see A as B: A\ub97c B\ub85c \ubcf4\ub2e4 (look upon\ubcf4\ub2e4 \ud6e8\uc52c \ud754\ud558\uac8c \uc4f0\ub294 \ud45c\ud604)\n- define A as B: A\ub97c B\ub85c \uc815\uc758\ud558\ub2e4\n- classify A as B: A\ub97c B\ub85c \ubd84\ub958\ud558\ub2e4\n- perceive A as B: A\ub97c B\ub85c \uc778\uc2dd\ud558\ub2e4\n- look upon A as B: A\ub97c B\ub85c \ubcf4\ub2e4 (\ub2e4\uc18c \uc608\uc2a4\ub7ec\uc6b4 \ud45c\ud604\uc774\ub77c \uc694\uc998 \uae00\uc5d0\uc11c\ub294 view\ub098 see\ub85c \ub300\uccb4\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc74c)"

      "guide": "\u2501\u2501\u2501 as\uc758 \uc5ec\ub7ec \uc4f0\uc784 \uc815\ub9ac \u2501\u2501\u2501\n\nas\ub294 '~\ub9cc\ud07c'\uc774\ub77c\ub294 \ube44\uad50 \ud45c\ud604\uc73c\ub85c\ub9cc \uc4f0\uc774\ub294 \uac8c \uc544\ub2d8. \uc5b4\ub5a4 \uc5ed\ud560\ub85c \uc4f0\uc600\ub294\uc9c0\uc5d0 \ub530\ub77c \uc9dd\uc774 \ud544\uc694\ud55c\uc9c0 \uc544\ub2cc\uc9c0\uac00 \uac08\ub9bc.\n\n1) \uc815\ub3c4 \ube44\uad50 (~\ub9cc\ud07c \u2026\ud558\ub2e4) \u2014 \ubc18\ub4dc\uc2dc \uc55e\ub4a4\ub85c \uc9dd\uc744 \uc774\ub904\uc57c \ud568\n   \uc124\uba85: as \ud615\uc6a9\uc0ac as \uad6c\uc870\uc5d0\uc11c \ud615\uc6a9\uc0ac \uc55e\ub4a4\ub85c as\uac00 \ud558\ub098\uc529 \uc788\uc5b4\uc57c \ud568. \ud558\ub098\ub77c\ub3c4 \ube60\uc9c0\uba74 \ube44\uad50 \uad6c\ubb38\uc774 \uae68\uc9d0.\n   Ex) It is not as delicious as food made by a chef. (O)\n   Ex) It is not delicious as food made by a chef. (X, \uc55e\uc758 as\uac00 \ube60\uc9d0)\n\n2) \uc774\uc720 (~\ub54c\ubb38\uc5d0) \u2014 \ub2e8\ub3c5\uc73c\ub85c \uc500\n   \uc124\uba85: \ubb38\uc7a5 \ub9e8 \uc55e\uc5d0\uc11c \uc774\uc720\ub97c \ub098\ud0c0\ub0bc \ub54c\ub294 as \ud63c\uc790 \uc500.\n   Ex) As it was raining, we stayed inside.\n\n3) \uc2dc\uac04 (~\ud558\ub294 \ub3d9\uc548/\ub54c) \u2014 \ub2e8\ub3c5\uc73c\ub85c \uc500\n   \uc124\uba85: \ub450 \uc0ac\uac74\uc774 \uac70\uc758 \ub3d9\uc2dc\uc5d0 \uc77c\uc5b4\ub0a8\uc744 \ub098\ud0c0\ub0bc \ub54c \uc500.\n   Ex) As I was leaving, the phone rang.\n\n4) \uc790\uaca9\u00b7\uc5ed\ud560 (~\ub85c\uc11c) \u2014 \ub2e8\ub3c5\uc73c\ub85c \uc500\n   \uc124\uba85: \uc5b4\ub5a4 \uc2e0\ubd84\uc774\ub098 \uc5ed\ud560\ub85c\uc11c \ubb34\uc5c7\uc744 \ud55c\ub2e4\ub294 \uc758\ubbf8. \ub4a4\uc5d0 \uba85\uc0ac(\uc5ed\ud560)\uac00 \uc634.\n   Ex) She works as a teacher.\n\n5) \uac04\uc8fc (~\ub85c \uc5ec\uae30\ub2e4) \u2014 \ub2e8\ub3c5\uc73c\ub85c \uc500\n   \uc124\uba85: regard/view/see/describe/treat \uac19\uc740 \ub3d9\uc0ac\uc640 \uc9dd\uc744 \uc774\ub904 'A\ub97c B\ub85c \uc5ec\uae30\ub2e4'\ub77c\ub294 \ub73b\uc744 \ub9cc\ub4e6 (\uc804\uce58\uc0ac \uac10\uac01 \uc7a1\uae30 \ucc38\uace0).\n   Ex) People regard it as important.\n\n\uc694\uc57d: as\uac00 '\uc815\ub3c4 \ube44\uad50' \uc5ed\ud560\uc77c \ub54c\ub9cc \ubc18\ub4dc\uc2dc \uc55e\ub4a4\ub85c \uc9dd(as...as)\uc774 \ud544\uc694\ud558\uace0, \uc774\uc720\u00b7\uc2dc\uac04\u00b7\uc790\uaca9\u00b7\uac04\uc8fc\ub85c \uc4f0\uc77c \ub54c\ub294 \ub2e8\ub3c5\uc73c\ub85c \uc500. \ubb38\uc7a5\uc5d0\uc11c as\uac00 \ubb34\uc5c7\uc744 \ube44\uad50\ud558\uace0 \uc788\ub294\uc9c0\ubd80\ud130 \ud655\uc778\ud558\uba74 \ud5f7\uac08\ub9ac\uc9c0 \uc54a\uc74c."

      "guide": "\u2501\u2501\u2501 \uba85\uc0ac \ub4a4 \uc218\uc2dd\uc5b4\uc640 the\uc758 \uad00\uacc4 \u2501\u2501\u2501\n\n\uad00\uc0ac(the)\ub294 \uba85\uc0ac \uc790\uccb4\uc5d0 \ubd99\uc5b4 \uc788\ub294 \ud55c\uc815 \ud45c\ud604\uc5d0 \ubc18\uc751\ud558\ub294 \uac83\uc774\uc9c0, \ubb38\uc7a5 \uc55e\ub4a4\uc5d0 \ub193\uc778 \ub9e5\ub77d \uc815\ubcf4 \uc804\uccb4\uc5d0 \ubc18\uc751\ud558\ub294 \uac8c \uc544\ub2d8. \ubb38\uc7a5 \uc55e\uc5d0 \ubc30\uacbd \uc124\uba85\uc774 \uc788\uc5b4\ub3c4 \uadf8\uac83\uc774 \uba85\uc0ac \ubc14\ub85c \uc606\uc5d0 \ubd99\uc9c0 \uc54a\uc73c\uba74 the\ub97c \uc720\ubc1c\ud558\uc9c0 \uc54a\uc74c.\n\n## the\uac00 \ud544\uc694\ud55c \uacbd\uc6b0: \uba85\uc0ac \ubc14\ub85c \ub4a4\uc5d0 \ubd99\ub294 \ud55c\uc815 \ud45c\ud604\n\n1) \uba85\uc0ac + of\uad6c\n   \uc124\uba85: \uba85\uc0ac \ub4a4\uc5d0 '\ubb34\uc5c7\uc5d0 \ub300\ud55c \uac83\uc778\uc9c0'\ub97c \ubabb\ubc15\ub294 of\uad6c\uac00 \ubc14\ub85c \ubd99\uc73c\uba74, \uadf8 \uba85\uc0ac\ub294 \ub354 \uc774\uc0c1 \uc77c\ubc18 \uac1c\ub150\uc774 \uc544\ub2c8\ub77c \ud2b9\uc815 \ub300\uc0c1\uc774 \ub418\ubbc0\ub85c the\uac00 \ud544\uc694\ud568.\n   Ex) the growth of UK tourist numbers (O) \u2014 growth \ub4a4\uc5d0 \ubd99\uc740 of\uad6c\uac00 \ubb34\uc5c7\uc758 \uc131\uc7a5\uc778\uc9c0 \ud2b9\uc815\ud568\n   Ex) the motivation of the students (O)\n\n2) \uba85\uc0ac + \uad00\uacc4\uc808\n   \uc124\uba85: \uba85\uc0ac \ub4a4\uc5d0 which/that/who\ub85c \uc2dc\uc791\ud558\ub294 \uad00\uacc4\uc808\uc774 \ubd99\uc5b4 \ub300\uc0c1\uc744 \uc881\ud600\uc8fc\ub294 \uacbd\uc6b0\uc5d0\ub3c4 the\uac00 \ud544\uc694\ud568.\n   Ex) the report that was published last year (O)\n\n3) \uba85\uc0ac + \uc22b\uc790(\ub3d9\uaca9)\n   \uc124\uba85: year, number\ucc98\ub7fc '\ubb34\uc5c7'\uc744 \uac00\ub9ac\ud0a4\ub294 \uba85\uc0ac \ub4a4\uc5d0 \uad6c\uccb4\uc801\uc778 \uc22b\uc790\uac00 \ucf64\ub9c8 \uc5c6\uc774 \ubc14\ub85c \ubd99\uc5b4\uc11c \ub3d9\uaca9\uc73c\ub85c \uadf8 \uba85\uc0ac\ub97c \ud2b9\uc815\ud558\ub294 \uacbd\uc6b0\uc5d0\ub3c4 the\uac00 \ud544\uc694\ud568. of\uad6c\ub098 \uad00\uacc4\uc808\ub9cc\ud07c \uac15\ub825\ud55c \ud55c\uc815 \ud45c\ud604\uc784.\n   Ex) In the year 1995, it is drama that stands out as the most popular genre. (O) \u2014 year \ub4a4\uc5d0 1995\uac00 \ub3d9\uaca9\uc73c\ub85c \ubd99\uc5b4 \uba87 \ub144\uc778\uc9c0 \ud2b9\uc815\ud568\n   \ube44\uad50) In 1995 (O, year \uc5c6\uc774 \uc22b\uc790\ub9cc \uc4f0\uba74 \uc560\ucd08\uc5d0 \uad00\uc0ac \ubb38\uc81c\uac00 \uc0dd\uae30\uc9c0 \uc54a\uc74c) / in year 1995 (X, year\ub97c \uba85\uc0ac\ub85c \uc4f0\uba74\uc11c the\ub97c \uc0dd\ub7b5\ud558\uba74 \ud2c0\ub9bc)\n\n## the\uac00 \ud544\uc694 \uc5c6\ub294 \uacbd\uc6b0: \ubb38\uc7a5 \uc804\uccb4\ub97c \uafb8\ubbf8\ub294 \ubd80\uc0ac\uad6c\n\n\ubb38\uc7a5 \ub9e8 \uc55e\uc774\ub098 \ub4a4\uc5d0 \uc624\ub294 for/in/among \uac19\uc740 \uc804\uce58\uc0ac\uad6c\ub294 \ub300\uac1c \uba85\uc0ac \ud558\ub098\uc5d0 \ubd99\ub294 \uc218\uc2dd\uc5b4\uac00 \uc544\ub2c8\ub77c, \ubb38\uc7a5 \uc804\uccb4(\uba85\uc81c)\uac00 \uc801\uc6a9\ub418\ub294 \ubc94\uc704\ub098 \uc870\uac74\uc744 \uc54c\ub824\uc8fc\ub294 \uc5ed\ud560\ub9cc \ud568. \uba85\uc0ac\uc640 \ubb38\ubc95\uc801\uc73c\ub85c \uc5f0\uacb0\ub41c \uac8c \uc544\ub2c8\ub77c \uc808 \uc804\uccb4\ub97c \uafb8\ubbf8\ub294 \uac83\uc774\ubbc0\ub85c, \uadf8 \uba85\uc0ac\ub294 \uc5ec\uc804\ud788 \uc544\ubb34 \uc218\uc2dd\ub3c4 \ubc1b\uc9c0 \uc54a\uc740 \uc77c\ubc18\uc801 \uac1c\ub150\uc73c\ub85c \ub0a8\uc544 \ubb34\uad00\uc0ac\ub85c \uc500.\n\n1) For UK tourists, growth was slow.\n   \uc124\uba85: \"For UK tourists\"\ub294 growth\ub77c\ub294 \uba85\uc0ac\ub97c \uafb8\ubbf8\ub294 \uac8c \uc544\ub2c8\ub77c, \"\uc774 \ubb38\uc7a5\uc774 \uc801\uc6a9\ub418\ub294 \ub300\uc0c1\uc740 UK \uad00\uad11\uac1d\uc774\ub2e4\"\ub77c\ub294 \uc870\uac74\uc744 \ubb38\uc7a5 \uc804\uccb4\uc5d0 \uac78\uc5b4\uc8fc\ub294 \uc5ed\ud560\ub9cc \ud568. growth \uc606\uc5d0\ub294 \uc5ec\uc804\ud788 \uc544\ubb34 \uc218\uc2dd\uc5b4\ub3c4 \uc5c6\uc73c\ubbc0\ub85c \ubb34\uad00\uc0ac.\n   \ube44\uad50) The growth of UK tourist numbers was slow. \u2014 growth \ubc14\ub85c \ub4a4\uc5d0 of\uad6c\uac00 \ubd99\uc5b4\uc57c the\uac00 \ud544\uc694\ud574\uc9d0. \"For UK tourists, the growth was slow\"\ucc98\ub7fc the\ub97c \ub123\uc73c\uba74 \ubd80\uc790\uc5f0\uc2a4\ub7ec\uc6c0.\n\n2) In 2013, sales increased.\n   \uc124\uba85: \"In 2013\"\uc740 \uc2dc\uc810\uc744 \ub098\ud0c0\ub0b4\ub294 \ubd80\uc0ac\uad6c\uc77c \ubfd0, sales\uc5d0 \ubd99\uc5b4\uc11c \uadf8\uac83\uc744 \ud55c\uc815\ud558\ub294 \ud45c\ud604\uc774 \uc544\ub2d8.\n   \ube44\uad50) The sales of laptops increased in 2013. \u2014 sales \ub4a4\uc5d0 of\uad6c\uac00 \ubd99\uc5b4\uc57c the\uac00 \ud544\uc694\ud568.\n\n3) Among teenagers, obesity is rising.\n   \uc124\uba85: \"Among teenagers\"\ub3c4 \ubb38\uc7a5 \uc804\uccb4\uac00 \uc801\uc6a9\ub418\ub294 \ubc94\uc704\ub97c \ub098\ud0c0\ub0bc \ubfd0, obesity \uc606\uc5d0 \ubd99\uc5b4 \uadf8\uac83\uc744 \ud55c\uc815\ud558\ub294 \ud45c\ud604\uc774 \uc544\ub2d8.\n   \ube44\uad50) The obesity rate among teenagers is rising. \u2014 rate\ub77c\ub294 \uba85\uc0ac \uc606\uc5d0 \"among teenagers\"\uac00 \uc9c1\uc811 \ubd99\uc5b4 \ud558\ub098\uc758 \uba85\uc0ac\uad6c(the obesity rate among teenagers)\ub97c \uc774\ub8e8\ubbc0\ub85c the\uac00 \ud544\uc694\ud568.\n\n\uc694\uc57d: the \uc5ec\ubd80\ub294 '\uc774 \ubb38\uc7a5\uc5d0 \ub9e5\ub77d \uc815\ubcf4\uac00 \uc788\ub294\uac00'\uac00 \uc544\ub2c8\ub77c '\uadf8 \uba85\uc0ac \ubc14\ub85c \uc606\uc5d0 \uc774 \uba85\uc0ac\ub97c \ud2b9\uc815 \ub300\uc0c1\uc73c\ub85c \uc881\ud600\uc8fc\ub294 \ud45c\ud604\uc774 \ubb38\ubc95\uc801\uc73c\ub85c \uc9c1\uc811 \ubd99\uc5b4 \uc788\ub294\uac00'\ub85c \ud310\ub2e8\ud574\uc57c \ud568.\n\n\u2501\u2501\u2501 \ubb34\uad00\uc0ac \u00b7 \ubd80\uc815\uad00\uc0ac \u00b7 \uc815\uad00\uc0ac \ube44\uad50 \u2014 food \uc608\uc2dc\ub85c \ubcf4\uae30 \u2501\u2501\u2501\n\nfood\ucc98\ub7fc \ubd88\uac00\uc0b0\uba85\uc0ac\ub85c\ub3c4 \uc4f0\uc774\ub294 \ub2e8\uc5b4\ub294 \uad00\uc0ac\uc5d0 \ub530\ub77c \uc758\ubbf8\uac00 \uc644\uc804\ud788 \ub2ec\ub77c\uc9d0. \uc138 \uac00\uc9c0\ub97c \ub098\ub780\ud788 \ube44\uad50\ud558\uba74 \ud5f7\uac08\ub9ac\uc9c0 \uc54a\uc74c.\n\n1) food (\ubb34\uad00\uc0ac) \u2014 \uc74c\uc2dd\uc774\ub77c\ub294 \uac1c\ub150 \uc804\uccb4\ub97c \uc77c\ubc18\uc801\uc73c\ub85c \uac00\ub9ac\ud0b4\n   \uc124\uba85: \uc544\ubb34 \uc218\uc2dd\uc5b4\ub3c4 \uc5c6\uc774 '\uc74c\uc2dd'\uc774\ub77c\ub294 \ubb3c\uc9c8\u00b7\uac1c\ub150 \uc804\uccb4\ub97c \ub9d0\ud560 \ub54c\ub294 \uad00\uc0ac\ub97c \ubd99\uc774\uc9c0 \uc54a\uc74c.\n   Ex) Food is expensive these days. (\uc74c\uc2dd \uc804\ubc18\uc5d0 \ub300\ud55c \uc77c\ubc18\uc801 \uc9c4\uc220)\n\n2) a food (\uc6d0\uce59\uc801\uc73c\ub85c \ud2c0\ub9bc) \u2014 food\ub294 \uc560\ucd08\uc5d0 \uc140 \uc218 \uc5c6\uc74c\n   \uc124\uba85: food\ub294 \ubd88\uac00\uc0b0\uba85\uc0ac\ub77c \ubd80\uc815\uad00\uc0ac a\ub97c \ubd99\uc77c \uc218 \uc5c6\uc74c. \uad73\uc774 '\ud55c \uac00\uc9c0 \uc74c\uc2dd/\uc74c\uc2dd\uc758 \ud55c \uc885\ub958'\ub97c \ub9d0\ud558\uace0 \uc2f6\ub2e4\uba74 a kind of food, a type of food\ucc98\ub7fc \ud480\uc5b4\uc368\uc57c \ud568.\n   Ex) a food that you bought (X) \u2192 the food that you bought / a type of food (O)\n\n3) the food (\ud2b9\uc815 \uc9c0\uce6d) \u2014 \uc774\ubbf8 \ud2b9\uc815\ub41c \uadf8 \uc74c\uc2dd\n   \uc124\uba85: \uad00\uacc4\uc808(that you bought)\uc774\ub098 of\uad6c\ucc98\ub7fc \uba85\uc0ac\uc5d0 \uc9c1\uc811 \ubd99\ub294 \ud55c\uc815 \ud45c\ud604\uc774 \uc788\uc5b4\uc11c '\uadf8 \uc74c\uc2dd'\uc73c\ub85c \ud2b9\uc815\ub420 \ub54c\ub294 the\ub97c \uc500.\n   Ex) the food that you bought from a grocery store (O)\n\n\uc694\uc57d: \uc77c\ubc18\uc801 \uac1c\ub150 \uc804\uccb4 = \ubb34\uad00\uc0ac, \uc140 \uc218 \uc5c6\ub294 \uba85\uc0ac\uc5d0 '\ud55c \uac1c'\ub77c\ub294 \uc758\ubbf8\uc758 a = \uc6d0\uce59\uc801\uc73c\ub85c \ubd88\uac00, \ud2b9\uc815 \ub300\uc0c1\uc73c\ub85c \uc881\ud600\uc84c\ub2e4\uba74 the.\n\n\u2501\u2501\u2501 few/a few, little/a little \u2014 \uc788\uc74c vs \uac70\uc758 \uc5c6\uc74c \u2501\u2501\u2501\n\n\ub611\uac19\uc774 '\uc870\uae08'\uc774\ub77c\ub294 \ub73b\ucc98\ub7fc \ubcf4\uc5ec\ub3c4, \ubd80\uc815\uad00\uc0ac a\uac00 \uc788\uace0 \uc5c6\uace0\uc5d0 \ub530\ub77c \ub258\uc559\uc2a4\uac00 \uc815\ubc18\ub300\uac00 \ub428.\n\n1) a few / a little \u2014 \ubd80\uc815\uad00\uc0ac a\uac00 \uc788\uc73c\uba74 \uae0d\uc815\uc801 \ub258\uc559\uc2a4 ('\uadf8\ub798\ub3c4 \uc880 \uc788\ub2e4')\n   \uc124\uba85: \uac00\uc0b0\uba85\uc0ac\uc5d0\ub294 a few, \ubd88\uac00\uc0b0\uba85\uc0ac\uc5d0\ub294 a little\uc744 \uc500. \uc591\uc740 \uc801\uc9c0\ub9cc '\uc788\ub2e4'\ub294 \ucabd\uc5d0 \ucd08\uc810\uc774 \uc788\uc74c.\n   Ex) I have a few friends. (\uce5c\uad6c\uac00 \uba87 \uba85 \uc788\uc74c \u2014 \uae0d\uc815\uc801)\n   Ex) There is a little water left. (\ubb3c\uc774 \uc870\uae08 \ub0a8\uc544\uc788\uc74c \u2014 \uae0d\uc815\uc801)\n\n2) few / little \u2014 a \uc5c6\uc774 \uc4f0\uba74 \ubd80\uc815\uc801 \ub258\uc559\uc2a4 ('\uac70\uc758 \uc5c6\ub2e4')\n   \uc124\uba85: \ub611\uac19\uc774 \uac00\uc0b0\uba85\uc0ac\uc5d4 few, \ubd88\uac00\uc0b0\uba85\uc0ac\uc5d4 little\uc744 \uc4f0\uc9c0\ub9cc, \uad00\uc0ac a\uac00 \ube60\uc9c0\uba74 '\ubd80\uc871\ud558\ub2e4'\ub294 \ubd80\uc815\uc801 \uc758\ubbf8\ub85c \ubc14\ub01c.\n   Ex) I have few friends. (\uce5c\uad6c\uac00 \uac70\uc758 \uc5c6\uc74c \u2014 \uc678\ub85c\uc6c0 \ub258\uc559\uc2a4)\n   Ex) There is little water left. (\ubb3c\uc774 \uac70\uc758 \uc5c6\uc74c \u2014 \ubd80\uc871\ud568 \ub258\uc559\uc2a4)\n\n   \ube44\uad50) a few friends (\uce5c\uad6c\uac00 \uba87 \uba85 \uc788\uc74c, O) / few friends (\uce5c\uad6c\uac00 \uac70\uc758 \uc5c6\uc74c, \uc758\ubbf8\uac00 \uc815\ubc18\ub300) \u2014 \uad00\uc0ac a \ud558\ub098\ub85c \ub258\uc559\uc2a4\uac00 \ub4a4\uc9d1\ud788\ubbc0\ub85c \ubc18\ub4dc\uc2dc \uc758\ub3c4\ud55c \uc758\ubbf8\uc5d0 \ub9de\uac8c \uace8\ub77c\uc57c \ud568.\n\n\uc694\uc57d: \uac00\uc0b0\uba85\u       "originalText": "Scores could be considered as which are determined by eacg team's ability, but the bar chart above show that it could be depended on the season. Of course, as you can see by team B's scores during 2002~2005, there could be a team whose scores are always way above than others. However, Team B's score was 82pt in 2002 but it had became lower until 2004, but it has successfully made their socre better in 2005.\n\nTeam A and Team C's scores are definitely lower than Team A's for the entire given period. Their scores are relatively similar compared to the scores of Team B's, even though the gap changes by the year. Furthermore, until 2003, Team C's performance was better than Team A's. By the way, as the gap had shrinked and Team A had performed better in 2004 with the score of 35. In 2005, TeamA's score has got lower a lot, but they were still above Team C.\n\nThis chart shows two ponits. First one is that the teams' score is not always high or low, and it costantly changes as the season goes. Second, there's something that could be called as a trend in theses scores.",
      "notes": "\u2501\u2501\u2501 \uacfc\uac70 \u00b7 \uacfc\uac70\uc644\ub8cc \u00b7 \ud604\uc7ac\uc644\ub8cc \uad6c\ubd84 \u2501\u2501\u2501\n\n- \uacfc\uac70(\ub2e8\uc21c\uacfc\uac70): \uc774\ubbf8 \uc885\ub8cc\ub41c \ud2b9\uc815 \uc2dc\uc810\uc758 \uc0ac\uac74\uc744 \ub098\ud0c0\ub0c4. \uc5f0\ub3c4\uac00 \uba85\uc2dc\ub418\ub294 \uacbd\uc6b0 \ub300\ubd80\ubd84 \uc774\uc5d0 \ud574\ub2f9\ud568.\n- \uacfc\uac70\uc644\ub8cc(had + p.p.): \ud2b9\uc815 \uacfc\uac70 \uc2dc\uc810\ubcf4\ub2e4 \uc55e\uc11c \ubc1c\uc0dd\ud55c \uc0ac\uac74\uc744 \ub098\ud0c0\ub0c4. \ubb38\uc7a5 \ub0b4\uc5d0 \uae30\uc900\uc774 \ub418\ub294 \uc2dc\uc810\uc774 \uba3c\uc800 \uc81c\uc2dc\ub418\uc5b4\uc57c \ud568.\n- \ud604\uc7ac\uc644\ub8cc(has/have + p.p.): \uacfc\uac70\ubd80\ud130 \ud604\uc7ac\uae4c\uc9c0 \uc774\uc5b4\uc9c0\ub294 \uc0c1\ud669, \ub610\ub294 \ud604\uc7ac \uc2dc\uc810\uc744 \uae30\uc900\uc73c\ub85c \ud55c \uc11c\uc220\uc5d0 \uc0ac\uc6a9\ud568. \uc774\ubbf8 \uc885\ub8cc\ub41c \uc5f0\ub3c4(\uc608: 2005\ub144)\ub97c \uc11c\uc220\ud560 \ub54c\ub294 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc74c.\n\n\uc608\uc2dc \uc624\ub958: \"it has successfully made their score better in 2005\"\n\u2192 2005\ub144\uc740 \uc774\ubbf8 \uc885\ub8cc\ub41c \ud2b9\uc815 \uc5f0\ub3c4\uc774\ubbc0\ub85c \ud604\uc7ac\uc644\ub8cc(has made)\uac00 \uc544\ub2cc \ub2e8\uc21c\uacfc\uac70(made)\ub85c \ud45c\uae30\ud574\uc57c \ud568.\n\n\u2501\u2501\u2501 \uacfc\uac70\uc644\ub8cc \uc0ac\uc6a9 \uc870\uac74 \u2501\u2501\u2501\n\n\uacfc\uac70\uc644\ub8cc\ub294 \ubb38\uc7a5 \ub0b4\uc5d0 '\uae30\uc900\uc774 \ub418\ub294 \ub354 \ub098\uc911 \uc2dc\uc810'\uc774 \uc874\uc7ac\ud560 \ub54c\ub9cc \uc0ac\uc6a9 \uac00\ub2a5\ud568. \uadf8 \uae30\uc900 \uc2dc\uc810\ubcf4\ub2e4 \uc55e\uc120 \uc0ac\uac74\uc5d0 \ud55c\ud574 had + p.p.\ub97c \uc0ac\uc6a9\ud558\uba70, \uae30\uc900 \uc2dc\uc810\uc774 \uc5c6\ub294 \uacbd\uc6b0 \ub2e8\uc21c\uacfc\uac70\ub97c \uc0ac\uc6a9\ud568.\n\n1) By the time + \uacfc\uac70, \uc8fc\uc5b4 + had + p.p.\n   Ex) By the time the season ended, Team B had already lost its lead.\n   \uc124\uba85: \uc2dc\uc98c\uc774 \ub05d\ub09c \uc2dc\uc810\uc774 \uae30\uc900. \uadf8 \uc774\uc804\uc5d0 \uc774\ubbf8 \uc120\ub450\ub97c \uc783\uc5c8\uc74c\uc744 \ub098\ud0c0\ub0c4.\n\n2) Before + \uacfc\uac70, \uc8fc\uc5b4 + had + p.p.\n   Ex) Before 2004, Team A had never scored above 20 points.\n   \uc124\uba85: 2004\ub144\uc774 \uae30\uc900 \uc2dc\uc810\uc774\uba70, \uadf8 \uc774\uc804 \uc0c1\ud669\uc744 \uc11c\uc220\ud568.\n\n3) By + \uc5f0\ub3c4, \uc8fc\uc5b4 + had + p.p.\n   Ex) By 2004, the gap between Team A and Team C had narrowed significantly.\n   \uc124\uba85: 'by 2004'\uac00 \uae30\uc900 \uc2dc\uc810 \uc5ed\ud560\uc744 \ud558\ubbc0\ub85c had narrowed \uc0ac\uc6a9\uc774 \uc801\uc808\ud568.\n\n   \ube44\uad50 \uc608\uc2dc:\n   \"Team A had performed better in 2004\" (\uc624\ub958)\n   \u2192 2004\ub144 \uc790\uccb4\ub97c \uc11c\uc220\ud558\ub294 \ubb38\uc7a5\uc73c\ub85c, \uae30\uc900\uc774 \ub420 \ub354 \ub098\uc911 \uc2dc\uc810\uc774 \uc5c6\uc74c. \ub530\ub77c\uc11c had performed\uac00 \uc544\ub2cc performed(\ub2e8\uc21c\uacfc\uac70)\uac00 \uc801\uc808\ud568.\n   \"By 2005, Team A had performed better than in the previous year.\" (\uc62c\ubc14\ub984)\n   \u2192 'by 2005'\ub77c\ub294 \uae30\uc900 \uc2dc\uc810\uc774 \uc874\uc7ac\ud558\ubbc0\ub85c had performed \uc0ac\uc6a9 \uac00\ub2a5.\n\n4) After + \uc8fc\uc5b4 + had + p.p., \uc8fc\uc5b4 + \uacfc\uac70\n   Ex) After the score had dropped for two years, it rose again in 2005.\n   \uc124\uba85: \uc810\uc218\uac00 \ud558\ub77d\ud55c \uc0ac\uac74\uc774 \uadf8 \uc774\ud6c4 \uc0c1\uc2b9\ud55c \uc0ac\uac74\ubcf4\ub2e4 \uba3c\uc800 \ubc1c\uc0dd\ud588\uc74c\uc744 \uba85\ud655\ud788 \ud558\uae30 \uc704\ud574 \uc55e\uc120 \uc0ac\uac74\uc5d0 had\ub97c \uc0ac\uc6a9\ud568.\n\n\uc694\uc57d: \ud55c \ubb38\uc7a5\uc5d0 \ub450 \uac1c\uc758 \uacfc\uac70 \uc0ac\uac74\uc774 \uc788\uace0, \uadf8\uc911 \ud558\ub098\uac00 \ub2e4\ub978 \ud558\ub098\ubcf4\ub2e4 \ub       "originalText": "The graph below shows changes in proportion in vehicle registration from 1970 to 2010. There is a trend that could be observed. First, truck is the most registrated vehicle among given period, except the fact that taxi exceeded truck in 1980. Truck\u2019s registration proportion almost reached 50 percent in 1970 and 2010. Second, bus is the least registrated vehicle through the for every periods. It has never been above 20 percent. Lastly, bus has a tendency to be ranked in a second place, and it has fluctuated a lot as the time passed.",
      "notes": "\u2501\u2501\u2501 \ud604\uc7ac\uc644\ub8cc \u00b7 \ub2e8\uc21c\uacfc\uac70 \uad6c\ubd84 \u2501\u2501\u2501\n\n- \ub2e8\uc21c\uacfc\uac70: \uc774\ubbf8 \uc885\ub8cc\ub41c \ud2b9\uc815 \uae30\uac04\uc774\ub098 \uc2dc\uc810\uc758 \uc0ac\uac74\uc744 \ub098\ud0c0\ub0c4. \uc885\ub8cc \uc5f0\ub3c4\uac00 \uba85\uc2dc\ub418\ub294 \uacbd\uc6b0 \ub300\ubd80\ubd84 \uc774\uc5d0 \ud574\ub2f9\ud568.\n- \ud604\uc7ac\uc644\ub8cc(has/have + p.p.): \uacfc\uac70\ubd80\ud130 \ud604\uc7ac\uae4c\uc9c0 \uc774\uc5b4\uc9c0\ub294 \uc0c1\ud669, \ub610\ub294 \ud604\uc7ac \uc2dc\uc810\uc744 \uae30\uc900\uc73c\ub85c \ud55c \uc11c\uc220\uc5d0 \uc0ac\uc6a9\ud568. \uc885\ub8cc \uc5f0\ub3c4\uac00 \uba85\uc2dc\ub41c \uae30\uac04(\uc608: 1970~2010\ub144)\uc744 \uc11c\uc220\ud560 \ub54c\ub294 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc74c.\n\n\uc608\uc2dc \uc624\ub958: \"It has never been above 20 percent.\"\n\u2192 1970\ub144\ubd80\ud130 2010\ub144\uae4c\uc9c0\ub294 \uc774\ubbf8 \uc885\ub8cc\ub41c \uae30\uac04\uc774\ubbc0\ub85c \ud604\uc7ac\uc644\ub8cc(has been)\uac00 \uc544\ub2cc \ub2e8\uc21c\uacfc\uac70(was)\ub85c \ud45c\uae30\ud574\uc57c \ud568.\n\n\uc608\uc2dc \uc624\ub958: \"it has fluctuated a lot\"\n\u2192 \uac19\uc740 \uc774\uc720\ub85c \ub2e8\uc21c\uacfc\uac70(fluctuated)\uac00 \uc801\uc808\ud568.\n\n\u2501\u2501\u2501 \uad00\uc0ac \uc0ac\uc6a9 \uaddc\uce59 \u2501\u2501\u2501\n\n\uad00\uc0ac\ub294 \uba85\uc0ac\uac00 \ud2b9\uc815 \ub300\uc0c1\uc744 \uac00\ub9ac\ud0a4\ub294\uc9c0, \uc77c\ubc18\uc801 \uac1c\ub150\uc744 \uac00\ub9ac\ud0a4\ub294\uc9c0\uc5d0 \ub530\ub77c \ubd99\uc774\uac70\ub098 \uc0dd\ub7b5\ud568.\n\n1) \uad00\uc6a9 \ud45c\ud604\uc5d0\ub294 \uad00\uc0ac\ub97c \ub123\uc9c0 \uc54a\uc74c\n   Ex) ranked in second place (O) / ranked in a second place (X)\n   \uc124\uba85: in first/second/third place\uc640 \uac19\uc740 \uc21c\uc704 \ud45c\ud604\uc740 \uad00\uc0ac \uc5c6\uc774 \uc500.\n\n2) \uc77c\ubc18\uc801 \uc758\ubbf8\ub85c \uc4f0\uc778 \ubd88\uac00\uc0b0\uba85\uc0ac \uc55e\u       "originalText": "First of all, I agree mostly with the topic because I believe there are areas where practical learning matters. And vocational careers like cooking and baking are included in those areas. A person who is going to choose to be a chef could practice cooking, and a person who wants to be a carpenter could learn how to handle wood. Learning about physics would not help them.\n\nSecond, learning practical knowledge since they are young would make them in the field earlier, which would make their career powerful. They might absorb things faster because they are young so that they can achieve their goal in the early stage of their life.\n\nBut what makes me not fully agreed to it is the chance of students to decide to change their career in the future. What if they want to work in a finance industry? What if they want to be a teacher? Life is long, and it is way too crucial if the choice you made when you were in high school interrupts you in the future. That\u2019s why I think students should learn some regular subjects to basic extent. They should know knowledge which is considered common sense, and they should know where they are interested  at by learning basic things.",

      "question": "Around the world, many people buy ready-to-eat food rather than cooking for themselves. Do the advantages of this situation outweigh the disadvantages?",
      "originalText": "The advantages of buying ready-to-eat food don't outweigh the disadvantages of it. There are definite cons of buying ready-to-eat food rather than cooking for myself. It is really costly if you buy the food in restaurants, compared to the case of buying supplies for our meal from grocery stores. These days I pack a lunch box to my work becuase I need to save money, and I can tell it really worked. The cost of buying ready-to-eat food is at least 1.5 times expensive, from my experience, even if a food that you bought from a grocery store is ready-to-cook food.\n\nBut, of course there are some downsides of making my own food. It is not delicious as the food made by chef, or at leat somebody who is proficient at cooking. Also, the menu of my meals feel like they are repeated a lot because I need to use all the ingredients I bought until a week pasts by.\n\nThese are the advantages and disadvantages that I could think of about buying ready-to-eat food. But I value the advantages of making my own meals. I can make food, not only affordable but also in healthy way. I know every single thing that is put inside my food, unlike when I buy food which is already made with unknown ingredients. Also, the process of making food makes me feel like I'm in control of something, which allows me to ahcieve the goal I set up. Moreover, I get so much joy when I make food for others, so it is good for me to practice my cooking skills in my daily life.\n\nTherefore, I would like to make my own food, unless it's time for me to enjoy the mood of the restaurant or sophisticated food.",
