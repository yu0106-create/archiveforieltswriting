<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE for IELTS WRITING</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap');

:root{
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #131315;
  --ink-soft: #6b7076;
  --ink-faint: #9aa0a6;
  --line: #e9e9ea;
  --red: #c23b3b;
  --red-deep: #9a2c2c;
  --red-wash: #fbe9e9;
  --star: #ffcd3c;
  --hl-mint: #ccffff;
  --subhead: #fc3468;
  --radius: 12px;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --en: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --hand: 'Caveat', cursive;
}

*{ box-sizing:border-box; }
html{
  scroll-behavior:smooth;
  /* dotted texture fills the gutters outside the centered 1040px column.
     Two identical radial-gradient layers, the second shifted by half a
     tile both horizontally and vertically, so each dot sits in the gap
     between the two dots of the row above it (a staggered / brick-offset
     grid, not a plain square grid) -- and because it's a repeating
     gradient rather than a dropped-in raster image, it tiles seamlessly
     with no visible seam. */
  background-color: var(--bg);
  background-image:
    radial-gradient(circle, #d7d7d9 1.3px, transparent 1.6px),
    radial-gradient(circle, #d7d7d9 1.3px, transparent 1.6px);
  background-size: 26px 26px, 26px 26px;
  background-position: 0 0, 13px 13px;
}

body{
  margin: 0 auto;
  max-width: 1040px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--kr);
  font-weight: 300;
  line-height: 1.6;
}

a{ color:inherit; text-decoration:none; }
::selection{ background: var(--red-wash); color: var(--red-deep); }
:focus-visible{ outline: 2px solid var(--red); outline-offset: 3px; }

.wrap{
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ---------- top bar ---------- */
.topbar{
  padding: 26px 0 0;
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
}
.topbar .wrap{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom: 20px;
}
.navbtns{ display:flex; gap:8px; }
.navbtns button{
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.navbtns button:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns a:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns button:disabled{ opacity: 0.35; cursor: default; }
.navbtns button:disabled:hover{ border-color: var(--line); color: var(--ink-soft); }
.navbtns button svg{ width: 15px; height: 15px; }
.starnav{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.starnav-btn{
  border: none;
  background: none;
  cursor: pointer;
  padding: 2px 0;
  display: flex;
  gap: 2px;
  line-height: 0;
}
.starnav-btn svg{ width: 13px; height: 13px; }
.star-fill{ fill: var(--star); stroke: var(--star); }
.star-empty{ fill: none; stroke: var(--ink-faint); stroke-width: 1.5; }
.starnav-btn.active svg .star-empty{ stroke: var(--ink); }

.topbar-brand{
  font-family: var(--en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.01em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease, max-width .3s ease;
}
.topbar-brand span{
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}
.topbar-brand .tb-for{
  font-weight: 300;
  font-size: 11.5px;
  color: var(--ink-faint);
}
.topbar-brand:hover{ opacity: 0.65; }
body:not(.is-home) .topbar-brand{
  opacity: 1;
  max-width: 320px;
  transform: translateY(0);
  pointer-events: auto;
}
body:not(.is-home) .topbar-brand:hover{ opacity: 0.65; }

/* ---------- hero ---------- */
/* Collapses via a CSS-grid row (1fr -> 0fr) rather than max-height: a
   max-height transition animates against an arbitrary cap, not the content's
   real height, so it visually snaps shut early and eases out over empty
   space -- this grid technique animates the actual track size instead, so
   the motion tracks the real content height and reads as smooth, not janky. */
.hero-collapse{
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows .3s ease;
}
body:not(.is-home) .hero-collapse{
  grid-template-rows: 0fr;
  pointer-events: none;
}
.hero-collapse-inner{
  overflow: hidden;
  min-height: 0;
}
.hero{
  padding: 34px 0 30px;
  opacity: 1;
  transition: opacity .18s ease;
}
body:not(.is-home) .hero{
  opacity: 0;
  transition: opacity .12s ease;
}
.hero .eyebrow{
  font-family: var(--en);
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.1em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 16px;
  display:flex; align-items:center; gap:8px;
}
.hero .eyebrow::before{
  content:"";
  width: 20px; height: 2px;
  background: var(--red);
  display:inline-block;
}
.hero h1{
  font-family: var(--en);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
.hero h1 a{ display:block; transition: opacity .15s ease; }
.hero h1 a:hover{ opacity: 0.6; }
.hero h1 span{ display:block; }
.hero h1 .l1{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.02; }
.hero h1 .l2{ font-size: clamp(38px, 6.4vw, 62px); font-weight: 300; color: var(--ink); margin: 2px 0; }
.hero h1 .l3{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.05; }

/* ---------- legend row (unused, kept out) ---------- */

/* ---------- section headers ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 44px 0 18px;
}
.section-head h2{
  font-family: var(--kr);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
  margin:0;
}
.section-head .count{
  font-family: var(--en);
  font-size: 12px;
  color: var(--ink-faint);
}

/* ---------- category grid ---------- */
.cat-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 12px;
}
.cat-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 18px 18px 16px;
  cursor:pointer;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  display:flex; flex-direction:column; gap:10px;
  position: relative;
}
.cat-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.cat-card.active{ border-color: var(--ink); }
.cat-card .top-row{ display:flex; align-items:flex-start; justify-content:space-between; }
.cat-card .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}
.pill{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  white-space: nowrap;
}
.cat-card .label{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 16.5px;
  line-height: 1.35;
}
.cat-card .desc{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height:1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cat-card .bottom-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: auto; padding-top: 4px;
}
.cat-card .arrow{
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint);
}
.cat-card .arrow svg{ width: 11px; height: 11px; display:block; }

/* ---------- essay cards ---------- */
.essay-grid{ display:flex; flex-direction:column; gap: 12px; }
.essay-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.essay-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.essay-card .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.essay-card .title{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 8px;
}
.essay-card .tag-row{ display:flex; flex-wrap:wrap; gap: 6px; }
.essay-card .score{
  text-align: right;
}
.essay-card .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
  line-height: 1;
}
.essay-card .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- essay detail header ---------- */
.essay-header{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 26px;
  margin: 8px 0 30px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
}
.essay-header .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.essay-header h3{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 22px;
  margin: 0 0 6px;
}
.essay-header .back{
  display:inline-block;
  margin-top: 10px;
  font-family: var(--en);
  font-weight: 600;
  font-size: 12px;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
}
.essay-header .score{ text-align:right; }
.essay-header .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 34px;
  color: var(--ink);
  line-height: 1;
}
.essay-header .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- question + original (uncorrected) text ---------- */
.essay-original{
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin: -12px 0 30px;
  background: var(--card);
}
.essay-original .block + .block{ margin-top: 22px; }
.essay-original .block-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.essay-original .question-text{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14.5px;
  color: var(--ink-soft);
  font-style: italic;
  line-height: 1.6;
}
.essay-original .question-text.placeholder{
  color: var(--ink-faint);
  font-style: normal;
}
.essay-original .original-text p{
  font-family: var(--en);
  font-weight: 400;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.75;
  margin: 0 0 14px;
}
.essay-original .original-text p:last-child{ margin-bottom: 0; }
.essay-original .chart-image{
  max-width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--line);
}

/* ---------- notes card ("알아두기") ---------- */
/* ---------- word/expression doc sidebar + "PDF popup" modal ---------- */
.topbar-right{
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
}
.worddoc-launcher-wrap{ position: relative; display: flex; align-items: center; }
.worddoc-launcher{
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
}
.worddoc-launcher-imgwrap{
  position: relative;
  display: block;
  height: 58px;
}
.worddoc-launcher-imgwrap img{
  height: 58px;
  width: auto;
  display: block;
  transition: opacity .15s ease, transform .15s ease;
}
/* Two pre-rendered layers instead of a CSS filter: wd-outline is a
   precomputed ring that traces only the character's *outer* silhouette
   (any internal gaps -- e.g. between the raised arm and the body -- were
   filled in before the ring was generated, so they're excluded from it).
   It sits behind the character, invisible at rest, and fades in on hover;
   because it has no ring around internal gaps, none appears there. */
.wd-outline{
  position: absolute;
  inset: 0;
  opacity: 0;
  z-index: 0;
}
.wd-char{ position: relative; z-index: 1; }
.worddoc-launcher:hover .wd-outline{ opacity: 1; }
.worddoc-launcher:hover .wd-char{ transform: scale(1.05); }


/* The flyout is split into an invisible "bridge" (this element, flush
   against the launcher with no gap) and a visible inner card offset by
   padding -- not margin. If the visible card started right where the
   hoverable box starts, moving the mouse from the launcher down into the
   list would cross a dead zone with nothing hoverable in it, and :hover
   would drop before the pointer ever reaches the list. Padding keeps the
   whole path continuously "inside" one hoverable element. */
.worddoc-flyout{
  position: absolute;
  right: 0;
  top: 100%;
  padding-top: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
  z-index: 45;
}
.worddoc-launcher-wrap:hover .worddoc-flyout,
.topbar-right.is-open .worddoc-flyout{
  opacity: 1;
  pointer-events: auto;
}
.worddoc-flyout-inner{
  min-width: 230px;
  max-width: 290px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0,0,0,0.14);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.worddoc-flyout-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 6px 10px 4px;
}
.worddoc-flyout-item{
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  border: none;
  background: none;
  font-family: var(--kr);
}
.worddoc-flyout-item:hover{ background: var(--line-soft, #f4f1ec); }
.worddoc-flyout-item .doc-title{ font-weight: 600; font-size: 13.5px; color: var(--ink); }
.worddoc-flyout-item .doc-sub{ font-size: 11px; color: var(--ink-faint); margin-top: 1px; }

/* Word-doc content is shown inline as its own page (see the "#/words" route
   family), not in a modal -- this just gives it slightly roomier padding
   than a standard notes-card. */
.worddoc-card{ padding: 0; margin-bottom: 20px; }
.worddoc-card .notes-content{ gap: 10px; }

/* Refined "reference sheet" look for the word-doc modal specifically.
   Collapsed chips keep the shared pill look used everywhere else on the site
   (same click-to-expand interaction people already know) -- but once
   expanded, the content reads like a clean glossary page rather than a
   stack of gray admin boxes: no box fill, a hairline rule between groups,
   dashed rules between entries, and each entry's own typographic hierarchy
   (bold pattern / italic example / small vocab caption) instead of uniform
   body text. */
/* "Index card" look (option B): each numbered entry is its own flat card --
   cream fill, thin border, one soft shadow for a touch of lift. No stacked
   "peek" card behind it -- just the single front card. Collapsed chips keep
   the shared pill look used everywhere else on the site (same click-to-
   expand interaction people already know). */
.worddoc-card .notes-section{
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
}
.worddoc-card .notes-section.is-collapsed{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 14px;
}
.worddoc-card .notes-section:not(.is-collapsed){
  padding-bottom: 4px;
}
.worddoc-card .notes-section:not(.is-collapsed) + .notes-section{
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}
.worddoc-card .notes-section:not(.is-collapsed) .notes-section-head{ margin-bottom: 14px; }
.worddoc-card .notes-section-title{ font-size: 17px; }

.worddoc-card .notes-content > .notes-section:not(.is-collapsed) .notes-section-body{
  display: flex;
  flex-direction: column;
}
.worddoc-card .notes-block{
  padding: 16px 4px 16px 22px;
  border-bottom: 1px solid var(--line);
}
.worddoc-card .notes-block:last-child{ border-bottom: none; padding-bottom: 4px; }
.worddoc-card .notes-block:first-child{ padding-top: 4px; }

/* Option E: a big fixed-width number column on the left; every other line's
   label reserves the same width (even though it's small text like "EX)" or
   "단어:") so all of a block's text lines start at one shared left edge,
   the way the first line's text starts right after its big number. */
.worddoc-card .notes-line{ align-items: baseline; }
.worddoc-card .notes-line-label{
  flex: 0 0 46px;
  width: 46px;
  overflow: hidden;
  text-align: right;
}
.worddoc-card .notes-line + .notes-line{ margin-top: 6px; }
.worddoc-card .notes-line[data-marker="num"] .notes-line-label{
  font-family: var(--en);
  font-weight: 500;
  font-size: 21px;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="num"] .notes-line-text{
  font-weight: 700;
  font-size: 15.5px;
  color: var(--ink);
}
.worddoc-card .notes-line[data-marker="ex"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="ex"] .notes-line-text{
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
}
.worddoc-card .notes-line[data-marker="vocab"] .notes-line-label,
.worddoc-card .notes-line[data-marker="vocab"] .notes-line-text{
  font-size: 12px;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="desc"] .notes-line-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.worddoc-card .notes-line[data-marker="desc"] .notes-line-text{ color: var(--ink-soft); }

@media (max-width: 480px){
  .worddoc-flyout{ max-width: calc(100vw - 40px); }
}

/* Topbar gets cramped on phones: three groups (nav arrows, brand, launcher+
   stars) competing for width, plus the brand reserving space even while
   invisible, pushed it past the viewport and forced horizontal scrolling.
   Shrink each control and tighten the gaps so everything fits on one line
   without needing to scroll, and stays vertically centered against each
   other at the smaller size. */
@media (max-width: 600px){
  .wrap{ padding: 0 16px; }
  .topbar .wrap{ gap: 8px; }
  .navbtns{ gap: 6px; }
  .navbtns button{ width: 26px; height: 26px; }
  .navbtns button svg{ width: 13px; height: 13px; }
  .topbar-brand{ display: none; }
  .topbar-right{ gap: 6px; }
  .worddoc-launcher-imgwrap,
  .worddoc-launcher-imgwrap img{ height: 40px; }
  .starnav{ gap: 3px; }
  .starnav-btn svg{ width: 11px; height: 11px; }
}

.notes-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin-bottom: 30px;
}
.guide-card{
  border-left-color: var(--red-deep);
}
.notes-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.notes-head .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.notes-head-right{ display:flex; align-items:center; gap:14px; }
.notes-edit-btn{
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.notes-edit-btn:hover{ border-color: var(--ink); color: var(--ink); }
.notes-edit-btn svg{ width: 13px; height: 13px; }
.notes-content{
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.notes-content > .notes-placeholder{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
}
.notes-section{
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  background: #fbfbfb;
}
.notes-section-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  line-height: 1;
}
.notes-section-title{
  font-family: var(--en);
  font-weight: 700;
  font-size: 17px;
  line-height: 1;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--subhead);
  display: flex;
  align-items: center;
  gap: 8px;
}
.notes-section-title-empty::before{ background: var(--ink-faint); }
.notes-section-title::before{
  content: "";
  width: 14px; height: 2px;
  background: var(--subhead);
  display: inline-block;
  flex: none;
}
.notes-section-head .stars{ flex: none; }

/* Collapsible guide chips (used inside .guide-card): collapsed by default,
   click the head to expand. Border, radius, and padding stay identical in
   both states -- and the header keeps the same margin-bottom -- so the box's
   top-left corner and the title's position never shift; only the box's
   width (auto vs full) and whether the body is visible change. */
.notes-section.collapsible > .notes-section-head{ cursor: pointer; }
.notes-section-chevron{
  width: 14px; height: 14px;
  color: var(--ink-faint);
  flex: none;
  display: block;
  transition: transform .15s ease;
}
.notes-section.collapsible.is-collapsed{
  align-self: flex-start;
  width: max-content;
  max-width: 100%;
}
.notes-section.collapsible.is-collapsed > .notes-section-head{
  margin-bottom: 0;
}
.notes-section.collapsible:not(.is-collapsed){
  align-self: stretch;
}
.notes-section.collapsible.is-collapsed .notes-section-body{ display: none; }
.notes-section.collapsible.is-collapsed .notes-section-chevron{ transform: rotate(90deg); }
.notes-section.collapsible:not(.is-collapsed) .notes-section-chevron{ transform: rotate(-90deg); }

.notes-section-body{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 15.5px;
  line-height: 1.85;
  color: var(--ink);
}
.notes-block{ margin-bottom: 14px; }
.notes-block:last-child{ margin-bottom: 0; }
.notes-subhead{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 16px;
  color: var(--subhead);
  background: #fdeff3;
  padding: 9px 12px;
  border-radius: 6px;
  /* margin (not just the box's own padding) on both sides, so the gap
     above and below collapses symmetrically with neighboring .notes-block
     margins instead of the box only "absorbing" spacing on one side. */
  margin: 14px 0;
}
.notes-subhead:first-child{ margin-top: 0; }
.notes-subhead:last-child{ margin-bottom: 0; }
.notes-line{
  display: flex;
  align-items: flex-start;
}
.notes-line-label{
  white-space: pre;
  flex: none;
}
.notes-line-text{
  flex: 1 1 auto;
  min-width: 0;
}
.notes-placeholder{ color: var(--ink-faint); font-style: italic; }
.notes-editarea{
  width: 100%;
  min-height: 220px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px;
  resize: vertical;
  background: #fffef8;
}
.notes-editarea:focus{ outline: 2px solid var(--red); outline-offset: 1px; }
.notes-edit-actions{
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}
.notes-edit-actions button{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  padding: 7px 16px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
}
.notes-edit-actions .notes-save{
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.notes-edit-actions button:hover{ opacity: 0.85; }

/* ---------- entries (sentence-level corrections) ---------- */
.entries{ display:flex; flex-direction:column; }
.entry{
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  display:grid;
  grid-template-columns: 140px 1fr;
  gap: 18px;
}
.entry .meta{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  padding-top: 3px;
}
.entry .meta .meta-row{ display: block; }
.entry .meta .meta-date{ display: block; }
.entry .meta .meta-essaylink{
  display: block;
  margin-top: 4px;
  color: var(--ink-faint);
  text-decoration: underline;
}
.entry .meta .tag{
  display:inline-block;
  margin-top: 8px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  cursor: pointer;
}
.stars{
  display: flex;
  gap: 3px;
}
.stars button{
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  line-height: 0;
}
.stars svg{ width: 15px; height: 15px; }
.stars button:hover svg .star-empty{ stroke: var(--ink-soft); }
.entry .meta .stars{ margin-top: 10px; }

mark.hl{
  background: var(--hl-mint);
  color: #073130;
  border-radius: 2px;
  padding: 0 1px;
  cursor: pointer;
  position: relative;
}
.hl-note-dot{
  display: inline-block;
  width: 5px; height: 5px;
  margin: -3px 0 0 1px;
  border-radius: 50%;
  background: var(--red-deep);
  border: none;
  padding: 0;
  vertical-align: top;
  cursor: pointer;
}
.hl-note-dot:hover{ transform: scale(1.4); }

/* Read-only memo callout (opened by clicking the dot) -- styled like the
   site's own cards (cream surface, hairline border, soft shadow) rather than
   the dark quick-action .hl-popup bubble, since this is content to read,
   not a transient action. */
.hl-memo-view{
  position: absolute;
  z-index: 200;
  width: 500px;
  max-width: calc(100vw - 24px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  padding: 12px 14px;
}
.hl-memo-view-head{
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.hl-memo-view-text{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--ink);
  white-space: pre-wrap;
}
.hl-memo-view-edit,
.hl-memo-view-close{
  width: 22px; height: 22px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.hl-memo-view-edit svg,
.hl-memo-view-close svg{ width: 11px; height: 11px; }
.hl-memo-view-edit:hover{ border-color: var(--red-deep); color: var(--red-deep); }
.hl-memo-view-close:hover{ border-color: var(--ink); color: var(--ink); }
.hl-popup{
  position: absolute;
  z-index: 200;
  background: var(--ink);
  color: #fff;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  padding: 4px;
  border-radius: 6px;
  white-space: nowrap;
  transform: translate(-50%, -100%);
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  display: flex;
  align-items: center;
  gap: 2px;
}
.hl-popup::after{
  content: "";
  position: absolute;
  left: 50%; top: 100%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--ink);
}
.hl-popup-btn{
  border: none;
  background: none;
  color: #fff;
  font-family: inherit;
  font-size: inherit;
  font-weight: 300;
  cursor: pointer;
  padding: 5px 9px;
  border-radius: 4px;
}
.hl-popup-btn:hover{ background: rgba(255,255,255,0.15); }
.hl-popup-sep{ width: 1px; height: 14px; background: rgba(255,255,255,0.25); flex: none; }

.hl-memo-panel{
  position: absolute;
  z-index: 200;
  width: 240px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.16);
  padding: 8px;
}
.hl-memo-textarea{
  width: 100%;
  min-height: 70px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  color: var(--ink);
  box-sizing: border-box;
}
.hl-memo-actions{
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 6px;
}
.hl-memo-actions button{
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
}
.hl-memo-actions button:hover{ border-color: var(--ink); color: var(--ink); }
.hl-memo-actions .hl-memo-save{ background: var(--ink); color: #fff; border-color: var(--ink); }
.hl-memo-actions .hl-memo-save:hover{ opacity: 0.85; }
.hl-zone{ cursor: text; }

.entry .body .wrong{
  position: relative;
  font-family: var(--en);
  font-weight: 400;
  font-size: 15.5px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 4px;
}
.entry .body .wrong .struck{
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--ink-faint);
}
.correction-note{
  position: absolute;
  transform: translateX(-50%);
  font-family: var(--hand);
  font-size: 17px;
  line-height: 1.15;
  color: var(--red-deep);
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
}
.full-correction{
  font-family: var(--hand);
  font-size: 19px;
  line-height: 1.3;
  color: var(--red-deep);
  margin: 2px 0 14px;
}
.entry .body .explanation{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.6;
}

.empty{
  padding: 40px 0;
  color: var(--ink-faint);
  font-size: 14px;
  font-family: var(--kr);
}

footer{
  margin-top: 60px;
  padding: 26px 0 50px;
  border-top: 1px solid var(--line);
  font-family: var(--en);
  font-size: 11.5px;
  color: var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}

@media (max-width: 760px){
  .cat-grid{ grid-template-columns: repeat(2, 1fr); }
  .entry{ grid-template-columns: 1fr; gap: 6px; }
  .entry .meta{ padding-top:0; }
  .entry .meta .meta-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .entry .meta .meta-date{ white-space:nowrap; }
  .entry .meta .tag{ margin-top:0; }
  .entry .meta .stars{ margin-top:0; }
  .hero{ padding: 24px 0 22px; }
  .essay-card{ grid-template-columns: 1fr; }
  .essay-card .score{ text-align:left; }
  .essay-header{ grid-template-columns: 1fr; }
  .essay-header .score{ text-align:left; }
}
@media (max-width: 480px){
  .cat-grid{ grid-template-columns: 1fr; }
}
</style>

      "guide": "━━━ as의 여러 쓰임 정리 ━━━\n\nas는 '~만큼'이라는 비교 표현으로만 쓰이는 게 아님. 어떤 역할로 쓰였는지에 따라 짝이 필요한지 아닌지가 갈림.\n\n1) 정도 비교 (~만큼 …하다) — 반드시 앞뒤로 짝을 이뤄야 함\n   설명: as 형용사 as 구조에서 형용사 앞뒤로 as가 하나씩 있어야 함. 하나라도 빠지면 비교 구문이 깨짐.\n   Ex) It is not as delicious as food made by a chef. (O)\n   Ex) It is not delicious as food made by a chef. (X, 앞의 as가 빠짐)\n\n2) 이유 (~때문에) — 단독으로 씀\n   설명: 문장 맨 앞에서 이유를 나타낼 때는 as 혼자 씀.\n   Ex) As it was raining, we stayed inside.\n\n3) 시간 (~하는 동안/때) — 단독으로 씀\n   설명: 두 사건이 거의 동시에 일어남을 나타낼 때 씀.\n   Ex) As I was leaving, the phone rang.\n\n4) 자격·역할 (~로서) — 단독으로 씀\n   설명: 어떤 신분이나 역할로서 무엇을 한다는 의미. 뒤에 명사(역할)가 옴.\n   Ex) She works as a teacher.\n\n5) 간주 (~로 여기다) — 단독으로 씀\n   설명: regard/view/see/describe/treat 같은 동사와 짝을 이뤄 'A를 B로 여기다'라는 뜻을 만듦 (전치사 감각 잡기 참고).\n   Ex) People regard it as important.\n\n요약: as가 '정도 비교' 역할일 때만 반드시 앞뒤로 짝(as...as)이 필요하고, 이유·시간·자격·간주로 쓰일 때는 단독으로 씀. 문장에서 as가 무엇을 비교하고 있는지부터 확인하면 헷갈리지 않음."

      "id": "word-form",

    {

      "description": "가산·불가산 여부와 특정성에 따라 a/an, the의 사용 여부가 달라짐. in second place 같은 관용구에는 관사를 쓰지 않고, 일반적 의미의 time 같은 불가산명사 앞에도 the를 붙이지 않음.",
      "guide": "━━━ 명사 뒤 수식어와 the의 관계 ━━━\n\n관사(the)는 명사 자체에 붙어 있는 한정 표현에 반응하는 것이지, 문장 앞뒤에 놓인 맥락 정보 전체에 반응하는 게 아님. 문장 앞에 배경 설명이 있어도 그것이 명사 바로 옆에 붙지 않으면 the를 유발하지 않음.\n\n## the가 필요한 경우: 명사 바로 뒤에 붙는 한정 표현\n\n1) 명사 + of구\n   설명: 명사 뒤에 '무엇에 대한 것인지'를 못박는 of구가 바로 붙으면, 그 명사는 더 이상 일반 개념이 아니라 특정 대상이 되므로 the가 필요함.\n   Ex) the growth of UK tourist numbers (O) — growth 뒤에 붙은 of구가 무엇의 성장인지 특정함\n   Ex) the motivation of the students (O)\n\n2) 명사 + 관계절\n   설명: 명사 뒤에 which/that/who로 시작하는 관계절이 붙어 대상을 좁혀주는 경우에도 the가 필요함.\n   Ex) the report that was published last year (O)\n\n3) 명사 + 숫자(동격)\n   설명: year, number처럼 '무엇'을 가리키는 명사 뒤에 구체적인 숫자가 콤마 없이 바로 붙어서 동격으로 그 명사를 특정하는 경우에도 the가 필요함. of구나 관계절만큼 강력한 한정 표현임.\n   Ex) In the year 1995, it is drama that stands out as the most popular genre. (O) — year 뒤에 1995가 동격으로 붙어 몇 년인지 특정함\n   비교) In 1995 (O, year 없이 숫자만 쓰면 애초에 관사 문제가 생기지 않음) / in year 1995 (X, year를 명사로 쓰면서 the를 생략하면 틀림)\n\n## the가 필요 없는 경우: 문장 전체를 꾸미는 부사구\n\n문장 맨 앞이나 뒤에 오는 for/in/among 같은 전치사구는 대개 명사 하나에 붙는 수식어가 아니라, 문장 전체(명제)가 적용되는 범위나 조건을 알려주는 역할만 함. 명사와 문법적으로 연결된 게 아니라 절 전체를 꾸미는 것이므로, 그 명사는 여전히 아무 수식도 받지 않은 일반적 개념으로 남아 무관사로 씀.\n\n1) For UK tourists, growth was slow.\n   설명: \"For UK tourists\"는 growth라는 명사를 꾸미는 게 아니라, \"이 문장이 적용되는 대상은 UK 관광객이다\"라는 조건을 문장 전체에 걸어주는 역할만 함. growth 옆에는 여전히 아무 수식어도 없으므로 무관사.\n   비교) The growth of UK tourist numbers was slow. — growth 바로 뒤에 of구가 붙어야 the가 필요해짐. \"For UK tourists, the growth was slow\"처럼 the를 넣으면 부자연스러움.\n\n2) In 2013, sales increased.\n   설명: \"In 2013\"은 시점을 나타내는 부사구일 뿐, sales에 붙어서 그것을 한정하는 표현이 아님.\n   비교) The sales of laptops increased in 2013. — sales 뒤에 of구가 붙어야 the가 필요함.\n\n3) Among teenagers, obesity is rising.\n   설명: \"Among teenagers\"도 문장 전체가 적용되는 범위를 나타낼 뿐, obesity 옆에 붙어 그것을 한정하는 표현이 아님.\n   비교) The obesity rate among teenagers is rising. — rate라는 명사 옆에 \"among teenagers\"가 직접 붙어 하나의 명사구(the obesity rate among teenagers)를 이루므로 the가 필요함.\n\n요약: the 여부는 '이 문장에 맥락 정보가 있는가'가 아니라 '그 명사 바로 옆에 이 명사를 특정 대상으로 좁혀주는 표현이 문법적으로 직접 붙어 있는가'로 판단해야 함.\n\n━━━ 무관사 · 부정관사 · 정관사 비교 — food 예시로 보기 ━━━\n\nfood처럼 불가산명사로도 쓰이는 단어는 관사에 따라 의미가 완전히 달라짐. 세 가지를 나란히 비교하면 헷갈리지 않음.\n\n1) food (무관사) — 음식이라는 개념 전체를 일반적으로 가리킴\n   설명: 아무 수식어도 없이 '음식'이라는 물질·개념 전체를 말할 때는 관사를 붙이지 않음.\n   Ex) Food is expensive these days. (음식 전반에 대한 일반적 진술)\n\n2) a food (원칙적으로 틀림) — food는 애초에 셀 수 없음\n   설명: food는 불가산명사라 부정관사 a를 붙일 수 없음. 굳이 '한 가지 음식/음식의 한 종류'를 말하고 싶다면 a kind of food, a type of food처럼 풀어써야 함.\n   Ex) a food that you bought (X) → the food that you bought / a type of food (O)\n\n3) the food (특정 지칭) — 이미 특정된 그 음식\n   설명: 관계절(that you bought)이나 of구처럼 명사에 직접 붙는 한정 표현이 있어서 '그 음식'으로 특정될 때는 the를 씀.\n   Ex) the food that you bought from a grocery store (O)\n\n요약: 일반적 개념 전체 = 무관사, 셀 수 없는 명사에 '한 개'라는 의미의 a = 원칙적으로 불가, 특정 대상으로 좁혀졌다면 the.\n\n━━━ few/a few, little/a little — 있음 vs 거의 없음 ━━━\n\n똑같이 '조금'이라는 뜻처럼 보여도, 부정관사 a가 있고 없고에 따라 뉘앙스가 정반대가 됨.\n\n1) a few / a little — 부정관사 a가 있으면 긍정적 뉘앙스 ('그래도 좀 있다')\n   설명: 가산명사에는 a few, 불가산명사에는 a little을 씀. 양은 적지만 '있다'는 쪽에 초점이 있음.\n   Ex) I have a few friends. (친구가 몇 명 있음 — 긍정적)\n   Ex) There is a little water left. (물이 조금 남아있음 — 긍정적)\n\n2) few / little — a 없이 쓰면 부정적 뉘앙스 ('거의 없다')\n   설명: 똑같이 가산명사엔 few, 불가산명사엔 little을 쓰지만, 관사 a가 빠지면 '부족하다'는 부정적 의미로 바뀜.\n   Ex) I have few friends. (친구가 거의 없음 — 외로움 뉘앙스)\n   Ex) There is little water left. (물이 거의 없음 — 부족함 뉘앙스)\n\n   비교) a few friends (친구가 몇 명 있음, O) / few friends (친구가 거의 없음, 의미가 정반대) — 관사 a 하나로 뉘앙스가 뒤집히므로 반드시 의도한 의미에 맞게 골라야 함.\n\n요약: 가산명사엔 few 계열, 불가산명사엔 little 계열을 쓰되, a가 있으면 '있다'(긍정), a가 없으면 '거의 없다'(부정)는 뜻이 됨.\n\n━━━ 가산·불가산명사 × a/the/무관사 조합표 ━━━\n\n관사 선택은 명사가 가산(셀 수 있음)인지 불가산(셀 수 없음)인지, 그리고 그 명사가 특정 대상으로 좁혀졌는지(한정) 아니면 일반적 개념·전체를 가리키는지에 따라 결정됨. 아래는 명사 종류(행) × 관사(열) 아홉 칸을 모두 짚어본 것.\n\n## 가산명사 단수 (a car / the car / car)\n\n1) a/an — O, 기본형\n   설명: 처음 언급하거나, 여러 개 중 어느 것이어도 상관없는 하나를 가리킬 때 씀. 가산명사 단수의 default 관사임.\n   Ex) I bought a car last year.\n2) the — O, 특정 지칭\n   설명: 이미 언급됐거나, of구·관계절 등으로 어느 것인지 특정될 때 씀.\n   Ex) The car I bought last year broke down.\n3) 무관사 — X, 원칙적으로 불가\n   설명: 가산명사 단수는 원칙적으로 관사 없이 못 씀. school, bed, prison처럼 본래 기능을 나타내는 관용구(go to school, in bed)나 by car 같은 교통·통신수단 표현은 예외임.\n   Ex) I bought car. (X) → I bought a car. (O)\n   비교) go to school (O, 예외 관용구) / go to a school (O, 특정 건물을 말할 때는 다시 관사 필요)\n\n## 가산명사 복수 (cars / the cars / 무관사 cars)\n\n1) a/an — X, 애초에 결합 불가\n   설명: a/an은 '하나'를 뜻하므로 복수형과는 함께 쓰이지 않음. 개수를 말하고 싶으면 some, many, two 같은 수량 표현을 씀.\n   Ex) a cars (X) → some cars / two cars (O)\n2) the — O, 특정 지칭\n   설명: 특정된 복수 대상을 가리킬 때 씀.\n   Ex) The cars in the parking lot are all electric.\n3) 무관사 — O, 일반적 진술\n   설명: 특정되지 않은 복수 대상을 종류 전체로 일반화해서 말할 때 가장 흔히 씀.\n   Ex) Cars are becoming more expensive.\n\n## 불가산명사 (water / the water / 무관사 water)\n\n1) a/an — X, 원칙적으로 불가\n   설명: 셀 수 없으므로 a를 붙일 수 없음. '한 잔/한 종류'처럼 단위를 말하고 싶으면 a glass of, a kind of, a piece of처럼 단위 명사를 앞세워야 함.\n   Ex) a water (X) → a glass of water (O) / a type of research (O)\n2) the — O, 특정 지칭\n   설명: 관계절·of구 등으로 특정된 그 물질·개념을 가리킬 때 씀.\n   Ex) The water in this bottle tastes strange.\n3) 무관사 — O, 일반적 진술\n   설명: 물질·개념 전체를 일반적으로 가리킬 때 가장 흔히 씀. IELTS 에세이에서 가장 많이 쓰는 형태임.\n   Ex) Water is essential for life.\n\n요약: the는 가산·불가산 여부와 상관없이 '그 명사가 특정 대상으로 좁혀졌는가'에만 반응함. a/an은 가산명사 단수에만 붙고, 무관사는 가산명사 복수와 불가산명사가 '일반적 개념 전체'를 가리킬 때 씀. 표로 보면: (가산단수, 가산복수, 불가산) × (a/an, the, 무관사) 아홉 칸 중 a/an이 자연스러운 칸은 가산단수 하나뿐이고, the는 세 칸 모두 가능하며, 무관사는 가산복수·불가산 두 칸에서 자연스러움.\n\n━━━ a variety of · 수량사로 쓰이는 명사의 관사 ━━━\n\nvariety처럼 '여러 개'라는 뜻을 담은 명사가 a lot of, a number of처럼 수량사 역할을 할 때는, 뒤에 of구가 오더라도 일반적인 the 규칙을 따르지 않고 항상 부정관사 a로 시작한다.\n\n## a variety of = 수량사 관용구\n설명: variety가 여기서는 '무엇에 대한 것'이라는 일반 명사가 아니라, a lot of·a number of·a range of와 같은 부류의 수량 표현으로 굳어져 쓰임. 뒤에 of + 복수명사가 오지만 항상 a로 시작하고 the를 쓰지 않는다.\nEx) a variety of reasons (O) — 여러 가지 이유들\nEx) the variety of reasons (X, 수량사로 쓸 때는 the를 붙이지 않음)\n\n## the variety of = '다양성'이라는 개념 명사\n설명: variety를 수량사가 아니라 '다양함이라는 성질·정도' 자체를 가리키는 일반 명사로 쓸 때는, article 카테고리의 다른 규칙과 마찬가지로 of구·관계절 등으로 특정되면 the가 붙는다.\nEx) The variety of dishes at the restaurant was impressive. (그 식당이 지닌 다양성 자체를 주어로 서술)\n\n비교) a variety of reasons (여러 이유들 — 수량사, a) / the variety of the menu (그 메뉴의 다양성 — 개념 명사, the)\n\n요약: of 뒤에 온다고 무조건 the가 붙는 게 아니라, 그 명사가 '여러 개의 ~들'을 뜻하는 수량사로 쓰였는지, '다양함'이라는 개념 명사로 쓰였는지에 따라 관사가 달라진다.\n\n━━━ 단수 가산명사는 반드시 한정사가 필요함 ━━━\n\n단수 가산명사(countable noun 단수형)는 절대 관사·한정사 없이 혼자 쓰일 수 없음. car, book, idea처럼 셀 수 있는 단수명사 앞에는 반드시 a/an, the, 지시사(this/that), 소유격(my/your), 수사(one, another) 등 무언가가 붙어야 함.\n\n## 단수 가산명사 앞에 올 수 있는 것들\n\n1) a/an — 처음 언급되거나 특정하지 않은 하나\n   Ex) I bought a car last year.\n2) the — 이미 언급됐거나 특정된 대상\n   Ex) I bought the car you recommended.\n3) 지시사·소유격·수사 (this/that/my/your/one 등)\n   Ex) I bought that car. / I bought my car.\n\n## 이 규칙에서 예외인 경우\n\n1) 복수 가산명사 — 관사 없이도 가능\n   Ex) I bought cars. (O)\n2) 불가산명사 — 관사 없이도 가능\n   Ex) I bought water. (O)\n3) 고유명사 — 관사 없이도 가능\n   Ex) I met John. (O)\n\n요약: 단수·가산명사(car 등)는 앞에 관사류가 반드시 있어야 하며(bought car는 오류), 복수형·불가산명사·고유명사는 이 규칙의 예외로 무관사로 써도 됨."

      "originalText": "Scores could be considered as which are determined by eacg team's ability, but the bar chart above show that it could be depended on the season. Of course, as you can see by team B's scores during 2002~2005, there could be a team whose scores are always way above than others. However, Team B's score was 82pt in 2002 but it had became lower until 2004, but it has successfully made their socre better in 2005.\n\nTeam A and Team C's scores are definitely lower than Team A's for the entire given period. Their scores are relatively similar compared to the scores of Team B's, even though the gap changes by the year. Furthermore, until 2003, Team C's performance was better than Team A's. By the way, as the gap had shrinked and Team A had performed better in 2004 with the score of 35. In 2005, TeamA's score has got lower a lot, but they were still above Team C.\n\nThis chart shows two ponits. First one is that the teams' score is not always high or low, and it costantly changes as the season goes. Second, there's something that could be called as a trend in theses scores.",
      "notes": "━━━ 과거 · 과거완료 · 현재완료 구분 ━━━\n\n- 과거(단순과거): 이미 종료된 특정 시점의 사건을 나타냄. 연도가 명시되는 경우 대부분 이에 해당함.\n- 과거완료(had + p.p.): 특정 과거 시점보다 앞서 발생한 사건을 나타냄. 문장 내에 기준이 되는 시점이 먼저 제시되어야 함.\n- 현재완료(has/have + p.p.): 과거부터 현재까지 이어지는 상황, 또는 현재 시점을 기준으로 한 서술에 사용함. 이미 종료된 연도(예: 2005년)를 서술할 때는 사용할 수 없음.\n\n예시 오류: \"it has successfully made their score better in 2005\"\n→ 2005년은 이미 종료된 특정 연도이므로 현재완료(has made)가 아닌 단순과거(made)로 표기해야 함.\n\n━━━ 과거완료 사용 조건 ━━━\n\n과거완료는 문장 내에 '기준이 되는 더 나중 시점'이 존재할 때만 사용 가능함. 그 기준 시점보다 앞선 사건에 한해 had + p.p.를 사용하며, 기준 시점이 없는 경우 단순과거를 사용함.\n\n1) By the time + 과거, 주어 + had + p.p.\n   Ex) By the time the season ended, Team B had already lost its lead.\n   설명: 시즌이 끝난 시점이 기준. 그 이전에 이미 선두를 잃었음을 나타냄.\n\n2) Before + 과거, 주어 + had + p.p.\n   Ex) Before 2004, Team A had never scored above 20 points.\n   설명: 2004년이 기준 시점이며, 그 이전 상황을 서술함.\n\n3) By + 연도, 주어 + had + p.p.\n   Ex) By 2004, the gap between Team A and Team C had narrowed significantly.\n   설명: 'by 2004'가 기준 시점 역할을 하므로 had narrowed 사용이 적절함.\n\n   비교 예시:\n   \"Team A had performed better in 2004\" (오류)\n   → 2004년 자체를 서술하는 문장으로, 기준이 될 더 나중 시점이 없음. 따라서 had performed가 아닌 performed(단순과거)가 적절함.\n   \"By 2005, Team A had performed better than in the previous year.\" (올바름)\n   → 'by 2005'라는 기준 시점이 존재하므로 had performed 사용 가능.\n\n4) After + 주어 + had + p.p., 주어 + 과거\n   Ex) After the score had dropped for two years, it rose again in 2005.\n   설명: 점수가 하락한 사건이 그 이후 상승한 사건보다 먼저 발생했음을 명확히 하기 위해 앞선 사건에 had를 사용함.\n\n요약: 한 문장에 두 개의 과거 사건이 있고, 그중 하나가 다른 하나보다 명백히 먼저 발생했음을 강조할 때만 과거완료를 사용함.",

      "originalText": "The graph below shows changes in proportion in vehicle registration from 1970 to 2010. There is a trend that could be observed. First, truck is the most registrated vehicle among given period, except the fact that taxi exceeded truck in 1980. Truck’s registration proportion almost reached 50 percent in 1970 and 2010. Second, bus is the least registrated vehicle through the for every periods. It has never been above 20 percent. Lastly, bus has a tendency to be ranked in a second place, and it has fluctuated a lot as the time passed.",
      "notes": "━━━ 현재완료 · 단순과거 구분 ━━━\n\n- 단순과거: 이미 종료된 특정 기간이나 시점의 사건을 나타냄. 종료 연도가 명시되는 경우 대부분 이에 해당함.\n- 현재완료(has/have + p.p.): 과거부터 현재까지 이어지는 상황, 또는 현재 시점을 기준으로 한 서술에 사용함. 종료 연도가 명시된 기간(예: 1970~2010년)을 서술할 때는 사용할 수 없음.\n\n예시 오류: \"It has never been above 20 percent.\"\n→ 1970년부터 2010년까지는 이미 종료된 기간이므로 현재완료(has been)가 아닌 단순과거(was)로 표기해야 함.\n\n예시 오류: \"it has fluctuated a lot\"\n→ 같은 이유로 단순과거(fluctuated)가 적절함.\n\n━━━ 관사 사용 규칙 ━━━\n\n관사는 명사가 특정 대상을 가리키는지, 일반적 개념을 가리키는지에 따라 붙이거나 생략함.\n\n1) 관용 표현에는 관사를 넣지 않음\n   Ex) ranked in second place (O) / ranked in a second place (X)\n   설명: in first/second/third place와 같은 순위 표현은 관사 없이 씀.\n\n2) 일반적 의미로 쓰인 불가산명사 앞에는 the를 넣지 않음\n   Ex) as time passed (O) / as the time passed (X)\n   설명: 특정 시점을 가리키는 것이 아니라 '시간이 흐르면서'라는 일반적 의미이므로 the를 붙이지 않음.\n\n3) 반대로, 특정한 기간·대상을 가리킬 때는 the가 필요함\n   Ex) throughout the given period (O) / among given period (X)\n   설명: 그래프에 제시된 특정 기간(1970~2010년)을 가리키므로 the가 필요하며, among은 하나의 기간과는 어울리지 않는 전치사이므로 throughout으로 바꿔야 함.\n\n4) 종류·범주 전체를 가리키는 가산명사는 관사 없이 씀\n   Ex) Trucks were the most common type of vehicle. (O)\n   비교) The truck in the picture was red. (특정한 트럭 한 대를 가리킴 → the 필요)\n   설명: Truck, Taxi, Bus처럼 도표 범례의 항목명을 그대로 문장의 주어로 써서 그 종류 전체의 통계를 서술할 때는 특정 대상 하나를 가리키는 것이 아니므로 관사가 필요 없음. 이때는 원칙적으로 단수(Truck)보다 복수형(Trucks)을 주어로 쓰는 것이 더 표준적인 표현임.\n\n5) 가산명사·불가산명사 구분 기준\n   설명: 명사를 셀 수 있는지 없는지는 '누가 세더라도 기준이 같은지'로 판단함. 하나의 단위가 명확하고 고정되어 있으면 가산명사, 하나의 단위를 사람마다 다르게 나눌 수 있으면 불가산명사임.\n   Ex) a chair, an idea, a day → 단위가 명확함 (가산명사)\n   Ex) bread, water, furniture → 물질이나 집합 전체를 가리켜 고정된 단위가 없음 (불가산명사)\n\n   불가산명사는 그 자체로는 개수를 셀 수 없으므로, 단위를 나타내는 명사(a piece of, a loaf of, a glass of 등)를 앞에 붙여야 개수를 표현할 수 있음.\n   Ex) a loaf of bread(빵 한 덩어리) / a slice of bread(빵 한 조각) — 같은 bread라도 어디까지를 '하나'로 볼지는 사람마다 다르므로, 그 기준을 단위명사로 정해줘야 함.\n   Ex) a piece of furniture(가구 한 점), a piece of information(정보 하나), a glass of water(물 한 잔)\n\n   같은 단어도 의미에 따라 가산·불가산이 달라지기도 함.\n   Ex) hair(불가산, 머리카락 전체) / a hair(가산, 머리카락 한 올)\n   Ex) paper(불가산, 종이라는 재질) / a paper(가산, 문서·논문 한 부)\n   Ex) chicken(불가산, 닭고기) / a chicken(가산, 닭 한 마리)\n\n6) 불가산명사와 관사의 관계\n   설명: a/an은 '하나'라는 의미를 내포한 관사이므로, 애초에 정해진 단위가 없는 불가산명사에는 절대 붙일 수 없음. 다만 the는 불가산명사에도 쓸 수 있으며, 그 여부는 앞의 규칙들과 마찬가지로 '특정 대상을 가리키는지'에 달려 있음.\n   Ex) water (O) / a water (X) — 물이라는 물질 자체는 하나로 셀 수 없으므로 a를 붙일 수 없음\n   Ex) the water in this bottle (O) — '이 병 안에 있는 물'이라는 특정 대상을 가리키므로 the는 가능함\n   Ex) Water is essential for life. (O) — 물이라는 개념 전체를 가리키는 일반적 진술이므로 관사 없이 씀\n\n   즉, 불가산명사는 a/an과는 함께 쓰이지 않지만, the와는 특정성 여부에 따라 함께 쓰일 수 있음.\n\n요약: the는 '무엇을 가리키는지 특정할 수 있는 대상'에만 붙이고, 관용구나 일반적 개념·범주를 가리킬 때는 관사를 생략함.\n\n━━━ 단어 형태 ━━━\n\n동사 register(등록하다)의 과거분사형은 registrated가 아니라 registered임. 동사에 임의로 -ate를 붙여 새로운 단어를 만들지 않도록 주의함.\nEx) the most registered vehicle (O) / the most registrated vehicle (X)",

      "notes": "━━━ 상태동사의 진행형 오용 ━━━\n\n## have + 상태 vs 동작\nhave가 소유·특성을 나타낼 땐 상태동사라서 진행형(-ing)을 원칙적으로 쓰지 않음.\n\nEx) are having trends (✗) → have trends / show a trend (○)\n비교) percentages are having trends → percentages have noticeable trends\n비교) genres are also having trends → genres also show a trend\n설명: 이 글에서 같은 오류가 두 번 반복됨. have가 '가지고 있다'는 지속 상태를 뜻할 때는 have/has로만 쓰고, 마시다·먹다처럼 동작을 뜻할 때만(have lunch 등) 진행형이 가능함.\n\n━━━ 전치사 및 시제 일관성 ━━━\n\n## opposite + 전치사\nopposite는 to와 결합함.\n\nEx) opposite from (✗) → opposite to (○)\n\n## 기간을 나타내는 전치사\n어떤 상태가 지속되는 기간에는 over/during, 시작점과 끝점을 잇는 'A부터 B까지'에는 between A and B(또는 from A to B)를 씀.\n\nEx) declining through two terms (✗) → declining over the two periods (○)\nEx) fluctuated over 1995 to 2005 (✗) → fluctuated between 1995 and 2005 (○)\n\n## 시제 일관성\n차트 묘사 글 전체가 현재시제(shows, are, seem)로 통일되어 있으므로 특정 데이터 값을 언급하는 경우가 아니라면 과거시제를 섞어 쓰지 않음.\n\nEx) fluctuated (✗) → fluctuate (○)",

      "text": "━━━ 전치사 감각 잡기: at · of · by · to · over · between · among ━━━\n\n이 표현집에 반복해서 나오는 전치사 at, of, by, to는 뜻으로 외우기보다 아래 감각으로 이해하면 훨씬 헷갈리지 않음.\n\n## at — 동사 뒤에서 '그 지점에 멈춰있다/도달했다'\n\n동사(peak, remain, stand, stop 등) 바로 뒤에서 '특정 지점에'라는 의미로 씀. 움직이던 것이 정확히 그 지점에서 멈추는 이미지.\n\n1) peak at ~\n   설명: peak가 동사로 쓰여 '그 지점에서 정점을 찍었다'는 뜻. 그래프가 올라가다가 정확히 그 수치 지점에서 멈추는 이미지라 at이 자연스러움.\n   Ex) The number of students from China peaked at 320,000 in 2015.\n\n2) remain at ~\n   설명: remain은 '머무르다'라는 뜻의 동사이므로, '어떤 지점에 머물러 있다'는 의미와 자연스럽게 어울림.\n   Ex) The number of US residents traveling to the UK remained at around 2.8 million.\n\n## of — 명사 뒤에서 '그 명사가 구체적으로 무엇인지 풀어줌'\n\npoint, level, low, high처럼 '어떤 지점'을 가리키는 명사 바로 뒤에서, 그 지점이 정확히 어떤 수치인지 동격처럼 풀어줌. '그 지점 = 얼마'라는 관계.\n\n1) reach the highest point of ~\n   설명: point 자체는 '지점'이라는 추상적인 명사라, 그것이 구체적으로 어떤 수치인지는 of로 이어줘야 함. the point of 3.2 million은 '3.2 million이라는 그 지점'으로 읽힘.\n   Ex) The number of US tourists traveling to the UK reached the highest point of 3.2 million in 2015.\n\n2) hit a low of ~\n   설명: a low도 '최저점'이라는 명사이므로 같은 원리로 of가 붙음.\n   Ex) The number of UK travelers hit a low of three million in 2012.\n\n   비교) peak at 320,000 / reach the highest point of 320,000\n   설명: 똑같이 '정점을 찍다'는 뜻이라도, peak처럼 동사로 쓰면 at, point처럼 명사로 쓰면 of가 붙음. 동사 뒤에는 at, 명사 뒤에는 of로 기억하면 헷갈리지 않음.\n\n## by — '변화의 폭' (그만큼의 차이)\n\n무엇이 얼마나 변했는지, 그 변화의 크기(margin)를 나타냄. 도착한 값이 아니라 '이동한 거리'를 말하는 감각.\n\n1) fall/drop/increase by + 수치\n   설명: by 뒤에 오는 숫자는 '변화의 양'이지 '결과값'이 아님. 27퍼센트만큼 떨어졌다는 뜻이지 27퍼센트가 됐다는 뜻이 아님.\n   Ex) Truck numbers dipped notably, falling by almost 27 percent in the second year.\n\n## to — '변화 후 도착한 최종 값'\n\n변화가 끝나고 도달한 결과값(도착지)을 나타냄. by와 정반대로, '얼마나'가 아니라 '어디까지'를 말하는 감각.\n\n1) fall/rise/halve to + 수치\n   설명: to 뒤에 오는 숫자는 변화가 끝난 뒤의 최종 수치임.\n   Ex) Sweden's proportion had roughly halved to 35 percent.\n\n   비교) fell by 5 percent / fell to 5 percent\n   설명: 원래 수치가 30퍼센트였다면, fell by 5 percent는 25퍼센트가 된 것이고 fell to 5 percent는 5퍼센트가 된 것이라 결과가 완전히 다름. 헷갈리면 문장의 의미 자체가 바뀌므로 반드시 구분해야 함.\n\n## over — '기간에 걸쳐'와 '~보다 많이', 두 가지 감각\n\n1) over + 기간 — 그 기간 전체에 걸쳐 (변화의 흐름을 강조)\n   설명: 어떤 값이 특정 기간 동안 점진적으로 변해왔다는 흐름을 강조할 때 씀. 그 기간 전체를 하나의 화살표처럼 관통하는 이미지.\n   Ex) increased gradually over the 20-year period (O)\n   Ex) almost doubling over the three-year period (O)\n\n2) over + 수치 — '~가 넘는'이라는 뜻의 수식어\n   설명: 이때 over는 기간이 아니라 뒤에 오는 수치를 꾸며서 '그 수치보다 많이'라는 뜻이 됨. more than과 같은 역할.\n   Ex) Traffic soared sharply by over 150 million in the last five years. (여기서 over는 150 million을 수식함, 기간이 아님)\n   Ex) growing by over two-thirds between the two years (여기서도 over는 two-thirds를 수식함)\n\n## over vs during vs between — 기간을 나타낼 때의 미묘한 차이\n\n1) over — 손가락으로 그래프 선을 처음부터 끝까지 쭉 훑는 이미지\n   설명: 그 기간의 시작점부터 끝점까지, 수치가 오르내려온 궤적 전체를 그림. '기간 내내 일어난 변화'를 하나로 묶어서 말할 때 씀.\n   Ex) increased gradually over the 20-year period (20년 전체를 훑으며 그린 증가 궤적)\n\n2) during — 그 기간 어딘가의 한 장면에 스포트라이트를 비추는 이미지\n   설명: 기간 전체의 흐름이 아니라, 그 구간 '안의 어느 지점'에 스포트라이트를 비춰서 무대를 깔아주는 느낌. that period 자체가 사건의 주인공이 아니라 배경이 됨.\n   Ex) Motorcycle registrations varied consistently during the whole period, with peaks in 1995 and 1997. (그 기간이라는 무대 위에서 벌어진 변동)\n\n3) between — 두 지점에 깃발 두 개만 꽂아두는 이미지\n   설명: 시작 깃발과 끝 깃발만 꽂아 '이 사이'라는 틀을 정해줄 뿐, over처럼 그 안에서 어떻게 변해왔는지 궤적을 그리지는 않음. 보통 between A and B 형태로 두 끝점을 명시함.\n   Ex) There were significant changes in the volume of migration between 1990 and 2010. (1990년과 2010년에 깃발을 꽂아 그 사이 구간만 지정)\n\n   비교) over the 20-year period (그 20년의 궤적을 쭉 훑음) / during the period (그 기간이라는 무대 위 한 장면) / between 1990 and 2010 (두 지점에 깃발만 꽂아 구간을 지정 — 궤적도 무대도 아님)\n\n## by의 또 다른 뜻 — '변화의 폭' vs '마감 시점'\n\n설명: 앞서 다룬 by(변화의 폭)와 달리, by 뒤에 연도가 오면 '그 시점까지는'이라는 마감 기한의 의미로 씀. 두 뜻이 헷갈리기 쉬우므로 반드시 구분해야 함.\n   Ex) Projections show that 25 percent of the population will fall into this category by 2050. (마감 시점 — '2050년까지는')\n   Ex) The total of master's degree students, representing approximately nine percent in 1980, nearly quadrupled by 2000. (마감 시점)\n   비교) falling by almost 27 percent (변화의 폭 — '27퍼센트만큼')\n\n## from ~ to ~ / between ~ and ~ — 범위의 시작과 끝\n\n설명: 둘 다 수치나 연도의 '범위'를 나타내지만 느낌이 다름. from ~ to ~는 변화의 시작값에서 끝값까지 이동한 궤적을 그리고, between ~ and ~는 두 시점 사이의 구간 자체를 가리킴.\n   Ex) The number of Internet users in Denmark approximately doubled from 22,000 to 45,000. (시작값 → 끝값)\n   Ex) The proportion of workers hired in the agriculture sector decreased substantially from 33 percent in 1981 to 6 percent in 2011. (시작값 → 끝값)\n   Ex) There were significant changes in the volume of migration between 1990 and 2010. (두 시점 사이의 구간)\n\n## between vs among — 대상이 두 개인지 셋 이상인지\n\n설명: between은 정확히 두 지점이나 두 대상 사이를 가리키고, among은 셋 이상의 대상 사이의 관계·비교를 나타냄. from ~ to ~와 between ~ and ~는 둘 다 '두 개'를 전제로 하는 표현이라, 대상이 셋 이상이면 among으로 바꿔야 함.\n   Ex) growing by over two-thirds between the two years (대상 2개 — between)\n   Ex) The gap in population among the three countries had widened by the end of the period. (대상 3개 — among)\n\n요약: 동사 뒤에서 특정 지점을 가리킬 땐 at, 지점을 뜻하는 명사를 구체적 수치로 풀 땐 of, 변화의 폭(얼마나)은 by, 변화의 도착값(어디까지)은 to, 기간에 걸친 흐름은 over, 마감 시점은 by(연도)로, 대상이 둘이면 between, 셋 이상이면 among으로 표현함.\n\n━━━ 증가를 나타낼 때 쓰는 표현 ━━━\n\n1) 점차/빠르게 증가하다 — 주어 increase gradually/quickly\n   Ex) The number of public transit passengers increased gradually over the 20-year period.\n   단어: 대중교통 public transit / 탑승객 passenger\n\n2) 대략/거의 두 배가 되다 — 주어 approximately/almost double\n   Ex) The number of Internet users in Denmark approximately doubled from 22,000 to 45,000.\n\n3) 증가가 더디다/빠르다 — Growth is slow/fast\n   Ex) For UK tourists, growth was slow until 2013, when it started to increase dramatically.\n   단어: 여행객 tourist / 극적으로 dramatically\n\n4) 빠르게/심하게 증가하다 — 주어 rise rapidly/heavily\n   Ex) The amount of beef Brazil exported rose rapidly from 125,465 to 137,650 tons over the ten-year period.\n   단어: 수출하다 export\n\n5) ~으로 정점에 도달하다 — 주어 peak at ~\n   Ex) The number of students from China peaked at 320,000 in 2015, before falling considerably in the next year.\n   단어: 상당히 considerably\n\n6) -에 ~으로 최고점에 도달하다 — 주어 reach the highest point of ~ in -\n   Ex) The number of US tourists traveling to the UK reached the highest point of 3.2 million in 2015.\n\n7) 일시적으로/계속해서 오르다 — 주어 ascend temporarily/continually\n   Ex) In 2000, comedy ascended temporarily to the top spot, before falling in the following year.\n   단어: 1위, 최고의 자리 top spot / 그다음 해에 in the following year\n\n8) 빠르게/극적으로 급증하다 — 주어 surge quickly/dramatically\n   Ex) Tram usage surged quickly from 2003 to 2005, almost doubling over the three-year period.\n   단어: 전차 tram / 두 배가 되다 double\n\n9) 상당히/꾸준히 증가하다 — 주어 grow significantly/steadily\n   Ex) The economic contribution of students from overseas in the US grew significantly.\n   단어: 경제상의, 경제의 economic / 기여 contribution\n\n10) 기하급수적으로/꽤 증가하다 — 주어 go up exponentially/moderately\n   Ex) Bus passenger numbers went up exponentially over the eight years from 2000, eventually reaching five times what they were at the start of the period.\n   단어: 결국 eventually\n\n11) 급격히/눈에 띄게 치솟다 — 주어 soar sharply/remarkably\n   Ex) Traffic soared sharply by over 150 million in the last five years.\n   단어: 교통량 traffic\n\n12) 상승 추세가 보여지다 — An upward/increasing trend is seen\n   Ex) An upward trend was seen in Mexico over the 40-year period, rapidly increasing in pace towards the end.\n   단어: 일정한 속도로 in pace\n\n13) 상당히/갑자기 급증하다 — 주어 shoot up considerably/suddenly\n   Ex) The share of graduates in Portugal shot up considerably from its lowest point of 54 percent in 2005 to a peak of 95 percent in 2009.\n   단어: 졸업생 graduate\n\n━━━ 하락을 나타낼 때 쓰는 표현 ━━━\n\n14) 눈에 띄게/극히 작게 떨어지다 — 주어 dip notably/minimally\n   Ex) Truck numbers dipped notably, falling by almost 27 percent in the second year and continued to drop in subsequent years.\n\n15) 조금/꾸준히 하락하다 — 주어 fall slightly/steadily\n   Ex) The number of US residents traveling to the UK remained at around 2.8 million in 2011 and 2012, but fell slightly in 2013.\n\n16) 서서히/꽤 크게 감소하다 — 주어 decline slowly/sizably\n   Ex) Luxembourg's rate declined slowly from 24% to 13%, which was the largest decrease of all the countries in question.\n\n17) 급속히/근소하게 하락하다 — 주어 drop rapidly/insignificantly\n   Ex) This figure dropped rapidly to 25 percent by 2011, a decrease of almost 50 percent compared to the original amount.\n\n18) 대략/거의 반으로 줄다 — 주어 roughly/nearly halve\n   Ex) Sweden's proportion had roughly halved to 35 percent, which was almost equal to Norway.\n   단어: 비율 proportion / ~과 같은 수준인 equal to\n\n19) 급격히/조금 떨어지다 — 주어 go down sharply/slightly\n   Ex) Iceland's percentage went down sharply to just under 20 percent.\n\n20) 크게/빠르게 폭락하다 — 주어 plummet remarkably/quickly\n   Ex) The proportion of people under the age of 15 plummeted remarkably during the second half of the period.\n   단어: 하반기 second half\n\n21) ~로 최저점에 도달하다 — 주어 hit a low of ~\n   Ex) The number of UK travelers hit a low of three million in 2012 before increasing substantially over the next few years.\n   단어: 상당히 substantially\n\n22) 끊임없이/갑자기 줄어들다 — 주어 shrink consistently/abruptly\n   Ex) The youngest age group was the only one to shrink consistently.\n   단어: 연령대 집단 age group\n\n23) 상당히/빠르게/점차 감소하다 — 주어 decrease substantially/quickly/gradually\n   Ex) The proportion of workers hired in the agriculture sector decreased substantially from 33 percent in 1981 to 6 percent in 2011.\n   단어: 농업 agriculture / 분야 sector\n\n━━━ 변동을 나타낼 때 쓰는 표현 ━━━\n\n24) -년의 기간 동안 변동을 거듭하다 — 주어 fluctuate over the #-year period\n   Ex) The percentage of industrial workers fluctuated over the 20-year period.\n\n25) ~에 큰 변화가 있다 — There are significant changes in ~\n   Ex) There were significant changes in the volume of migration between 1990 and 2010.\n   단어: 양, 용량 volume / 인구 이동 migration\n\n26) 조금씩의 변화가 있다 — There are some slight shifts\n   Ex) Sales figures were more or less stable in the three years, though there were some slight shifts.\n   단어: 거의 more or less\n\n27) 지속적으로/계속해서 변하다 — 주어 vary consistently/continuously\n   Ex) Motorcycle registrations varied consistently during the whole period, with peaks in 1995 and 1997, and a low in 2000.\n   단어: 오토바이 motorcycle / 등록 건수 registration\n\n28) 여러 차례 오르내리다 — 주어 go up and down several times\n   Ex) The percentages for resources and equipment went up and down several times.\n   단어: 재료, 자원 resource"

      "title": "Task 1 · 비교·비율·안정 표현",

      "text": "━━━ 비교를 나타낼 때 쓰는 표현 ━━━\n\n1) ~와 거의/대략 같다 — 주어 is nearly/roughly equal to ~\n   Ex) Adventure represented close to 15 percent, which was nearly equal to the profit rates of the three least popular genres combined.\n   단어: 나타내다, 대표하다 represent / 이익률 profit rate / 합치다 combine\n\n2) 상대적으로 균등하게 분포되어 있다 — 주어 is relatively evenly distributed\n   Ex) The proportions for both sexes in Norway and Finland were relatively evenly distributed.\n\n3) A가 B보다 ~하다 — A is 비교급(higher/lower/more ~) than B\n   Ex) Advertising costs for televisions were higher than those for any other category.\n   단어: 광고비 advertising cost / 범주 category\n\n4) A가 가장 ~하다 — A is 최상급(the most common/the most popular/the highest)\n   Ex) Although the amount of bachelor's degree students decreased, it was still the most common degree at the end of the period.\n   단어: 학사 학위 bachelor's degree\n\n5) ~가 뒤를 이었다 — 주어 followed by ~\n   Ex) The UK spent the most on health, at roughly 8 percent, followed by education at 6.4 percent.\n   단어: 지출하다 spend / 건강 health\n\n6) 바로 뒤를 따르다 — 주어+동사 close behind\n   Ex) Chilean and Finnish men were close behind at roughly 60 percent, whilst South Africa was the lowest.\n   단어: ~하는 반면에 whilst\n\n7) 격차가 넓어지다/좁혀지다 — The gap widens/narrows\n   Ex) The gap in population among the three countries had widened by the end of the period.\n   단어: 격차, 갭 gap\n\n8) ~와 비교해서 — Compared to ~\n   Ex) Compared to the 2010 figure, the 2015 value was around 2.5 times higher.\n   단어: 수치 figure\n\n9) 그에 반해, — In/By contrast,\n   Ex) In contrast, the proportion of people visiting on tour was cut by more than half from 27 percent to 12 percent.\n   단어: 여행 중에 on tour / ~만큼 줄다 cut by\n\n━━━ 비율을 나타낼 때 쓰는 표현 ━━━\n\n10) 비슷한 경향이 보였다 — A similar pattern/trend was seen\n   Ex) A similar pattern was seen on the lower end with refrigerators and washing machines, capturing just 6.78 percent and 6.04 percent of the total.\n   단어: 냉장고 refrigerator / 차지하다, 잡다 capture\n\n11) 반면 — Whereas 주어 + 동사\n   Ex) Wh       var struckRange = { start: 0, end: wrong.length };
      return (
        '<div' + zoneAttrs + '>' + renderAnnotatedText(wrong, hlRanges, struckRange, null) + '</div>' +
        '<div class="full-correction">' + escapeHtml(correct) + '</div>'
      );
    }

    var prefixStr = d.prefix.join(' ');
    var middleStr = d.middleWrong.join(' ');
    var suffixStr = d.suffix.join(' ');
    var reconstructed = [prefixStr, middleStr, suffixStr].filter(function (s) { return s.length; }).join(' ');
    var mStart = prefixStr.length ? prefixStr.length + 1 : 0;
    var mEnd = mStart + middleStr.length;

    return '<div' + zoneAttrs + '>' +
      renderAnnotatedText(reconstructed, hlRanges, { start: mStart, end: mEnd }, d.middleCorrect.join(' ')) +
      '</div>';
  }

  // Measures each struck word's actual on-screen position and places its
  // correction note flush left under it, then reserves exactly enough space
  // below so the note never overlaps the explanation text that follows.
  var NOTE_GAP = 4; // fixed, consistent gap between the strikethrough and the correction note

  function positionCorrectionNotes(root) {
    // idempotent: safe to call again (e.g. after web fonts finish loading, or on resize)
    root.querySelectorAll('.correction-note').forEach(function (n) { n.remove(); });

    var wrongs = root.querySelectorAll('.wrong');
    wrongs.forEach(function (wrongEl) {
      wrongEl.style.paddingBottom = '';
      var struck = wrongEl.querySelector('.struck[data-fix]');
      if (!struck) return;
      var wrongRect = wrongEl.getBoundingClientRect();
      var rects = struck.getClientRects();
      // anchor to the LAST visual line of the struck text, not the first --
      // on a single line these are the same rect (so desktop is unaffected),
      // but if the struck phrase wraps onto 2+ lines (narrow / mobile widths),
      // anchoring to the first line would place the note on top of the
      // text's own remaining wrapped lines.
      var anchorRect = rects[rects.length - 1];
      if (!anchorRect) return;

      var center = anchorRect.left + anchorRect.width / 2 - wrongRect.left;
      var top = anchorRect.bottom - wrongRect.top + NOTE_GAP;

      var note = document.createElement('div');
      note.className = 'correction-note';
      note.textContent = struck.getAttribute('data-fix');
      note.style.top = top + 'px';
      note.style.left = center + 'px'; // temporary, refined below once width is known
      wrongEl.appendChild(note);

      // Note is always a single line (nowrap); if it's wider than the space
      // around the struck word's center, shift it left/right just enough to
      // stay inside the card instead of letting it clip or wrap.
      var noteW = note.getBoundingClientRect().width;
      var half = noteW / 2;
      var clampedCenter = (half * 2 > wrongRect.width)
        ? wrongRect.width / 2
        : Math.min(Math.max(center, half), wrongRect.width - half);
      note.style.left = clampedCenter + 'px';

      var noteRect = note.getBoundingClientRect();
      var neededHeight = (noteRect.bottom - wrongRect.top) - wrongEl.offsetHeight;
      if (neededHeight > 0) {
        wrongEl.style.paddingBottom = (neededHeight + 4) + 'px';
      }
    });
  }

  function colorFor(id) {
    var idx = state.categories.findIndex(function (c) { return c.id === id; });
    if (idx < 0) idx = 0;
    return PALETTE[idx % PALETTE.length];
  }

  function catById(id) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].id === id) return state.categories[i];
    }
    return null;
  }

  function essayById(id) {
    for (var i = 0; i < state.essays.length; i++) {
      if (state.essays[i].id === id) return state.essays[i];
    }
    return null;
  }

  // flatten all entries across essays, each tagged with its parent essay id.
  // "id" is essayId + array-index -- stable regardless of how a view later sorts
  // the list for display, so highlights/stars always point at the right sentence.
  function essayIndexOf(essayId) {
    for (var i = 0; i < state.essays.length; i++) {
      if (state.essays[i].id === essayId) return i;
    }
    return -1;
  }

  function allEntries() {
    var out = [];
    state.essays.forEach(function (essay) {
      essay.entries.forEach(function (e, idx) {
        out.push(Object.assign({}, e, {
          id: essay.id + '-' + idx,
          essayId: essay.id,
          essayTitle: essay.title,
          date: essay.date
        }));
      });
    });
    return out;
  }

  // Finds where an entry's "wrong" excerpt sits inside the essay's original text,
  // so entries can be shown in the order the person actually wrote them —
  // not the order they happen to appear in the data array. Falls back to
  // progressively shorter prefixes in case the excerpt diverges from the raw
  // original (e.g. a typo was normalized when the excerpt was written).
  function essayOrderIndex(essay, entry) {
    if (!essay || !essay.originalText) return Infinity;
    var original = essay.originalText.replace(/\s+/g, ' ').toLowerCase();
    var wrong = entry.wrong.replace(/\s+/g, ' ').toLowerCase();
    for (var len = wrong.length; len >= 10; len -= 5) {
      var pos = original.indexOf(wrong.slice(0, len));
      if (pos !== -1) return pos;
    }
    return Infinity;
  }

  function countFor(catId) {
    return allEntries().filter(function (e) { return e.category === catId; }).length;
  }

  function parseRoute() {
    var h = window.location.hash;
    var mEssay = h.match(/^#\/essay\/(.+)$/);
    if (mEssay) return { type: 'essay', essayId: decodeURIComponent(mEssay[1]) };
    var mTag = h.match(/^#\/tag\/(.+)$/);
    if (mTag) return { type: 'tag', tag: decodeURIComponent(mTag[1]) };
    var mStars = h.match(/^#\/stars\/(\d)$/);
    if (mStars) return { type: 'stars', n: parseInt(mStars[1], 10) };
    var mWordsSection = h.match(/^#\/words\/([^/]+)\/(\d+)$/);
    if (mWordsSection) return { type: 'words', docId: decodeURIComponent(mWordsSection[1]), sectionIdx: parseInt(mWordsSection[2], 10) };
    var mWordsDoc = h.match(/^#\/words\/([^/]+)$/);
    if (mWordsDoc) return { type: 'words', docId: decodeURIComponent(mWordsDoc[1]) };
    var mWords = h.match(/^#\/words$/);
    if (mWords) return { type: 'words' };
    return { type: 'home' };
  }

  function render() {
    var route = parseRoute();
    document.body.classList.toggle('is-home', route.type === 'home');

    var catSection = document.getElementById('catSection');
    var essayHeaderWrap = document.getElementById('essayHeaderWrap');
    var guideArea = document.getElementById('guideArea');
    var listArea = document.getElementById('listArea');
    var entryTitle = document.getElementById('entryTitle');
    var entryCount = document.getElementById('entryCount');
    guideArea.innerHTML = '';

    if (route.type === 'essay') {
      catSection.style.display = 'none';
      renderEssayHeader(route.essayId);
      var essay = essayById(route.essayId);
