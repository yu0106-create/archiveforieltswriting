<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Phrasal Verb Dump</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
:root{
  --lime: #eef7d8;
  --lime-deep: #d7ec9c;
  --lime-line: #c3e07a;
  --pink: #ff6f9c;
  --pink-deep: #e14f7f;
  --pink-wash: #ffe3ec;
  --green: #3fae59;
  --green-deep: #2c8a43;
  --green-wash: #e3f7e7;
  --amber: #e0a940;
  --amber-deep: #8a6d1a;
  --amber-wash: #fff3cf;
  --amber-line: #e8c65a;
  --ink: #33361f;
  --ink-soft: #6b6f4c;
  --paper: #ffffff;
  --red-soft: #d9603f;
  --red-wash: #fbe3da;
  --sky: #3a7ec2;
  --sky-deep: #2a5d92;
  --sky-wash: #e5f0fb;
  --sky-line: #8fbde3;
  --violet: #9b83d9;
  --violet-deep: #5d4494;
  --violet-wash: #f1ecfb;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}
*{ box-sizing: border-box; }
html, body{ margin:0; padding:0; }
body{
  font-family: var(--kr);
  color: var(--ink);
  background: var(--lime-deep);
  min-height: 100vh;
  position: relative;
}
/* 배경 그라데이션을 뷰포트 높이에 고정. body에 직접 그라데이션을 주면
   문서 전체 길이(스크롤 콘텐츠 길이)에 맞춰 그라데이션이 늘어나 버려서,
   카드가 많아 페이지가 길 때는 거의 단색으로 보이다가 검색 결과가
   한 줄 이하로 줄어 페이지가 짧아지면 같은 그라데이션이 압축되어
   아래쪽이 갑자기 진해 보이는 문제가 있었음(스크롤 위치·카드 개수와
   무관하게 배경이 항상 같은 느낌을 유지해야 함). position:fixed 레이어로
   분리해 뷰포트 크기에만 반응하도록 고정 — background-attachment:fixed는
   iOS Safari에서 스크롤 시 버벅이는 문제가 있어 pseudo-element 방식을 사용.*/
body::before{
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,0.6), transparent 40%),
    linear-gradient(180deg, var(--lime) 0%, var(--lime-deep) 100%);
}

/* ---------------- header ---------------- */
.page-head{
  position: sticky; top: 0; z-index: 20;
  background: rgba(238,247,216,0.9);
  backdrop-filter: blur(6px);
  border-bottom: 2px solid var(--lime-line);
  padding: 18px 20px 14px;
}
.page-head-inner{
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.title-block h1{
  margin: 0; font-size: 1.35rem; letter-spacing: -0.01em;
}
.head-icons{
  display: flex; align-items: center; gap: 8px;
}
.icon-btn{
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--lime-line); background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-soft); cursor: pointer; flex-shrink: 0;
  transition: border-color .15s ease, color .15s ease;
  text-decoration: none;
}
.icon-btn:hover{ border-color: var(--pink); color: var(--pink-deep); }
.icon-btn svg{ width: 16px; height: 16px; }
.search-row{
  max-width: 1080px; margin: 12px auto 0;
}
.search-box{
  width: 100%;
  border: 2px solid var(--lime-line);
  background: var(--paper);
  border-radius: 0;
  padding: 10px 16px;
  font-family: var(--kr);
  font-size: 16px;
  color: var(--ink);
  outline: none;
}
.search-box:focus{ border-color: var(--pink); }
.count-line{
  max-width: 1080px; margin: 8px auto 0;
  font-size: 0.78rem; color: var(--ink-soft);
}

/* ---------------- grid ---------------- */
.grid-wrap{
  max-width: 1080px; margin: 0 auto; padding: 22px 20px 80px;
}
.card-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
@media (max-width: 380px){
  .card-grid{ grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 9px; }
  .grid-wrap{ padding-left: 12px; padding-right: 12px; }
}
.verb-card{
  position: relative;
  background: var(--paper);
  border: 2px solid var(--lime-line);
  border-radius: 0;
  padding: 16px 30px 14px 14px;
  cursor: pointer;
  text-align: left;
  display: flex; flex-direction: column; gap: 8px;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  box-shadow: 0 2px 0 var(--lime-line);
}
.verb-card:hover{
  border-color: var(--pink);
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(225,79,127,0.18);
}
.verb-card .headword{
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--ink);
}
.verb-card .meaning-preview{
  font-size: 0.8rem;
  color: var(--ink-soft);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.verb-card .sense-count{
  align-self: flex-start;
  font-size: 0.68rem;
  color: var(--pink-deep);
  background: var(--pink-wash);
  border-radius: 0;
  padding: 2px 9px;
}
.status-badge{
  position: absolute; top: 6px; right: 6px;
  width: 22px; height: 22px;
  border: 1.5px solid var(--lime-line);
  background: var(--paper);
  border-radius: 0;
  padding: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
.status-badge svg{ width: 13px; height: 13px; display: block; }
.status-badge[data-status="known"]{ background: var(--green-wash); border-color: var(--green); color: var(--green-deep); }
.status-badge[data-status="unsure"]{ background: var(--amber-wash); border-color: var(--amber-line); color: var(--amber-deep); }
.status-badge[data-status="unknown"]{ background: var(--red-wash); border-color: var(--red-soft); color: var(--red-soft); }
/* 상태 배지를 누르면 뜨는 팝업 — 현재 상태를 제외한 나머지 두 상태를 바로 고를 수 있게 해서,
   순환(cycle) 방식처럼 중간 상태를 거치며 카드가 재정렬돼 위치를 잃는 문제를 없앤다. */
.status-picker{
  position: fixed;
  z-index: 60;
  display: none;
  gap: 6px;
  background: var(--paper);
  border: 2px solid var(--lime-line);
  box-shadow: 0 6px 14px rgba(51,54,31,0.2);
  padding: 6px;
}
.status-picker.open{ display: flex; }
.status-picker button{
  width: 30px; height: 30px;
  border: 1.5px solid var(--lime-line);
  background: var(--paper);
  border-radius: 0;
  padding: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.status-picker button svg{ width: 16px; height: 16px; display: block; }
.status-picker button[data-status="known"]{ background: var(--green-wash); border-color: var(--green); color: var(--green-deep); }
.status-picker button[data-status="unsure"]{ background: var(--amber-wash); border-color: var(--amber-line); color: var(--amber-deep); }
.status-picker button[data-status="unknown"]{ background: var(--red-wash); border-color: var(--red-soft); color: var(--red-soft); }
.no-results{
  text-align: center;
  color: var(--ink-soft);
  padding: 60px 0;
  font-size: 0.9rem;
}

/* ---------------- notes (memo) panel ---------------- */
.notes-body{
  overflow-y: auto;
  padding: 6px 20px 24px;
}
.notes-intro{
  font-size: 0.82rem; color: var(--ink-soft); line-height: 1.6;
  margin: 10px 0 4px;
}
.note-item{
  border-bottom: 1px solid #eee7d5;
}
.note-item:last-child{ border-bottom: none; }
.note-item > summary{
  list-style: none;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 0;
  cursor: pointer;
  font-weight: 700; font-size: 0.98rem; color: var(--ink);
}
.note-item > summary::-webkit-details-marker{ display: none; }
.note-item > summary .note-chevron{
  flex-shrink: 0; width: 18px; height: 18px; color: var(--ink-soft);
  transition: transform .18s ease;
}
.note-item[open] > summary .note-chevron{ transform: rotate(90deg); }
.note-item-body{
  padding: 0 0 18px;
  color: var(--ink-soft); font-size: 0.86rem; line-height: 1.75;
}
.note-item-body .note-intro-line{
  margin: 0 0 12px;
}
.note-group{
  margin-bottom: 14px;
}
.note-group:last-child{ margin-bottom: 0; }
.note-group-title{
  display: block;
  font-weight: 700; color: var(--ink);
  font-size: 0.82rem;
  background: var(--lime);
  border-left: 3px solid var(--lime-line);
  padding: 4px 8px;
  margin-bottom: 6px;
}
.note-group-items{
  display: flex; flex-wrap: wrap; gap: 6px;
}
.note-word-chip{
  border: 1px solid var(--lime-line);
  background: var(--paper);
  color: var(--ink-soft);
  font-size: 0.78rem;
  padding: 3px 9px;
}
.note-example-block{
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--lime);
  border-left: 3px solid var(--pink);
}
.note-example-block .ex-line{ margin: 0 0 4px; }
.note-example-block .ex-line:last-child{ margin-bottom: 0; }
.note-example-block .ok{ color: var(--green-deep); }
.note-example-block .no{ color: var(--red-soft); text-decoration: line-through; }

/* particle별 뜻 토글: 학습 메모 안에서 한 번 더 접히는 중첩 details.
   (상단 메모 칸 -> "Particle별 뜻 정리" 토글 -> 개별 particle(over 등) 토글
   -> 그 particle이 만드는 의미 카테고리별 정리, 순서로 파고들도록 함) */
.particle-list{ margin-top: 8px; }
.particle-toggle{
  border: 1px solid var(--lime-line);
  background: var(--paper);
  margin-bottom: 8px;
}
.particle-toggle > summary{
  list-style: none;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  font-weight: 700; font-size: 0.88rem; color: var(--ink);
}
.particle-toggle > summary::-webkit-details-marker{ display: none; }
.particle-toggle > summary .note-chevron{
  flex-shrink: 0; width: 16px; height: 16px; color: var(--ink-soft);
  transition: transform .18s ease;
}
.particle-toggle[open] > summary .note-chevron{ transform: rotate(90deg); }
.particle-toggle-body{
  padding: 0 12px 14px;
  border-top: 1px solid #eee7d5;
}
.particle-category{ margin-top: 12px; }
.particle-category-label{
  display: block;
  font-weight: 700; color: var(--pink-deep);
  font-size: 0.8rem;
  margin-bottom: 3px;
}
.particle-category-desc{
  font-size: 0.78rem; color: var(--ink-soft);
  line-height: 1.5;
  margin-bottom: 8px;
}
.particle-example-list{
  display: flex; flex-direction: column; gap: 6px;
}
.particle-example{
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
  background: var(--lime);
  padding: 6px 10px;
}
.particle-example-verb{
  font-weight: 700; font-size: 0.82rem; color: var(--ink);
}
.particle-example-gloss{
  font-size: 0.78rem; color: var(--ink-soft);
}

/* ---------------- modal ---------------- */
.modal-overlay{
  position: fixed; inset: 0;
  background: rgba(51,54,31,0.45);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
  padding: 0;
}
.modal-overlay.open{ display: flex; }
.modal-card{
  background: var(--paper);
  width: 100%; max-width: 640px;
  max-height: 86vh;
  border-radius: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: sheet-up .25s ease;
}
@media (min-width: 700px){
  .modal-overlay{ align-items: center; }
  .modal-card{ border-radius: 0; max-height: 80vh; }
}
@keyframes sheet-up{
  from{ transform: translateY(24px); opacity: 0; }
  to{ transform: translateY(0); opacity: 1; }
}
.modal-head{
  position: sticky; top: 0;
  background: var(--paper);
  border-bottom: 2px solid var(--lime-line);
  padding: 18px 20px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.modal-head-left{
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.modal-head h2{
  margin: 0; font-size: 1.2rem; color: var(--ink); line-height: 1;
}
.modal-head .modal-count{
  display: none;
}
.modal-close{
  border: none; background: var(--lime-deep); color: var(--ink);
  width: 30px; height: 30px; border-radius: 0;
  font-size: 1rem; line-height: 1; cursor: pointer;
  flex-shrink: 0;
}
.modal-body{
  overflow-y: auto;
  padding: 6px 20px 24px;
}
.sense-block{
  padding: 16px 0;
  border-bottom: 1px solid #eee7d5;
}
.sense-block:last-child{ border-bottom: none; }
.sense-idx{
  display: inline-block;
  font-size: 0.68rem;
  color: var(--paper);
  background: var(--pink);
  border-radius: 0;
  padding: 2px 9px;
  margin-bottom: 6px;
}
.sense-top-row{
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.sense-meaning{
  font-size: 1rem; font-weight: 700; color: var(--ink);
}
.sense-note{
  font-size: 0.78rem; color: var(--ink-soft);
  background: var(--lime);
  border-radius: 0;
  padding: 6px 10px;
  line-height: 1.5;
  flex: 1 1 auto;
  max-width: 100%;
}
.sense-cf{
  font-size: 0.76rem; color: var(--sky-deep);
  background: var(--sky-wash);
  border-left: 3px solid var(--sky-line);
  border-radius: 0;
  padding: 6px 10px;
  line-height: 1.5;
  flex: 1 1 100%;
  font-style: italic;
}
.sense-example{
  font-size: 0.92rem; color: var(--ink); margin-bottom: 4px; line-height: 1.5;
}
.sense-translation{
  font-size: 0.85rem; color: var(--ink-soft); line-height: 1.5;
}
.pattern-tags{
  display: flex; flex-wrap: wrap; gap: 5px;
  margin-bottom: 8px;
}
.pattern-tag{
  font-size: 0.68rem; font-weight: 700;
  padding: 2px 8px;
  border-radius: 0;
  border: 1px solid;
}
.pattern-tag.is-trans{ color: var(--pink-deep); background: var(--pink-wash); border-color: var(--pink); }
.pattern-tag.is-intrans{ color: var(--green-deep); background: var(--green-wash); border-color: var(--green); }
.pattern-tag.is-obj{ color: var(--amber-deep); background: var(--amber-wash); border-color: var(--amber-line); }
.pattern-tag.is-pos{ color: var(--ink-soft); background: var(--lime); border-color: var(--lime-line); }
.pattern-tag.is-stative{ color: var(--violet-deep); background: var(--violet-wash); border-color: var(--violet); }

.synonym-row{
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.synonym-tag{
  font-size: 0.72rem; font-weight: 700;
  padding: 2px 9px;
  border-radius: 0;
  border: 1px solid var(--sky-line);
  color: var(--sky-deep); background: var(--sky-wash);
}
.synonym-note{
  font-size: 0.68rem; color: var(--ink-soft);
}

/* ---------------- study (swipe) mode ---------------- */
.study-view{
  max-width: 480px; margin: 0 auto;
  padding: 18px 20px 32px;
  display: flex; flex-direction: column;
  min-height: 100vh;
}
.study-head{
  width: 100%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.study-progress{
  font-size: 0.85rem; color: var(--ink-soft);
}
/* wrapper that centers the stage+actions group as one unit inside
   whatever vertical space is left under study-head, so the group's
   center lands near the screen's center instead of hugging the top */
.study-center{
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px;
  width: 100%;
  padding: 20px 0;
}
.study-stage{
  position: relative;
  width: 100%;
  max-width: 380px;
  height: 440px;
  height: min(600px, 66vh);
  flex-shrink: 0;
}
.swipe-card{
  position: absolute; inset: 0;
  background: var(--paper);
  border: 2px solid var(--lime-line);
  box-shadow: 0 10px 24px rgba(51,54,31,0.18);
  display: flex; flex-direction: column;
  touch-action: none;
  user-select: none;
  cursor: grab;
  overflow: hidden;
}
.swipe-card:active{ cursor: grabbing; }
.swipe-card-inner{
  flex: 1;
  overflow-y: auto;
  padding: 44px 20px 20px;
}
.swipe-card-inner h3{
  margin: 0 0 12px; font-size: 1.3rem; color: var(--ink);
}
/* horizontal segmented bar, inspired by classic iOS toolbar segments:
   one pill-shaped row, thin dividers between segments instead of a
   stack of full-width bars */
.study-actions{
  display: flex; flex-direction: row;
  width: 100%; max-width: 380px;
  border-radius: 999px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(51,54,31,0.2), inset 0 0 0 1px rgba(51,54,31,0.12);
  flex-shrink: 0;
}
.study-btn{
  border: none;
  border-right: 1px solid rgba(0,0,0,0.16);
  flex: 1;
  padding: 15px 6px;
  font-family: var(--kr);
  font-size: 0.86rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  white-space: nowrap;
  cursor: pointer;
  color: #fff;
  text-shadow: 0 1px 1px rgba(0,0,0,0.18);
  transition: filter .1s ease, transform .1s ease;
}
.study-btn:last-child{ border-right: none; }
.study-btn:active{ filter: brightness(0.9); transform: scale(0.985); }
.study-btn-unknown{ background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 48%), var(--red-soft); }
.study-btn-unsure{ background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 48%), var(--amber); }
.study-btn-known{ background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 48%), var(--green); }
@media (max-width: 380px){
  .study-btn{ font-size: 0.76rem; padding: 13px 3px; }
}
.study-empty{
  text-align: center;
  padding: 20px 20px;
  font-size: 1.05rem;
  color: var(--ink-soft);
  line-height: 1.7;
}
.study-empty .big{ font-size: 2rem; display:block; margin-bottom: 10px; }
.study-reset{
  margin-top: 16px;
  border: 1px solid var(--pink); background: var(--pink-wash); color: var(--pink-deep);
  border-radius: 0; padding: 8px 16px; font-family: var(--kr); font-size: 0.82rem; cursor: pointer;
}
</style>
</head>
<body>

<div class="page-head">
  <div class="page-head-inner">
    <div class="title-block">
      <h1>Phrasal Verb Dump</h1>
    </div>
    <div class="head-icons">
      <button type="button" class="icon-btn" id="notesBtn" aria-label="학습 메모" title="학습 메모">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15 3v5h5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 13h8M8 17h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="icon-btn" id="studyEnterBtn" aria-label="스와이프 학습 모드" title="스와이프로 외우기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7.5 5.2v13.6a1 1 0 0 0 1.53.85l10.9-6.8a1 1 0 0 0 0-1.7l-10.9-6.8a1 1 0 0 0-1.53.85Z" fill="currentColor"/></svg>

osition":"before"},"synonym":{"verb":"inconvenience","moreInformal":true}}]},{"headword":"Come up against","first_num":507,"senses":[{"meaning":"(문제·난관 등에) 부딪히다 (직면하다)","note":"3단어 구동사라 목적어가 항상 뒤에만 옴","example":"I came up against a serious problem when I tried to save my work.","translation":"작업을 저장하려다가 심각한 문제에 부딪혔어요","pattern":{"transitive":true,"object":"sth","position":"after"},"synonym":{"verb":"encounter","moreInformal":true}}]},{"headword":"Brush aside","first_num":508,"senses":[{"meaning":"무시하다 (묵살하다)","note":null,"example":"They just brushed aside my complaints; it made me very angry.","translation":"그들은 그냥 제 항의를 무시했어요; 그것 때문에 정말 화가 났어요","pattern":{"transitive":true,"object":"sth","position":"both"},"synonym":{"verb":"dismiss","moreInformal":true}}]},{"headword":"Chase up","first_num":509,"senses":[{"meaning":"재촉하다 (독촉해서 알아보다)","note":null,"example":"Could you chase up Emily's report? She promised it last week but I haven't seen it yet.","translation":"에밀리의 보고서 좀 재촉해서 알아봐 줄 수 있어요? 지난주에 준다고 했는데 아직 못 받았어요","pattern":{"transitive":true,"object":"sb/sth","position":"both"},"synonym":{"verb":"pursue","moreInformal":true}}]},{"headword":"Put out","first_num":510,"senses":[{"meaning":"(성명 등을) 발표하다 (공표하다)","note":null,"example":"The government put out a statement condemning the recent protests.","translation":"정부는 최근 시위를 규탄하는 성명을 발표했어요","pattern":{"transitive":true,"object":"sth","position":"both"},"synonym":{"verb":"issue","moreInformal":true}}]},{"headword":"See to","first_num":511,"senses":[{"meaning":"(일을) 처리하다 (챙기다, 준비하다)","note":null,"example":"Could you see to lunch for our visitors? There will be four of them.","translation":"방문객들 점심 좀 챙겨주실 수 있나요? 네 분이에요","pattern":{"transitive":true,"object":"sth","position":"after"},"synonym":{"verb":"organize","moreInformal":true}}]},{"headword":"Invite out","first_num":512,"senses":[{"meaning":"(밖에서 만나자고) 불러내다","note":"'Ask out'과 달리 연애 감정이 꼭 있어야 하는 건 아님 — 친구·동료 사이에도 쓰고, '집 안이 아니라 밖에서 보자'는 점 자체에 초점이 있음","example":"Jack in const STATUS_KEY = 'pv_status_v1';
function loadStatusLocal(){
  try{ return JSON.parse(localStorage.getItem(STATUS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStatusLocal(s){
  try{ localStorage.setItem(STATUS_KEY, JSON.stringify(s)); }catch(e){ /* storage unavailable */ }
}
let statusMap = loadStatusLocal();

// localStorage = instant local cache (works offline, no lag on click).
// Firestore = shared source of truth that syncs across devices -- a single
// fixed document (kept separate from ielts.html's) that only this page
// reads/writes. A status change made on one device shows up on the others
// within a second or two, no refresh needed, thanks to onSnapshot below.
var SYNC_DOC = db ? db.collection('sync').doc('phrasal-verbs') : null;
var pushTimer = null;
var pushPending = false; // true면 debounce 타이머가 아직 안 끝나 클라우드에 못 나간 상태
function doPush(){
  pushPending = false;
  SYNC_DOC.set({
    status: statusMap,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(function (err) {
    console.error('Sync write failed (staying local-only for now):', err);
  });
}
function pushToCloud(){
  if (!SYNC_DOC) return; // no cloud connection -- local-only mode, already saved above
  clearTimeout(pushTimer);
  pushPending = true;
  pushTimer = setTimeout(doPush, 400);
}
// 카드를 스와이프하자마자 탭을 닫거나 다른 앱으로 전환하면 위 400ms 디바운스가
// 끝나기 전에 페이지가 죽어서 로컬(localStorage)에는 저장됐지만 클라우드엔 못
// 올라가는 경우가 있었음 -- 페이지가 숨겨지거나(다른 앱으로 전환/탭 전환) 완전히
// 닫힐 때 대기 중인 저장이 있으면 디바운스를 건너뛰고 즉시 내보낸다.
function flushPendingPush(){
  if (!pushPending || !SYNC_DOC) return;
  clearTimeout(pushTimer);
  doPush();
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') flushPendingPush();
});
window.addEventListener('pagehide', flushPendingPush);

function getStatus(hw){ return statusMap[hw] || 'unknown'; }
function setStatus(hw, val){
  statusMap[hw] = val;
  saveStatusLocal(statusMap);
  pushToCloud();
}
function cycleStatus(hw){
  const cur = getStatus(hw);
  const next = cur === 'unknown' ? 'unsure' : (cur === 'unsure' ? 'known' : 'unknown');
  setStatus(hw, next);
  return next;
}
// Same stroke-width (2.4) and viewBox on all three so the icons read as
// one consistent family instead of three differently-weighted glyphs.
const STATUS_SYMBOL = {
  unknown: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  unsure: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5 21 19.5H3L12 4.5Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>',
  known: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="2.4"/></svg>'
};
const STATUS_ALL = ['unknown', 'unsure', 'known'];

// 상태 배지를 클릭했을 때, 순환(cycle) 대신 "현재 상태를 제외한 나머지 두 상태" 중 하나를
// 바로 고를 수 있는 작은 팝업을 띄운다. 그리드가 상태 기준으로 정렬되기 때문에, 기존
// 순환 방식은 중간 상태를 거치는 동안 카드가 계속 재정렬되어 위치를 잃어버리는 문제가 있었음.
const statusPicker = document.createElement('div');
statusPicker.className = 'status-picker';
document.body.appendChild(statusPicker);
let pickerHeadword = null;

function closeStatusPicker(){
  statusPicker.classList.remove('open');
  statusPicker.innerHTML = '';
  pickerHeadword = null;
}
function openStatusPicker(badge, headword){
  const cur = getStatus(headword);
  const options = STATUS_ALL.filter(s => s !== cur);
  statusPicker.innerHTML = options.map(s =>
    `<button type="button" data-status="${s}" aria-label="상태를 ${s}(으)로 변경">${STATUS_SYMBOL[s]}</button>`
  ).join('');
  statusPicker.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setStatus(headword, btn.dataset.status);
      closeStatusPicker();
      applySearch(); // 상태가 바뀌면 정렬 순서도 바뀌므로 그리드를 다시 그려서 카드 위치를 즉시 반영
    });
  });
  const rect = badge.getBoundingClientRect();
  statusPicker.style.top = (rect.bottom + 6) + 'px';
  statusPicker.style.left = Math.max(6, rect.right - 74) + 'px';
  statusPicker.classList.add('open');
  pickerHeadword = headword;
  // 팝업 실제 크기를 잰 뒤 화면 밖으로 넘치면 위치를 보정 (아래쪽/오른쪽이 넘치면 반대쪽으로)
  requestAnimationFrame(() => {
    const pr = statusPicker.getBoundingClientRect();
    if(pr.right > window.innerWidth - 6){
      statusPicker.style.left = Math.max(6, window.innerWidth - pr.width - 6) + 'px';
    }
    if(pr.bottom > window.innerHeight - 6){
      statusPicker.style.top = Math.max(6, rect.top - pr.height - 6) + 'px';
    }
  });
}
document.addEventListener('click', (e) => {
  if(!statusPicker.classList.contains('open')) return;
  if(statusPicker.contains(e.target)) return;
  if(e.target.closest && e.target.closest('.status-badge')) return; // 배지 자체 클릭은 배지 핸들러가 열고/닫음을 직접 관리
  closeStatusPicker();
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeStatusPicker(); });
window.addEventListener('scroll', () => { if(statusPicker.classList.contains('open')) closeStatusPicker(); }, true);
window.addEventListener('resize', () => { if(statusPicker.classList.contains('open')) closeStatusPicker(); });

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 문법 패턴 라벨: 기준1) 타동사 여부, 기준2) 목적어가 sb/sth/둘다인지,
// 기준3) particle(전치사/부사)의 앞/뒤/둘다에 목적어가 올 수 있는지.
// pattern이 없는 sense는 아직 라벨링 전이므로 아무것도 표시하지 않음.
const POS_LABEL = { before: '목적어 위치: 전치사 앞', after: '목적어 위치: 전치사 뒤', both: '목적어 위치: 전치사 앞or뒤' };
function buildPatternTags(pattern){
  if(!pattern) return '';
  const tags = [];
  if(pattern.transitive){
    tags.push(`<span class="pattern-tag is-trans">타동사</span>`);
    if(pattern.object){
      tags.push(`<span class="pattern-tag is-obj">${escapeHtml(pattern.object)}</span>`);
    }
    if(pattern.position){
      tags.push(`<span class="pattern-tag is-pos">${escapeHtml(POS_LABEL[pattern.position] || pattern.position)}</span>`);
    }
  } else {
    tags.push(`<span class="pattern-tag is-intrans">자동사</span>`);
  }
  return `<div class="pattern-tags">${tags.join('')}</div>`;
}

// formal 단일 동사 동의어 라벨: 교재 팁(phrasal verb는 종종, 그러나 항상은 아니게,
// single-verb synonym보다 informal함)을 반영. synonym이 없는 sense는 아직
// 라벨링 전이므로 아무것도 표시하지 않음 (하위호환, pattern 필드와 동일한 원칙).
const SYN_NOTE = { true: '구동사가 더 캐주얼함', false: '격식 차이 거의 없음', formal: '구동사가 더 정중함' };
function buildSynonymTag(synonym){
  if(!synonym || !synonym.verb) return '';
  if(synonym.plain === true){
    return `<div class="synonym-row"><span class="synonym-tag">= ${escapeHtml(synonym.verb)}</span></div>`;
  }
  const noteKey = synonym.moreFormal === true ? 'formal' : (synonym.moreInformal === false ? false : true);
  const noteText = SYN_NOTE[noteKey];
  return `<div class="synonym-row"><span class="synonym-tag">= ${escapeHtml(synonym.verb)}</span><span class="synonym-note">${noteText}</span></div>`;
}

// 현재진행형 불가 라벨: sense.noProgressive === true 인 경우에만 표시.
// 상태·인식·소유 등을 나타내는 동사라 진행형으로 거의 쓰이지 않는 sense에 한해 붙임
// (같은 headword라도 sense별로 다를 수 있음 — 예: Care for는 '좋아하다' sense만 해당,
// '돌보다' sense는 동작동사라 해당 없음). 필드가 없으면 아무것도 표시 안 함 (하위호환).
function buildStativeTag(sense){
  if(!sense.noProgressive) return '';
  return `<div class="pattern-tags"><span class="pattern-tag is-stative">현재진행형 불가</span></div>`;
}

function buildSensesHtml(card){
  return card.senses.map((s, i) => `
    <div class="sense-block">
      ${card.senses.length > 1 ? `<span class="sense-idx">${i+1}</span>` : ''}
      <div class="sense-top-row">
        <div class="sense-meaning">${escapeHtml(s.meaning)}</div>
        ${s.note ? `<div class="sense-note">▶ ${escapeHtml(s.note)}</div>` : ''}
        ${s.cf ? `<div class="sense-cf">Cf. ${escapeHtml(s.cf)}</div>` : ''}
      </div>
      ${buildPatternTags(s.pattern)}
      ${buildStativeTag(s)}
      ${buildSynonymTag(s.synonym)}
      ${s.example ? `<div class="sense-example">${escapeHtml(s.example)}</div>` : ''}
      ${s.translation ? `<div class="sense-translation">${escapeHtml(s.translation)}</div>` : ''}
    </div>
  `).join('');
}

// 그리드 카드 정렬 우선순위: X(모르는, unknown) → △(애매한, unsure) → ○(아는, known).
// 같은 상태 안에서는 원래 순서(DATA/검색결과 순서)를 그대로 유지 (stable sort).
const STATUS_ORDER = { unknown: 0, unsure: 1, known: 2 };
function sortByStatus(list){
  return list
    .map((card, i) => ({ card, i }))
    .sort((a, b) => {
      const diff = STATUS_ORDER[getStatus(a.card.headword)] - STATUS_ORDER[getStatus(b.card.headword)];
      return diff !== 0 ? diff : a.i - b.i;
    })
    .map(x => x.card);
}
function renderGrid(rawList){
  const list = sortByStatus(rawList);
  grid.innerHTML = '';
  if(list.length === 0){
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';
  const frag = document.createDocumentFragment();
  list.forEach(card => {
    const el = document.createElement('div');
    el.className = 'verb-card';
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    const previewMeaning = card.senses.map(s => s.meaning).join(' · ');
    const st = getStatus(card.headword);
    el.innerHTML = `
      <button type="button" class="status-badge" data-status="${st}" data-headword="${escapeHtml(card.headword)}" aria-label="학습 상태 변경">${STATUS_SYMBOL[st]}</button>
      <span class="headword">${escapeHtml(card.headword)}</span>
      <span class="meaning-preview">${escapeHtml(previewMeaning)}</span>
      ${card.senses.length > 1 ? `<span class="sense-count">${card.senses.length}가지 뜻</span>` : ''}
    `;
    el.addEventListener('click', () => openModal(card));
    el.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(card); } });
    const badge = el.querySelector('.status-badge');
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      if(pickerHeadword === card.headword && statusPicker.classList.contains('open')){
        closeStatusPicker();
      } else {
        openStatusPicker(badge, card.headword);
      }
    });
    frag.appendChild(el);
  });
  grid.appendChild(frag);
}

function openModal(card){
  modalTitle.textContent = card.headword;
  modalCount.textContent = card.senses.length + '가지 뜻';
  modalBody.innerHTML = buildSensesHtml(card);
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

// ---------------- notes (memo) panel ----------------
// NOTES는 계속 늘어날 수 있는 배열입니다. 항목마다 title(제목)과
// 본문(intro/groups 또는 intro/example/note2)을 갖고, 각각 <details>로
// 토글되어 제목만 보이다가 클릭하면 내용이 펼쳐집니다.
function buildNoteGroupsHtml(groups){
  return groups.map(g => `
    <div class="note-group">
      <span class="note-group-title">${escapeHtml(g.heading)} (${g.words.length})</span>
      <div class="note-group-items">
        ${g.words.map(w => `<span class="note-word-chip">${escapeHtml(w)}</span>`).join('')}
      </div>
    </div>
  `).join('');
}
function buildNoteExampleHtml(example){
  if(!example) return '';
  return `
    <div class="note-example-block">
      ${example.lines.map(l => `<div class="ex-line ${l.ok ? 'ok' : 'no'}">${l.ok ? '✓' : '✕'} ${escapeHtml(l.text)}</div>`).join('')}
    </div>
  `;
}
// particle별 뜻 정리: note.particles = [{ particle, categories: [{ label, desc,
// examples: [{ verb, gloss }] }] }] 형태. particle 하나당 토글 하나, 그 안에
// 책에 나온 뜻 카테고리(예: over의 '위치 변화' vs '철저함')별로 예시 구동사를 묶어서 보여줌.
// 새 particle(up/out/off 등)이 추가되면 이 배열에 원소만 추가하면 됨.
function buildParticleCategoryHtml(cat){
  return `
    <div class="particle-category">
      <span class="particle-category-label">${escapeHtml(cat.label)}</span>
      ${cat.desc ? `<div class="particle-category-desc">${escapeHtml(cat.desc)}</div>` : ''}
      <div class="particle-example-list">
        ${cat.examples.map(ex => `
          <div class="particle-example">
            <span class="particle-example-verb">${escapeHtml(ex.verb)}</span>
            <span class="particle-example-gloss">${escapeHtml(ex.gloss)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function buildParticleItemHtml(p){
  return `
    <details class="particle-toggle">
      <summary>
        <span>${escapeHtml(p.particle)}</span>
        <svg class="note-chevron" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="particle-toggle-body">
        ${p.categories.map(buildParticleCategoryHtml).join('')}
      </div>
    </details>
  `;
}
function buildNoteItemHtml(note, idx){
  const bodyParts = [];
  if(note.intro) bodyParts.push(`<p class="note-intro-line">${escapeHtml(note.intro)}</p>`);
  if(note.groups) bodyParts.push(buildNoteGroupsHtml(note.groups));
  if(note.example) bodyParts.push(buildNoteExampleHtml(note.example));
  if(note.note2) bodyParts.push(`<p class="note-intro-line">${escapeHtml(note.note2)}</p>`);
  if(note.particles) bodyParts.push(`<div class="particle-list">${note.particles.map(buildParticleItemHtml).join('')}</div>`);
  return `
    <details class="note-item">
      <summary>
        <span>${escapeHtml(note.title)}</span>
        <svg class="note-chevron" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="note-item-body">${bodyParts.join('')}</div>
    </details>
  `;
}
const notesBtn = document.getElementById('notesBtn');
const notesOverlay = document.getElementById('notesOverlay');
const notesBody = document.getElementById('notesBody');
const notesClose = document.getElementById('notesClose');
function renderNotes(){
  notesBody.innerHTML = NOTES.map((n, i) => buildNoteItemHtml(n, i)).join('');
}
function openNotes(){
  renderNotes();
  notesOverlay.classList.add('open');
}
function closeNotes(){ notesOverlay.classList.remove('open'); }
notesBtn.addEventListener('click', openNotes);
notesClose.addEventListener('click', closeNotes);
notesOverlay.addEventListener('click', (e) => { if(e.target === notesOverlay) closeNotes(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeNotes(); });

function updateCount(list){
  countLine.textContent = `총 ${DATA.length}개 구동사 (뜻풀이 ${DATA.reduce((a,c)=>a+c.senses.length,0)}개)`;
}
function applySearch(){
  closeStatusPicker();
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ renderGrid(DATA); updateCount(DATA); return; }
  const filtered = DATA.filter(card => {
    if(card.headword.toLowerCase().includes(q)) return true;
    return card.senses.some(s =>
      (s.meaning && s.meaning.toLowerCase().includes(q)) ||
      (s.example && s.example.toLowerCase().includes(q)) ||
      (s.translation && s.translation.toLowerCase().includes(q))
    );
  });
  renderGrid(filtered);
  updateCount(filtered);
}
searchInput.addEventListener('input', applySearch);

// 다른 기기(PC 등)에서 저장한 상태가 있으면 첫 화면부터 반영되도록, 그리기 전에
// 클라우드에서 한 번 최신 statusMap을 당겨온다. (onSnapshot은 비동기라 첫 렌더보다
// 늦게 도착하는 경우가 많음 -- 그러면 옛 로컬 상태로 잠깐 그렸다가 바뀌는 깜빡임이 생김)
// 오프라인/네트워크 지연 대비 최대 1.5초만 기다리고, 그 안에 응답이 없으면 로컬 값
// 그대로 그린다 (오프라인에서도 항상 페이지가 뜨도록).
function initialSync(done){
  if (!SYNC_DOC) { done(); return; }
  var settled = false;
  var timer = setTimeout(function(){
    if (settled) return;
    settled = true;
    done();
  }, 1500);
  SYNC_DOC.get().then(function(doc){
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    if (doc.exists) {
      var data = doc.data() || {};
      statusMap = data.status || {};
      saveStatusLocal(statusMap);
    }
    done();
  }).catch(function(err){
    console.error('Initial sync fetch failed (using local data):', err);
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    done();
  });
}

initialSync(function(){
  renderGrid(DATA);
  updateCount(DATA);
});

/* ---------------- study (swipe) mode ---------------- */
const studyEnterBtn = document.getElementById('studyEnterBtn');
const studyBackBtn = document.getElementById('studyBackBtn');
const studyProgress = document.getElementById('studyProgress');
const swipeCard = document.getElementById('swipeCard');
const swipeCardInner = document.getElementById('swipeCardInner');
const studyEmpty = document.getElementById('studyEmpty');
const studyResetBtn = document.getElementById('studyResetBtn');
const pageHead = document.querySelector('.page-head');

let studyQueue = [];

function buildQueue(){
  const unknowns = DATA.filter(c => getStatus(c.headword) === 'unknown');
  const unsures = DATA.filter(c => getStatus(c.headword) === 'unsure');
  studyQueue = unknowns.concat(unsures);
}

function enterStudy(){
  closeStatusPicker();
  buildQueue();
  pageHead.style.display = 'none';
  gridView.style.display = 'none';
  studyView.style.display = 'flex';
  renderStudyCard();
}
function exitStudy(){
  studyView.style.display = 'none';
  pageHead.style.display = '';
  gridView.style.display = '';
  applySearch();
}
studyEnterBtn.addEventListener('click', enterStudy);
studyBackBtn.addEventListener('click', exitStudy);
studyResetBtn.addEventListener('click', () => {
  statusMap = {};
  saveStatusLocal(statusMap);
  pushToCloud();
  buildQueue();
  studyEmpty.style.display = 'none';
  swipeCard.style.display = 'flex';
  renderStudyCard();
});

function renderStudyCard(){
  resetCardTransform();
  if(studyQueue.length === 0){
    swipeCard.style.display = 'none';
    studyEmpty.style.display = 'block';
    studyProgress.textContent = '0개 남음';
    return;
  }
  swipeCard.style.display = 'flex';
  studyEmpty.style.display = 'none';
  const card = studyQueue[0];
  swipeCardInner.innerHTML = `<h3>${escapeHtml(card.headword)}</h3>` + buildSensesHtml(card);
  swipeCardInner.scrollTop = 0;
  studyProgress.textContent = `${studyQueue.length}개 남음`;
}

function resetCardTransform(){
  swipeCard.style.transition = 'none';
  swipeCard.style.transform = 'translate(0px, 0px) rotate(0deg)';
}

function classify(action){
  const card = studyQueue.shift();
  if(!card) return;
  if(action === 'know'){
    setStatus(card.headword, 'known');
  } else if(action === 'unknown'){
    setStatus(card.headword, 'unknown');
    const pos = Math.min(studyQueue.length, 3);
    studyQueue.splice(pos, 0, card);
  } else if(action === 'unsure'){
    setStatus(card.headword, 'unsure');
    const pos = Math.floor(studyQueue.length / 2);
    studyQueue.splice(pos, 0, card);
  }
  renderStudyCard();
}

function animateAndClassify(action, dx, dy){
  swipeCard.style.transition = 'transform .28s ease';
  swipeCard.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/18}deg)`;
  setTimeout(() => classify(action), 220);
}

document.getElementById('btnUnknown').addEventListener('click', () => animateAndClassify('unknown', -480, 0));
document.getElementById('btnUnsure').addEventListener('click', () => animateAndClassify('unsure', 0, 480));
document.getElementById('btnKnown').addEventListener('click', () => animateAndClassify('know', 480, 0));

/* drag / swipe gesture */
// axisLock: null(아직 방향 결정 전) | 'x'(좌우 스와이프 = 카드 드래그) | 'y'(상하 = 기본적으로
// 뜻풀이 스크롤, 맨 위에서 더 아래로 당길 때만 카드 드래그로 전환돼 "Unsure" 제스처가 됨).
// 뜻이 2개 이상이라 카드 안 내용이 넘칠 때, 스크롤하려는 손동작이 카드째로 끌려나가버리던
// 버그를 고치기 위한 로직 -- 카드 높이를 늘려도 내용이 더 길면 여전히 필요함.
let dragging = false, startX = 0, startY = 0, curX = 0, curY = 0;
let axisLock = null, startScrollTop = 0;
const AXIS_THRESHOLD = 6;

swipeCard.addEventListener('pointerdown', (e) => {
  if(studyQueue.length === 0) return;
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  curX = 0; curY = 0;
  axisLock = null;
  startScrollTop = swipeCardInner.scrollTop;
  swipeCard.style.transition = 'none';
  try{ swipeCard.setPointerCapture(e.pointerId); }catch(err){}
});
swipeCard.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  if(axisLock === null){
    if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
    axisLock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }

  if(axisLock === 'x'){
    curX = dx; curY = dy;
    swipeCard.style.transform = `translate(${curX}px, ${curY}px) rotate(${curX/18}deg)`;
    return;
  }

  // axisLock === 'y': 먼저 뜻풀이 텍스트를 스크롤한다. 이미 맨 위(scrollTop 0)인
  // 상태에서 계속 아래로 당기는 만큼(overshoot)만 카드를 실제로 끌어내린다.
  const maxScroll = Math.max(0, swipeCardInner.scrollHeight - swipeCardInner.clientHeight);
  const desiredScrollTop = startScrollTop - dy;
  const clampedScrollTop = Math.max(0, Math.min(maxScroll, desiredScrollTop));
  swipeCardInner.scrollTop = clampedScrollTop;
  const overshoot = desiredScrollTop < 0 ? -desiredScrollTop : 0;
  curX = 0; curY = overshoot;
  swipeCard.style.transform = `translate(0px, ${curY}px) rotate(0deg)`;
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  const threshold = 90;
  swipeCard.style.transition = 'transform .25s ease';
  if(curY > threshold && Math.abs(curY) > Math.abs(curX)){
    swipeCard.style.transform = `translate(${curX}px, 520px) rotate(0deg)`;
    setTimeout(() => classify('unsure'), 200);
  } else if(curX > threshold){
    swipeCard.style.transform = `translate(520px, ${curY}px) rotate(20deg)`;
    setTimeout(() => classify('know'), 200);
  } else if(curX < -threshold){
    swipeCard.style.transform = `translate(-520px, ${curY}px) rotate(-20deg)`;
    setTimeout(() => classify('unknown'), 200);
  } else {
    swipeCard.style.transform = 'translate(0px, 0px) rotate(0deg)';
  }
}
swipeCard.addEventListener('pointerup', endDrag);
swipeCard.addEventListener('pointercancel', endDrag);

function refreshUI(){
  if (gridView.style.display !== 'none') {
    applySearch();
  } else {
    buildQueue();
    renderStudyCard();
  }
}

// Live sync: whenever the shared cloud document changes -- including from a
// *different* device -- pull it in and refresh whatever's currently on
// screen. hasPendingWrites=true means this snapshot is our own optimistic
// local echo (we already have this data), so skip re-rendering for that one.
if (SYNC_DOC) {
  SYNC_DOC.onSnapshot(function (doc) {
    if (doc.metadata.hasPendingWrites) return;
    if (!doc.exists) return;
    var data = doc.data() || {};
    statusMap = data.status || {};
    saveStatusLocal(statusMap);
    refreshUI();
  }, function (err) {
    console.error('Sync read failed (staying local-only):', err);
  });
}
</script>
