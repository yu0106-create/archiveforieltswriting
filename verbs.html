<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOCA DUMP</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&display=swap');

:root{
  --lemon: #f3e26b;
  --pink: #ff5fa8;
  --mint: #63e9c4;
  --ink: #f2efe6;
  --ink-dim: rgba(242,239,230,0.55);
  --void: #0a0a0b;
  --panel: rgba(10,10,11,0.88);
  --line: rgba(242,239,230,0.14);
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --word-font: 'Cormorant Garamond', 'Times New Roman', serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body{
  margin:0; padding:0; height:100%; width:100%;
  overflow:hidden;
  background: var(--void);
  color: var(--ink);
  font-family: var(--kr);
  font-weight: 300;
  line-height: 1.6;
}

/* ---------- background ---------- */
.bg{
  position:fixed; inset:0; z-index:0;
  background-image:
    radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%),
    url('night-spiral-bg.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: saturate(0.9) brightness(0.85);
}
.bg::after{
  content:"";
  position:absolute; inset:0;
  background: radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.5) 50%, transparent 51%) repeat,
              radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.35) 50%, transparent 51%) repeat,
              radial-gradient(1.2px 1.2px at 40% 80%, rgba(255,255,255,0.3) 50%, transparent 51%) repeat;
  background-size: 180px 180px, 140px 140px, 220px 220px;
  opacity:0.5;
  pointer-events:none;
}

/* ---------- top bar: ielts.html처럼 흰색 고정바 ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding: 13px 22px;
  background: #ffffff;
  border-bottom: 1px solid #e9e9ea;
}
.tb-home{
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid #e9e9ea;
  background: #ffffff;
  display:flex; align-items:center; justify-content:center;
  color: #9aa0a6;
  transition: border-color .15s ease, color .15s ease;
}
.tb-home:hover{ border-color: #131315; color: #131315; }
.tb-home svg{ width: 15px; height: 15px; }
.tb-brand{
  font-family: var(--kr); font-weight:300; font-size: 15.5px;
  letter-spacing: 0.06em; color: #131315; text-transform:uppercase;
}
.tb-brand b{ font-weight:700; }
.tb-right{ display:flex; align-items:center; gap:8px; }
.tb-icon{
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid #e9e9ea;
  background: #ffffff;
  display:flex; align-items:center; justify-content:center;
  color: #9aa0a6;
  cursor:pointer;
  transition: border-color .15s ease, color .15s ease;
}
.tb-icon:hover{ border-color: #131315; color: #131315; }
.tb-icon svg{ width: 15px; height: 15px; }

/* ---------- stage ---------- */
.stage{
  position:fixed; inset:0; z-index:5;
  overflow:hidden;
}
/*
  위치(translate)는 JS가 매 프레임 갱신하므로 여기엔 트랜지션을 걸지 않음(끌림/떨림 방지).
  scale/rotate는 'transform'과 별개인 CSS 개별 속성(translate/scale/rotate)을 써서,
  확대(길게 누르기)·흔들림(오답) 애니메이션만 부드럽게 걸리도록 분리함.
*/
.word{
  position:absolute;
  top:0; left:0;
  transform: translate(-50%,-50%); /* 중심 정렬 고정값, 트랜지션 없음 */
  translate: -999px -999px;       /* JS가 매 프레임 덮어씀 */
  scale: 1;
  rotate: 0deg;
  font-family: var(--word-font);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(17px, 2.6vw, 26px);
  color: var(--ink);
  cursor: pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action: none;
  padding: 6px 10px;
  white-space: nowrap;
  will-change: translate, scale;
  transition: color .25s ease, scale .25s ease;
}
@media (prefers-reduced-motion: reduce){
  .word{ transition: color .25s ease; }
}

.word.charging{
  transition: color 1300ms linear, scale 1300ms ease;
  color: var(--anchor-color, var(--ink));
  scale: 1.3;
}
.word.anchor{
  color: var(--anchor-color, var(--ink));
  scale: 1.3;
  z-index: 2;
}
.word.matched{
  z-index: 2;
}
.word.wrong{
  animation: shake .32s ease;
}
@keyframes shake{
  0%,100%{ rotate: 0deg; }
  25%{ rotate: -3deg; }
  75%{ rotate: 3deg; }
}
.word.leaving{
  transition: scale .5s ease, opacity .5s ease;
  scale: 0.2;
  opacity:0;
}

/* ---------- dock: 완료된 그룹을 작은 배지 형태로 모아두는 영역 ---------- */
.dock{
  position:fixed; top:70px; right:18px; z-index:25;
  display:flex; flex-direction:column; align-items:flex-end;
  gap:8px;
}
.dock-item{
  width:34px; height:34px; border-radius:50%;
  background: rgba(10,10,11,0.82);
  border: 1.5px solid rgba(255,255,255,0.16);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  animation: dockIn .35s ease;
  transition: border-color .15s ease, transform .15s ease;
}
.dock-item:hover{ border-color: rgba(255,255,255,0.5); transform: scale(1.08); }
@keyframes dockIn{ from{ opacity:0; transform: scale(0.5); } to{ opacity:1; transform:none; } }
.dock-dot{ width:12px; height:12px; border-radius:50%; background: currentColor; box-shadow: 0 0 9px currentColor; flex:none; }

/* ---------- overlay card ---------- */
.overlay{
  position:fixed; inset:0; z-index:65;
  background: rgba(4,4,5,0.72);
  display:flex; align-items:center; justify-content:center;
  padding: 24px;
  opacity:0; pointer-events:none;
  transition: opacity .2s ease;
}
.overlay.open{ opacity:1; pointer-events:auto; }

/* ---------- card: ielts.html과 같은 라이트 테마(흰 배경/레드 포인트) ---------- */
.card{
  --c-bg: #ffffff;
  --c-ink: #131315;
  --c-ink-soft: #6b7076;
  --c-ink-faint: #9aa0a6;
  --c-line: #e9e9ea;
  --c-red: #c23b3b;
  --c-red-deep: #9a2c2c;
  --c-subhead: #fc3468;
  --c-subhead-wash: #fdeff3;

  position:relative;
  width:100%; max-width: 720px; max-height: 80vh; overflow-y:auto;
  background: var(--c-bg);
  color: var(--c-ink);
  border: 1px solid var(--c-line);
  border-radius: 12px;
  padding: 26px 26px 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  transform: translateY(10px) scale(0.98);
  transition: transform .2s ease;
}
.overlay.open .card{ transform:none; }

/* 제목/개수 부분은 스크롤해도 위에 붙어있는 고정 상단바 역할 */
.card-header{
  position: sticky; top: 0; z-index: 8;
  background: var(--c-bg);
  margin: -26px -26px 20px; /* .card 자체 패딩을 상쇄해서 좌우 끝까지 꽉 차게 */
  padding: 26px 26px 16px;
  border-bottom: 1px solid var(--c-line);
}
.card-concept{
  font-family: var(--kr); font-weight:700; font-size: 21px;
  color: var(--c-ink);
  margin: 0 0 4px; line-height:1.3;
  display:flex; align-items:center; gap:9px;
}
.card-concept .dot{
  width:10px; height:10px; border-radius:50%; background: currentColor;
  flex:none;
}
.card-sub{
  font-family: var(--kr); font-weight:300; font-size:11.5px; color: var(--c-ink-faint);
  letter-spacing:0.04em;
}
.card-close{
  position:absolute; top:18px; right:18px; z-index:10;
  width:28px; height:28px; border-radius:50%;
  border:1px solid var(--c-line); background:#ffffff; color:var(--c-ink-faint);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size: 16px; line-height:1;
  transition: border-color .15s ease, color .15s ease;
}
.card-close:hover{ color:var(--c-ink); border-color:var(--c-ink); }
.card-back{
  display:inline-block; margin-bottom:10px;
  font-family: var(--kr); font-weight:700; font-size:12px;
  color: var(--c-ink-soft); background:transparent; border:none; cursor:pointer;
  padding:0;
}
.card-back:hover{ color: var(--c-ink); }

.concept-list{ display:flex; flex-direction:column; gap:8px; }
.concept-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  background: #faf9f6; border: 1px solid var(--c-line); border-radius: 8px;
  padding: 13px 14px; cursor:pointer;
  font-family: var(--kr);
  transition: border-color .15s ease, background .15s ease;
}
.concept-item:hover{ border-color:#d8d6d0; background:#f5f3ee; }
.concept-item-label{ flex:1; font-weight:700; font-size:14.5px; color: var(--c-ink); }
.concept-item-count{ font-family: var(--en, var(--kr)); font-weight:300; font-size:11.5px; color: var(--c-ink-faint); }
.concept-item-arrow{ width:14px; height:14px; color: var(--c-ink-faint); flex:none; }

/*
  간격 규칙: 모든 블록(entry/cluster-note/contrast-box)은 오직 margin-bottom(20px)만 가짐.
  margin-top은 절대 쓰지 않음 — 그래야 "이전 요소 뒤 간격"과 "다음 요소 앞 간격"이
  항상 같은 하나의 값(20px)이 되고, 어떤 조합으로 이어지든 간격이 흐트러지지 않음.
*/
.entry{ padding-bottom: 16px; border-bottom: 1px solid var(--c-line); margin: 0 0 20px; }
.entry.entry-highlight{
  background: #faf8f4;
  border-left: 3px solid currentColor;
  padding: 16px 14px;
  margin: 0 0 20px;
  border-bottom: none;
  border-radius: 0 8px 8px 0;
}
.entry-word{
  font-family: var(--word-font); font-style:italic; font-weight:600; font-size:20px;
  color: var(--c-ink);
  margin-bottom:6px;
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
}
.tag-same{
  font-family: var(--kr); font-style:normal; font-weight:700; font-size:10.5px;
  letter-spacing:0.02em; color: var(--c-subhead);
  background: var(--c-subhead-wash);
  padding: 3px 9px; border-radius: 999px;
  position: relative; top: -1px; /* 이탤릭 단어의 시각적 중심과 배지 중심을 맞추기 위한 미세 보정 */
}
.entry-ex{
  font-family: var(--word-font); font-size:15px; color: var(--c-ink);
  line-height:1.5; margin-bottom:6px;
}
.entry-ex b{ font-style:normal; font-weight:700; color: var(--c-red-deep); padding:0 1px; }
.entry-nuance{
  font-family: var(--kr); font-weight:300; font-size:13px;
  color: var(--c-ink-soft); line-height:1.6;
}
.cluster-note{
  font-family: var(--kr); font-weight:300; font-size:12px;
  color: var(--c-ink-soft); margin: 0 0 20px; padding: 9px 12px;
  background: var(--c-subhead-wash); border-radius:6px;
}

/* '헷갈리기 쉬운 짝' — 배지가 테두리 위에 살짝 걸치는 노트 박스 */
.contrast-box{
  position: relative;
  margin: 0 0 4px;
  padding: 18px 16px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--c-ink);
  background: #ffffff;
}
.contrast-title{
  position: absolute; top: -12px; left: 14px;
  font-family:var(--kr); font-weight:700; font-size:11px; letter-spacing:0.03em;
  color: #ffffff; background: var(--c-ink);
  padding: 4px 10px; border-radius: 6px;
  margin-bottom: 0;
}
.contrast-row{ margin-bottom:10px; margin-top: 8px; }
.contrast-row:last-of-type{ margin-bottom:12px; }
.contrast-ex{ font-family: var(--word-font); font-size:14.5px; line-height:1.5; color: var(--c-ink); }
.contrast-ex b{ font-style:normal; font-weight:700; color: var(--c-red-deep); }
.contrast-note{ font-family: var(--kr); font-weight:300; font-size:12.5px; color: var(--c-ink-soft); line-height:1.6; }

/* toast */
.toast{
  position:fixed; bottom: 22px; left:50%; transform: translateX(-50%) translateY(10px);
  background: var(--panel); border:1px solid var(--line); border-radius:999px;
  padding: 9px 18px; font-family:var(--kr); font-size:12.5px; color:var(--ink);
  z-index:40; opacity:0; transition: opacity .25s ease, transform .25s ease;
  pointer-events:none; white-space:nowrap;
  max-width: 80vw; overflow:hidden; text-overflow:ellipsis;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }/* ---------- clear screen ---------- */
.clear-screen{
  position:fixed; inset:0; z-index:60;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px;
  background: rgba(6,6,7,0.35);
  opacity:0; pointer-events:none; /* 배경 자체는 클릭을 막지 않음 → 도킹된 그룹을 계속 누를 수 있음 */
  transition: opacity .35s ease;
}
.clear-screen.show{ opacity:1; }
.clear-title{
  font-family: var(--word-font); font-style: italic; font-weight:600;
  font-size: clamp(48px, 11vw, 96px);
  color: var(--ink);
  text-shadow: 0 0 30px rgba(242,239,230,0.35);
  margin:0;
  transform: translateY(6px) scale(0.94);
  transition: transform .4s ease;
  pointer-events:none;
}
.clear-screen.show .clear-title{ transform:none; }
.clear-restart{
  margin-top: 6px;
  font-family: var(--kr); font-weight:700; font-size:12.5px;
  color: var(--ink); background: rgba(8,8,9,0.6);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 20px; cursor:pointer;
  pointer-events:auto; /* 이 버튼만 클릭 가능 */
  transition: border-color .15s ease, background .15s ease;
}
.clear-restart:hover{ border-color: var(--ink); background: rgba(255,255,255,0.06); }
</style>
</head>
<body>

<div class="bg"></div>

<div class="topbar">
  <a class="tb-home" href="index.html" aria-label="홈으로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
  </a>
  <div class="tb-brand"><b>Voca</b> Dump</div>
  <div class="tb-right">
    <button class="tb-icon" id="btnAllList" aria-label="전체 목록 보기" title="전체 목록 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="tb-icon" id="btnReset" aria-label="새 라운드 시작" title="새 라운드 시작">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
</div>

<div class="stage" id="stage"></div>
<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>

<div class="clear-screen" id="clearScreen">
  <div class="clear-title">Clear!</div>
  <button class="clear-restart" id="btnRestart">다시 시작</button>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(function(){

  /* ============ DATA ============ */
  var DATA = {
    groups: [
      {
        id: "cause",
        pos: "verb",
        theme: "변화·인과",
        concept: "원인이 되다",
        template: "The heavy rain {word} the flood.",
        cluster: [
          { text: "cause", form: "caused" },
          { text: "bring about", form: "brought about" },
          { text: "give rise to", form: "gave rise to" }
        ],
        distinct: [
          {
            text: "trigger",
            example: "The referee's decision triggered angry protests.",
            nuance: "갑작스럽고 즉각적인 반응을 유발할 때 씀. 주로 부정적·격한 사건에 붙음."
          }
        ],
        contrastPair: { a: "cause", b: "trigger",
          noteKo: "cause는 원인-결과를 중립적으로 서술, trigger는 그 반응이 즉각적이고 격렬함을 강조." }
      },
      {
        id: "increase",
        pos: "verb",
        theme: "변화·인과",
        concept: "증가하다",
        template: "House prices in the city {word} rapidly last year.",
        cluster: [
          { text: "increase", form: "increased" },
          { text: "go up", form: "went up" },
          { text: "rise", form: "rose" }
        ],
        distinct: [
          {
            text: "shoot up",
            example: "Demand for masks shot up overnight.",
            nuance: "매우 빠르고 급격하게 늘어남. 놀라움의 뉘앙스가 있음."
          },
          {
            text: "step up",
            example: "The company stepped up its marketing efforts.",
            nuance: "노력·활동의 양을 의도적으로 늘림. 가격·수치 등에는 잘 안 씀."
          }
        ],
        contrastPair: { a: "increase", b: "shoot up",
          noteKo: "increase는 일반적인 증가, shoot up은 그 증가가 매우 가파르고 놀라울 정도임을 강조." }
      },
      {
        id: "decrease",
        pos: "verb",
        theme: "변화·인과",
        concept: "감소하다 / 줄이다",
        template: "Sales {word} sharply after the scandal.",
        cluster: [
          { text: "decrease", form: "decreased" },
          { text: "go down", form: "went down" },
          { text: "decline", form: "declined" }
        ],
        distinct: [
          {
            text: "cut back on",
            example: "The company cut back on staff to save money.",
            nuance: "누군가의 의도적인 결정으로 줄임. 저절로 줄어드는 상황엔 안 씀."
          },
          {
            text: "tail off",
            example: "Interest in the project tailed off after a few months.",
            nuance: "서서히, 자연스럽게 잦아드는 감소. 의도가 없는 흐름을 나타냄."
          }
        ],
        contrastPair: { a: "cut back on", b: "tail off",
          noteKo: "cut back on은 누군가 의도적으로 줄이는 것, tail off는 별다른 개입 없이 저절로 잦아드는 것." }
      },
      {
        id: "need",
        pos: "verb",
        theme: "필요·문제해결",
        concept: "필요로 하다",
        template: "This job {word} strong communication skills.",
        cluster: [
          { text: "need", form: "needs" },
          { text: "require", form: "requires" }
        ],
        distinct: [
          {
            text: "call for",
            example: "The situation calls for immediate action.",
            nuance: "사람이 아니라 상황·환경이 주어가 되어 '그것이 필요하다'고 할 때 자연스러움."
          }
        ],
        contrastPair: { a: "need", b: "call for",
          noteKo: "need/require는 사람·사물이 직접 필요로 할 때, call for는 상황이 무언가를 요구할 때 씀." }
      },
      {
        id: "problem",
        pos: "noun",
        theme: "필요·문제해결",
        concept: "문제",
        template: "We need to solve this {word} quickly.",
        cluster: [
          { text: "problem", form: "problem" },
          { text: "issue", form: "issue" }
        ],
        distinct: [

  var COLORS = ['lemon', 'pink', 'mint'];
  var COLOR_HEX = { lemon: '#f3e26b', pink: '#ff5fa8', mint: '#63e9c4' };
  var TOPBAR_MARGIN = 78;   // 상단바 피하는 여백(px)
  var SIDE_MARGIN = 26;
  var DOCK_ZONE = { x: 0, y: 0, w: 0, h: 0 }; // 초기화시 계산

  /* ============ helpers ============ */
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildUnifiedList(group){
    var list = [];
    group.cluster.forEach(function(w){ list.push({ type: 'cluster', text: w.text }); });
    group.distinct.forEach(function(w){ list.push({ type: 'distinct', text: w.text, nuance: w.nuance }); });
    return list;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function boldPhrase(sentence, phrase){
    var idx = sentence.toLowerCase().indexOf(phrase.toLowerCase());
    if (idx === -1) return escapeHtml(sentence);
    var before = sentence.slice(0, idx);
    var match = sentence.slice(idx, idx + phrase.length);
    var after = sentence.slice(idx + phrase.length);
    return escapeHtml(before) + '<b>' + escapeHtml(match) + '</b>' + escapeHtml(after);
  }

  function sentenceForWord(group, wordText){
    var c = group.cluster.filter(function(w){ return w.text === wordText; })[0];
    if (c) return boldPhrase(group.template.replace('{word}', c.form), c.form);
    var d = group.distinct.filter(function(w){ return w.text === wordText; })[0];
    if (d) return boldPhrase(d.example, d.text);
    return '';
  }

  /* ============ state ============ */
  var stageEl = document.getElementById('stage');
  var dockEl = document.getElementById('dock');
  var toastEl = document.getElementById('toast');
  var overlayEl = document.getElementById('overlay');
  var cardEl = document.getElementById('card');
  var clearScreenEl = document.getElementById('clearScreen');

  var ROUND_SIZE = 3; // 한 라운드에 등장하는 그룹 수 (추후 조정 가능)
  var REVIEW_INTERVAL = { 1: 1, 2: 2, 3: 4 }; // box(숙련도)별 복습 주기(라운드 수)
  var STATS_KEY = 'pvdStats_v1';
  var ROUND_KEY = 'pvdRoundIndex_v1';

  var onScreen = {};       // groupId -> { group, color, wordEls: [], matched, mistakes }
  var particles = [];      // 물리 시뮬레이션 대상 전체 { el, x, y, vx, vy, r, fixed }
  var frozen = false;
  var activeGroupId = null;
  var roundGroupIds = [];  // 이번 라운드에 등장한 그룹 id 목록(전부 클리어됐는지 판정용)

  function loadStats(){
    try {
      var raw = localStorage.getItem(STATS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e){ return {}; }
  }
  function saveStats(stats){
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e){}
  }
  function loadRoundIndex(){
    var v = parseInt(localStorage.getItem(ROUND_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  }
  function saveRoundIndex(v){
    try { localStorage.setItem(ROUND_KEY, String(v)); } catch (e){}
  }

  var stats = loadStats();       // groupId -> { box, lastRound }
  var roundIndex = loadRoundIndex();

  function statFor(groupId){
    if (!stats[groupId]) stats[groupId] = { box: 1, lastRound: -1 };
    return stats[groupId];
  }

  // 복습 우선순위: 한 번도 안 본 그룹 > 복습 주기가 지난(오래된 순) 그룹 > 나머지
  function selectRoundGroups(){
    var all = DATA.groups.slice();
    var unseen = all.filter(function(g){ return !stats[g.id]; });
    var seen = all.filter(function(g){ return !!stats[g.id]; });

    seen.sort(function(a, b){
      var sa = stats[a.id], sb = stats[b.id];
      var dueA = roundIndex - sa.lastRound - REVIEW_INTERVAL[sa.box];
      var dueB = roundIndex - sb.lastRound - REVIEW_INTERVAL[sb.box];
      return dueB - dueA; // 많이 밀린(overdue) 것부터
    });

    var ordered = shuffle(unseen).concat(seen); // 새 단어 우선 노출, 새 단어끼리는 랜덤
    return ordered.slice(0, Math.min(ROUND_SIZE, ordered.length));
  }

  function usedColors(){
    return Object.keys(onScreen).map(function(id){ return onScreen[id].color; });
  }

  function pickColor(){
    var active = usedColors();
    var free = COLORS.filter(function(c){ return active.indexOf(c) === -1; });
    var pool = free.length ? free : COLORS;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ============ physics ============ */
  var cachedRect = null;
  function stageRect(){
    if (!cachedRect) cachedRect = stageEl.getBoundingClientRect();
    return cachedRect;
  }
  window.addEventListener('resize', function(){ cachedRect = null; });

  function findFreeSpot(r){
    var rect = stageRect();
    var minX = SIDE_MARGIN + r, maxX = rect.width - SIDE_MARGIN - r;
    var minY = TOPBAR_MARGIN + r, maxY = rect.height - SIDE_MARGIN - r;
    var best = null, bestScore = -1;
    for (var attempt = 0; attempt < 40; attempt++){
      var x = minX + Math.random() * Math.max(1, maxX - minX);
      var y = minY + Math.random() * Math.max(1, maxY - minY);
      var minDist = Infinity;
      for (var i = 0; i < particles.length; i++){
        var p = particles[i];
        var d = Math.hypot(p.x - x, p.y - y) - (p.r + r);
        if (d < minDist) minDist = d;
      }
      if (minDist === Infinity) return { x: x, y: y };
      if (minDist > 18) return { x: x, y: y };
      if (minDist > bestScore){ bestScore = minDist; best = { x: x, y: y }; }
    }
    return best || { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
  }

  var lastTs = null;

  function tick(ts){
    // 고정(long-press) 모드에서는 전 단어가 정지 상태이므로 물리 계산을 통째로 건너뜀 — 버벅임 방지
    if (frozen){
      lastTs = ts;
      requestAnimationFrame(tick);
      return;
    }

    if (lastTs == null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 1 / 30); // 탭 전환 등으로 프레임이 크게 벌어져도 한 번에 확 튀지 않게 상한
    lastTs = ts;

    var rect = stageRect();
    var minX = SIDE_MARGIN, maxX = rect.width - SIDE_MARGIN;
    var minY = TOPBAR_MARGIN, maxY = rect.height - SIDE_MARGIN;

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      if (p.fixed) continue;
      // 감쇠(마찰)를 먼저 적용해서 속도가 무한히 쌓이지 않게 함 — 진동의 핵심 원인이었음
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.vx += (Math.random() - 0.5) * 0.35;
      p.vy += (Math.random() - 0.5) * 0.35;
      var speed = Math.hypot(p.vx, p.vy);
      var maxSpeed = 7, minSpeed = 1.6;
      if (speed > maxSpeed){ p.vx = p.vx / speed * maxSpeed; p.vy = p.vy / speed * maxSpeed; }
      else if (speed < minSpeed && speed > 0.01){ p.vx = p.vx / speed * minSpeed; p.vy = p.vy / speed * minSpeed; }
      p.x += p.vx * dt * 60 * 0.06;
      p.y += p.vy * dt * 60 * 0.06;
      if (p.x - p.r < minX){ p.x = minX + p.r; p.vx = Math.abs(p.vx); }
      if (p.x + p.r > maxX){ p.x = maxX - p.r; p.vx = -Math.abs(p.vx); }
      if (p.y - p.r < minY){ p.y = minY + p.r; p.vy = Math.abs(p.vy); }
      if (p.y + p.r > maxY){ p.y = maxY - p.r; p.vy = -Math.abs(p.vy); }
    }

    // 충돌 회피: 어느 정도(pad)까지는 가까이 붙어도 그냥 두고, 그 이상 겹칠 때만
    // 겹친 양의 일부(0.35)만 매 프레임 부드럽게 밀어냄 — 한 번에 순간이동시키지 않아 떨림이 없음.
    var pad = 4;
    var correctionRate = 0.35;
    for (var a = 0; a < particles.length; a++){
      for (var b = a + 1; b < particles.length; b++){
        var pa = particles[a], pb = particles[b];
        if (pa.fixed && pb.fixed) continue;
        var dx = pb.x - pa.x, dy = pb.y - pa.y;
        var dist = Math.hypot(dx, dy);
        var minDist = pa.r + pb.r + pad;
        if (dist < minDist - 1){ // 1px 여유는 무시(미세 떨림 방지용 히스테리시스)
          if (dist < 0.001){ dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); dist = 0.001; }
          var nx = dx / dist, ny = dy / dist;
          var overlap = (minDist - dist) * correctionRate;
          if (pa.fixed){ pb.x += nx * overlap * 2; pb.y += ny * overlap * 2; }
          else if (pb.fixed){ pa.x -= nx * overlap * 2; pa.y -= ny * overlap * 2; }
          else{ pa.x -= nx * overlap; pa.y -= ny * overlap; pb.x += nx * overlap; pb.y += ny * overlap; }
        }
      }
    }

    for (var k = 0; k < particles.length; k++){
      var pp = particles[k];
      pp.el.style.translate = pp.x + 'px ' + pp.y + 'px';
    }

    requestAnimationFrame(tick);
  }

  /* ============ spawn / group lifecycle ============ */
  function spawnGroup(group){
    var color = pickColor();
    var words = shuffle(buildUnifiedList(group));
    var entry = { group: group, color: color, wordEls: [], matched: {}, mistakes: 0 };

    words.forEach(function(w){
      var el = document.createElement('div');
      el.className = 'word';
      el.dataset.groupId = group.id;
      el.dataset.text = w.text;

      var wobble = document.createElement('span');
      wobble.className = 'wobble';
      wobble.textContent = w.text;
      var wdur = (3 + Math.random() * 2.5).toFixed(2);
      var wdelay = (Math.random() * -4).toFixed(2);
      var wrot = (1 + Math.random() * 1.6).toFixed(1) + 'deg';
      wobble.style.setProperty('--wdur', wdur + 's');
      wobble.style.setProperty('--wdelay', wdelay + 's');
      wobble.style.setProperty('--wrot', wrot);
      el.appendChild(wobble);

      stageEl.appendChild(el);
      var w0 = el.offsetWidth, h0 = el.offsetHeight;
      var r = Math.max(w0, h0) / 2;
      var spot = findFreeSpot(r);

      var particle = {
        el: el, x: spot.x, y: spot.y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        r: r, fixed: false
      };
      el.style.translate = spot.x + 'px ' + spot.y + 'px';

      particles.push(particle);
      attachPressHandlers(el, entry, particle);
      entry.wordEls.push(el);
    });

    onScreen[group.id] = entry;
  }

  function startRound(){
    // 진행 중이던 상태 완전히 정리
    frozen = false;
    activeGroupId = null;
    clearTimeout(showToast._t);
    toastEl.classList.remove('show');
    overlayEl.classList.remove('open');
    clearScreenEl.classList.remove('show');

    particles.forEach(function(p){ p.el.remove(); });
    particles = [];
    onScreen = {};
    dockEl.innerHTML = '';

    roundIndex += 1;
    saveRoundIndex(roundIndex);

    var groups = selectRoundGroups();
    roundGroupIds = groups.map(function(g){ return g.id; });
    groups.forEach(function(g){ spawnGroup(g); });
  }

  function removeParticleFor(el){
    for (var i = 0; i < particles.length; i++){
      if (particles[i].el === el){ particles.splice(i, 1); return; }
    }
  }

  /* ============ press / tap / match logic ============ */
  var PRESS_MS = 1300; // 롱프레스(고정) 임계값

  function attachPressHandlers(el, entry, particle){
    var pressTimer = null;

    el.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      if (!frozen){
        el.style.setProperty('--anchor-color', COLOR_HEX[entry.color]);
        el.classList.add('charging');
        pressTimer = setTimeout(function(){
          el.classList.remove('charging');
          el._justFroze = true;
          freezeOn(entry, el, particle);
        }, PRESS_MS);
      }
    });

    function cancelCharge(){
      if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      if (!el.classList.contains('anchor')) el.classList.remove('charging');
    }

    el.addEventListener('pointerup', function(){
      // 타이머가 아직 살아있었다는 건(=지금 clear됨) 1.3초를 채우기 전에 뗐다는 뜻 → 짧은 탭으로 처리
      var wasShortTap = !!pressTimer;
      cancelCharge();
      if (el._justFroze){ el._justFroze = false; return; }
      if (frozen){ handleTapWhileFrozen(entry, el); return; }
      if (wasShortTap){
        openCard(entry.group, entry.color, el.dataset.text);
      }
    });
    el.addEventListener('pointerleave', cancelCharge);
    el.addEventListener('pointercancel', cancelCharge);
  }

  var anchorEl = null; // 현재 고정된(long-press) 단어 엘리먼트 참조

  function freezeOn(entry, el, particle){
    frozen = true;
    activeGroupId = entry.group.id;
    anchorEl = el;
    el.classList.add('anchor');
    // 나머지 단어들도 전부 위치 고정 (요청: 한 단어를 고정하면 나머지도 같이 멈춤)
    particles.forEach(function(p){ p.fixed = true; });
    entry.matched[el.dataset.text] = true;
    checkGroupComplete(entry);
  }

  function handleTapWhileFrozen(entry, el){
    if (entry.group.id !== activeGroupId) return;
    var text = el.dataset.text;

    if (el.classList.contains('anchor')){
      unfreeze();
      return;
    }
    if (entry.matched[text]) return;

    entry.matched[text] = true;
    el.classList.add('matched');
    el.style.color = COLOR_HEX[entry.color];
    checkGroupComplete(entry);
  }

  function particleFor(el){
    for (var i = 0; i < particles.length; i++){ if (particles[i].el === el) return particles[i]; }
    return null;
  }

  stageEl.addEventListener('pointerup', function(ev){
    if (!frozen) return;
    var el = ev.target.closest('.word');
    if (!el) return;
    var gid = el.dataset.groupId;
    if (gid === activeGroupId) return;
    var activeEntry = onScreen[activeGroupId];
    if (activeEntry) activeEntry.mistakes += 1;
    el.classList.add('wrong');
    setTimeout(function(){ el.classList.remove('wrong'); }, 320);
  });

  function checkGroupComplete(entry){
    var total = entry.group.cluster.length + entry.group.distinct.length;
    var done = Object.keys(entry.matched).length;
    if (done >= total) completeGroup(entry);
  }

  function completeGroup(entry){
    entry.wordEls.forEach(function(el){ el.classList.add('leaving'); });
    setTimeout(function(){
      entry.wordEls.forEach(function(el){ removeParticleFor(el); el.remove(); });
      delete onScreen[entry.group.id];

      var s = statFor(entry.group.id);
      s.box = entry.mistakes === 0 ? Math.min(3, s.box + 1) : 1;
      s.lastRound = roundIndex;
      saveStats(stats);

      addDockItem(entry.group, entry.color);
      unfreeze(); // 이 그룹이 사라지면서 나머지(다른 그룹 포함) 단어들이 다시 움직이기 시작함

      if (Object.keys(onScreen).length === 0){
        showClearScreen();
      }
    }, 500);
  }

  function showClearScreen(){
    clearScreenEl.classList.add('show');
  }

  function unfreeze(){
    frozen = false;
    activeGroupId = null;
    if (anchorEl){ anchorEl.classList.remove('anchor'); anchorEl = null; }
    particles.forEach(function(p){ p.fixed = false; });
  }

  /* ============ dock + overlay ============ */
  function addDockItem(group, color){
    if (document.querySelector('.dock-item[data-group="' + group.id + '"]')) return;
    var item = document.createElement('div');
    item.className = 'dock-item';
    item.dataset.group = group.id;
    item.title = group.concept;
    item.setAttribute('aria-label', group.concept);
    item.innerHTML = '<span class="dock-dot" style="color:' + COLOR_HEX[color] + '"></span>';
    item.addEventListener('click', function(){ openCard(group, color); });
    dockEl.appendChild(item);
  }

  function openCard(group, color, highlightText){
    var list = buildUnifiedList(group);
    if (highlightText){
      var idx = -1;
      for (var i = 0; i < list.length; i++){ if (list[i].text === highlightText){ idx = i; break; } }
      if (idx > 0){ var item = list.splice(idx, 1)[0]; list.unshift(item); }
    }

    var hex = COLOR_HEX[color];
    var hasCluster = group.cluster.length > 1;
    var html = '<button class="card-close" id="cardClose">&times;</button>' +
      '<div class="card-header">' +
      '<div class="card-concept"><span class="dot" style="color:' + hex + '"></span>' + escapeHtml(group.concept) + '</div>' +
      '<div class="card-sub">동의어 ' + list.length + '개</div>' +
      '</div>';

    if (hasCluster){
      html += '<div class="cluster-note">"= 동일 표현" 단어들은 위 문장에서 서로 그대로 바꿔 쓸 수 있음.</div>';
    }

    list.forEach(function(it){
      var isHi = it.text === highlightText;
      var tag = it.type === 'cluster' ? '<span class="tag-same">= 동일 표현</span>' : '';
      var cls = 'entry' + (isHi ? ' entry-highlight' : '');
      html += '<div class="' + cls + '"' + (isHi ? ' style="color:' + hex + '"' : '') + '>' +
        '<div class="entry-word">' + escapeHtml(it.text) + tag + '</div>' +
        '<div class="entry-ex">' + sentenceForWord(group, it.text) + '</div>' +
        (it.nuance ? '<div class="entry-nuance">' + escapeHtml(it.nuance) + '</div>' : '') +
        '</div>';
    });

    if (group.contrastPair){
      var cp = group.contrastPair;
      html += '<div class="contrast-box">' +
        '<div class="contrast-title">헷갈리기 쉬운 짝</div>' +
        '<div class="contrast-row"><div class="contrast-ex">' + sentenceForWord(group, cp.a) + '</div></div>' +
        '<div class="contrast-row"><div class="contrast-ex">' + sentenceForWord(group, cp.b) + '</div></div>' +
        '<div class="contrast-note">' + escapeHtml(cp.noteKo) + '</div>' +
        '</div>';
    }

    cardEl.innerHTML = html;
    overlayEl.classList.add('open');
    document.getElementById('cardClose').addEventListener('click', closeCard);
  }
  var POS_LABEL = { verb: '동사', adjective: '형용사', noun: '명사' };
  var CRITERIA = [
    { key: 'pos', label: '품사별' },
    { key: 'theme', label: '주제별' }
  ];

  var screenStack = [];
  function pushScreen(renderFn){ screenStack.push(renderFn); renderFn(); }
  function goBack(){
    screenStack.pop();
    var prev = screenStack[screenStack.length - 1];
    if (prev) prev(); else closeCard();
  }
  function bindCommon(){
    document.getElementById('cardClose').addEventListener('click', closeCard);
    var back = document.getElementById('cardBack');
    if (back) back.addEventListener('click', goBack);
  }

  function labelFor(critKey, value){
    return critKey === 'pos' ? (POS_LABEL[value] || value) : value;
  }

  function renderCriteriaScreen(){
    var html = '<button class="card-close" id="cardClose">&times;</button>' +
      '<div class="card-header">' +
      '<div class="card-concept"><span class="dot" style="color:#9aa0a6"></span>VOCA DUMP · 전체 목록</div>' +
      '<div class="card-sub">어떤 기준으로 볼까요?</div>' +
      '</div>' +
      '<div class="concept-list">';
    CRITERIA.forEach(function(c){
      html += '<button class="concept-item" data-crit="' + c.key + '">' +
        '<span class="concept-item-label">' + escapeHtml(c.label) + '</span>' +
        '<svg class="concept-item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
        '</button>';
    });
    html += '</div>';
    cardEl.innerHTML = html;
    bindCommon();
    Array.prototype.forEach.call(cardEl.querySelectorAll('.concept-item'), function(btn){
      btn.addEventListener('click', function(){
        var critKey = btn.dataset.crit;
        pushScreen(function(){ renderCategoryValuesScreen(critKey); });
      });
    });
  }

  function renderCategoryValuesScreen(critKey){
    var crit = CRITERIA.filter(function(c){ return c.key === critKey; })[0];
    var values = [];
    DATA.groups.forEach(function(g){
      var v = g[critKey];
      if (values.indexOf(v) === -1) values.push(v);
    });

    var html = '<button class="card-close" id="cardClose">&times;</button>' +
      '<div class="card-header">' +
      '<button class="card-back" id="cardBack">← 뒤로</button>' +
      '<div class="card-concept"><span class="dot" style="color:#9aa0a6"></span>' + escapeHtml(crit.label) + '</div>' +
      '<div class="card-sub">' + values.length + '개 분류</div>' +
      '</div>' +
      '<div class="concept-list">';
    values.forEach(function(v){
      var count = DATA.groups.filter(function(g){ return g[critKey] === v; }).length;
      html += '<button class="concept-item" data-val="' + escapeHtml(v) + '">' +
        '<span class="concept-item-label">' + escapeHtml(labelFor(critKey, v)) + '</span>' +
        '<span class="concept-item-count">' + count + '개</span>' +
        '<svg class="concept-item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
        '</button>';
    });
    html += '</div>';
    cardEl.innerHTML = html;
    bindCommon();
    Array.prototype.forEach.call(cardEl.querySelectorAll('.concept-item'), function(btn){
      btn.addEventListener('click', function(){
        var val = btn.dataset.val;
        pushScreen(function(){ renderConceptsScreen(critKey, val); });
      });
    });
  }

  function renderConceptsScreen(critKey, val){
    var groups = DATA.groups.filter(function(g){ return g[critKey] === val; });
    var html = '<button class="card-close" id="cardClose">&times;</button>' +
      '<div class="card-header">' +
      '<button class="card-back" id="cardBack">← 뒤로</button>' +
      '<div class="card-concept"><span class="dot" style="color:#9aa0a6"></span>' + escapeHtml(labelFor(critKey, val)) + '</div>' +
      '<div class="card-sub">' + groups.length + '개 그룹</div>' +
      '</div>' +
      '<div class="concept-list">';
    groups.forEach(function(group){
      var count = group.cluster.length + group.distinct.length;
      html += '<button class="concept-item" data-id="' + escapeHtml(group.id) + '">' +
        '<span class="concept-item-label">' + escapeHtml(group.concept) + '</span>' +
        '<span class="concept-item-count">' + count + '개</span>' +
        '<svg class="concept-item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
        '</button>';
    });
    html += '</div>';
    cardEl.innerHTML = html;
    bindCommon();
    Array.prototype.forEach.call(cardEl.querySelectorAll('.concept-item'), function(btn){
      btn.addEventListener('click', function(){
        var g = DATA.groups.filter(function(x){ return x.id === btn.dataset.id; })[0];
        if (g) pushScreen(function(){ renderConceptDetailScreen(g); });
      });
    });
  }

  function openAllListCard(){
    screenStack = [];
    overlayEl.classList.add('open');
    pushScreen(renderCriteriaScreen);
  }

  function renderConceptDetailScreen(group){
    var list = buildUnifiedList(group);
    var hasCluster = group.cluster.length > 1;

    var html = '<button class="card-close" id="cardClose">&times;</button>' +
      '<div class="card-header">' +
      '<button class="card-back" id="cardBack">← 뒤로</button>' +
      '<div class="card-concept"><span class="dot" style="color:#9aa0a6"></span>' + escapeHtml(group.concept) + '</div>' +
      '<div class="card-sub">동의어 ' + list.length + '개</div>' +
      '</div>';

    if (hasCluster){
      html += '<div class="cluster-note">"= 동일 표현" 단어들은 위 문장에서 서로 그대로 바꿔 쓸 수 있음.</div>';
    }

    list.forEach(function(it){
      var tag = it.type === 'cluster' ? '<span class="tag-same">= 동일 표현</span>' : '';
      html += '<div class="entry">' +
        '<div class="entry-word">' + escapeHtml(it.text) + tag + '</div>' +
        '<div class="entry-ex">' + sentenceForWord(group, it.text) + '</div>' +
        (it.nuance ? '<div class="entry-nuance">' + escapeHtml(it.nuance) + '</div>' : '') +
        '</div>';
    });
    if (group.contrastPair){
      var cp = group.contrastPair;
      html += '<div class="contrast-box">' +
        '<div class="contrast-title">헷갈리기 쉬운 짝</div>' +
        '<div class="contrast-row"><div class="contrast-ex">' + sentenceForWord(group, cp.a) + '</div></div>' +
        '<div class="contrast-row"><div class="contrast-ex">' + sentenceForWord(group, cp.b) + '</div></div>' +
        '<div class="contrast-note">' + escapeHtml(cp.noteKo) + '</div>' +
        '</div>';
    }

    cardEl.innerHTML = html;
    bindCommon();
  }

  function closeCard(){ overlayEl.classList.remove('open'); }
  overlayEl.addEventListener('click', function(ev){ if (ev.target === overlayEl) closeCard(); });

  document.getElementById('btnAllList').addEventListener('click', openAllListCard);
  document.getElementById('btnReset').addEventListener('click', startRound);
  document.getElementById('btnRestart').addEventListener('click', startRound);

  /* ============ init ============ */
  startRound();
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
