<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHRASAL VERBS DUMP</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&display=swap');

:root{
  --lemon: #f3e26b;
  --pink: #ff5fa8;
  --mint: #63e9c4;
  --ink: #f2efe6;
  --ink-dim: rgba(242,239,230,0.55);
  --void: #0a0a0b;
  --panel: rgba(12,12,14,0.72);
  --line: rgba(242,239,230,0.14);
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --word-font: 'Cormorant Garamond', 'Times New Roman', serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body{
  margin:0; padding:0; height:100%; width:100%;
  overflow:hidden;
  background: var(--void);
  color: var(--ink);
  font-family: var(--kr);
  font-weight: 300;
  line-height: 1.6;
}

/* ---------- background ---------- */
.bg{
  position:fixed; inset:0; z-index:0;
  background-image:
    radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%),
    url('night-spiral-bg.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: saturate(0.9) brightness(0.85);
}
.bg::after{
  content:"";
  position:absolute; inset:0;
  background: radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.5) 50%, transparent 51%) repeat,
              radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.35) 50%, transparent 51%) repeat,
              radial-gradient(1.2px 1.2px at 40% 80%, rgba(255,255,255,0.3) 50%, transparent 51%) repeat;
  background-size: 180px 180px, 140px 140px, 220px 220px;
  opacity:0.5;
  pointer-events:none;
}

/* ---------- top bar ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 22px;
  pointer-events:none;
}
.topbar > *{ pointer-events:auto; }
.tb-home{
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(10,10,11,0.5);
  backdrop-filter: blur(6px);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-dim);
  transition: border-color .15s ease, color .15s ease;
}
.tb-home:hover{ border-color: var(--ink); color: var(--ink); }
.tb-home svg{ width: 15px; height: 15px; }
.tb-brand{
  font-family: var(--kr); font-weight:700; font-size: 12.5px;
  letter-spacing: 0.08em; color: var(--ink-dim); text-transform:uppercase;
}
.tb-spacer{ width: 32px; height: 32px; }

/* ---------- stage ---------- */
.stage{
  position:fixed; inset:0; z-index:5;
  overflow:hidden;
}
.word{
  position:absolute;
  top:-999px; left:-999px; /* 측정 전까지 화면 밖 */
  transform: translate(-50%,-50%);
  font-family: var(--word-font);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(17px, 2.6vw, 26px);
  color: var(--ink);
  cursor: pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action: none;
  padding: 6px 10px;
  white-space: nowrap;
  transition: color .25s ease, transform .25s ease;
}
.word .wobble{
  display:inline-block;
  animation: wobble var(--wdur,4s) ease-in-out var(--wdelay,0s) infinite alternate;
}
@keyframes wobble{
  from{ transform: rotate(calc(var(--wrot,1.5deg) * -1)); }
  to{ transform: rotate(var(--wrot,1.5deg)); }
}
@media (prefers-reduced-motion: reduce){
  .word .wobble{ animation: none !important; }
}

.word.charging{
  transition: color 2000ms linear, transform 2000ms ease;
  color: var(--anchor-color, var(--ink));
  transform: translate(-50%,-50%) scale(1.3);
}
.word.anchor{
  color: var(--anchor-color, var(--ink));
  transform: translate(-50%,-50%) scale(1.3);
  z-index: 2;
}
.word.matched{
  z-index: 2;
}
.word.wrong{
  animation: shake .32s ease;
}
@keyframes shake{
  0%,100%{ transform: translate(-50%,-50%) rotate(0); }
  25%{ transform: translate(-50%,-50%) translateX(-4px) rotate(-3deg); }
  75%{ transform: translate(-50%,-50%) translateX(4px) rotate(3deg); }
}
.word.leaving{
  transition: transform .5s ease, opacity .5s ease;
  transform: translate(-50%,-50%) scale(0.2);
  opacity:0;
}

/* ---------- dock (constellation) ---------- */
.dock{
  position:fixed; top:64px; right:18px; z-index:25;
  display:flex; flex-direction:column; align-items:flex-end; gap:10px;
}
.dock-item{
  display:flex; align-items:center; gap:8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px 6px 8px;
  cursor:pointer;
  backdrop-filter: blur(6px);
  animation: dockIn .4s ease;
}
@keyframes dockIn{ from{ opacity:0; transform: translateY(-8px) scale(0.8); } to{ opacity:1; transform:none; } }
.dock-dot{ width:9px; height:9px; border-radius:50%; background: currentColor; box-shadow: 0 0 8px currentColor; flex:none; }
.dock-label{ font-family: var(--kr); font-size:12px; color: var(--ink); white-space:nowrap; }

/* ---------- overlay card ---------- */
.overlay{
  position:fixed; inset:0; z-index:50;
  background: rgba(4,4,5,0.72);
  backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding: 24px;
  opacity:0; pointer-events:none;
  transition: opacity .2s ease;
}
.overlay.open{ opacity:1; pointer-events:auto; }
.card{
  position:relative;
  width:100%; max-width: 480px; max-height: 80vh; overflow-y:auto;
  background: #121214;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 26px 26px 22px;
  transform: translateY(10px) scale(0.98);
  transition: transform .2s ease;
}
.overlay.open .card{ transform:none; }
.card-concept{
  font-family: var(--kr); font-weight:700; font-size: 21px;
  margin: 0 0 4px; line-height:1.3;
}
.card-sub{
  font-family: var(--kr); font-size:11.5px; color: var(--ink-dim);
  letter-spacing:0.04em; margin-bottom:18px;
}
.card-close{
  position:absolute; top:18px; right:18px;
  width:28px; height:28px; border-radius:50%;
  border:1px solid var(--line); background:transparent; color:var(--ink-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size: 16px; line-height:1;
}
.card-close:hover{ color:var(--ink); border-color:var(--ink); }

.entry{ margin-bottom: 18px; padding-bottom:16px; border-bottom: 1px solid var(--line); border-radius:8px; }
.entry:last-of-type{ border-bottom:none; margin-bottom:6px; padding-bottom:0; }
.entry.entry-highlight{
  background: rgba(255,255,255,0.05);
  padding: 12px 12px 14px;
  margin: 0 -12px 18px;
  border-bottom: none;
}
.entry-word{
  font-family: var(--word-font); font-style:italic; font-weight:600; font-size:20px;
  margin-bottom:6px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.tag-same{
  font-family: var(--kr); font-style:normal; font-weight:700; font-size:10.5px;
  letter-spacing:0.02em; color: var(--ink-dim);
  background: rgba(255,255,255,0.08);
  padding: 2px 8px; border-radius: 999px;
}
.entry-ex{
  font-family: var(--word-font); font-size:15px; color: var(--ink);
  line-height:1.5; margin-bottom:6px;
}
.entry-ex b{ font-style:normal; font-weight:700; padding:0 1px; }
.entry-nuance{
  font-family: var(--kr); font-weight:300; font-size:13px;
  color: var(--ink-dim); line-height:1.6;
}
.cluster-note{
  font-family: var(--kr); font-weight:300; font-size:12px;
  color: var(--ink-dim); margin-top: 4px; padding: 8px 10px;
  background: rgba(255,255,255,0.04); border-radius:8px;
}

.contrast-box{
  margin-top: 6px; padding: 14px; border-radius: 10px;
  background: rgba(255,255,255,0.04);
}
.contrast-title{
  font-family:var(--kr); font-weight:700; font-size:11.5px; letter-spacing:0.04em;
  color: var(--ink-dim); text-transform:uppercase; margin-bottom:10px;
}
.contrast-row{ margin-bottom:8px; }
.contrast-row:last-of-type{ margin-bottom:10px; }
.contrast-ex{ font-family: var(--word-font); font-size:14.5px; line-height:1.5; }
.contrast-ex b{ font-style:normal; font-weight:700; }
.contrast-note{ font-family: var(--kr); font-weight:300; font-size:12.5px; color: var(--ink-dim); line-height:1.6; }

/* toast */
.toast{
  position:fixed; bottom: 22px; left:50%; transform: translateX(-50%) translateY(10px);
  background: var(--panel); border:1px solid var(--line); border-radius:999px;
  padding: 9px 18px; font-family:var(--kr); font-size:12.5px; color:var(--ink);
  z-index:40; opacity:0; transition: opacity .25s ease, transform .25s ease;
  pointer-events:none; backdrop-filter: blur(6px); white-space:nowrap;
  max-width: 80vw; overflow:hidden; text-overflow:ellipsis;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="bg"></div>

<div class="topbar">
  <a class="tb-home" href="index.html" aria-label="홈으로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
  </a>
  <div class="tb-brand">Phrasal Verbs Dump</div>
  <div class="tb-spacer"></div>
</div>

<div class="stage" id="stage"></div>
<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(function(){

  /* ============ DATA ============ */
  var DATA = {
    groups: [
      {
        id: "cause",
        concept: "원인이 되다",
        template: "The heavy rain {word} the flood.",
        cluster: [
          { text: "cause", form: "caused" },
          { text: "bring about", form: "brought about" },
          { text: "give rise to", form: "gave rise to" }
        ],
        distinct: [
          {
            text: "trigger",
            example: "The referee's decision triggered angry protests.",
            nuance: "갑작스럽고 즉각적인 반응을 유발할 때 씀. 주로 부정적·격한 사건에 붙음."
          }
        ],
        contrastPair: { a: "cause", b: "trigger",
          noteKo: "cause는 원인-결과를 중립적으로 서술, trigger는 그 반응이 즉각적이고 격렬함을 강조." }
      },
      {
        id: "increase",
        concept: "증가하다",
        template: "House prices in the city {word} rapidly last year.",
        cluster: [
          { text: "increase", form: "increased" },
          { text: "go up", form: "went up" },
          { text: "rise", form: "rose" }
        ],
        distinct: [
          {
            text: "shoot up",
            example: "Demand for masks shot up overnight.",
            nuance: "매우 빠르고 급격하게 늘어남. 놀라움의 뉘앙스가 있음."
          },
          {
            text: "step up",
            example: "The company stepped up its marketing efforts.",
            nuance: "노력·활동의 양을 의도적으로 늘림. 가격·수치 등에는 잘 안 씀."
          }
        ],
        contrastPair: { a: "increase", b: "shoot up",
          noteKo: "increase는 일반적인 증가, shoot up은 그 증가가 매우 가파르고 놀라울 정도임을 강조." }
      },
      {
        id: "decrease",
        concept: "감소하다 / 줄이다",
        template: "Sales {word} sharply after the scandal.",
        cluster: [
          { text: "decrease", form: "decreased" },
          { text: "go down", form: "went down" },
          { text: "decline", form: "declined" }
        ],
        distinct: [
          {
            text: "cut back on",
            example: "The company cut back on staff to save money.",
            nuance: "누군가의 의도적인 결정으로 줄임. 저절로 줄어드는 상황엔 안 씀."
          },
          {
            text: "tail off",
            example: "Interest in the project tailed off after a few months.",
            nuance: "서서히, 자연스럽게 잦아드는 감소. 의도가 없는 흐름을 나타냄."
          }
        ],
        contrastPair: { a: "cut back on", b: "tail off",
          noteKo: "cut back on은 누군가 의도적으로 줄이는 것, tail off는 별다른 개입 없이 저절로 잦아드는 것." }
      },
      {
        id: "need",
        concept: "필요로 하다",
        template: "This job {word} strong communication skills.",
        cluster: [
          { text: "need", form: "needs" },
          { text: "require", form: "requires" }
        ],
        distinct: [
          {
            text: "call for",
            example: "The situation calls for immediate action.",
            nuance: "사람이 아니라 상황·환경이 주어가 되어 '그것이 필요하다'고 할 때 자연스러움."
          }
        ],
        contrastPair: { a: "need", b: "call for",
          noteKo: "need/require는 사람·사물이 직접 필요로 할 때, call for는 상황이 무언가를 요구할 때 씀." }
      },
      {
        id: "problem",
        concept: "문제",
        template: "We need to solve this {word} quickly.",
        cluster: [
          { text: "problem", form: "problem" },
          { text: "issue", form: "issue" }
        ],
        distinct: [
          {
            text: "challenge",
            example: "Climate change is the biggest challenge of our generation.",
            nuance: "단순한 문제보다 '극복해야 할 도전'의 뉘앙스. 부정적이지만은 않음."
          },
          {
            text: "dilemma",
            example: "She faced a difficult dilemma: stay or leave.",
            nuance: "두 선택지 사이에서 고민해야 하는 상황. 단순 문제와는 결이 다름."
          }
        ],
        contrastPair: { a: "problem", b: "challenge",
          noteKo: "problem은 해결해야 할 부정적 대상, challenge는 극복하며 성장할 수 있는 도전에 가까움." }
      }
    ]
  };

  var COLORS = ['lemon', 'pink', 'mint'];
  var COLOR_HEX = { lemon: '#f3e26b', pink: '#ff5fa8', mint: '#63e9c4' };
  var POOL_SIZE = 3; // 화면에 동시에 떠 있는 그룹 수 (라운드당 단어 개수는 추후 조정)
  var TOPBAR_MARGIN = 78;   // 상단바 피하는 여백(px)
  var SIDE_MARGIN = 26;
  var DOCK_ZONE = { x: 0, y: 0, w: 0, h: 0 }; // 초기화시 계산

  /* ============ helpers ============ */
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildUnifiedList(group){
    var list = [];
    group.cluster.forEach(function(w){ list.push({ type: 'cluster', text: w.text }); });
    group.distinct.forEach(function(w){ list.push({ type: 'distinct', text: w.text, nuance: w.nuance }); });
    return list;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function boldPhrase(sentence, phrase){
    var idx = sentence.toLowerCase().indexOf(phrase.toLowerCase());
    if (idx === -1) return escapeHtml(sentence);
    var before = sentence.slice(0, idx);
    var match = sentence.slice(idx, idx + phrase.length);
    var after = sentence.slice(idx + phrase.length);
    return escapeHtml(before) + '<b>' + escapeHtml(match) + '</b>' + escapeHtml(after);
  }

  function sentenceForWord(group, wordText){
    var c = group.cluster.filter(function(w){ return w.text === wordText; })[0];
    if (c) return boldPhrase(group.template.replace('{word}', c.form), c.form);
    var d = group.distinct.filter(function(w){ return w.text === wordText; })[0];
    if (d) return boldPhrase(d.example, d.text);
    return '';
  }

  /* ============ state ============ */
  var stageEl = document.getElementById('stage');
  var dockEl = document.getElementById('dock');
  var toastEl = document.getElementById('toast');
  var overlayEl = document.getElementById('overlay');
  var cardEl = document.getElementById('card');

  var queue = shuffle(DATA.groups);
  var qIdx = 0;
  var dockedIds = {};      // 이미 도킹 완료되어 다시 등장하면 안 되는 그룹
  var onScreen = {};       // groupId -> { group, color, wordEls: [] }
  var particles = [];      // 물리 시뮬레이션 대상 전체 { el, x, y, vx, vy, r, fixed }
  var frozen = false;
  var activeGroupId = null;

  function remainingGroups(){
    return DATA.groups.filter(function(g){ return !dockedIds[g.id] && !onScreen[g.id]; });
  }

  function nextGroup(){
    var pool = remainingGroups();
    if (!pool.length) return null;
    if (qIdx >= queue.length || !queue.some(function(g){ return pool.indexOf(g) !== -1; })){
      queue = shuffle(pool);
      qIdx = 0;
    }
    while (qIdx < queue.length){
      var g = queue[qIdx++];
      if (pool.indexOf(g) !== -1) return g;
    }
    return pool[0];
  }

  function usedColors(){
    return Object.keys(onScreen).map(function(id){ return onScreen[id].color; });
  }
  function dockedColors(){
    return Object.keys(dockedIds).map(function(id){ return dockedIds[id]; });
  }

  function pickColor(){
    var active = usedColors();
    var docked = dockedColors();
    var freeOfActive = COLORS.filter(function(c){ return active.indexOf(c) === -1; });
    var freeOfBoth = freeOfActive.filter(function(c){ return docked.indexOf(c) === -1; });
    var pool = freeOfBoth.length ? freeOfBoth : (freeOfActive.length ? freeOfActive : COLORS);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ============ physics ============ */
  function stageRect(){ return stageEl.getBoundingClientRect(); }

  function findFreeSpot(r){
    var rect = stageRect();
    var minX = SIDE_MARGIN + r, maxX = rect.width - SIDE_MARGIN - r;
    var minY = TOPBAR_MARGIN + r, maxY = rect.height - SIDE_MARGIN - r;
    var best = null, bestScore = -1;
    for (var attempt = 0; attempt < 40; attempt++){
      var x = minX + Math.random() * Math.max(1, maxX - minX);
      var y = minY + Math.random() * Math.max(1, maxY - minY);
      var minDist = Infinity;
      for (var i = 0; i < particles.length; i++){
        var p = particles[i];
        var d = Math.hypot(p.x - x, p.y - y) - (p.r + r);
        if (d < minDist) minDist = d;
      }
      if (minDist === Infinity) return { x: x, y: y };
      if (minDist > 18) return { x: x, y: y };
      if (minDist > bestScore){ bestScore = minDist; best = { x: x, y: y }; }
    }
    return best || { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
  }

  function tick(){
    var rect = stageRect();
    var minX = SIDE_MARGIN, maxX = rect.width - SIDE_MARGIN;
    var minY = TOPBAR_MARGIN, maxY = rect.height - SIDE_MARGIN;

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      if (p.fixed) continue;
      p.vx += (Math.random() - 0.5) * 0.9;
      p.vy += (Math.random() - 0.5) * 0.9;
      var speed = Math.hypot(p.vx, p.vy);
      var maxSpeed = 13, minSpeed = 4;
      if (speed > maxSpeed){ p.vx = p.vx / speed * maxSpeed; p.vy = p.vy / speed * maxSpeed; }
      else if (speed < minSpeed && speed > 0.01){ p.vx = p.vx / speed * minSpeed; p.vy = p.vy / speed * minSpeed; }
      p.x += p.vx * 0.06;
      p.y += p.vy * 0.06;
      if (p.x - p.r < minX){ p.x = minX + p.r; p.vx = Math.abs(p.vx); }
      if (p.x + p.r > maxX){ p.x = maxX - p.r; p.vx = -Math.abs(p.vx); }
      if (p.y - p.r < minY){ p.y = minY + p.r; p.vy = Math.abs(p.vy); }
      if (p.y + p.r > maxY){ p.y = maxY - p.r; p.vy = -Math.abs(p.vy); }
    }

    // 충돌 회피: 서로 겹치면 밀어냄 (고정된 단어는 밀리지 않고, 상대만 피해감)
    var pad = 16;
    for (var a = 0; a < particles.length; a++){
      for (var b = a + 1; b < particles.length; b++){
        var pa = particles[a], pb = particles[b];
        var dx = pb.x - pa.x, dy = pb.y - pa.y;
        var dist = Math.hypot(dx, dy);
        var minDist = pa.r + pb.r + pad;
        if (dist < minDist){
          if (dist < 0.001){ dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); dist = 0.001; }
          var nx = dx / dist, ny = dy / dist;
          var overlap = minDist - dist;
          if (pa.fixed && pb.fixed) continue;
          if (pa.fixed){ pb.x += nx * overlap; pb.y += ny * overlap; }
          else if (pb.fixed){ pa.x -= nx * overlap; pa.y -= ny * overlap; }
          else{ pa.x -= nx * overlap * 0.5; pa.y -= ny * overlap * 0.5; pb.x += nx * overlap * 0.5; pb.y += ny * overlap * 0.5; }
        }
      }
    }

    for (var k = 0; k < particles.length; k++){
      var pp = particles[k];
      pp.el.style.left = pp.x + 'px';
      pp.el.style.top = pp.y + 'px';
    }

    requestAnimationFrame(tick);
  }

  /* ============ spawn / group lifecycle ============ */
  function spawnGroup(group){
    var color = pickColor();
    var words = shuffle(buildUnifiedList(group));
    var entry = { group: group, color: color, wordEls: [], matched: {} };

    words.forEach(function(w){
      var el = document.createElement('div');
      el.className = 'word';
      el.dataset.groupId = group.id;
      el.dataset.text = w.text;

      var wobble = document.createElement('span');
      wobble.className = 'wobble';
      wobble.textContent = w.text;
      var wdur = (3 + Math.random() * 2.5).toFixed(2);
      var wdelay = (Math.random() * -4).toFixed(2);
      var wrot = (1 + Math.random() * 1.6).toFixed(1) + 'deg';
      wobble.style.setProperty('--wdur', wdur + 's');
      wobble.style.setProperty('--wdelay', wdelay + 's');
      wobble.style.setProperty('--wrot', wrot);
      el.appendChild(wobble);

      stageEl.appendChild(el);
      var w0 = el.offsetWidth, h0 = el.offsetHeight;
      var r = Math.max(w0, h0) / 2;
      var spot = findFreeSpot(r);

      var particle = {
        el: el, x: spot.x, y: spot.y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        r: r, fixed: false
      };
      el.style.left = spot.x + 'px';
      el.style.top = spot.y + 'px';

      particles.push(particle);
      attachPressHandlers(el, entry, particle);
      entry.wordEls.push(el);
    });

    onScreen[group.id] = entry;
  }

  function refill(){
    var addedAny = false;
    while (Object.keys(onScreen).length < POOL_SIZE){
      var g = nextGroup();
      if (!g) break;
      spawnGroup(g);
      addedAny = true;
    }
    if (!addedAny && !Object.keys(onScreen).length && Object.keys(dockedIds).length === DATA.groups.length){
      showToast('지금 있는 표현을 모두 모았어요');
    }
  }

  function removeParticleFor(el){
    for (var i = 0; i < particles.length; i++){
      if (particles[i].el === el){ particles.splice(i, 1); return; }
    }
  }

  /* ============ press / tap / match logic ============ */
  function attachPressHandlers(el, entry, particle){
    var pressTimer = null;
    var downTime = 0;

    el.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      downTime = Date.now();
      if (!frozen){
        el.style.setProperty('--anchor-color', COLOR_HEX[entry.color]);
        el.classList.add('charging');
        pressTimer = setTimeout(function(){
          el.classList.remove('charging');
          el._justFroze = true;
          freezeOn(entry, el, particle);
        }, 2000);
      }
    });

    function cancelCharge(){
      if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      if (!el.classList.contains('anchor')) el.classList.remove('charging');
    }

    el.addEventListener('pointerup', function(){
      var elapsed = Date.now() - downTime;
      cancelCharge();
      if (el._justFroze){ el._justFroze = false; return; }
      if (frozen){ handleTapWhileFrozen(entry, el); return; }
      if (elapsed < 1900){
        openCard(entry.group, entry.color, el.dataset.text);
      }
    });
    el.addEventListener('pointerleave', cancelCharge);
    el.addEventListener('pointercancel', cancelCharge);
  }

  function freezeOn(entry, anchorEl, particle){
    frozen = true;
    activeGroupId = entry.group.id;
    anchorEl.classList.add('anchor');
    particle.fixed = true;
    entry.matched[anchorEl.dataset.text] = true;
    checkGroupComplete(entry);
  }

  function handleTapWhileFrozen(entry, el){
    if (entry.group.id !== activeGroupId) return;
    var text = el.dataset.text;

    if (el.classList.contains('anchor')){
      unfreeze(entry);
      return;
    }
    if (entry.matched[text]) return;

    entry.matched[text] = true;
    el.classList.add('matched');
    el.style.color = COLOR_HEX[entry.color];
    var p = particleFor(el);
    if (p) p.fixed = true;
    checkGroupComplete(entry);
  }

  function particleFor(el){
    for (var i = 0; i < particles.length; i++){ if (particles[i].el === el) return particles[i]; }
    return null;
  }

  stageEl.addEventListener('pointerup', function(ev){
    if (!frozen) return;
    var el = ev.target.closest('.word');
    if (!el) return;
    var gid = el.dataset.groupId;
    if (gid === activeGroupId) return;
    el.classList.add('wrong');
    setTimeout(function(){ el.classList.remove('wrong'); }, 320);
  });

  function checkGroupComplete(entry){
    var total = entry.group.cluster.length + entry.group.distinct.length;
    var done = Object.keys(entry.matched).length;
    if (done >= total) completeGroup(entry);
  }

  function completeGroup(entry){
    entry.wordEls.forEach(function(el){ el.classList.add('leaving'); });
    setTimeout(function(){
      entry.wordEls.forEach(function(el){ removeParticleFor(el); el.remove(); });
      delete onScreen[entry.group.id];
      dockedIds[entry.group.id] = entry.color;
      addDockItem(entry.group, entry.color);
      unfreeze(entry);
      refill();
    }, 500);
  }

  function unfreeze(entry){
    frozen = false;
    activeGroupId = null;
    if (entry){
      entry.wordEls.forEach(function(el){
        el.classList.remove('anchor');
        var p = particleFor(el); // 완료돼서 이미 제거된 단어는 particleFor가 null을 반환 → 자동으로 스킵됨
        if (p) p.fixed = false;
      });
    }
  }

  /* ============ dock + overlay ============ */
  function addDockItem(group, color){
    if (document.querySelector('.dock-item[data-group="' + group.id + '"]')) return;
    var item = document.createElement('div');
    item.className = 'dock-item';
    item.dataset.group = group.id;
    item.innerHTML = '<span class="dock-dot" style="color:' + COLOR_HEX[color] + '"></span>' +
                      '<span class="dock-label">' + escapeHtml(group.concept) + '</span>';
    item.addEventListener('click', function(){ openCard(group, color); });
    dockEl.appendChild(item);
  }

  function openCard(group, color, highlightText){
    var list = buildUnifiedList(group);
    if (highlightText){
      var idx = -1;
      for (var i = 0; i < list.length; i++){ if (list[i].text === highlightText){ idx = i; break; } }
      if (idx > 0){ var item = list.splice(idx, 1)[0]; list.unshift(item); }
    }

    var html = '<button class="card-close" id="cardClose">&times;</button>' +
      '<div class="card-concept" style="color:' + COLOR_HEX[color] + '">' + escapeHtml(group.concept) + '</div>' +
      '<div class="card-sub">동의어 ' + list.length + '개</div>';

    var hasCluster = group.cluster.length > 1;
    list.forEach(function(it){
      var isHi = it.text === highlightText;
      var tag = it.type === 'cluster' ? '<span class="tag-same">= 동일 표현</span>' : '';
      html += '<div class="entry' + (isHi ? ' entry-highlight' : '') + '">' +
        '<div class="entry-word">' + escapeHtml(it.text) + tag + '</div>' +
        '<div class="entry-ex">' + sentenceForWord(group, it.text) + '</div>' +
        (it.nuance ? '<div class="entry-nuance">' + escapeHtml(it.nuance) + '</div>' : '') +
        '</div>';
    });
    if (hasCluster){
      html += '<div class="cluster-note">"= 동일 표현" 단어들은 위 문장에서 서로 그대로 바꿔 쓸 수 있음.</div>';
    }

    if (group.contrastPair){
      var cp = group.contrastPair;
      html += '<div class="contrast-box">' +
        '<div class="contrast-title">헷갈리기 쉬운 짝</div>' +
        '<div class="contrast-row"><div class="contrast-ex">' + sentenceForWord(group, cp.a) + '</div></div>' +
        '<div class="contrast-row"><div class="contrast-ex">' + sentenceForWord(group, cp.b) + '</div></div>' +
        '<div class="contrast-note">' + escapeHtml(cp.noteKo) + '</div>' +
        '</div>';
    }

    cardEl.innerHTML = html;
    overlayEl.classList.add('open');
    document.getElementById('cardClose').addEventListener('click', closeCard);
  }
  function closeCard(){ overlayEl.classList.remove('open'); }
  overlayEl.addEventListener('click', function(ev){ if (ev.target === overlayEl) closeCard(); });

  /* ============ init ============ */
  refill();
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
