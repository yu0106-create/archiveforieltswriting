<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #46413e;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .frame {
    position: relative;
    width: min(1400px, 94vw);
    aspect-ratio: 16 / 9;
  }

  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-drag: none;
  }

  .hotspot {
    position: absolute;
    display: block;
    border-radius: 6px;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .18s ease, background-color .18s ease;
  }

  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45) inset;
  }

  /* IELTS WRITING 폴더 라벨 */
  .hotspot.ielts {
    left: 12.76%;
    top: 11.11%;
    width: 17.97%;
    height: 8.80%;
  }

  /* SYNONYMS 폴더 라벨 */
  .hotspot.synonyms {
    left: 39.84%;
    top: 33.33%;
    width: 19.27%;
    height: 9.72%;
  }

  /* PHRASAL VERBS 폴더 라벨 */
  .hotspot.phrasal {
    left: 17.19%;
    top: 59.72%;
    width: 21.88%;
    height: 8.80%;
  }
</style>
</head>
<body>

  <div class="frame">
    <img src="home-folders.png" alt="Current Studies in Folders — IELTS WRITING, SYNONYMS, PHRASAL VERBS">

    <a class="hotspot ielts" href="ielts.html" aria-label="IELTS WRITING 폴더로 이동"></a>
    <a class="hotspot synonyms" href="verbs.html" aria-label="SYNONYMS 폴더로 이동"></a>
    <a class="hotspot phrasal" href="phrasal-verbs.html" aria-label="PHRASAL VERBS 폴더로 이동"></a>
  </div>

</body>
</html>
