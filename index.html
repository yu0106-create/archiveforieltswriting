<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Desktop</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}

:root{
  --ink: #2b2622;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, sans-serif;
}

*{ box-sizing:border-box; }
html, body{
  margin:0; padding:0; height:100%;
  font-family: var(--kr);
  color: var(--ink);
  overflow: hidden; /* this page is a single fixed scene, not a scroll --
    the entrance animation is the "reveal", so there's nothing to scroll to. */
}
body{
  position: relative; /* frames are now individually absolute-positioned,
    not flex-centered as a single unit, so two frames can sit at two
    different spots on the wall. */
  /* the wall is now a real tiled-mosaic photo repeated edge to edge --
     the source crop was cut exactly at grout-line centers on all four
     sides (found by detecting the grout's brightness peaks), so tiling
     it lines the grout up continuously instead of showing a seam. */
  background-image: url('wall-tile-unit.jpg');
  background-repeat: repeat;
  background-size: 340px 340px;
}
a{ color:inherit; text-decoration:none; }
img{ -webkit-user-drag:none; user-select:none; display:block; }

/* ===================== the framed picture ===================== */
/* A real photographed picture frame (pink/mauve molded wood) instead of
   a CSS-drawn border. The frame image's own background AND its inner
   opening were both flattened to transparent (see pink-frame.png), so
   it can sit directly on top of the scene: .frame-img is scaled up and
   shifted so its opening lines up exactly with .stage underneath,
   using the opening's measured position within the source photo
   (openingLeft/openingTop/openingWidth as fractions of the full image)
   converted to percentages of .stage's own box. */
.picture{
  position: absolute;
  left: 42%;
  top: 58%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 22px 46px rgba(0,0,0,0.45));
}
.frame-img{
  position: absolute;
  left: -44.6%; top: -46.4%;
  width: 190.3%; height: 180.6%;
  z-index: 6;
  pointer-events: none;
}

/* The source photos are a perfect 1:1 square, so the stage keeps that
   exact aspect ratio -- that keeps the scene lined up with the frame's
   window at any screen size. Clipped here (not just the background):
   the corner objects are now the FULL, un-cropped book/pencil-case
   photos (real edges, no artificial rectangular crop line), sized with
   plenty of spare room around where they actually show through -- so a
   hover wiggle moves entirely within real object silhouette or margin
   that was always going to be covered by the frame anyway, and never
   reveals a hard-cut edge. */
.stage{
  position: relative;
  width: min(38vw, 42vh, 350px); /* ~67% of the previous size, like zooming out to 67% in Chrome */
  aspect-ratio: 1 / 1;
  overflow: hidden;
}
@media (max-width: 760px){
  .stage{ width: min(52vw, 40vh, 288px); } /* smaller vw fraction too, so there's clear side margin on phones */
}
.scene-bg{
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ===================== the two corner objects ===================== */
/* Each is a two-layer element: the outer <a> just owns positioning/
   rotation (a plain static transform, no entrance animation); the inner
   <img> owns the hover "wiggle" only. */
.corner-obj{
  position: absolute;
  z-index: 5;
  cursor: pointer;
}
.corner-obj img{ width: 100%; height: 100%; }

.corner-book{
  left: -10%; top: -4%;
  width: 26.3%;
  transform: rotate(-4deg);
}
.corner-pencase{
  right: -8%; bottom: -6%;
  width: 46.7%;
  transform: rotate(-18deg);
}
.corner-book img, .corner-pencase img{ width: 100%; height: auto; }

/* ===================== second framed picture (phrasal verbs) ===================== */
/* This one is a single flattened photo (frame + the little horse print
   already baked into it) with only the outer background removed --
   unlike the pink frame it has no separate "opening" for a scene behind
   it, so it behaves like a third clickable corner object rather than a
   second .stage. Same two-layer split as the book/pencase: the outer
   <a> owns position + a fixed base rotation, the inner <img> owns the
   hover wiggle only. */
.corner-frame2{
  /* Sized to match the pink frame's own outer visible width: the pink
     frame's frame-img canvas is 190.3% of .stage's width (see below),
     so this second frame reuses the exact same .stage width formula
     scaled by that same 1.903 factor -- both frames grow/shrink
     together at any viewport size instead of matching at only one
     breakpoint. */
  position: absolute;
  left: 76%;
  top: 26%;
  width: min(72vw, 80vh, 666px);
  transform: translate(-50%, -50%) rotate(-4deg);
  z-index: 5;
  cursor: pointer;
  filter: drop-shadow(0 16px 32px rgba(0,0,0,0.4));
}
.corner-frame2 img{ width: 100%; height: auto; transform-origin: 50% 50%; }
.corner-frame2:hover img{ animation: wiggle-frame2 .6s ease-in-out; }
@keyframes wiggle-frame2{
  0%   { transform: rotate(0deg) translate(0,0); }
  25%  { transform: rotate(-3deg) translate(-2px, 1px); }
  55%  { transform: rotate(2deg) translate(1px, -1px); }
  80%  { transform: rotate(-1deg) translate(0, 1px); }
  100% { transform: rotate(0deg) translate(0,0); }
}
@media (max-width: 760px){
  .corner-frame2{ width: min(99vw, 76vh, 548px); left: 78%; top: 22%; }
}
/* pivot near the bottom of the book (not dead-center), so a rotation
   reads as "top swings, bottom stays put" rather than the whole
   object rotating around its middle. */
.corner-book img{ transform-origin: 50% 92%; }

.corner-book:hover img{ animation: wiggle-book .6s ease-in-out; }
.corner-pencase:hover img{ animation: wiggle-pencase .6s ease-in-out; }
@keyframes wiggle-book{
  0%   { transform: rotate(0deg); }
  30%  { transform: rotate(6deg); }
  60%  { transform: rotate(-1.5deg); }
  100% { transform: rotate(0deg); }
}
@keyframes wiggle-pencase{
  0%   { transform: rotate(0deg) translate(0,0); }
  20%  { transform: rotate(2.5deg) translate(2px, -2px); }
  50%  { transform: rotate(-2deg) translate(-2px, 1px); }
  78%  { transform: rotate(1.5deg) translate(1px, 1px); }
  100% { transform: rotate(0deg) translate(0,0); }
}
</style>
</head>
<body>

<div class="picture">
<div class="stage">
  <img class="scene-bg" src="scene-bg.jpg" alt="">

  <a class="corner-obj corner-book" href="verbs.html" aria-label="Phrasal Verbs Dump로 이동">
    <img src="full-book.png" alt="">
  </a>

  <a class="corner-obj corner-pencase" href="ielts.html" aria-label="IELTS Writing으로 이동">
    <img src="full-pencase.png" alt="">
  </a>
</div>
<img class="frame-img" src="pink-frame.png" alt="">
</div>

<a class="corner-frame2" href="phrasal-verbs.html" aria-label="구동사 사전으로 이동">
  <img src="horse-frame.png" alt="">
</a>

</body>
</html>
