<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Desktop</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}

:root{
  --ink: #2b2622;
  --wall: #5f4541;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, sans-serif;
}

*{ box-sizing:border-box; }
html, body{
  margin:0; padding:0; height:100%;
  font-family: var(--kr);
  color: var(--ink);
  overflow: hidden; /* this page is a single fixed scene, not a scroll --
    the entrance animation is the "reveal", so there's nothing to scroll to. */
  background: var(--wall);
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
}
a{ color:inherit; text-decoration:none; }
img{ -webkit-user-drag:none; user-select:none; display:block; }

/* ===================== the framed picture ===================== */
/* Sitting on the dark wall color like a framed photo -- a pale mat
   (passe-partout) around a thin dark inner lip, then the square scene
   itself. Since the whole thing is now noticeably smaller than a
   full-bleed background would be, the source photo also reads sharper
   (less upscaling) than stretching it across the entire viewport did. */
.frame{
  background: #f3ede2;
  padding: 2.6vmin;
  border: 10px solid #241c18;
  box-shadow: 0 30px 70px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.08) inset;
}

/* The source photos are a perfect 1:1 square, so the stage keeps that
   exact aspect ratio -- that keeps the book's and pencil case's
   percentage-based positions lined up with the background pixel-for-
   pixel at any screen size. */
.stage{
  position: relative;
  width: min(70vw, 76vh, 640px);
  aspect-ratio: 1 / 1;
  overflow: hidden;
}
@media (max-width: 760px){
  .frame{ padding: 3.2vmin; border-width: 8px; }
  .stage{ width: min(88vw, 70vh, 640px); }
}
.scene-bg{
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ===================== the two corner objects ===================== */
/* Each is a two-layer element: the outer <a> owns positioning AND the
   one-time slide-in entrance animation; the inner <img> owns the hover
   "wiggle". Keeping them on separate elements means hovering never
   touches the outer's animation-name, so the entrance never re-triggers
   when the mouse leaves (a single shared animation would restart from
   its 0% keyframe the moment :hover's computed animation-name changed
   back, which looks like the object flying back out and in again). */
.corner-obj{
  position: absolute;
  z-index: 5;
  cursor: pointer;
}
.corner-obj img{ width: 100%; height: 100%; }

.corner-book{
  left: 0%; top: 0%;
  width: 15%; height: 57.8%;
  animation: slide-in-book 1.05s cubic-bezier(.22,.85,.32,1) both;
}
.corner-pencase{
  left: 57.45%; top: 71.85%;
  width: 42.55%; height: 28.15%;
  animation: slide-in-pencase 1.05s cubic-bezier(.22,.85,.32,1) both;
  animation-delay: 1.15s; /* starts only once the book has finished --
    "one object at a time", not both sliding in together. */
}
@keyframes slide-in-book{
  0%   { transform: translate(-135%, -135%); }
  100% { transform: translate(0, 0); }
}
@keyframes slide-in-pencase{
  0%   { transform: translate(135%, 135%); }
  100% { transform: translate(0, 0); }
}

.corner-book:hover img{ animation: wiggle-book .6s ease-in-out; }
.corner-pencase:hover img{ animation: wiggle-pencase .6s ease-in-out; }
@keyframes wiggle-book{
  0%   { transform: rotate(0deg) translate(0,0); }
  25%  { transform: rotate(-3deg) translate(-2px, 1px); }
  55%  { transform: rotate(2deg) translate(2px, -1px); }
  80%  { transform: rotate(-1.5deg) translate(-1px, 1px); }
  100% { transform: rotate(0deg) translate(0,0); }
}
@keyframes wiggle-pencase{
  0%   { transform: rotate(0deg) translate(0,0); }
  20%  { transform: rotate(2.5deg) translate(2px, -2px); }
  50%  { transform: rotate(-2deg) translate(-2px, 1px); }
  78%  { transform: rotate(1.5deg) translate(1px, 1px); }
  100% { transform: rotate(0deg) translate(0,0); }
}
</style>
</head>
<body>

<div class="frame">
<div class="stage">
  <img class="scene-bg" src="scene-bg.jpg" alt="">

  <a class="corner-obj corner-book" href="verbs.html" aria-label="Phrasal Verbs Dump로 이동">
    <img src="corner-book.png" alt="">
  </a>

  <a class="corner-obj corner-pencase" href="ielts.html" aria-label="IELTS Writing으로 이동">
    <img src="corner-pencase.png" alt="">
  </a>
</div>
</div>

</body>
</html>
