<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Desktop</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body{
  margin:0; padding:0;
  width:100%; height:100%;
  overflow:hidden;
  font-family: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  font-weight: 300;
}
.desktop{
  position: fixed;
  inset: 0;
  background-image: url('bg-home.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
/* soft top scrim so icon labels stay legible against any part of the photo */
.desktop::before{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(0,0,0,0.14) 0%, rgba(0,0,0,0) 22%);
  pointer-events:none;
}
.corner-label{
  position:absolute;
  left: 18px; bottom: 14px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.78);
  text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  user-select:none;
  pointer-events:none;
}
.icon{
  position:absolute;
  width: 108px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 7px;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  transform: translate(-50%, -50%);
}
.icon-art{
  width: 84px; height: 84px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.25) inset;
  border: 1px solid rgba(255,255,255,0.35);
  transition: transform .12s ease, box-shadow .12s ease;
  background: #fff;
}
.icon-art img{
  width:100%; height:100%;
  object-fit: cover;
  display:block;
  pointer-events: none;
  -webkit-user-drag: none;
}
.icon:hover .icon-art{
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.34), 0 1px 0 rgba(255,255,255,0.25) inset;
}
.icon.dragging .icon-art{
  transform: scale(1.05);
  box-shadow: 0 14px 26px rgba(0,0,0,0.38);
}
.icon-label{
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  line-height: 1.3;
  text-shadow: 0 1px 4px rgba(0,0,0,0.55), 0 0 1px rgba(0,0,0,0.4);
  padding: 2px 8px;
  max-width: 100%;
}
@media (max-width: 480px){
  .icon{ width: 88px; }
  .icon-art{ width: 68px; height: 68px; border-radius: 16px; }
  .icon-label{ font-size: 11.5px; }
}
</style>
</head>
<body>

<div class="desktop" id="desktop">
  <div class="icon" id="icon-ielts" data-href="ielts.html">
    <div class="icon-art"><img src="icon-ielts.jpg" alt="" draggable="false"></div>
    <div class="icon-label">IELTS Writing</div>
  </div>
  <div class="icon" id="icon-verbs" data-href="verbs.html">
    <div class="icon-art"><img src="icon-verbs.jpg" alt="" draggable="false"></div>
    <div class="icon-label">Phrasal Verbs Dump</div>
  </div>
  <div class="corner-label">personal study desktop</div>
</div>

<script>
(function () {
  var STORE_KEY = 'desktopIconPositions.v1';
  // default positions, expressed as % of viewport so the layout scales
  // sensibly across screen sizes -- a simple top-left vertical stack, like
  // a fresh macOS desktop before you've touched anything.
  var DEFAULTS = {
    'icon-ielts': { x: 10, y: 14 },
    'icon-verbs': { x: 10, y: 32 }
  };

  function loadPositions() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function savePositions(pos) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(pos)); } catch (e) {}
  }

  var positions = loadPositions();
  var desktop = document.getElementById('desktop');

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function applyPosition(el, xPct, yPct) {
    var rect = desktop.getBoundingClientRect();
    var half = el.offsetWidth / 2;
    // keep the whole icon (art + label) inside the viewport with a small margin
    var minXPct = (half + 8) / rect.width * 100;
    var maxXPct = 100 - minXPct;
    var minYPct = (half + 8) / rect.height * 100;
    var maxYPct = 100 - minYPct;
    xPct = clamp(xPct, minXPct, maxXPct);
    yPct = clamp(yPct, minYPct, maxYPct);
    el.style.left = xPct + '%';
    el.style.top = yPct + '%';
    return { x: xPct, y: yPct };
  }

  document.querySelectorAll('.icon').forEach(function (el) {
    var id = el.id;
    var saved = positions[id] || DEFAULTS[id] || { x: 12, y: 14 };
    applyPosition(el, saved.x, saved.y);

    var dragging = false, moved = false;
    var startX, startY, startLeftPct, startTopPct;

    el.addEventListener('pointerdown', function (ev) {
      dragging = true; moved = false;
      el.setPointerCapture(ev.pointerId);
      var rect = desktop.getBoundingClientRect();
      startX = ev.clientX; startY = ev.clientY;
      var curRect = el.getBoundingClientRect();
      startLeftPct = ((curRect.left + curRect.width / 2) - rect.left) / rect.width * 100;
      startTopPct = ((curRect.top + curRect.height / 2) - rect.top) / rect.height * 100;
    });

    el.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      var dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        moved = true;
        el.classList.add('dragging');
      }
      if (!moved) return;
      var rect = desktop.getBoundingClientRect();
      var xPct = startLeftPct + (dx / rect.width) * 100;
      var yPct = startTopPct + (dy / rect.height) * 100;
      var applied = applyPosition(el, xPct, yPct);
      positions[id] = applied;
    });

    function endDrag(ev) {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if (moved) {
        savePositions(positions);
      } else {
        // no meaningful movement -> treat as a click/tap: navigate
        var href = el.getAttribute('data-href');
        if (href) window.location.href = href;
      }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  });

  window.addEventListener('resize', function () {
    document.querySelectorAll('.icon').forEach(function (el) {
      var id = el.id;
      var saved = positions[id] || DEFAULTS[id];
      applyPosition(el, saved.x, saved.y);
    });
  });
})();
</script>
</body>
</html>
