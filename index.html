<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE for IELTS WRITING</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Lt.woff2') format('woff2');
  font-weight: 300;
  font-display: swap;
}
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap');

:root{
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #131315;
  --ink-soft: #6b7076;
  --ink-faint: #9aa0a6;
  --line: #e9e9ea;
  --red: #c23b3b;
  --red-deep: #9a2c2c;
  --red-wash: #fbe9e9;
  --star: #ffcd3c;
  --hl-mint: #ccffff;
  --radius: 12px;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --en: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
  --hand: 'Caveat', cursive;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--kr);
  font-weight: 300;
  line-height: 1.6;
}

a{ color:inherit; text-decoration:none; }
::selection{ background: var(--red-wash); color: var(--red-deep); }
:focus-visible{ outline: 2px solid var(--red); outline-offset: 3px; }

.wrap{
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ---------- top bar ---------- */
.topbar{
  padding: 26px 0 0;
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
}
.topbar .wrap{
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom: 20px;
}
.navbtns{ display:flex; gap:8px; }
.navbtns button{
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.navbtns button:hover{ border-color: var(--ink); color: var(--ink); }
.navbtns button:disabled{ opacity: 0.35; cursor: default; }
.navbtns button:disabled:hover{ border-color: var(--line); color: var(--ink-soft); }
.navbtns button svg{ width: 15px; height: 15px; }
.starnav{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.starnav-btn{
  border: none;
  background: none;
  cursor: pointer;
  padding: 2px 0;
  display: flex;
  gap: 2px;
  line-height: 0;
}
.starnav-btn svg{ width: 13px; height: 13px; }
.star-fill{ fill: var(--star); stroke: var(--star); }
.star-empty{ fill: none; stroke: var(--ink-faint); stroke-width: 1.5; }
.starnav-btn.active svg .star-empty{ stroke: var(--ink); }

/* ---------- hero ---------- */
.hero{
  padding: 34px 0 30px;
}
.hero .eyebrow{
  font-family: var(--en);
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.1em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 16px;
  display:flex; align-items:center; gap:8px;
}
.hero .eyebrow::before{
  content:"";
  width: 20px; height: 2px;
  background: var(--red);
  display:inline-block;
}
.hero h1{
  font-family: var(--en);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
.hero h1 a{ display:block; transition: opacity .15s ease; }
.hero h1 a:hover{ opacity: 0.6; }
.hero h1 span{ display:block; }
.hero h1 .l1{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.02; }
.hero h1 .l2{ font-size: clamp(26px, 3.6vw, 36px); font-weight: 300; color: var(--ink); margin: 2px 0; }
.hero h1 .l3{ font-size: clamp(38px, 6.4vw, 62px); line-height: 1.05; }

/* ---------- legend row (unused, kept out) ---------- */

/* ---------- section headers ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin: 44px 0 18px;
}
.section-head h2{
  font-family: var(--kr);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
  margin:0;
}
.section-head .count{
  font-family: var(--en);
  font-size: 12px;
  color: var(--ink-faint);
}

/* ---------- category grid ---------- */
.cat-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 12px;
}
.cat-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 18px 18px 16px;
  cursor:pointer;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  display:flex; flex-direction:column; gap:10px;
  position: relative;
}
.cat-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.cat-card.active{ border-color: var(--ink); }
.cat-card .top-row{ display:flex; align-items:flex-start; justify-content:space-between; }
.cat-card .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}
.pill{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  white-space: nowrap;
}
.cat-card .label{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 16.5px;
  line-height: 1.35;
}
.cat-card .desc{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height:1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cat-card .bottom-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: auto; padding-top: 4px;
}
.cat-card .arrow{
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint);
}
.cat-card .arrow svg{ width: 11px; height: 11px; display:block; }

/* ---------- essay cards ---------- */
.essay-grid{ display:flex; flex-direction:column; gap: 12px; }
.essay-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.essay-card:hover{
  border-color: #d8d8d9;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transform: translateY(-2px);
}
.essay-card .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.essay-card .title{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 8px;
}
.essay-card .tag-row{ display:flex; flex-wrap:wrap; gap: 6px; }
.essay-card .score{
  text-align: right;
}
.essay-card .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
  line-height: 1;
}
.essay-card .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- essay detail header ---------- */
.essay-header{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 26px;
  margin: 8px 0 30px;
  display:grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
}
.essay-header .meta-line{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.essay-header h3{
  font-family: var(--kr);
  font-weight: 700;
  font-size: 22px;
  margin: 0 0 6px;
}
.essay-header .back{
  display:inline-block;
  margin-top: 10px;
  font-family: var(--en);
  font-weight: 600;
  font-size: 12px;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
}
.essay-header .score{ text-align:right; }
.essay-header .score .num{
  font-family: var(--en);
  font-weight: 700;
  font-size: 34px;
  color: var(--ink);
  line-height: 1;
}
.essay-header .score .lbl{
  font-family: var(--en);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ---------- question + original (uncorrected) text ---------- */
.essay-original{
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin: -12px 0 30px;
  background: var(--card);
}
.essay-original .block + .block{ margin-top: 22px; }
.essay-original .block-label{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.essay-original .question-text{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14.5px;
  color: var(--ink-soft);
  font-style: italic;
  line-height: 1.6;
}
.essay-original .question-text.placeholder{
  color: var(--ink-faint);
  font-style: normal;
}
.essay-original .original-text p{
  font-family: var(--en);
  font-weight: 400;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.75;
  margin: 0 0 14px;
}
.essay-original .original-text p:last-child{ margin-bottom: 0; }
.essay-original .chart-image{
  max-width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--line);
}

/* ---------- notes card ("알아두기") ---------- */
.notes-card{
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  padding: 22px 26px;
  margin-top: 30px;
}
.notes-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.notes-head .eyebrow{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.notes-head-right{ display:flex; align-items:center; gap:14px; }
.notes-edit-btn{
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, color .15s ease;
}
.notes-edit-btn:hover{ border-color: var(--ink); color: var(--ink); }
.notes-edit-btn svg{ width: 13px; height: 13px; }
.notes-content{
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.notes-content > .notes-placeholder{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
}
.notes-section{
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  background: #fbfbfb;
}
.notes-section-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.notes-section-title{
  font-family: var(--en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--red-deep);
  display: flex;
  align-items: center;
  gap: 8px;
}
.notes-section-title-empty::before{ background: var(--ink-faint); }
.notes-section-title::before{
  content: "";
  width: 14px; height: 2px;
  background: var(--red-deep);
  display: inline-block;
  flex: none;
}
.notes-section-head .stars{ flex: none; }
.notes-section-body{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink);
}
.notes-block{ margin-bottom: 14px; }
.notes-block:last-child{ margin-bottom: 0; }
.notes-line{
  display: flex;
  align-items: flex-start;
}
.notes-line-label{
  white-space: pre;
  flex: none;
}
.notes-line-text{
  flex: 1 1 auto;
  min-width: 0;
}
.notes-placeholder{ color: var(--ink-faint); font-style: italic; }
.notes-editarea{
  width: 100%;
  min-height: 220px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px;
  resize: vertical;
  background: #fffef8;
}
.notes-editarea:focus{ outline: 2px solid var(--red); outline-offset: 1px; }
.notes-edit-actions{
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}
.notes-edit-actions button{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  padding: 7px 16px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
}
.notes-edit-actions .notes-save{
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.notes-edit-actions button:hover{ opacity: 0.85; }

/* ---------- entries (sentence-level corrections) ---------- */
.entries{ display:flex; flex-direction:column; }
.entry{
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  display:grid;
  grid-template-columns: 140px 1fr;
  gap: 18px;
}
.entry .meta{
  font-family: var(--en);
  font-size: 11px;
  color: var(--ink-faint);
  padding-top: 3px;
}
.entry .meta .meta-row{ display: block; }
.entry .meta .meta-date{ display: block; }
.entry .meta .meta-essaylink{
  display: block;
  margin-top: 4px;
  color: var(--ink-faint);
  text-decoration: underline;
}
.entry .meta .tag{
  display:inline-block;
  margin-top: 8px;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  cursor: pointer;
}
.stars{
  display: flex;
  gap: 3px;
}
.stars button{
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  line-height: 0;
}
.stars svg{ width: 15px; height: 15px; }
.stars button:hover svg .star-empty{ stroke: var(--ink-soft); }
.entry .meta .stars{ margin-top: 10px; }

mark.hl{
  background: var(--hl-mint);
  color: #073130;
  border-radius: 2px;
  padding: 0 1px;
  cursor: pointer;
}
.hl-popup{
  position: fixed;
  z-index: 200;
  background: var(--ink);
  color: #fff;
  font-family: var(--kr);
  font-weight: 300;
  font-size: 12.5px;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transform: translate(-50%, -100%);
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}
.hl-popup::after{
  content: "";
  position: absolute;
  left: 50%; top: 100%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--ink);
}
.hl-zone{ cursor: text; }

.entry .body .wrong{
  position: relative;
  font-family: var(--en);
  font-weight: 400;
  font-size: 15.5px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 4px;
}
.entry .body .wrong .struck{
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--ink-faint);
}
.correction-note{
  position: absolute;
  transform: translateX(-50%);
  font-family: var(--hand);
  font-size: 17px;
  line-height: 1.15;
  color: var(--red-deep);
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
}
.full-correction{
  font-family: var(--hand);
  font-size: 19px;
  line-height: 1.3;
  color: var(--red-deep);
  margin: 2px 0 14px;
}
.entry .body .explanation{
  font-family: var(--kr);
  font-weight: 300;
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.6;
}

.empty{
  padding: 40px 0;
  color: var(--ink-faint);
  font-size: 14px;
  font-family: var(--kr);
}

footer{
  margin-top: 60px;
  padding: 26px 0 50px;
  border-top: 1px solid var(--line);
  font-family: var(--en);
  font-size: 11.5px;
  color: var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}

@media (max-width: 760px){
  .cat-grid{ grid-template-columns: repeat(2, 1fr); }
  .entry{ grid-template-columns: 1fr; gap: 6px; }
  .entry .meta{ padding-top:0; }
  .entry .meta .meta-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .entry .meta .meta-date{ white-space:nowrap; }
  .entry .meta .tag{ margin-top:0; }
  .entry .meta .stars{ margin-top:0; }
  .hero{ padding: 24px 0 22px; }
  .essay-card{ grid-template-columns: 1fr; }
  .essay-card .score{ text-align:left; }
  .essay-header{ grid-template-columns: 1fr; }
  .essay-header .score{ text-align:left; }
}
@media (max-width: 480px){
  .cat-grid{ grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="navbtns">
      <button type="button" id="navBack" aria-label="뒤로 가기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" id="navForward" aria-label="앞으로 가기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="starnav" id="starNav">
      <button type="button" class="starnav-btn" data-n="3" aria-label="별 3개 표시한 문장"></button>
      <button type="button" class="starnav-btn" data-n="2" aria-label="별 2개 표시한 문장"></button>
      <button type="button" class="starnav-btn" data-n="1" aria-label="별 1개 표시한 문장"></button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div>
      <div class="eyebrow">Grammar Archive · IELTS Writing</div>
      <h1>
        <a href="#/">
          <span class="l1">ARCHIVE</span>
          <span class="l2">for</span>
          <span class="l3">IELTS WRITING</span>
        </a>
      </h1>
    </div>
  </section>

  <div id="catSection">
    <div class="section-head">
      <h2 id="sectionTitle">카테고리 목록</h2>
      <span class="count" id="catCount"></span>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <div id="essayHeaderWrap"></div>

  <div class="section-head">
    <h2 id="entryTitle">기록한 글</h2>
    <span class="count" id="entryCount"></span>
  </div>
  <div id="listArea"></div>

  <footer>
    <span>Personal grammar log</span>
    <span id="lastUpdated"></span>
  </footer>

</main>

      "originalText": "Scores could be considered as which are determined by eacg team's ability, but the bar chart above show that it could be depended on the season. Of course, as you can see by team B's scores during 2002~2005, there could be a team whose scores are always way above than others. However, Team B's score was 82pt in 2002 but it had became lower until 2004, but it has successfully made their socre better in 2005.\n\nTeam A and Team C's scores are definitely lower than Team A's for the entire given period. Their scores are relatively similar compared to the scores of Team B's, even though the gap changes by the year. Furthermore, until 2003, Team C's performance was better than Team A's. By the way, as the gap had shrinked and Team A had performed better in 2004 with the score of 35. In 2005, TeamA's score has got lower a lot, but they were still above Team C.\n\nThis chart shows two ponits. First one is that the teams' score is not always high or low, and it costantly changes as the season goes. Second, there's something that could be called as a trend in theses scores.",
      "notes": "\u2501\u2501\u2501 \uacfc\uac70 \u00b7 \uacfc\uac70\uc644\ub8cc \u00b7 \ud604\uc7ac\uc644\ub8cc \uad6c\ubd84 \u2501\u2501\u2501\n\n- \uacfc\uac70(\ub2e8\uc21c\uacfc\uac70): \uc774\ubbf8 \uc885\ub8cc\ub41c \ud2b9\uc815 \uc2dc\uc810\uc758 \uc0ac\uac74\uc744 \ub098\ud0c0\ub0c4. \uc5f0\ub3c4\uac00 \uba85\uc2dc\ub418\ub294 \uacbd\uc6b0 \ub300\ubd80\ubd84 \uc774\uc5d0 \ud574\ub2f9\ud568.\n- \uacfc\uac70\uc644\ub8cc(had + p.p.): \ud2b9\uc815 \uacfc\uac70 \uc2dc\uc810\ubcf4\ub2e4 \uc55e\uc11c \ubc1c\uc0dd\ud55c \uc0ac\uac74\uc744 \ub098\ud0c0\ub0c4. \ubb38\uc7a5 \ub0b4\uc5d0 \uae30\uc900\uc774 \ub418\ub294 \uc2dc\uc810\uc774 \uba3c\uc800 \uc81c\uc2dc\ub418\uc5b4\uc57c \ud568.\n- \ud604\uc7ac\uc644\ub8cc(has/have + p.p.): \uacfc\uac70\ubd80\ud130 \ud604\uc7ac\uae4c\uc9c0 \uc774\uc5b4\uc9c0\ub294 \uc0c1\ud669, \ub610\ub294 \ud604\uc7ac \uc2dc\uc810\uc744 \uae30\uc900\uc73c\ub85c \ud55c \uc11c\uc220\uc5d0 \uc0ac\uc6a9\ud568. \uc774\ubbf8 \uc885\ub8cc\ub41c \uc5f0\ub3c4(\uc608: 2005\ub144)\ub97c \uc11c\uc220\ud560 \ub54c\ub294 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc74c.\n\n\uc608\uc2dc \uc624\ub958: \"it has successfully made their score better in 2005\"\n\u2192 2005\ub144\uc740 \uc774\ubbf8 \uc885\ub8cc\ub41c \ud2b9\uc815 \uc5f0\ub3c4\uc774\ubbc0\ub85c \ud604\uc7ac\uc644\ub8cc(has made)\uac00 \uc544\ub2cc \ub2e8\uc21c\uacfc\uac70(made)\ub85c \ud45c\uae30\ud574\uc57c \ud568.\n\n\u2501\u2501\u2501 \uacfc\uac70\uc644\ub8cc \uc0ac\uc6a9 \uc870\uac74 \u2501\u2501\u2501\n\n\uacfc\uac70\uc644\ub8cc\ub294 \ubb38\uc7a5 \ub0b4\uc5d0 '\uae30\uc900\uc774 \ub418\ub294 \ub354 \ub098\uc911 \uc2dc\uc810'\uc774 \uc874\uc7ac\ud560 \ub54c\ub9cc \uc0ac\uc6a9 \uac00\ub2a5\ud568. \uadf8 \uae30\uc900 \uc2dc\uc810\ubcf4\ub2e4 \uc55e\uc120 \uc0ac\uac74\uc5d0 \ud55c\ud574 had + p.p.\ub97c \uc0ac\uc6a9\ud558\uba70, \uae30\uc900 \uc2dc\uc810\uc774 \uc5c6\ub294 \uacbd\uc6b0 \ub2e8\uc21c\uacfc\uac70\ub97c \uc0ac\uc6a9\ud568.\n\n1) By the time + \uacfc\uac70, \uc8fc\uc5b4 + had + p.p.\n   Ex) By the time the season ended, Team B had already lost its lead.\n   \uc124\uba85: \uc2dc\uc98c\uc774 \ub05d\ub09c \uc2dc\uc810\uc774 \uae30\uc900. \uadf8 \uc774\uc804\uc5d0 \uc774\ubbf8 \uc120\ub450\ub97c \uc783\uc5c8\uc74c\uc744 \ub098\ud0c0\ub0c4.\n\n2) Before + \uacfc\uac70, \uc8fc\uc5b4 + had + p.p.\n   Ex) Before 2004, Team A had never scored above 20 points.\n   \uc124\uba85: 2004\ub144\uc774 \uae30\uc900 \uc2dc\uc810\uc774\uba70, \uadf8 \uc774\uc804 \uc0c1\ud669\uc744 \uc11c\uc220\ud568.\n\n3) By + \uc5f0\ub3c4, \uc8fc\uc5b4 + had + p.p.\n   Ex) By 2004, the gap between Team A and Team C had narrowed significantly.\n   \uc124\uba85: 'by 2004'\uac00 \uae30\uc900 \uc2dc\uc810 \uc5ed\ud560\uc744 \ud558\ubbc0\ub85c had narrowed \uc0ac\uc6a9\uc774 \uc801\uc808\ud568.\n\n   \ube44\uad50 \uc608\uc2dc:\n   \"Team A had performed better in 2004\" (\uc624\ub958)\n   \u2192 2004\ub144 \uc790\uccb4\ub97c \uc11c\uc220\ud558\ub294 \ubb38\uc7a5\uc73c\ub85c, \uae30\uc900\uc774 \ub420 \ub354 \ub098\uc911 \uc2dc\uc810\uc774 \uc5c6\uc74c. \ub530\ub77c\uc11c had performed\uac00 \uc544\ub2cc performed(\ub2e8\uc21c\uacfc\uac70)\uac00 \uc801\uc808\ud568.\n   \"By 2005, Team A had performed better than in the previous year.\" (\uc62c\ubc14\ub984)\n   \u2192 'by 2005'\ub77c\ub294 \uae30\uc900 \uc2dc\uc810\uc774 \uc874\uc7ac\ud558\ubbc0\ub85c had performed \uc0ac\uc6a9 \uac00\ub2a5.\n\n4) After + \uc8fc\uc5b4 + had + p.p., \uc8fc\uc5b4 + \uacfc\uac70\n   Ex) After the score had dropped for two years, it rose again in 2005.\n   \uc124\uba85: \uc810\uc218\uac00 \ud558\ub77d\ud55c \uc0ac\uac74\uc774 \uadf8 \uc774\ud6c4 \uc0c1\uc2b9\ud55c \uc0ac\uac74\ubcf4\ub2e4 \uba3c\uc800 \ubc1c\uc0dd\ud588\uc74c\uc744 \uba85\ud655\ud788 \ud558\uae30 \uc704\ud574 \uc55e\uc120 \uc0ac\uac74\uc5d0 had\ub97c \uc0ac\uc6a9\ud568.\n\n\uc694\uc57d: \ud55c \ubb38\uc7a5\uc5d0 \ub450 \uac1c\uc758 \uacfc\uac70 \uc0ac\uac74\uc774 \uc788\uace0, \uadf8\uc911 \ud558\ub098\uac00 \ub2e4\ub978 \ud558\ub098\ubcf4\ub2e4 \ub       "originalText": "The graph below shows changes in proportion in vehicle registration from 1970 to 2010. There is a trend that could be observed. First, truck is the most registrated vehicle among given period, except the fact that taxi exceeded truck in 1980. Truck\u2019s registration proportion almost reached 50 percent in 1970 and 2010. Second, bus is the least registrated vehicle through the for every periods. It has never been above 20 percent. Lastly, bus has a tendency to be ranked in a second place, and it has fluctuated a lot as the time passed.",
      "notes": "\u2501\u2501\u2501 \ud604\uc7ac\uc644\ub8cc \u00b7 \ub2e8\uc21c\uacfc\uac70 \uad6c\ubd84 \u2501\u2501\u2501\n\n- \ub2e8\uc21c\uacfc\uac70: \uc774\ubbf8 \uc885\ub8cc\ub41c \ud2b9\uc815 \uae30\uac04\uc774\ub098 \uc2dc\uc810\uc758 \uc0ac\uac74\uc744 \ub098\ud0c0\ub0c4. \uc885\ub8cc \uc5f0\ub3c4\uac00 \uba85\uc2dc\ub418\ub294 \uacbd\uc6b0 \ub300\ubd80\ubd84 \uc774\uc5d0 \ud574\ub2f9\ud568.\n- \ud604\uc7ac\uc644\ub8cc(has/have + p.p.): \uacfc\uac70\ubd80\ud130 \ud604\uc7ac\uae4c\uc9c0 \uc774\uc5b4\uc9c0\ub294 \uc0c1\ud669, \ub610\ub294 \ud604\uc7ac \uc2dc\uc810\uc744 \uae30\uc900\uc73c\ub85c \ud55c \uc11c\uc220\uc5d0 \uc0ac\uc6a9\ud568. \uc885\ub8cc \uc5f0\ub3c4\uac00 \uba85\uc2dc\ub41c \uae30\uac04(\uc608: 1970~2010\ub144)\uc744 \uc11c\uc220\ud560 \ub54c\ub294 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc74c.\n\n\uc608\uc2dc \uc624\ub958: \"It has never been above 20 percent.\"\n\u2192 1970\ub144\ubd80\ud130 2010\ub144\uae4c\uc9c0\ub294 \uc774\ubbf8 \uc885\ub8cc\ub41c \uae30\uac04\uc774\ubbc0\ub85c \ud604\uc7ac\uc644\ub8cc(has been)\uac00 \uc544\ub2cc \ub2e8\uc21c\uacfc\uac70(was)\ub85c \ud45c\uae30\ud574\uc57c \ud568.\n\n\uc608\uc2dc \uc624\ub958: \"it has fluctuated a lot\"\n\u2192 \uac19\uc740 \uc774\uc720\ub85c \ub2e8\uc21c\uacfc\uac70(fluctuated)\uac00 \uc801\uc808\ud568.\n\n\u2501\u2501\u2501 \uad00\uc0ac \uc0ac\uc6a9 \uaddc\uce59 \u2501\u2501\u2501\n\n\uad00\uc0ac\ub294 \uba85\uc0ac\uac00 \ud2b9\uc815 \ub300\uc0c1\uc744 \uac00\ub9ac\ud0a4\ub294\uc9c0, \uc77c\ubc18\uc801 \uac1c\ub150\uc744 \uac00\ub9ac\ud0a4\ub294\uc9c0\uc5d0 \ub530\ub77c \ubd99\uc774\uac70\ub098 \uc0dd\ub7b5\ud568.\n\n1) \uad00\uc6a9 \ud45c\ud604\uc5d0\ub294 \uad00\uc0ac\ub97c \ub123\uc9c0 \uc54a\uc74c\n   Ex) ranked in second place (O) / ranked in a second place (X)\n   \uc124\uba85: in first/second/third place\uc640 \uac19\uc740 \uc21c\uc704 \ud45c\ud604\uc740 \uad00\uc0ac \uc5c6\uc774 \uc500.\n\n2) \uc77c\ubc18\uc801 \uc758\ubbf8\ub85c \uc4f0\uc778 \ubd88\uac00\uc0b0\uba85\uc0ac \uc55e\u (function () {
  var state = DATA;

  // ---------------------------------------------------------------
  // Persistence for highlights & star ratings.
  // localStorage = instant local cache (works offline, no lag on click).
  // Firestore = the shared source of truth that syncs across devices --
  // a single fixed document that only this site's own code reads/writes.
  // Every device that opens the page subscribes to that document, so a
  // highlight made on one device shows up on the others within a second
  // or two (no refresh needed, thanks to onSnapshot).
  // ---------------------------------------------------------------
  var SYNC_DOC = db ? db.collection('sync').doc('grammar-archive') : null;

  function makeStore(storageKey) {
    var cache = null;
    function load() {
      if (cache) return cache;
      try { cache = JSON.parse(localStorage.getItem(storageKey) || '{}'); }
      catch (e) { cache = {}; }
      return cache;
    }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(cache)); } catch (e) { /* storage unavailable */ }
    }
    function replaceAll(data) {
      cache = data || {};
      save();
    }
    return { load: load, save: save, replaceAll: replaceAll };
  }

  var HStore = makeStore('grammar-archive-highlights-v1');
  var SStore = makeStore('grammar-archive-stars-v1');
  var NStore = makeStore('grammar-archive-notes-v1'); // user-edited "알아두기" text, keyed by essayId

  var pushTimer = null;
  function pushToCloud() {
    if (!SYNC_DOC) return; // no cloud connection -- local-only mode, already saved above
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      SYNC_DOC.set({
        highlights: HStore.load(),
        stars: SStore.load(),
        notes: NStore.load(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(function (err) {
        console.error('Sync write failed (staying local-only for now):', err);
      });
    }, 400);
  }

  var Notes = {
    // returns the effective text: the user's saved edit if one exists,
    // otherwise the default text that came with the essay data.
    get: function (essayId, fallback) {
      var d = NStore.load();
      return (essayId in d) ? d[essayId] : (fallback || '');
    },
    hasOverride: function (essayId) { return essayId in NStore.load(); },
    set: function (essayId, text) {
      var d = NStore.load();
      d[essayId] = text;
      NStore.save();
      // the text positions highlights were anchored to no longer apply once
      // edited, so clear them rather than leave them pointing at the wrong spot
      var hd = HStore.load();
      delete hd[essayId + '-notes'];
      HStore.save();
      pushToCloud();
    }
  };

  var Highlights = {
    get: function (entryId, field) {
      var d = HStore.load();
      return (d[entryId] && d[entryId][field]) || [];
    },
    add: function (entryId, field, start, end) {
      var d = HStore.load();
      if (!d[entryId]) d[entryId] = {};
      if (!d[entryId][field]) d[entryId][field] = [];
      d[entryId][field].push({ start: start, end: end });
      d[entryId][field] = mergeRanges(d[entryId][field]);
      HStore.save();
      pushToCloud();
    },
    removeAt: function (entryId, field, start, end) {
      var d = HStore.load();
      if (!d[entryId] || !d[entryId][field]) return;
      d[entryId][field] = d[entryId][field].filter(function (r) { return !(r.start === start && r.end === end); });
      if (!d[entryId][field].length) delete d[entryId][field];
      if (Object.keys(d[entryId]).length === 0) delete d[entryId];
      HStore.save();
      pushToCloud();
    }
  };

  function mergeRanges(ranges) {
    var sorted = ranges.slice().sort(function (a, b) { return a.start - b.start; });
    var out = [];
    sorted.forEach(function (r) {
      var last = out[out.length - 1];

    });
    return out;
  }

    get: function (entryId) { return SStore.load()[entryId] || 0; },

      var d = SStore.load();
      if (n <= 0) delete d[entryId]; else d[entryId] = n;
      SStore.save();
      pushToCloud();
    }
  };

      : '<svg viewBox="0 0 24 24"><path class="star-empty" d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.6l-6.1 3.4 1.5-6.8-5.2-4.7 6.9-.7z"/></svg>';
  }

  // 9 pastel colors spread evenly around the hue wheel (avoiding washed-out yellow)
  // with enough saturation/lightness contrast to stay distinguishable at a glance.
  var PALETTE = [
    { bg: 'hsl(352, 68%, 93%)', fg: 'hsl(352, 58%, 42%)' }, // red
    { bg: 'hsl(26, 75%, 90%)',  fg: 'hsl(26, 65%, 38%)'  }, // orange
    { bg: 'hsl(44, 72%, 87%)',  fg: 'hsl(44, 62%, 32%)'  }, // gold
    { bg: 'hsl(152, 48%, 90%)', fg: 'hsl(152, 45%, 30%)' }, // green
    { bg: 'hsl(180, 45%, 88%)', fg: 'hsl(180, 50%, 28%)' }, // teal
    { bg: 'hsl(210, 62%, 92%)', fg: 'hsl(210, 58%, 40%)' }, // blue
    { bg: 'hsl(238, 58%, 93%)', fg: 'hsl(238, 52%, 46%)' }, // indigo
    { bg: 'hsl(272, 52%, 93%)', fg: 'hsl(272, 46%, 46%)' }, // violet
    { bg: 'hsl(322, 58%, 93%)', fg: 'hsl(322, 52%, 42%)' }  // magenta
  ];

  var ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M8 16L16 8M10 8H16V14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';

  function diffWords(wrong, correct) {
    var a = wrong.split(/\s+/);
    var b = correct.split(/\s+/);
    var i = 0;
    while (i < a.length && i < b.length && a[i].toLowerCase() === b[i].toLowerCase()) i++;
    var j = 0;
    while (
      j < a.length - i && j < b.length - i &&
      a[a.length - 1 - j].toLowerCase() === b[b.length - 1 - j].toLowerCase()
    ) j++;
    var prefix = a.slice(0, i);
    var middleWrong = a.slice(i, a.length - j);
    var suffix = a.slice(a.length - j);
    var middleCorrect = b.slice(i, b.length - j);
    if (!middleWrong.length) { middleWrong = a.slice(i); suffix = []; middleCorrect = b.slice(i); }
    return { prefix: prefix, middleWrong: middleWrong, suffix: suffix, middleCorrect: middleCorrect };
  }

  // Splits text into non-overlapping segments at every highlight/struck boundary,
  // then wraps each segment with whichever of <mark class="hl"> / <span class="struck">
  // actually apply to it. Handles arbitrary overlap between a user's highlight drag
  // and the auto-computed struck range.
  function renderAnnotatedText(text, highlightRanges, struckRange, fixText) {
    var points = {};
    points[0] = true; points[text.length] = true;
    (highlightRanges || []).forEach(function (r) { points[r.start] = true; points[r.end] = true; });
    if (struckRange) { points[struckRange.start] = true; points[struckRange.end] = true; }
    var sorted = Object.keys(points).map(Number).sort(function (a, b) { return a - b; });

    var html = '';
    for (var k = 0; k < sorted.length - 1; k++) {
      var s = sorted[k], e = sorted[k + 1];
      if (s >= e) continue;
      var seg = text.slice(s, e);
      var isHi = (highlightRanges || []).some(function (r) { return s >= r.start && e <= r.end; });
      var isStruck = struckRange && s >= struckRange.start && e <= struckRange.end;
      var open = '', close = '';
      if (isHi) { open += '<mark class="hl" data-start="' + s + '" data-end="' + e + '">'; close = '</mark>' + close; }
      if (isStruck) {
        open += (fixText != null) ? '<span class="struck" data-fix="' + escapeHtml(fixText) + '">' : '<span class="struck">';
        close = '</span>' + close;
      }
      html += open + escapeHtml(seg) + close;
    }
    return html;
  }

  // Two rendering modes:
  // - "inline": only part of the sentence changed -> struck word(s) get a small
  //   proofreading-style note positioned precisely under them via JS (positionCorrectionNotes).
  // - "full": the whole sentence changed -> no shared anchor point exists, so the
  //   correction is shown as a normal in-flow line below (nothing overlaps, ever).
  function buildWrongBlock(entryId, wrong, correct) {
    var d = diffWords(wrong, correct);
    var isFullRewrite = d.prefix.length === 0 && d.suffix.length === 0;
    var hlRanges = Highlights.get(entryId, 'wrong');
    var zoneAttrs = ' class="wrong hl-zone" data-entry-id="' + escapeHtml(entryId) + '" data-field="wrong"';

    if (isFullRewrite) {
      var struckRange = { start: 0, end: wrong.length };
      return (
        '<div' + zoneAttrs + '>' + renderAnnotatedText(wrong, hlRanges, struckRange, null) + '</div>' +
        '<div class="full-correction">' + escapeHtml(correct) + '</div>'
      );
    }

    var prefixStr = d.prefix.join(' ');
    var middleStr = d.middleWrong.join(' ');
    var suffixStr = d.suffix.join(' ');
    var reconstructed = [prefixStr, middleStr, suffixStr].filter(function (s) { return s.length; }).join(' ');
    var mStart = prefixStr.length ? prefixStr.length + 1 : 0;
    var mEnd = mStart + middleStr.length;

    return '<div' + zoneAttrs + '>' +
      renderAnnotatedText(reconstructed, hlRanges, { start: mStart, end: mEnd }, d.middleCorrect.join(' ')) +
      '</div>';
  }

  // Measures each struck word's actual on-screen position and places its
  // correction note flush left under it, then reserves exactly enough space
  // below so the note never overlaps the explanation text that follows.
  var NOTE_GAP = 4; // fixed, consistent gap between the strikethrough and the correction note

  function positionCorrectionNotes(root) {
    // idempotent: safe to call again (e.g. after web fonts finish loading, or on resize)
    root.querySelectorAll('.correction-note').forEach(function (n) { n.remove(); });

    var wrongs = root.querySelectorAll('.wrong');
    wrongs.forEach(function (wrongEl) {
      wrongEl.style.paddingBottom = '';
      var struck = wrongEl.querySelector('.struck[data-fix]');
      if (!struck) return;
      var wrongRect = wrongEl.getBoundingClientRect();
      var rects = struck.getClientRects();
      // anchor to the LAST visual line of the struck text, not the first --
      // on a single line these are the same rect (so desktop is unaffected),
      // but if the struck phrase wraps onto 2+ lines (narrow / mobile widths),
      // anchoring to the first line would place the note on top of the
      // text's own remaining wrapped lines.
      var anchorRect = rects[rects.length - 1];
      if (!anchorRect) return;

      var center = anchorRect.left + anchorRect.width / 2 - wrongRect.left;
      var top = anchorRect.bottom - wrongRect.top + NOTE_GAP;

      var note = document.createElement('div');
      note.className = 'correction-note';
      note.textContent = struck.getAttribute('data-fix');
      note.style.top = top + 'px';
      note.style.left = center + 'px'; // temporary, refined below once width is known
      wrongEl.appendChild(note);

      // Note is always a single line (nowrap); if it's wider than the space
      // around the struck word's center, shift it left/right just enough to
      // stay inside the card instead of letting it clip or wrap.
      var noteW = note.getBoundingClientRect().width;
      var half = noteW / 2;
      var clampedCenter = (half * 2 > wrongRect.width)
        ? wrongRect.width / 2
        : Math.min(Math.max(center, half), wrongRect.width - half);
      note.style.left = clampedCenter + 'px';

      var noteRect = note.getBoundingClientRect();
      var neededHeight = (noteRect.bottom - wrongRect.top) - wrongEl.offsetHeight;
      if (neededHeight > 0) {
        wrongEl.style.paddingBottom = (neededHeight + 4) + 'px';
      }
    });
  }

  function colorFor(id) {
    var idx = state.categories.findIndex(function (c) { return c.id === id; });
    if (idx < 0) idx = 0;
    return PALETTE[idx % PALETTE.length];
  }

  function catById(id) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].id === id) return state.categories[i];
    }
    return null;
  }

  function essayById(id) {
    for (var i = 0; i < state.essays.length; i++) {
      if (state.essays[i].id === id) return state.essays[i];
    }
    return null;
  }

  // flatten all entries across essays, each tagged with its parent essay id.
  // "id" is essayId + array-index -- stable regardless of how a view later sorts
  // the list for display, so highlights/stars always point at the right sentence.
  function allEntries() {
    var out = [];
    state.essays.forEach(function (essay) {
      essay.entries.forEach(function (e, idx) {
        out.push(Object.assign({}, e, {
          id: essay.id + '-' + idx,
          essayId: essay.id,
          essayTitle: essay.title,
          date: essay.date
        }));
      });
    });
    return out;
  }

  // Finds where an entry's "wrong" excerpt sits inside the essay's original text,
  // so entries can be shown in the order the person actually wrote them —
  // not the order they happen to appear in the data array. Falls back to
  // progressively shorter prefixes in case the excerpt diverges from the raw
  // original (e.g. a typo was normalized when the excerpt was written).
  function essayOrderIndex(essay, entry) {
    if (!essay || !essay.originalText) return Infinity;
    var original = essay.originalText.replace(/\s+/g, ' ').toLowerCase();
    var wrong = entry.wrong.replace(/\s+/g, ' ').toLowerCase();
    for (var len = wrong.length; len >= 10; len -= 5) {
      var pos = original.indexOf(wrong.slice(0, len));
      if (pos !== -1) return pos;
    }
    return Infinity;
  }

  function countFor(catId) {
    return allEntries().filter(function (e) { return e.category === catId; }).length;
  }

  function parseRoute() {
    var h = window.location.hash;
    var mEssay = h.match(/^#\/essay\/(.+)$/);
    if (mEssay) return { type: 'essay', essayId: decodeURIComponent(mEssay[1]) };
    var mTag = h.match(/^#\/tag\/(.+)$/);
    if (mTag) return { type: 'tag', tag: decodeURIComponent(mTag[1]) };
    var mStars = h.match(/^#\/stars\/(\d)$/);
    if (mStars) return { type: 'stars', n: parseInt(mStars[1], 10) };
    return { type: 'home' };
  }

  function render() {
    var route = parseRoute();

    var catSection = document.getElementById('catSection');
    var essayHeaderWrap = document.getElementById('essayHeaderWrap');
    var listArea = document.getElementById('listArea');
    var entryTitle = document.getElementById('entryTitle');
    var entryCount = document.getElementById('entryCount');

    if (route.type === 'essay') {
      catSection.style.display = 'none';
      renderEssayHeader(route.essayId);
      var essay = essayById(route.essayId);
      var list = essay ? essay.entries.map(function (e, idx) {
        return Object.assign({}, e, { id: essay.id + '-' + idx, essayId: essay.id, date: essay.date });
      }) : [];
      // reading order: as the sentences actually appear in what was written
      list.sort(function (x, y) { return essayOrderIndex(essay, x) - essayOrderIndex(essay, y); });
      entryTitle.textContent = essay ? essay.title + ' · 문장별 교정' : '문장별 교정';
      entryCount.textContent = list.length + '건';
      listArea.innerHTML = '';
      listArea.appendChild(buildEntriesEl(list));
      if (essay) listArea.appendChild(buildNotesCard(essay));
    } else if (route.type === 'tag') {
      // focused page: category grid stays hidden, only the matching sentences show
      catSection.style.display = 'none';
      var cat = catById(route.tag);
      essayHeaderWrap.innerHTML = buildTagHeaderHtml(cat, route.tag);
      var taglist = allEntries().filter(function (e) { return e.category === route.tag; });
      // most recent first
      taglist.sort(function (x, y) { return y.date.localeCompare(x.date); });
      entryTitle.textContent = (cat ? cat.label : route.tag) + ' 실수 목록';
      entryCount.textContent = taglist.length + '건';
      listArea.innerHTML = '';
      listArea.appendChild(buildEntriesEl(taglist, true));
    } else if (route.type === 'stars') {
      catSection.style.display = 'none';
      essayHeaderWrap.innerHTML = buildStarsHeaderHtml(route.n);
      var starlist = allEntries().filter(function (e) { return Stars.get(e.id) === route.n; });
      starlist.sort(function (x, y) { return y.date.localeCompare(x.date); });
      entryTitle.textContent = '별 ' + route.n + '개 표시한 문장';
      entryCount.textContent = starlist.length + '건';
      listArea.innerHTML = '';
      listArea.appendChild(buildEntriesEl(starlist, true));
    } else {
      catSection.style.display = '';
      essayHeaderWrap.innerHTML = '';
      renderCategoryGrid(null);

      entryTitle.textContent = '기록한 글';
      entryCount.textContent = state.essays.length + '개';
      listArea.innerHTML = '';
      listArea.appendChild(buildEssayGridEl(state.essays, null));
    }

    var dates = allEntries().map(function (e) { return e.date; }).sort();
    document.getElementById('lastUpdated').textContent = dates.length ? ('last entry · ' + dates[dates.length - 1]) : '';
    positionCorrectionNotes(listArea);
    updateNavButtons();
    document.querySelectorAll('.starnav-btn').forEach(function (btn) {
      var n = parseInt(btn.getAttribute('data-n'), 10);
      btn.classList.toggle('active', route.type === 'stars' && route.n === n);
    });
  }

  function buildTagHeaderHtml(cat, tagId) {
    return (
      '<div class="essay-header">' +
        '<div>' +
          '<div class="meta-line">' + (cat ? cat.eyebrow : '') + '</div>' +
          '<h3>' + escapeHtml(cat ? cat.label : tagId) + '</h3>' +
          '<a href="#/" class="back">← 전체 글 목록으로</a>' +
        '</div>' +
      '</div>'
    );
  }

  function buildStarsHeaderHtml(n) {
    var stars = '';
    for (var i = 0; i < 3; i++) stars += starIconSvg(i < n);
    return (
      '<div class="essay-header">' +
        '<div>' +
          '<h3 style="display:flex;gap:4px;align-items:center">' +
            '<span style="display:flex;gap:3px">' + stars.replace(/<svg/g, '<svg style="width:20px;height:20px"') + '</span>' +
          '</h3>' +
          '<a href="#/" class="back">← 전체 글 목록으로</a>' +
        '</div>' +
      '</div>'
    );
  }

  // Internal-only back/forward: a stack of hashes visited inside this site.
  // Deliberately NOT window.history.back()/forward() -- that could walk past
  // the very first visit and leave the site entirely (e.g. back to whatever
  // page linked here). On first load, both buttons start disabled.
  var navStack = [window.location.hash || '#/'];
  var navIndex = 0;
  var isProgrammaticNav = false;

  function navBack() {
    if (navIndex <= 0) return;
    navIndex--;
    isProgrammaticNav = true;
    window.location.hash = navStack[navIndex];
  }
  function navForward() {
    if (navIndex >= navStack.length - 1) return;
    navIndex++;
    isProgrammaticNav = true;
    window.location.hash = navStack[navIndex];
  }
  function onHashChangeForNav() {
    var hash = window.location.hash || '#/';
    if (isProgrammaticNav) {
      isProgrammaticNav = false; // this change came from navBack/navForward -- stack already points at it
    } else {
      // a real navigation (clicking a link inside the site) -- drop any
      // "forward" entries and record this as a new step
      navStack = navStack.slice(0, navIndex + 1);
      if (navStack[navStack.length - 1] !== hash) {
        navStack.push(hash);
        navIndex = navStack.length - 1;
      }
    }
    updateNavButtons();
  }

  document.getElementById('navBack').addEventListener('click', navBack);
  document.getElementById('navForward').addEventListener('click', navForward);
  function updateNavButtons() {
    document.getElementById('navBack').disabled = navIndex <= 0;
    document.getElementById('navForward').disabled = navIndex >= navStack.length - 1;
  }

  function renderCategoryGrid(activeTag) {
    var grid = document.getElementById('catGrid');
    document.getElementById('catCount').textContent = state.categories.length + '개';
    grid.innerHTML = state.categories.map(function (c) {
      var active = c.id === activeTag ? ' active' : '';
      var color = colorFor(c.id);
      var n = countFor(c.id);
      return (
        '<a class="cat-card' + active + '" href="#/tag/' + encodeURIComponent(c.id) + '">' +
          '<div class="top-row">' +
            '<div class="eyebrow">' + c.eyebrow + '</div>' +
            '<span class="pill" style="background:' + color.bg + ';color:' + color.fg + '">' + n + '건</span>' +
          '</div>' +
          '<div class="label">' + c.label + '</div>' +
          '<div class="desc">' + c.description + '</div>' +
          '<div class="bottom-row">' +
            '<span class="pill" style="background:#f4f4f5;color:#6b7076">최근 ' + (lastDateFor(c.id) || '—') + '</span>' +
            '<span class="arrow">' + ARROW_SVG + '</span>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  }

  function lastDateFor(id) {
    var dates = allEntries().filter(function (e) { return e.category === id; }).map(function (e) { return e.date; }).sort();
    if (!dates.length) return null;
    return dates[dates.length - 1].slice(5).replace('-', '.');
  }

  function renderEssayHeader(essayId) {
    var essay = essayById(essayId);
    var wrap = document.getElementById('essayHeaderWrap');
    if (!essay) { wrap.innerHTML = '<div class="empty">글을 찾을 수 없음.</div>'; return; }

    var questionHtml = essay.question
      ? '<div class="question-text">' + escapeHtml(essay.question) + '</div>'
      : '<div class="question-text placeholder">질문 미등록 — 추후 추가 예정</div>';

    var originalHtml = (essay.originalText || '')
      .split(/\n\s*\n/)
      .map(function (p) { return '<p>' + escapeHtml(p.trim()) + '</p>'; })
      .join('');

    var imageBlock = essay.image
      ? '<div class="block">' +
          '<div class="block-label">첨부 이미지</div>' +
          '<img class="chart-image" src="' + essay.image + '" alt="' + escapeHtml(essay.title) + '">' +
        '</div>'
      : '';

    wrap.innerHTML =
      '<div class="essay-header">' +
        '<div>' +
          '<div class="meta-line">' + essay.date + '</div>' +
          '<h3>' + escapeHtml(essay.title) + '</h3>' +
          '<a href="#/" class="back">← 전체 글 목록으로</a>' +
        '</div>' +
        '<div class="score">' +
          '<div class="num">' + escapeHtml(String(essay.score)) + '</div>' +
          '<div class="lbl">EST. BAND</div>' +
        '</div>' +
      '</div>' +
      '<div class="essay-original">' +
        '<div class="block">' +
          '<div class="block-label">Question</div>' +
          questionHtml +
        '</div>' +
        imageBlock +
        '<div class="block">' +
          '<div class="block-label">원문 (첨삭 전)</div>' +
          '<div class="original-text">' + originalHtml + '</div>' +
        '</div>' +
      '</div>';
  }

  function buildEssayGridEl(essays, activeTag) {
    var grid = document.createElement('div');
    grid.className = 'essay-grid';
    if (!essays.length) {
      grid.innerHTML = '<div class="empty">아직 기록된 글이 없음.</div>';
      return grid;
    }
    essays.slice().sort(function (a, b) { return b.date.localeCompare(a.date); }).forEach(function (essay) {
      var cats = {};
      essay.entries.forEach(function (e) { cats[e.category] = (cats[e.category] || 0) + 1; });
      var tagRow = Object.keys(cats).map(function (catId) {
        var c = catById(catId);
        var color = colorFor(catId);
        var count = activeTag && catId === activeTag ? cats[catId] : null;
        return '<span class="pill" style="background:' + color.bg + ';color:' + color.fg + '">' +
          (c ? c.label : catId) + (count ? ' · ' + count + '건' : '') + '</span>';
      }).join('');

      var card = document.createElement('a');
      card.className = 'essay-card';
      card.href = '#/essay/' + encodeURIComponent(essay.id);
      card.innerHTML =
        '<div>' +
          '<div class="meta-line">' + essay.date + ' · ' + essay.entries.length + '건 교정</div>' +
          '<div class="title">' + escapeHtml(essay.title) + '</div>' +
          '<div class="tag-row">' + tagRow + '</div>' +
        '</div>' +
        '<div class="score">' +
          '<div class="num">' + escapeHtml(String(essay.score)) + '</div>' +
          '<div class="lbl">EST. BAND</div>' +
        '</div>';
      grid.appendChild(card);
    });
    return grid;
  }

  function buildEntriesEl(list, showEssayLink) {
    var wrap = document.createElement('div');
    wrap.className = 'entries';
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">아직 기록된 실수가 없음.</div>';
      return wrap;
    }
    wrap.innerHTML = list.map(function (e) {
      var c = catById(e.category);
      var color = colorFor(e.category);
      var entryId = e.id;
      var essayLink = (showEssayLink && e.essayId)
        ? '<a class="meta-essaylink" href="#/essay/' + encodeURIComponent(e.essayId) + '">' + escapeHtml(e.essayTitle || '') + '</a>'
        : '';
      var rating = Stars.get(entryId);
      var starsHtml = '<div class="stars">' +
        [1, 2, 3].map(function (n) {
          return '<button type="button" data-star-entry="' + escapeHtml(entryId) + '" data-star-n="' + n + '" aria-label="별 ' + n + '개">' + starIconSvg(n <= rating) + '</button>';
        }).join('') +
        '</div>';
      var explHl = Highlights.get(entryId, 'explanation');
      return (
        '<div class="entry" data-entry-id="' + escapeHtml(entryId) + '">' +
          '<div class="meta">' +
            '<div class="meta-row">' +
              '<span class="meta-date">' + e.date + '</span>' +
              '<a class="tag" href="#/tag/' + encodeURIComponent(e.category) + '" style="background:' + color.bg + ';color:' + color.fg + '">' + (c ? c.label : e.category) + '</a>' +
              starsHtml +
            '</div>' +
            essayLink +
          '</div>' +
          '<div class="body">' +
            buildWrongBlock(entryId, e.wrong, e.correct) +
            '<div class="explanation hl-zone" data-entry-id="' + escapeHtml(entryId) + '" data-field="explanation">' +
              renderAnnotatedText(e.explanation, explHl, null, null) +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    return wrap;
  }

  // Splits a notes string into titled sections using "━━━ 제목 ━━━" divider
  // lines (already used as the authoring convention in the notes text).
  // Any text before the first divider becomes an untitled leading section.
  function splitNotesSections(text) {
    var titleRe = /^━+\s*(.+?)\s*━+\s*$/;
    var lines = text.split('\n');
    var sections = [];
    var current = null;
    lines.forEach(function (line) {
      var m = line.match(titleRe);
      if (m) {
        current = { title: m[1], bodyLines: [] };
        sections.push(current);
      } else {
        if (!current) { current = { title: '', bodyLines: [] }; sections.push(current); }
        current.bodyLines.push(line);
      }
    });
    return sections.map(function (s) {
      return { title: s.title, body: s.bodyLines.join('\n').replace(/^\n+|\n+$/g, '') };
    }).filter(function (s) { return s.title || s.body; });
  }

  // Renders a section's body with a hanging indent: each raw line's own
  // leading whitespace + list marker ("- ", "1) ", "Ex) ", "설명:", "요약:",
  // "→ " ...) becomes a fixed-width label, and the rest of the line wraps
  // underneath itself (not back to the far left) when it's too long to fit.
  // Blank lines in the source just become gaps between "blocks" of lines.
  var NOTES_MARKER_RE = /^(-\s+|\d+\)\s+|Ex\)\s+|비교\s?예시:\s*|비교\)\s+|예시\s?오류:\s*|요약:\s*|설명:\s*|→\s*)/;

  function renderNotesBody(bodyText, hlRanges) {
    hlRanges = hlRanges || [];
    var lines = bodyText.split('\n');
    var lineInfos = [];
    var offset = 0;
    lines.forEach(function (line) {
      var start = offset;
      var end = start + line.length;
      lineInfos.push({ text: line, start: start, end: end });
      offset = end; // no text node represents the '\n' itself in the rendered DOM
    });

    var blocks = [];
    var current = [];
    lineInfos.forEach(function (li) {
      if (li.text === '') {
        if (current.length) { blocks.push(current); current = []; }
      } else {
        current.push(li);
      }
    });
    if (current.length) blocks.push(current);

    return blocks.map(function (block) {
      var linesHtml = block.map(function (li) {
        var wsMatch = li.text.match(/^\s*/);
        var leadingWs = wsMatch[0];
        var afterWs = li.text.slice(leadingWs.length);
        var markerMatch = afterWs.match(NOTES_MARKER_RE);
        var marker = markerMatch ? markerMatch[0] : '';
        var labelText = leadingWs + marker;
        var contentText = afterWs.slice(marker.length);

        var lineHl = hlRanges
          .filter(function (r) { return r.start < li.end && r.end > li.start; })
          .map(function (r) { return { start: Math.max(r.start, li.start) - li.start, end: Math.min(r.end, li.end) - li.start }; });
        var labelHl = lineHl
          .filter(function (r) { return r.start < labelText.length; })
          .map(function (r) { return { start: r.start, end: Math.min(r.end, labelText.length) }; });
        var contentHl = lineHl
          .filter(function (r) { return r.end > labelText.length; })
          .map(function (r) { return { start: Math.max(r.start, labelText.length) - labelText.length, end: r.end - labelText.length }; });

        var labelSpan = labelText
          ? '<span class="notes-line-label">' + renderAnnotatedText(labelText, labelHl, null, null) + '</span>'
          : '';
        var textSpan = '<span class="notes-line-text">' + renderAnnotatedText(contentText, contentHl, null, null) + '</span>';

        return '<div class="notes-line">' + labelSpan + textSpan + '</div>';
      }).join('');
      return '<div class="notes-block">' + linesHtml + '</div>';
    }).join('');
  }

  // "알아두기" -- a free-form note attached to the whole essay (not one sentence),
  // shown at the bottom of the essay page. Each "━━━ 제목 ━━━" block renders as
  // its own bordered box with a unified title style; highlighting AND star
  // rating both work per box (their own entry id / field, independent of
  // the other boxes in the same card).
  function buildNotesCard(essay) {
    var baseId = essay.id + '-notes';
    var text = Notes.get(essay.id, essay.notes);
    var card = document.createElement('div');
    card.className = 'notes-card';
    card.setAttribute('data-essay-id', essay.id);

    var bodyHtml;
    if (!text) {
      bodyHtml = '<div class="notes-content"><span class="notes-placeholder">아직 작성한 메모가 없음 — 편집 아이콘을 눌러 추가할 수 있음.</span></div>';
    } else {
      var sections = splitNotesSections(text);
      bodyHtml = '<div class="notes-content">' +
        sections.map(function (sec, idx) {
          var field = 'notes-' + idx;
          var hl = Highlights.get(baseId, field);
          var sectionEntryId = baseId + '-' + idx;
          var rating = Stars.get(sectionEntryId);
          var starsHtml = '<div class="stars">' +
            [1, 2, 3].map(function (n) {
              return '<button type="button" data-star-entry="' + escapeHtml(sectionEntryId) + '" data-star-n="' + n + '" aria-label="별 ' + n + '개">' + starIconSvg(n <= rating) + '</button>';
            }).join('') +
            '</div>';
          var titleHtml = sec.title ? '<div class="notes-section-title">' + escapeHtml(sec.title) + '</div>' : '<div class="notes-section-title notes-section-title-empty"></div>';
          return '<div class="notes-section">' +
            '<div class="notes-section-head">' +
              titleHtml +
              starsHtml +
            '</div>' +
            '<div class="notes-section-body hl-zone" data-entry-id="' + escapeHtml(baseId) + '" data-field="' + field + '">' +
              renderNotesBody(sec.body, hl) +
            '</div>' +
          '</div>';
        }).join('') +
        '</div>';
    }

    card.innerHTML =
      '<div class="notes-head">' +
        '<div class="eyebrow">알아두기</div>' +
        '<div class="notes-head-right">' +
          '<button type="button" class="notes-edit-btn" aria-label="편집">' +
            '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15v5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      bodyHtml;
    return card;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ---------------------------------------------------------------
  // Highlight interaction: drag-select text inside a .hl-zone -> a small
  // "하이라이트" button appears -> click it to mark that range hot pink.
  // Click an existing mark -> a "취소하기" button appears to remove it.
  // ---------------------------------------------------------------
  var popupEl = null;
  function ensurePopup() {
    if (!popupEl) {
      popupEl = document.createElement('div');
      popupEl.className = 'hl-popup';
      popupEl.style.display = 'none';
      document.body.appendChild(popupEl);
    }
    return popupEl;
  }
  function showPopup(rect, label, onClick) {
    var p = ensurePopup();
    p.textContent = label;
    p.style.display = 'block';
    p.style.left = (rect.left + rect.width / 2) + 'px';
    p.style.top = (rect.top - 10) + 'px';
    p.onclick = function (ev) { ev.stopPropagation(); onClick(); };
  }
  function hidePopup() {
    if (popupEl) popupEl.style.display = 'none';
  }

  function getTextOffsetInZone(zone, node, nodeOffset) {
    var walker = document.createTreeWalker(zone, NodeFilter.SHOW_TEXT, null);
    var offset = 0, n;
    while ((n = walker.nextNode())) {
      if (n === node) return offset + nodeOffset;
      offset += n.textContent.length;
    }
    return offset;
  }

  function handleSelectionEnd(ev) {
    if (!ev.target || !ev.target.closest) return;
    if (ev.target.closest('.hl-popup')) return;
    if (ev.target.closest('mark.hl')) return; // that's handled by the click-to-remove path instead
    setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hidePopup(); return; }
      var range = sel.getRangeAt(0);
      var startEl = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
      var endEl = range.endContainer.nodeType === 3 ? range.endContainer.parentElement : range.endContainer;
      var startZone = startEl.closest('.hl-zone');
      var endZone = endEl.closest('.hl-zone');
      if (!startZone || startZone !== endZone) { hidePopup(); return; }

      var start = getTextOffsetInZone(startZone, range.startContainer, range.startOffset);
      var end = getTextOffsetInZone(startZone, range.endContainer, range.endOffset);
      if (start === end) { hidePopup(); return; }
      var lo = Math.min(start, end), hi = Math.max(start, end);
      var rect = range.getBoundingClientRect();
      var entryId = startZone.getAttribute('data-entry-id');
      var field = startZone.getAttribute('data-field');

      showPopup(rect, '하이라이트', function () {
        Highlights.add(entryId, field, lo, hi);
        sel.removeAllRanges();
        hidePopup();
        render();
      });
    }, 10);
  }
  document.addEventListener('mouseup', handleSelectionEnd);
  document.addEventListener('touchend', handleSelectionEnd);
  document.addEventListener('mousedown', function (ev) {
    if (!ev.target || !ev.target.closest) return;
    if (!ev.target.closest('.hl-popup') && !ev.target.closest('mark.hl')) hidePopup();
  });

  // clicks inside the results list: star buttons + highlight marks (event
  // delegation on the container, since its contents are fully rebuilt on every render)
  document.getElementById('listArea').addEventListener('click', function (ev) {
    var starBtn = ev.target.closest('[data-star-entry]');
    if (starBtn) {
      var id = starBtn.getAttribute('data-star-entry');
      var n = parseInt(starBtn.getAttribute('data-star-n'), 10);
      // clicking the star that's already the current rating clears it back to 0 --
      // otherwise there'd be no way to un-star something once set.
      Stars.set(id, Stars.get(id) === n ? 0 : n);
      render();
      return;
    }
    var markEl = ev.target.closest('mark.hl');
    if (markEl) {
      var zoneEl = markEl.closest('.hl-zone');
      var start = parseInt(markEl.getAttribute('data-start'), 10);
      var end = parseInt(markEl.getAttribute('data-end'), 10);
      var rect = markEl.getBoundingClientRect();
      showPopup(rect, '취소하기', function () {
        Highlights.removeAt(zoneEl.getAttribute('data-entry-id'), zoneEl.getAttribute('data-field'), start, end);
        hidePopup();
        render();
      });
      return;
    }

    var editBtn = ev.target.closest('.notes-edit-btn');
    if (editBtn) {
      var card = editBtn.closest('.notes-card');
      enterNotesEditMode(card);
      return;
    }
    var cancelBtn = ev.target.closest('.notes-cancel');
    if (cancelBtn) { render(); return; }
    var saveBtn = ev.target.closest('.notes-save');
    if (saveBtn) {
      var editCard = saveBtn.closest('.notes-card');
      var essayId = editCard.getAttribute('data-essay-id');
      var textarea = editCard.querySelector('.notes-editarea');
      Notes.set(essayId, textarea.value);
      render();
      return;
    }
  });

  function enterNotesEditMode(card) {
    var essayId = card.getAttribute('data-essay-id');
    var essay = essayById(essayId);
    var current = Notes.get(essayId, essay ? essay.notes : '');
    var contentEl = card.querySelector('.notes-content');
    contentEl.outerHTML =
      '<textarea class="notes-editarea">' + escapeHtml(current) + '</textarea>' +
      '<div class="notes-edit-actions">' +
        '<button type="button" class="notes-cancel">취소</button>' +
        '<button type="button" class="notes-save">저장</button>' +
      '</div>';
    var ta = card.querySelector('.notes-editarea');
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  // top-left star-tier filter buttons (3 / 2 / 1 stars, right-aligned in the topbar)
  document.querySelectorAll('.starnav-btn').forEach(function (btn) {
    var n = parseInt(btn.getAttribute('data-n'), 10);
    var html = '';
    for (var i = 0; i < 3; i++) html += starIconSvg(i >= 3 - n);
    btn.innerHTML = html;
    btn.addEventListener('click', function () { window.location.hash = '#/stars/' + n; });
  });

  render();
  window.addEventListener('hashchange', onHashChangeForNav);
  window.addEventListener('hashchange', render);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { positionCorrectionNotes(document.getElementById('listArea')); });
  }
  window.addEventListener('resize', function () {
    positionCorrectionNotes(document.getElementById('listArea'));
  });

  // Live sync: whenever the shared cloud document changes -- including from
  // a *different* device -- pull it in and re-render. hasPendingWrites=true
  // means this snapshot is our own optimistic local echo (we already have
  // this data), so we skip re-rendering for that one specifically.
  if (SYNC_DOC) {
    SYNC_DOC.onSnapshot(function (doc) {
      if (doc.metadata.hasPendingWrites) return;
      if (!doc.exists) return;
      var data = doc.data() || {};
      HStore.replaceAll(data.highlights || {});
      SStore.replaceAll(data.stars || {});
      NStore.replaceAll(data.notes || {});
      render();
    }, function (err) {
      console.error('Sync read failed (staying local-only):', err);
    });
  }
})();
</script>
</body>
</html>
