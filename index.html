<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #46413e;
  }

  body {
    -webkit-tap-highlight-color: transparent;
  }

  /* 화면에 맞춰 줄이거나 세로 중앙정렬하지 않음 — 이미지를 원본 비율 그대로,
     화면 폭에 맞춰 위에서부터 자연스럽게 배치. 뷰포트보다 길면 스크롤로 나머지가 보임. */
  .frame {
    position: relative;
    width: 100%;
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  .hotspot {
    position: absolute;
    display: block;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 데스크탑 기준 (잘리지 않은 전체 이미지, home-folders-full.png) 폴더 전체 영역 */
  .hotspot.tan   { left: 25.52%; top: 10.65%; width: 19.32%; height: 45.09%; z-index: 1; }
  .hotspot.pink  { left: 34.43%; top: 26.11%; width: 45.00%; height: 38.33%; z-index: 2; }
  .hotspot.red   { left: 29.01%; top: 44.07%; width: 44.01%; height: 51.67%; z-index: 3; }

  /* 모바일 기준 (세로 이미지, home-folders-mobile.png) 폴더 전체 영역 */
  @media (max-width: 700px) {
    .hotspot.tan   { left: 10.09%; top: 33.28%; width: 28.80%; height: 21.25%; }
    .hotspot.pink  { left: 23.33%; top: 40.57%; width: 67.22%; height: 18.39%; }
    .hotspot.red   { left: 15.28%; top: 49.06%; width: 65.65%; height: 24.43%; }
  }
</style>
</head>
<body>

  <div class="frame">
    <picture>
      <source media="(max-width: 700px)" srcset="home-folders-mobile.png">
      <img src="home-folders-full.png" alt="Current Studies in Folders — IELTS WRITING, SYNONYMS, PHRASAL VERBS">
    </picture>

    <a class="hotspot tan"  href="ielts.html"         aria-label="IELTS WRITING 폴더로 이동"></a>
    <a class="hotspot pink" href="verbs.html"         aria-label="SYNONYMS 폴더로 이동"></a>
    <a class="hotspot red"  href="phrasal-verbs.html" aria-label="PHRASAL VERBS 폴더로 이동"></a>
  </div>

</body>
</html>
