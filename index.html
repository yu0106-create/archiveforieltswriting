<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Desktop</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}

:root{
  --ink: #2b2622;
  --wall: #5f4541;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, sans-serif;
}

*{ box-sizing:border-box; }
html, body{
  margin:0; padding:0; height:100%;
  font-family: var(--kr);
  color: var(--ink);
  overflow: hidden; /* this page is a single fixed scene, not a scroll --
    the entrance animation is the "reveal", so there's nothing to scroll to. */
  background: var(--wall);
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
}
a{ color:inherit; text-decoration:none; }
img{ -webkit-user-drag:none; user-select:none; display:block; }

/* ===================== the framed picture ===================== */
/* Sitting on the dark wall color like a framed photo -- a pale mat
   (passe-partout) around a thin dark inner lip, then the square scene
   itself. Since the whole thing is now noticeably smaller than a
   full-bleed background would be, the source photo also reads sharper
   (less upscaling) than stretching it across the entire viewport did. */
.frame{
  background: #f3ede2;
  padding: 2.6vmin;
  border: 7px solid #c0f6e4;
  box-shadow: 0 30px 70px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.08) inset;
}

/* The source photos are a perfect 1:1 square, so the stage keeps that
   exact aspect ratio -- that keeps the scene lined up with the frame's
   window at any screen size. Clipped here (not just the background):
   the corner objects are now the FULL, un-cropped book/pencil-case
   photos (real edges, no artificial rectangular crop line), sized with
   plenty of spare room around where they actually show through -- so a
   hover wiggle moves entirely within real object silhouette or margin
   that was always going to be covered by the frame anyway, and never
   reveals a hard-cut edge. */
.stage{
  position: relative;
  width: min(56vw, 60.8vh, 512px); /* 80% of the previous min(70vw, 76vh, 640px) */
  aspect-ratio: 1 / 1;
  overflow: hidden;
}
@media (max-width: 760px){
  .frame{ padding: 3.2vmin; border-width: 6px; }
  .stage{ width: min(64vw, 58vh, 420px); }
}
.scene-bg{
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ===================== the two corner objects ===================== */
/* Each is a two-layer element: the outer <a> just owns positioning/
   rotation (a plain static transform, no entrance animation); the inner
   <img> owns the hover "wiggle" only. */
.corner-obj{
  position: absolute;
  z-index: 5;
  cursor: pointer;
}
.corner-obj img{ width: 100%; height: 100%; }

.corner-book{
  left: -11%; top: -5%;
  width: 24%;
  transform: rotate(-4deg);
}
.corner-pencase{
  right: -9%; bottom: -7%;
  width: 44%;
  transform: rotate(-18deg);
}
.corner-book img, .corner-pencase img{ width: 100%; height: auto; }

.corner-book:hover img{ animation: wiggle-book .6s ease-in-out; }
.corner-pencase:hover img{ animation: wiggle-pencase .6s ease-in-out; }
@keyframes wiggle-book{
  0%   { transform: rotate(0deg) translate(0,0); }
  25%  { transform: rotate(-3deg) translate(-2px, 1px); }
  55%  { transform: rotate(2deg) translate(2px, -1px); }
  80%  { transform: rotate(-1.5deg) translate(-1px, 1px); }
  100% { transform: rotate(0deg) translate(0,0); }
}
@keyframes wiggle-pencase{
  0%   { transform: rotate(0deg) translate(0,0); }
  20%  { transform: rotate(2.5deg) translate(2px, -2px); }
  50%  { transform: rotate(-2deg) translate(-2px, 1px); }
  78%  { transform: rotate(1.5deg) translate(1px, 1px); }
  100% { transform: rotate(0deg) translate(0,0); }
}
</style>
</head>
<body>

<div class="frame">
<div class="stage">
  <img class="scene-bg" src="scene-bg.jpg" alt="">

  <a class="corner-obj corner-book" href="verbs.html" aria-label="Phrasal Verbs Dump로 이동">
    <img src="full-book.png" alt="">
  </a>

  <a class="corner-obj corner-pencase" href="ielts.html" aria-label="IELTS Writing으로 이동">
    <img src="full-pencase.png" alt="">
  </a>
</div>
</div>

</body>
</html>
