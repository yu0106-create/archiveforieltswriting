<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Desktop</title>
<style>
@font-face{
  font-family: 'BookkGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkGothic-Bd.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}

:root{
  --ink: #2b2622;
  --kr: 'BookkGothic', -apple-system, BlinkMacSystemFont, sans-serif;
}

*{ box-sizing:border-box; }
html, body{
  margin:0; padding:0; height:100%;
  font-family: var(--kr);
  color: var(--ink);
  overflow: hidden; /* this page is a single fixed scene, not a scroll --
    the entrance animation is the "reveal", so there's nothing to scroll to. */
}
body{
  position: relative; /* frames are now individually absolute-positioned,
    not flex-centered as a single unit, so two frames can sit at two
    different spots on the wall. */
  /* the wall is now a real tiled-mosaic photo repeated edge to edge --
     the source crop was cut exactly at grout-line centers on all four
     sides (found by detecting the grout's brightness peaks), so tiling
     it lines the grout up continuously instead of showing a seam. */
  background-image: url('wall-tile-unit.jpg');
  background-repeat: repeat;
  background-size: 340px 340px;
}
a{ color:inherit; text-decoration:none; }
img{ -webkit-user-drag:none; user-select:none; display:block; }

/* ===================== the framed picture ===================== */
/* A real photographed picture frame (pink/mauve molded wood) instead of
   a CSS-drawn border. The frame image's own background AND its inner
   opening were both flattened to transparent (see pink-frame.png), so
   it can sit directly on top of the scene: .frame-img is scaled up and
   shifted so its opening lines up exactly with .stage underneath,
   using the opening's measured position within the source photo
   (openingLeft/openingTop/openingWidth as fractions of the full image)
   converted to percentages of .stage's own box. */
.picture{
  position: absolute;
  left: 42%;
  top: 58%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 22px 46px rgba(0,0,0,0.45));
}
.frame-img{
  position: absolute;
  left: -44.6%; top: -46.4%;
  width: 190.3%; height: 180.6%;
  z-index: 6;
  pointer-events: none;
}

/* The source photos are a perfect 1:1 square, so the stage keeps that
   exact aspect ratio -- that keeps the scene lined up with the frame's
   window at any screen size. Clipped here (not just the background):
   the corner objects are now the FULL, un-cropped book/pencil-case
   photos (real edges, no artificial rectangular crop line), sized with
   plenty of spare room around where they actually show through, so the
   transparent margin never reveals a hard-cut edge. */
.stage{
  position: relative;
  /* Sized against the wall tile grid itself, not an independent vw/vh
     guess: the tile photo's background-size is a fixed 340px repeat
     unit containing a 2x2 block of tiles, so one tile "square" is
     170px (measured by autocorrelating the tile photo's grout-line
     spacing). The pink frame's outer edge should span a 4x4 block of
     those squares (16 tiles) = 680px, and since frame-img is scaled to
     190.3% of .stage (see below), .stage itself needs to be
     680 / 1.903 = ~357px for the frame's outer molding to land on
     that 4-tile mark. vw/vh still cap it lower on small screens so it
     never overflows a phone; the tile-matched 357px is only the
     desktop ceiling. */
  width: min(22.8vw, 25.2vh, 214.2px); /* 0.6x of previous size */
  aspect-ratio: 1 / 1;
  overflow: hidden;
}
@media (max-width: 760px){
  .stage{ width: min(31.2vw, 24vh, 176.4px); } /* 0.6x of previous mobile size */
}
.scene-bg{
  width: 100%; height: 100%;
  object-fit: cover;
}

/* ===================== the two corner objects ===================== */
/* Each is a two-layer element: the outer <a> owns positioning/rotation
   (a plain static transform); the inner <img> owns the hover pink-glow
   highlight (see the "hover highlight" block below). */
.corner-obj{
  position: absolute;
  z-index: 5;
  cursor: pointer;
}
.corner-obj img{ width: 100%; height: 100%; transition: filter .25s ease; }

/* ===================== hover highlight (link objects only) ===================== */
/* All three linked objects (book, pencase, horse frame) are transparent-
   background PNGs with irregular silhouettes, so a normal CSS border
   would just draw a rectangle around empty space. Instead we stack
   several blurred drop-shadows in the same neon pink -- drop-shadow
   follows the image's actual alpha shape, so the glow traces the real
   outline of the object, not a bounding box. */
.corner-book:hover img,
.corner-pencase:hover img,
.corner-frame2:hover img{
  filter:
    drop-shadow(0 0 4px #ff2fd6)
    drop-shadow(0 0 10px #ff2fd6)
    drop-shadow(0 0 18px #ff2fd6);
}
/* frame2's own cast-shadow drop-shadow lives on the outer <a> (see
   .corner-frame2 above); the pink glow above is layered on the inner
   <img> so both effects stack without overwriting each other. */

.corner-book{
  left: -10%; top: -4%;
  width: 26.3%;
  transform: rotate(-4deg);
}
.corner-pencase{
  right: -8%; bottom: -6%;
  width: 46.7%;
  transform: rotate(-18deg);
}
.corner-book img, .corner-pencase img{ width: 100%; height: auto; }

/* ===================== second framed picture (phrasal verbs) ===================== */
/* This one is a single flattened photo (frame + the little horse print
   already baked into it) with only the outer background removed --
   unlike the pink frame it has no separate "opening" for a scene behind
   it, so it behaves like a third clickable corner object rather than a
   second .stage. Same two-layer split as the book/pencase: the outer
   <a> owns position, the inner <img> owns the hover pink-glow
   highlight. */
.corner-frame2{
  /* Same 16-tile (4x4, 680px) target as the pink frame's outer edge --
     see the .stage comment above for how that 680px number was
     measured. This one is a single flattened image (no inner-scaling
     trick), so its CSS width IS its visible outer width directly. It
     sits flat/level with no rotation. */
  position: absolute;
  left: 76%;
  top: 26%;
  width: min(43.2vw, 48vh, 408px); /* 0.6x of previous size */
  transform: translate(-50%, -50%);
  z-index: 5;
  cursor: pointer;
  filter: drop-shadow(0 16px 32px rgba(0,0,0,0.4));
}
.corner-frame2 img{ width: 100%; height: auto; transform-origin: 50% 50%; transition: filter .25s ease; }
@media (max-width: 760px){
  .corner-frame2{ width: min(59.4vw, 45.6vh, 336px); left: 78%; top: 22%; } /* 0.6x of previous mobile size */
}

</style>
</head>
<body>

<div class="picture">
<div class="stage">
  <img class="scene-bg" src="scene-bg.jpg" alt="">

  <a class="corner-obj corner-book" href="verbs.html" aria-label="Phrasal Verbs Dump로 이동">
    <img src="full-book.png" alt="">
  </a>

  <a class="corner-obj corner-pencase" href="ielts.html" aria-label="IELTS Writing으로 이동">
    <img src="full-pencase.png" alt="">
  </a>
</div>
<img class="frame-img" src="pink-frame.png" alt="">
</div>

<a class="corner-frame2" href="phrasal-verbs.html" aria-label="구동사 사전으로 이동">
  <img src="horse-frame.png" alt="">
</a>

</body>
</html>
